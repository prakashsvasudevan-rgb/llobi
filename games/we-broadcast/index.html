<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>We Broadcast What We Choose</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Georgia,serif;}
canvas{cursor:none;display:block;max-width:100%;height:auto;}
</style>
</head>
<body>
<canvas id="c" width="620" height="420"></canvas>
<script>
const C=document.getElementById('c');
const ctx=C.getContext('2d');
const W=620,H=420;

// offscreen for photo
const P=document.createElement('canvas');P.width=160;P.height=90;
const pctx=P.getContext('2d');

let mx=W/2,my=H/2,clicked=false;
function evtCoords(e,touch=false){
  const r=C.getBoundingClientRect();
  const scaleX=W/r.width,scaleY=H/r.height;
  const src=touch?e.touches[0]:e;
  return {x:(src.clientX-r.left)*scaleX,y:(src.clientY-r.top)*scaleY};
}
C.addEventListener('mousemove',e=>{const c=evtCoords(e);mx=c.x;my=c.y;});
C.addEventListener('click',e=>{const c=evtCoords(e);mx=c.x;my=c.y;clicked=true;});
C.addEventListener('touchstart',e=>{const c=evtCoords(e,true);mx=c.x;my=c.y;clicked=true;e.preventDefault();},{passive:false});

// ══════════════════════════════════════════════
// GAME STATE
// ══════════════════════════════════════════════
const VF=70; // viewfinder half-size
const TV={x:W/2-80,y:8,w:160,h:90}; // TV screen rect

let phase='intro'; // intro|tutorial|play|escalate|ending
let tension=0;      // 0–100
let frame=0;
let flashTimer=0;
let introFrame=0;
let tutFrame=0;    // tutorial timer
let endFrame=0;
let endType=''; // 'peace'|'chaos'

// tutorial steps (scripted story beat timings in frames)
const TUT=[
  {at:60,  msg:'A new trend is spreading among the circles...',col:'#ffcc44'},
  {at:160, msg:'More circles are picking it up.',col:'#ffcc44'},
  {at:260, msg:'The squares have noticed.',col:'#aa88ff'},
  {at:360, msg:'One square grows angry.',col:'#ff4444'},
  {at:480, msg:'You hold the camera.\nWhat will you broadcast?',col:'#ffffff'},
];
let tutStep=0;
// storyPhase: 0=squares scared, 1=circles scared, 2=all scared, 3=wait for glasses photo, 4=fight
let storyPhase=0;
let storyMsg='';     // overlay message shown after a story beat
let storyMsgTimer=0;

// broadcast
let broadcast={type:'static',intensity:0,imgData:null};
let broadcastTimer=0;

// floating texts
let floats=[];
function addFloat(txt,x,y,col){floats.push({txt,x,y,col,life:90});}

// ══════════════════════════════════════════════
// NPCs
// ══════════════════════════════════════════════
// Circles = orange group (left side)
// Squares = purple group (right side)
const PLAY_TOP=145,PLAY_BOT=390,PLAY_MID=310;

function mkNPC(type,x,y){
  return {
    type, x, y,
    vx:(Math.random()-0.5)*1.1,
    vy:(Math.random()-0.5)*0.9,
    mood:'calm',    // calm|angry
    trendy:false,   // wearing glasses (circle trend)
    extreme:false,  // hat or spike
    extremeT:0,
    moodT:Math.random()*120,
    wobble:Math.random()*Math.PI*2,
    size:type==='circle'?12:11,
    id:Math.random(),
  };
}

let npcs=[];
// circles on left
for(let i=0;i<10;i++) npcs.push(mkNPC('circle',80+Math.random()*200,PLAY_TOP+30+Math.random()*200));
// squares on right
for(let i=0;i<10;i++) npcs.push(mkNPC('square',340+Math.random()*200,PLAY_TOP+30+Math.random()*200));

// ══════════════════════════════════════════════
// DRAWING — NPC
// ══════════════════════════════════════════════
function drawNPC(n,scale=1){
  ctx.save();ctx.translate(n.x,n.y);ctx.scale(scale,scale);
  const s=n.size;
  const scared=n.mood==='scared';
  const col = n.mood==='angry'
    ? '#dd1111'
    : scared
      ? (n.type==='circle'?'#ffcc88':'#aabbff')
      : n.extreme
        ? (n.type==='circle'?'#ffaa00':'#aa22ff')
        : (n.type==='circle'?'#ff9933':'#6677ff');

  // scared shake offset
  const shk=scared?(Math.random()-0.5)*3:0;
  ctx.translate(shk,0);

  // angry pulsing ring
  if(n.mood==='angry'){
    const pulse=0.5+0.5*Math.sin(frame*0.18+n.wobble);
    ctx.strokeStyle=`rgba(255,50,0,${0.5+pulse*0.5})`;ctx.lineWidth=3+pulse*2;
    if(n.type==='circle'){ctx.beginPath();ctx.arc(0,0,s+5+pulse*3,0,Math.PI*2);ctx.stroke();}
    else{ctx.beginPath();ctx.roundRect(-s-5-pulse*2,-s-5-pulse*2,(s+5+pulse*2)*2,(s+5+pulse*2)*2,4);ctx.stroke();}
  }

  if(n.type==='circle'){
    // body
    ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.fill();
    // face — scared = huge eyes + wavy mouth
    if(scared){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*0.3,-s*0.1,s*0.3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(s*0.3,-s*0.1,s*0.3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-s*0.3,-s*0.1,s*0.17,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(s*0.3,-s*0.1,s*0.17,0,Math.PI*2);ctx.fill();
      // wavy scared mouth
      ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.beginPath();
      ctx.moveTo(-s*0.35,s*0.3);ctx.bezierCurveTo(-s*0.15,s*0.5,s*0.15,s*0.1,s*0.35,s*0.3);ctx.stroke();
      // sweat
      ctx.fillStyle='#88ccff';ctx.beginPath();ctx.arc(s*0.75,-s*0.3,s*0.1,0,Math.PI*2);ctx.fill();
    } else {
      ctx.fillStyle='#111';
      ctx.beginPath();ctx.arc(-s*0.3,-s*0.15,s*0.18,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(s*0.3,-s*0.15,s*0.18,0,Math.PI*2);ctx.fill();
    }
    if(n.mood==='angry'){
      ctx.strokeStyle='#111';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(0,s*0.2,s*0.3,Math.PI*0.1,Math.PI*0.9,true);ctx.stroke();
      // angry eyebrows
      ctx.strokeStyle='#111';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(-s*0.5,-s*0.35);ctx.lineTo(-s*0.1,-s*0.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(s*0.5,-s*0.35);ctx.lineTo(s*0.1,-s*0.5);ctx.stroke();
    } else {
      ctx.strokeStyle='#111';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(0,s*0.1,s*0.3,0.1*Math.PI,0.9*Math.PI);ctx.stroke();
    }
    // trendy glasses
    if(n.trendy){
      ctx.strokeStyle='#111';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(-s*0.3,-s*0.15,s*0.26,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(s*0.3,-s*0.15,s*0.26,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-s*0.04,-s*0.15);ctx.lineTo(s*0.04,-s*0.15);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-s*0.56,-s*0.15);ctx.lineTo(-s*0.68,-s*0.1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(s*0.56,-s*0.15);ctx.lineTo(s*0.68,-s*0.1);ctx.stroke();
    }
    // hat (extreme)
    if(n.extreme){
      ctx.fillStyle='#550000';
      ctx.fillRect(-s*0.9,-s*1.7,s*1.8,s*0.3);
      ctx.fillRect(-s*0.5,-s*2.4,s,s*0.75);
    }
  } else {
    // square body
    ctx.fillStyle=col;
    ctx.beginPath();ctx.roundRect(-s,-s,s*2,s*2,3);ctx.fill();
    // face
    if(scared){
      ctx.fillStyle='#fff';ctx.fillRect(-s*0.5,-s*0.35,s*0.32,s*0.32);ctx.fillRect(s*0.18,-s*0.35,s*0.32,s*0.32);
      ctx.fillStyle='#111';ctx.fillRect(-s*0.4,-s*0.3,s*0.18,s*0.18);ctx.fillRect(s*0.22,-s*0.3,s*0.18,s*0.18);
      ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.beginPath();
      ctx.moveTo(-s*0.35,s*0.3);ctx.bezierCurveTo(-s*0.15,s*0.5,s*0.15,s*0.1,s*0.35,s*0.3);ctx.stroke();
      ctx.fillStyle='#88ccff';ctx.beginPath();ctx.arc(s*0.9,-s*0.2,s*0.1,0,Math.PI*2);ctx.fill();
    } else {
      ctx.fillStyle='#111';
      ctx.fillRect(-s*0.5,-s*0.35,s*0.3,s*0.3);
      ctx.fillRect(s*0.2,-s*0.35,s*0.3,s*0.3);
      if(n.mood==='angry'){
        ctx.strokeStyle='#111';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(-s*0.4,s*0.3);ctx.lineTo(s*0.4,s*0.3);ctx.stroke();
        ctx.strokeStyle='#111';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(-s*0.6,-s*0.5);ctx.lineTo(-s*0.1,-s*0.65);ctx.stroke();
        ctx.beginPath();ctx.moveTo(s*0.6,-s*0.5);ctx.lineTo(s*0.1,-s*0.65);ctx.stroke();
      } else {
        ctx.strokeStyle='#111';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(0,s*0.2,s*0.35,0.05*Math.PI,0.95*Math.PI);ctx.stroke();
      }
    }
    // spikes (extreme)
    if(n.extreme){
      ctx.fillStyle='#001155';
      for(let i=-1;i<=1;i++) {
        ctx.beginPath();ctx.moveTo(i*s*0.5,-s);ctx.lineTo(i*s*0.5-s*0.25,-s*1.7);ctx.lineTo(i*s*0.5+s*0.25,-s*1.7);ctx.closePath();ctx.fill();
      }
    }
  }
  ctx.restore();
}

// ══════════════════════════════════════════════
// DRAWING — BACKGROUND
// ══════════════════════════════════════════════
function drawBg(){
  // Sky / wall
  const sky=ctx.createLinearGradient(0,0,0,PLAY_TOP);
  sky.addColorStop(0,'#2a1a3e');sky.addColorStop(1,'#3a2a50');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,PLAY_TOP);

  // Ground
  const grd=ctx.createLinearGradient(0,PLAY_TOP,0,H);
  grd.addColorStop(0,'#c4a870');grd.addColorStop(1,'#a8905a');
  ctx.fillStyle=grd;ctx.fillRect(0,PLAY_TOP,W,H-PLAY_TOP);

  // Cobblestone lines
  ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1;
  for(let y=PLAY_TOP+20;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,PLAY_TOP);ctx.lineTo(x,H);ctx.stroke();}

  // Dividing line (social)
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=2;ctx.setLineDash([6,8]);
  ctx.beginPath();ctx.moveTo(PLAY_MID,PLAY_TOP);ctx.lineTo(PLAY_MID,H);ctx.stroke();
  ctx.setLineDash([]);

  // Buildings left
  drawBuilding(20,PLAY_TOP-70,80,80,'#4a2a5a');
  drawBuilding(120,PLAY_TOP-55,70,60,'#3a1e4a');
  // Buildings right
  drawBuilding(W-110,PLAY_TOP-65,80,70,'#2a3a5a');
  drawBuilding(W-30,PLAY_TOP-50,30,55,'#1e2e4a');

  // TV stand
  ctx.fillStyle='#3a3040';ctx.fillRect(TV.x-10,TV.y+TV.h,TV.w+20,10);
  ctx.fillStyle='#2a2030';ctx.fillRect(W/2-5,TV.y+TV.h+10,10,16);
  ctx.fillStyle='#2a2030';ctx.fillRect(W/2-18,TV.y+TV.h+24,36,6);
}

function drawBuilding(x,y,w,h,col){
  ctx.fillStyle=col;ctx.fillRect(x,y,w,h);
  // windows
  ctx.fillStyle='rgba(255,220,120,0.3)';
  for(let wy=y+8;wy<y+h-10;wy+=16){
    for(let wx=x+6;wx<x+w-6;wx+=18){ctx.fillRect(wx,wy,10,10);}
  }
  // roof
  ctx.fillStyle='#2a1a30';ctx.fillRect(x-3,y-6,w+6,8);
}

// ══════════════════════════════════════════════
// DRAWING — TV
// ══════════════════════════════════════════════
function drawTV(){
  // Frame
  ctx.fillStyle='#1a1a2a';ctx.beginPath();ctx.roundRect(TV.x-8,TV.y-8,TV.w+16,TV.h+16,6);ctx.fill();
  ctx.strokeStyle='#4a4060';ctx.lineWidth=3;ctx.stroke();

  // Screen
  if(broadcast.type==='static'||!broadcast.imgData){
    // Static noise
    ctx.fillStyle='#111';ctx.fillRect(TV.x,TV.y,TV.w,TV.h);
    for(let i=0;i<400;i++){
      const sx=TV.x+Math.random()*TV.w,sy=TV.y+Math.random()*TV.h;
      ctx.fillStyle=`rgba(200,200,200,${Math.random()*0.3})`;
      ctx.fillRect(sx,sy,2,2);
    }
    ctx.fillStyle='rgba(100,100,120,0.5)';ctx.font='11px Georgia,serif';ctx.textAlign='center';
    ctx.fillText('[ NO BROADCAST ]',W/2,TV.y+TV.h/2+4);
  } else {
    ctx.drawImage(P,TV.x,TV.y,TV.w,TV.h);
    // Scanlines
    ctx.fillStyle='rgba(0,0,0,0.12)';
    for(let y=TV.y;y<TV.y+TV.h;y+=3){ctx.fillRect(TV.x,y,TV.w,1);}
  }

  // Antenna
  ctx.strokeStyle='#555566';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(TV.x+TV.w*0.3,TV.y-8);ctx.lineTo(TV.x+TV.w*0.1,TV.y-30);ctx.stroke();
  ctx.beginPath();ctx.moveTo(TV.x+TV.w*0.7,TV.y-8);ctx.lineTo(TV.x+TV.w*0.9,TV.y-30);ctx.stroke();

  // "LIVE" badge when broadcasting
  if(broadcast.imgData){
    ctx.fillStyle='#cc2222';ctx.beginPath();ctx.roundRect(TV.x+4,TV.y+4,30,14,3);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='left';ctx.fillText('LIVE',TV.x+8,TV.y+14);
  }

  // Broadcast label below TV
  if(broadcast.type!=='static'&&broadcast.msg){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.beginPath();ctx.roundRect(TV.x,TV.y+TV.h+2,TV.w,16,2);ctx.fill();
    ctx.fillStyle='#ffdd88';ctx.font='10px Georgia,serif';ctx.textAlign='center';
    ctx.fillText(broadcast.msg,W/2,TV.y+TV.h+13);
  }
}

// ══════════════════════════════════════════════
// DRAWING — TENSION METER
// ══════════════════════════════════════════════
function drawTension(){
  const bx=20,by=H-18,bw=W-40,bh=10;
  // background
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.beginPath();ctx.roundRect(bx-2,by-14,bw+4,bh+16,4);ctx.fill();
  // label
  ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='bold 9px sans-serif';ctx.textAlign='left';
  ctx.fillText('TENSION',bx,by-3);
  ctx.textAlign='right';ctx.fillText(Math.round(tension)+'%',bx+bw,by-3);
  // track
  ctx.fillStyle='rgba(60,40,80,0.9)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,5);ctx.fill();
  // fill
  const fillW=bw*(tension/100);
  if(fillW>0){
    const tcol=tension<40?'#44dd44':tension<70?'#ffaa00':'#ff2200';
    const grad=ctx.createLinearGradient(bx,0,bx+fillW,0);
    grad.addColorStop(0,tcol);grad.addColorStop(1,tension>70?'#ff5500':tcol);
    ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(bx,by,fillW,bh,5);ctx.fill();
  }
  // border
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,5);ctx.stroke();
  // pulsing glow at high tension
  if(tension>70){
    ctx.strokeStyle=`rgba(255,50,0,${0.3+Math.sin(frame*0.15)*0.3})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(bx-1,by-1,bw+2,bh+2,6);ctx.stroke();
  }
}

// ══════════════════════════════════════════════
// DRAWING — CAMERA VIEWFINDER
// ══════════════════════════════════════════════
const SCREAMS=['GRRRR!!','GET AWAY!','AAAGH!','😡😡😡','BACK OFF!!','LEAVE ME!','NO PHOTOS!','RAAAAH!'];
function drawScreams(){
  npcs.forEach(n=>{
    if(n.mood!=='angry') return;
    const dist=Math.hypot(mx-n.x,my-n.y);
    if(dist>90) return;
    const intensity=1-dist/90; // 0..1, 1=closest
    // pick a stable scream per NPC based on id
    const scream=SCREAMS[Math.floor(n.id*SCREAMS.length)%SCREAMS.length];
    // shake offset
    const shakeX=(Math.random()-0.5)*intensity*6;
    const shakeY=(Math.random()-0.5)*intensity*4;
    const bx=n.x+shakeX,by=n.y-n.size-8+shakeY;
    // bubble
    ctx.save();
    ctx.globalAlpha=0.5+intensity*0.5;
    const tw=ctx.measureText(scream).width+14;
    ctx.font=`bold ${10+Math.round(intensity*5)}px Georgia,serif`;
    const tw2=ctx.measureText(scream).width+14;
    const th=18+intensity*4;
    ctx.fillStyle='rgba(255,30,30,0.92)';
    ctx.strokeStyle='#ff0000';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(bx-tw2/2,by-th,tw2,th,5);ctx.fill();ctx.stroke();
    // tail
    ctx.fillStyle='rgba(255,30,30,0.92)';
    ctx.beginPath();ctx.moveTo(bx-5,by);ctx.lineTo(bx+5,by);ctx.lineTo(bx,by+7);ctx.closePath();ctx.fill();
    // text
    ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.fillText(scream,bx,by-4);
    ctx.restore();
  });
}

function drawViewfinder(){
  const inTV = mx>TV.x&&mx<TV.x+TV.w&&my>TV.y&&my<TV.y+TV.h;
  const alpha = inTV ? 0.3 : 1;
  ctx.globalAlpha=alpha;

  // Viewfinder box
  const vx=mx-VF,vy=my-VF,vw=VF*2,vh=VF*2;
  ctx.strokeStyle=`rgba(255,255,100,${alpha})`;ctx.lineWidth=2;ctx.setLineDash([6,4]);
  ctx.strokeRect(vx,vy,vw,vh);ctx.setLineDash([]);

  // Corner brackets
  const bs=16;ctx.lineWidth=3;ctx.strokeStyle=`rgba(255,255,100,${alpha})`;
  [[vx,vy],[vx+vw,vy],[vx,vy+vh],[vx+vw,vy+vh]].forEach(([cx,cy])=>{
    const sx=cx===vx?1:-1,sy=cy===vy?1:-1;
    ctx.beginPath();ctx.moveTo(cx+sx*bs,cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy+sy*bs);ctx.stroke();
  });

  // Crosshair center
  ctx.strokeStyle=`rgba(255,255,100,${alpha})`;ctx.lineWidth=1;ctx.setLineDash([2,3]);
  ctx.beginPath();ctx.moveTo(mx-8,my);ctx.lineTo(mx+8,my);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mx,my-8);ctx.lineTo(mx,my+8);ctx.stroke();
  ctx.setLineDash([]);

  ctx.globalAlpha=1;

  // Camera body (cursor)
  ctx.fillStyle='rgba(30,20,40,0.85)';ctx.strokeStyle='rgba(200,200,180,0.8)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(mx-16,my+VF+4,32,20,3);ctx.fill();ctx.stroke();
  // Lens
  ctx.fillStyle='rgba(50,50,80,0.9)';ctx.beginPath();ctx.arc(mx,my+VF+14,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(180,200,255,0.6)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='rgba(180,220,255,0.3)';ctx.beginPath();ctx.arc(mx-2,my+VF+12,3,0,Math.PI*2);ctx.fill();
  // Flash hint
  if(phase==='play'){
    ctx.fillStyle='rgba(255,255,200,0.6)';ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText('click',mx,my+VF+34);
  }
}

// ══════════════════════════════════════════════
// PHOTO CAPTURE
// ══════════════════════════════════════════════
function takePhoto(){
  flashTimer=12;
  // Render current scene to offscreen at scale
  const scale=P.width/(VF*2);
  pctx.save();
  pctx.scale(scale,scale);
  pctx.translate(-mx+VF,-my+VF);
  // Redraw scene into photo canvas
  pctx.fillStyle='#c4a870';pctx.fillRect(0,0,W,H);
  drawBgToCtx(pctx);
  npcs.forEach(n=>drawNPCToCtx(pctx,n));
  pctx.restore();

  // Slight vignette
  const vg=pctx.createRadialGradient(P.width/2,P.height/2,20,P.width/2,P.height/2,80);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.3)');
  pctx.fillStyle=vg;pctx.fillRect(0,0,P.width,P.height);

  // Determine what's in the frame
  const inFrame=npcs.filter(n=>{
    return n.x>mx-VF&&n.x<mx+VF&&n.y>my-VF&&n.y<my+VF;
  });
  analyzeBroadcast(inFrame);
  broadcast.imgData=P.toDataURL();
}

function showStoryMsg(msg,col='#ffdd44'){storyMsg=msg;storyMsgTimer=180;}

function analyzeBroadcast(inFrame){
  if(inFrame.length===0){broadcast.type='empty';broadcast.msg='';broadcast.intensity=0;return;}
  const circles=inFrame.filter(n=>n.type==='circle');
  const squares=inFrame.filter(n=>n.type==='square');
  const trendyIn=inFrame.filter(n=>n.trendy).length;
  const angryIn=inFrame.filter(n=>n.mood==='angry').length;
  const scaredIn=inFrame.filter(n=>n.mood==='scared').length;

  // ── SCRIPTED STORY BEATS ──────────────────────
  // Phase 0: first photo → squares terrified of circles
  if(storyPhase===0){
    broadcast.type='scared_s';broadcast.intensity=0.6;
    broadcast.msg='😱 BREAKING: Squares TERRIFIED of circles!';
    npcs.filter(n=>n.type==='square').forEach(n=>n.mood='scared');
    showStoryMsg('😱 Squares are terrified of circles!','#aa88ff');
    tension=Math.min(100,tension+5);
    storyPhase=1;
    return;
  }
  // Phase 1: next photo → circles now scared of squares
  if(storyPhase===1){
    broadcast.type='scared_c';broadcast.intensity=0.6;
    broadcast.msg='😱 NOW: Circles TERRIFIED of squares too!';
    npcs.filter(n=>n.type==='circle'&&!n.trendy).forEach(n=>n.mood='scared');
    showStoryMsg('😱 Now the circles are terrified of the squares!','#ffaa44');
    tension=Math.min(100,tension+8);
    storyPhase=2;
    return;
  }
  // Phase 2: next photo → everyone scared
  if(storyPhase===2){
    broadcast.type='scared_all';broadcast.intensity=0.8;
    broadcast.msg='😱 EVERYONE IS TERRIFIED OF EACH OTHER!';
    npcs.forEach(n=>{if(n.mood!=='angry') n.mood='scared';});
    showStoryMsg('😱 Everyone is terrified of each other!','#ff8844');
    tension=Math.min(100,tension+10);
    storyPhase=3;
    return;
  }
  // Phase 3: must photograph glasses to trigger next beat
  if(storyPhase===3){
    if(trendyIn>0){
      broadcast.type='glasses_dumb';broadcast.intensity=0.9;
      broadcast.msg='👓 OPINION: GLASSES ARE DUMB! 94% of viewers agree.';
      showStoryMsg('👓 "GLASSES ARE DUMB!" — the TV has spoken.','#ffcc00');
      // Un-glassed squares rage against glassed circles
      npcs.filter(n=>n.type==='square').forEach(n=>n.mood='angry');
      npcs.filter(n=>n.trendy).forEach(n=>n.mood='angry');
      tension=Math.min(100,tension+20);
      storyPhase=4;
    } else {
      broadcast.type='empty';broadcast.intensity=0;
      broadcast.msg='📺 Photograph someone wearing glasses...';
    }
    return;
  }
  // Phase 4+: free but scripted chaos, tension rises fast
  if(storyPhase>=4){
    if(angryIn>=2){
      broadcast.type='chaos';broadcast.intensity=0.9;
      broadcast.msg='⚡ GLASSES-WEARERS VS NON-WEARERS! All-out brawl!';
      tension=Math.min(100,tension+10);
      addFloat('⚡ Tension rises!',W/2,PLAY_TOP+20,'#ff4422');
    } else if(angryIn===1){
      broadcast.type='extreme';broadcast.intensity=0.6;
      broadcast.msg='😡 Anger is spreading through the square!';
      tension=Math.min(100,tension+5);
    } else {
      broadcast.type='mixed';broadcast.intensity=0.4;
      broadcast.msg='📺 Chaos in the town square.';
      tension=Math.min(100,tension+2);
    }
  }
}

// Lightweight bg/NPC draw for offscreen
function drawBgToCtx(c){
  c.fillStyle='#2a1a3e';c.fillRect(0,0,W,PLAY_TOP);
  const grd=c.createLinearGradient(0,PLAY_TOP,0,H);grd.addColorStop(0,'#c4a870');grd.addColorStop(1,'#a8905a');
  c.fillStyle=grd;c.fillRect(0,PLAY_TOP,W,H-PLAY_TOP);
  c.strokeStyle='rgba(0,0,0,0.1)';c.lineWidth=1;
  for(let y=PLAY_TOP+20;y<H;y+=30){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
}

function drawNPCToCtx(c,n){
  const s=n.size;
  const col=n.mood==='angry'?'#dd1111'
    :n.trendy?(n.type==='circle'?'#ffaa00':'#6677ff')
    :(n.type==='circle'?'#ff9933':'#6677ff');
  c.fillStyle=col;
  if(n.type==='circle'){
    c.beginPath();c.arc(n.x,n.y,s,0,Math.PI*2);c.fill();
    // face
    c.fillStyle='#111';
    c.beginPath();c.arc(n.x-s*0.3,n.y-s*0.15,s*0.18,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(n.x+s*0.3,n.y-s*0.15,s*0.18,0,Math.PI*2);c.fill();
    if(n.mood==='angry'){
      c.strokeStyle='#111';c.lineWidth=1.5;
      c.beginPath();c.arc(n.x,n.y+s*0.2,s*0.3,Math.PI*0.1,Math.PI*0.9,true);c.stroke();
    } else {
      c.strokeStyle='#111';c.lineWidth=1.5;
      c.beginPath();c.arc(n.x,n.y+s*0.1,s*0.3,0.1*Math.PI,0.9*Math.PI);c.stroke();
    }
    // trendy glasses
    if(n.trendy){
      c.strokeStyle='#111';c.lineWidth=1.5;
      c.beginPath();c.arc(n.x-s*0.3,n.y-s*0.15,s*0.26,0,Math.PI*2);c.stroke();
      c.beginPath();c.arc(n.x+s*0.3,n.y-s*0.15,s*0.26,0,Math.PI*2);c.stroke();
      c.beginPath();c.moveTo(n.x-s*0.04,n.y-s*0.15);c.lineTo(n.x+s*0.04,n.y-s*0.15);c.stroke();
    }
  } else {
    c.fillRect(n.x-s,n.y-s,s*2,s*2);
    // face
    c.fillStyle='#111';
    c.fillRect(n.x-s*0.5,n.y-s*0.35,s*0.3,s*0.3);
    c.fillRect(n.x+s*0.2,n.y-s*0.35,s*0.3,s*0.3);
    if(n.mood==='angry'){
      c.strokeStyle='#111';c.lineWidth=1.5;
      c.beginPath();c.moveTo(n.x-s*0.4,n.y+s*0.3);c.lineTo(n.x+s*0.4,n.y+s*0.3);c.stroke();
    } else {
      c.strokeStyle='#111';c.lineWidth=1.5;
      c.beginPath();c.arc(n.x,n.y+s*0.2,s*0.35,0.05*Math.PI,0.95*Math.PI);c.stroke();
    }
  }
}

// ══════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════
function update(){
  frame++;
  if(flashTimer>0) flashTimer--;

  if(phase==='intro'){
    introFrame++;
    if(clicked&&introFrame>60){phase='tutorial';tutFrame=0;tutStep=0;clicked=false;}
    return;
  }
  if(phase==='tutorial'){
    tutFrame++;
    // scripted story beats
    if(tutStep<TUT.length&&tutFrame>=TUT[tutStep].at){
      // fire the event
      if(tutStep===0){
        // first trendy circle
        const c=npcs.find(n=>n.type==='circle'&&!n.trendy);
        if(c) c.trendy=true;
      } else if(tutStep===1){
        // 3 more trendy circles
        npcs.filter(n=>n.type==='circle'&&!n.trendy).slice(0,3).forEach(n=>n.trendy=true);
      } else if(tutStep===2){
        // squares notice — a couple look toward center
        npcs.filter(n=>n.type==='square').slice(0,3).forEach(n=>n.vx=-Math.abs(n.vx||0.5));
      } else if(tutStep===3){
        // first angry square
        const sq=npcs.find(n=>n.type==='square'&&n.mood==='calm');
        if(sq){sq.mood='angry';tension=15;}
      } else if(tutStep===4){
        // transition to play — camera appears, let player take over
        setTimeout(()=>{phase='play';},1500);
      }
      tutStep++;
    }
    // move NPCs during tutorial
    npcs.forEach(n=>{
      n.wobble+=0.04;n.x+=n.vx+(Math.sin(n.wobble)*0.15);n.y+=n.vy+(Math.cos(n.wobble*0.7)*0.1);
      const lx=n.type==='circle'?55:PLAY_MID+5,rx=n.type==='circle'?PLAY_MID-5:W-55;
      if(n.x<lx+5)n.vx+=0.1;if(n.x>rx-5)n.vx-=0.1;
      if(n.y<PLAY_TOP+15)n.vy+=0.1;if(n.y>H-25)n.vy-=0.1;
      const spd=Math.hypot(n.vx,n.vy);if(spd>1.6){n.vx*=0.98;n.vy*=0.98;}
    });
    clicked=false;return;
  }
  if(phase==='ending'){endFrame++;clicked=false;return;}
  if(phase==='escalate'){
    endFrame++;
    tension=Math.min(100,tension+0.3);
    if(endFrame>120){
      endType=tension>=95?'chaos':'peace';
      phase='ending';endFrame=0;
    }
    clicked=false;return;
  }

  // Update NPCs
  npcs.forEach(n=>{
    n.wobble+=0.04;
    // Drift
    n.x+=n.vx+(Math.sin(n.wobble)*0.2);
    n.y+=n.vy+(Math.cos(n.wobble*0.7)*0.15);

    // Angry: rush toward center / opposite group
    if(n.mood==='angry'){
      const push=n.type==='circle'?0.06:-0.06;
      n.vx+=push;
      const spd=Math.hypot(n.vx,n.vy);
      if(spd>3){n.vx*=0.93;n.vy*=0.93;}
    }
    // Scared: run away from opposite group (away from center)
    if(n.mood==='scared'){
      const flee=n.type==='circle'?-0.08:0.08;
      n.vx+=flee;
      const spd=Math.hypot(n.vx,n.vy);
      if(spd>2.5){n.vx*=0.93;n.vy*=0.93;}
    }

    // Boundaries (soft) — scared can go anywhere, others stay in territory
    const lx=n.mood==='scared'||n.mood==='angry'?30:n.type==='circle'?55:PLAY_MID+5;
    const rx=n.mood==='scared'||n.mood==='angry'?W-30:n.type==='circle'?PLAY_MID-5:W-55;
    if(n.x<lx+5) n.vx+=0.1;
    if(n.x>rx-5) n.vx-=0.1;
    if(n.y<PLAY_TOP+15) n.vy+=0.1;
    if(n.y>H-15) n.vy-=0.1;
    // Clamp velocity
    const spd=Math.hypot(n.vx,n.vy);
    if(spd>1.8){n.vx*=0.98;n.vy*=0.98;}
    if(spd<0.3&&Math.random()<0.02){n.vx=(Math.random()-0.5)*1;n.vy=(Math.random()-0.5)*0.8;}

    // Anger contagion from broadcast
    n.moodT--;
    if(n.moodT<=0){
      n.moodT=60+Math.random()*80;
      if(broadcast.type==='chaos'||broadcast.type==='extreme'){
        if(Math.random()<broadcast.intensity*0.3) n.mood='angry';
      } else if(broadcast.type==='together'||broadcast.type==='calm_c'||broadcast.type==='calm_s'){
        if(n.mood==='angry'&&Math.random()<0.25) n.mood='calm';
      }
      // Peer contagion near angry same-type
      const nearAngry=npcs.filter(o=>o.type===n.type&&o.mood==='angry'&&Math.hypot(o.x-n.x,o.y-n.y)<55).length;
      if(nearAngry>2&&Math.random()<0.15) n.mood='angry';
    }

    // Extreme (hat/spike) — appears when tension high
    if(!n.extreme&&tension>35&&Math.random()<0.0004*(tension/35)){
      n.extreme=true;n.extremeT=360+Math.random()*240;
    }
    if(n.extremeT>0){
      n.extremeT--;
      if(n.extremeT<=0){n.extreme=false;}
    }
    // Extreme ones more likely angry
    if(n.extreme&&n.mood==='calm'&&Math.random()<0.005) n.mood='angry';

    // Tension passively rises if many angry
    const angryCount=npcs.filter(o=>o.mood==='angry').length;
    if(angryCount>8) tension=Math.min(100,tension+0.02);
  });

  // Conflict: angry circles near angry squares
  let conflicts=0;
  npcs.filter(a=>a.mood==='angry'&&a.type==='circle').forEach(a=>{
    npcs.filter(b=>b.mood==='angry'&&b.type==='square').forEach(b=>{
      if(Math.hypot(a.x-b.x,a.y-b.y)<30) conflicts++;
    });
  });
  if(conflicts>0) tension=Math.min(100,tension+conflicts*0.05);

  // Passive decay
  if(broadcast.type==='together'||broadcast.type==='calm_c'||broadcast.type==='calm_s'){
    tension=Math.max(0,tension-0.015);
  }

  if(tension>=100) phase='escalate';

  // Handle photo click
  if(clicked){
    clicked=false;
    const inTV=mx>TV.x&&mx<TV.x+TV.w&&my>TV.y&&my<TV.y+TV.h;
    if(!inTV&&phase==='play') takePhoto();
  }

  // Floats
  floats=floats.filter(f=>f.life>0);
  floats.forEach(f=>f.life--);
}

// ══════════════════════════════════════════════
// DRAW INTRO
// ══════════════════════════════════════════════
function drawIntro(){
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
  const lines=[
    {t:'We Broadcast What We Choose',y:H/2-80,size:26,col:'#ffdd88',bold:true},
    {t:'A town. Two kinds of people.',y:H/2-30,size:16,col:'#dddddd',bold:false},
    {t:'You hold a camera.',y:H/2-6,size:16,col:'#dddddd',bold:false},
    {t:'What you broadcast shapes what they become.',y:H/2+22,size:14,col:'#bbbbbb',bold:false},
    {t:'',y:H/2+50,size:14,col:'#888888',bold:false},
    {t:'[ click to begin ]',y:H/2+72,size:14,col:introFrame%40<20?'#ffdd44':'#aa9922',bold:false},
  ];
  lines.forEach(l=>{
    if(!l.t) return;
    const a=Math.min(1,(introFrame-10)/40);
    ctx.globalAlpha=a>0?a:0;
    ctx.fillStyle=l.col;
    ctx.font=(l.bold?'bold ':'')+l.size+'px Georgia,serif';
    ctx.textAlign='center';ctx.fillText(l.t,W/2,l.y);
  });
  ctx.globalAlpha=1;
}

// ══════════════════════════════════════════════
// DRAW ESCALATE / ENDING
// ══════════════════════════════════════════════
function drawStoryMsg(){
  if(storyMsgTimer<=0) return;
  storyMsgTimer--;
  const a=Math.min(1,storyMsgTimer/20);
  ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.beginPath();ctx.roundRect(W/2-170,PLAY_TOP+8,340,32,8);ctx.fill();
  ctx.fillStyle='#ffdd44';ctx.font='bold 15px Georgia,serif';ctx.textAlign='center';
  ctx.fillText(storyMsg,W/2,PLAY_TOP+28);
  ctx.globalAlpha=1;
}

function drawTutorial(){
  // Show current tutorial message with fade
  if(tutStep===0) return;
  const step=TUT[Math.min(tutStep-1,TUT.length-1)];
  const sinceStep=tutFrame-step.at;
  const fadeIn=Math.min(1,sinceStep/20);
  const nextAt=tutStep<TUT.length?TUT[tutStep].at:tutFrame+999;
  const fadeOut=sinceStep>nextAt-step.at-30?Math.max(0,1-(sinceStep-(nextAt-step.at-30))/20):1;
  const alpha=fadeIn*fadeOut;
  if(alpha<=0) return;
  const lines=step.msg.split('\n');
  const lh=22,pad=14;
  const tw=220,th=lines.length*lh+pad*2;
  const bx=W/2-tw/2,by=PLAY_TOP+16;
  ctx.globalAlpha=alpha*0.92;
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.beginPath();ctx.roundRect(bx,by,tw,th,8);ctx.fill();
  ctx.strokeStyle=step.col;ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=step.col;ctx.font='bold 13px Georgia,serif';ctx.textAlign='center';
  lines.forEach((l,i)=>ctx.fillText(l,W/2,by+pad+13+i*lh));
  ctx.globalAlpha=1;
  // Arrow pointing at first trendy NPC during step 1
  if(tutStep===1||tutStep===2){
    const tNPC=npcs.find(n=>n.trendy);
    if(tNPC){
      ctx.globalAlpha=alpha*0.8;
      ctx.strokeStyle='#ffcc44';ctx.lineWidth=2;ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.moveTo(W/2,by+th+4);ctx.lineTo(tNPC.x,tNPC.y-20);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#ffcc44';ctx.beginPath();ctx.moveTo(tNPC.x,tNPC.y-14);ctx.lineTo(tNPC.x-5,tNPC.y-24);ctx.lineTo(tNPC.x+5,tNPC.y-24);ctx.closePath();ctx.fill();
      ctx.globalAlpha=1;
    }
  }
  // Arrow pointing at angry square during step 4
  if(tutStep===4){
    const aSq=npcs.find(n=>n.type==='square'&&n.mood==='angry');
    if(aSq){
      ctx.globalAlpha=alpha*0.8;
      ctx.strokeStyle='#ff4444';ctx.lineWidth=2;ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.moveTo(W/2,by+th+4);ctx.lineTo(aSq.x,aSq.y-20);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#ff4444';ctx.beginPath();ctx.moveTo(aSq.x,aSq.y-14);ctx.lineTo(aSq.x-5,aSq.y-24);ctx.lineTo(aSq.x+5,aSq.y-24);ctx.closePath();ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}

function drawEscalate(){
  // Screen shake
  const shake=Math.sin(endFrame*0.8)*3;
  ctx.save();ctx.translate(shake,0);

  // Red overlay pulsing
  ctx.fillStyle=`rgba(200,0,0,${0.1+Math.sin(endFrame*0.2)*0.1})`;ctx.fillRect(-10,0,W+20,H);

  // Angry NPCs converge
  ctx.restore();

  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ff4422';ctx.font='bold 22px Georgia,serif';ctx.textAlign='center';
  ctx.fillText('⚡ CONFLICT ERUPTS ⚡',W/2,H/2-20);
  ctx.fillStyle='#ffaa88';ctx.font='14px Georgia,serif';
  ctx.fillText('The broadcasts have done their work.',W/2,H/2+10);
}

function drawEnding(){
  ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,0,W,H);
  const msgIndex=Math.min(4,Math.floor(endFrame/60));
  const msgs_chaos=[
    'You chose what to show.',
    'You showed the anger. The hatred. The fear.',
    'And they became what you broadcast.',
    'Media shapes what people see.',
    'What will you choose next time?',
  ];
  const msgs_peace=[
    'You chose what to show.',
    'You chose to broadcast the ordinary.',
    'The normal moments. The shared spaces.',
    'And the tension never reached a breaking point.',
    'What we broadcast matters.',
  ];
  const msgs=endType==='chaos'?msgs_chaos:msgs_peace;
  const col=endType==='chaos'?'#ff8866':'#88ff99';

  for(let i=0;i<=msgIndex;i++){
    const a=i<msgIndex?1:Math.min(1,((endFrame%60)/30));
    ctx.globalAlpha=a;
    ctx.fillStyle=i===msgIndex?col:'#dddddd';
    ctx.font=(i===0?'bold 20px':'16px')+' Georgia,serif';
    ctx.textAlign='center';
    ctx.fillText(msgs[i],W/2,H/2-80+i*42);
  }
  ctx.globalAlpha=1;

  if(msgIndex>=4&&endFrame>280){
    ctx.fillStyle=endFrame%50<25?'#ffdd44':'#886600';
    ctx.font='13px Georgia,serif';ctx.textAlign='center';
    ctx.fillText('[ click to play again ]',W/2,H-40);
    if(clicked){clicked=false;resetGame();}
  }
}

function resetGame(){
  tension=0;frame=0;flashTimer=0;introFrame=0;tutFrame=0;tutStep=0;endFrame=0;endType='';storyPhase=0;storyMsg='';storyMsgTimer=0;
  broadcast={type:'static',intensity:0,imgData:null};floats=[];
  npcs=[];
  for(let i=0;i<10;i++) npcs.push(mkNPC('circle',80+Math.random()*200,PLAY_TOP+30+Math.random()*200));
  for(let i=0;i<10;i++) npcs.push(mkNPC('square',340+Math.random()*200,PLAY_TOP+30+Math.random()*200));
  phase='intro';
}

// ══════════════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════════════
function loop(){
  ctx.clearRect(0,0,W,H);
  update();

  drawBg();

  // Flash
  if(flashTimer>0){
    ctx.fillStyle=`rgba(255,255,255,${flashTimer/12*0.7})`;ctx.fillRect(0,0,W,H);
  }

  if(phase==='intro'){
    npcs.forEach(n=>drawNPC(n));
    drawTV();
    drawIntro();
    requestAnimationFrame(loop);return;
  }

  if(phase==='tutorial'){
    npcs.forEach(n=>drawNPC(n));
    drawScreams();
    drawTV();
    drawTutorial();
    requestAnimationFrame(loop);return;
  }

  if(phase==='ending'){
    npcs.forEach(n=>drawNPC(n));
    drawTV();
    drawEnding();
    requestAnimationFrame(loop);return;
  }

  if(phase==='escalate'){
    npcs.forEach(n=>drawNPC(n));
    drawTV();
    drawTension();
    drawEscalate();
    requestAnimationFrame(loop);return;
  }

  // Normal play
  npcs.forEach(n=>drawNPC(n));
  drawScreams();
  drawStoryMsg();
  drawTV();
  drawTension();

  // Floats
  floats.forEach(f=>{
    const a=f.life/90;
    ctx.globalAlpha=a;ctx.fillStyle=f.col;ctx.font='bold 12px Georgia,serif';ctx.textAlign='center';
    ctx.fillText(f.txt,f.x,f.y-(90-f.life)*0.4);
  });
  ctx.globalAlpha=1;

  drawViewfinder();

  // Instructions (early game)
  if(frame<200){
    const a=Math.min(1,(200-frame)/60);
    ctx.globalAlpha=a;
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.beginPath();ctx.roundRect(W/2-130,H-32,260,22,4);ctx.fill();
    ctx.fillStyle='#ffe8a0';ctx.font='11px Georgia,serif';ctx.textAlign='center';
    ctx.fillText('Move mouse to aim • Click to photograph • TV broadcasts your photos',W/2,H-17);
    ctx.globalAlpha=1;
  }

  requestAnimationFrame(loop);
}

loop();
</script>
