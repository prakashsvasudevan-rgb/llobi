<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dragon Battle | LLOBI</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;user-select:none;display:flex;flex-direction:column;align-items:center;height:100dvh;font-family:'Press Start 2P',monospace}
.topbar{width:100%;max-width:700px;display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:#0a0005;border-bottom:3px solid #4a0010;flex-shrink:0;z-index:10;position:relative}
.logo{font-family:'Press Start 2P',monospace;font-size:.55rem;color:#fff;text-decoration:none}
.logo span{color:#ff4444}
#wrap{position:relative;width:100%;max-width:700px;flex:1;overflow:hidden;isolation:isolate}
canvas{display:block;width:100%;height:100%;position:relative;z-index:0}

/* Select Screen */
#sel{position:absolute;inset:0;background:linear-gradient(#080018,#200030);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;gap:10px;transform:translateZ(0)}
#sel h1{font-size:1.1rem;color:#ff4444;text-shadow:0 0 20px #ff0000}
#sel .sub{font-size:.45rem;color:#aaa}
#cards{display:flex;gap:6px;padding:0 6px;overflow:hidden}
.card{flex:0 0 auto;padding:8px 6px;background:#111122;border:2px solid #333355;cursor:pointer;text-align:center;min-width:80px;transition:transform .1s}
.card.sel{border-color:var(--ec);background:var(--bd);transform:translateY(-8px)}
.card-emoji{font-size:1.6rem;margin-bottom:4px}
.card-name{font-size:.4rem;color:var(--ec)}
.card-desc{font-size:.28rem;color:#888;margin-top:2px}
.bars{margin-top:4px}
.bar-row{display:flex;align-items:center;gap:3px;font-size:.25rem;color:#666;margin:1px 0}
.bar-fill{height:3px;background:var(--ec);border-radius:1px}
#sel-hint{font-size:.38rem;color:#FFD700}
#sel-best{font-size:.35rem;color:#ff8888}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:none;z-index:4;transform:translateZ(0)}
#hud-tl{position:absolute;top:8px;left:8px}
#type-badge{font-size:.45rem;padding:3px 8px;background:rgba(0,0,0,.5);margin-bottom:4px;display:inline-block}
.bar-wrap{width:160px;height:10px;background:rgba(0,0,0,.5);margin:3px 0;border:1px solid rgba(255,255,255,.1)}
.bar-inner{height:100%;transition:width .1s}
#hp-fill{background:#ff3333}
#fuel-fill{background:#ff8800}
#hud-tr{position:absolute;top:8px;right:8px;text-align:right}
#hud-tr div{font-size:.5rem;margin:3px 0}
#sc{color:#FFD700}#bs{color:#888}#kl{color:#ff8888}#dst{color:#555;font-size:.38rem}

/* Dead screen */
#dead{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:6;gap:12px;transform:translateZ(0)}
#dead h2{font-size:.85rem;color:#ff4444}
#dead p{font-size:.5rem;color:#FFD700}
#dead .sub{font-size:.35rem;color:#888}
#dead .hint{font-size:.38rem;color:#ff8888;margin-top:4px}

/* Mobile controls */
#mctrl{position:absolute;bottom:0;left:0;right:0;display:none;padding:6px 10px;pointer-events:none;z-index:4}
#mctrl.show{display:flex;justify-content:space-between;align-items:flex-end}
.mc-pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:4px}
.mc-btn{width:52px;height:52px;background:rgba(255,50,50,.18);border:2px solid rgba(255,80,80,.35);color:#ff8888;font-size:.8rem;display:grid;place-items:center;cursor:pointer;pointer-events:all;border-radius:6px}
.mc-btn:active{background:rgba(255,80,80,.4)}
.mc-fire{width:76px;height:76px;background:rgba(255,100,0,.22);border:3px solid rgba(255,140,0,.5);border-radius:50%;color:#ffaa00;font-size:1.6rem;display:grid;place-items:center;cursor:pointer;pointer-events:all}
.mc-fire:active{background:rgba(255,160,0,.5)}
</style>
</head>
<body>
<div class="topbar">
  <a href="/" class="logo"><span>llobi</span>.com</a>
  <span style="font-size:.42rem;color:#661111">DRAGON BATTLE</span>
</div>
<div id="wrap">
  <canvas id="c3d"></canvas>

  <!-- Select -->
  <div id="sel">
    <h1>DRAGON BATTLE</h1>
    <p class="sub">CHOOSE YOUR DRAGON</p>
    <div id="cards"></div>
    <p id="sel-hint">◀ ▶ TO CHOOSE · SPACE/TAP TO FLY</p>
    <p id="sel-best"></p>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-tl">
      <div id="type-badge">FIRE 🔥</div>
      <div class="bar-wrap"><div class="bar-inner" id="hp-fill"></div></div>
      <div class="bar-wrap"><div class="bar-inner" id="fuel-fill"></div></div>
    </div>
    <div id="hud-tr">
      <div id="sc">SCORE 0</div><div id="bs">BEST 0</div>
      <div id="kl">KILLS 0</div><div id="dst">0 km</div>
    </div>
  </div>

  <!-- Dead -->
  <div id="dead">
    <h2>YOUR DRAGON FELL!</h2>
    <p id="dead-score"></p><p id="dead-new" class="sub"></p>
    <p id="dead-hint" class="hint">SPACE / TAP TO CONTINUE</p>
  </div>

  <!-- Mobile -->
  <div id="mctrl">
    <div class="mc-pad">
      <div></div><div class="mc-btn" id="mc-up">▲</div><div></div>
      <div class="mc-btn" id="mc-left">◀</div>
      <div class="mc-btn" id="mc-down">▼</div>
      <div class="mc-btn" id="mc-right">▶</div>
    </div>
    <div class="mc-fire" id="mc-fire">🔥</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
'use strict';
// ── Dragon types ──────────────────────────────────────────────────────────────
const DT=[
  {id:'fire',  name:'FIRE',   emoji:'🔥',desc:'Fast & fierce',
   body:0x8B0000,bodyL:0xCC2222,bodyD:0x5a0000,belly:0xCC7744,
   wingD:0x3d0000,wingL:0x660000,horn:0x1a1a1a,eye:0xFFD700,eyeC:'#FFD700',
   breath:[0xFFE566,0xFF8800,0xFF2200],speed:22,hp:140,fuel:80,rfuel:1.4,dmg:5,pts:1},
  {id:'ice',   name:'ICE',    emoji:'❄️',desc:'Slows enemies',
   body:0x1a3a6b,bodyL:0x4488cc,bodyD:0x0d2040,belly:0xaaddff,
   wingD:0x0d2040,wingL:0x1a3a6b,horn:0x88ccff,eye:0xffffff,eyeC:'#ffffff',
   breath:[0xffffff,0x88ddff,0x44aaff],speed:18,hp:160,fuel:90,rfuel:1.1,dmg:4,pts:1},
  {id:'earth', name:'EARTH',  emoji:'🪨',desc:'Heavy & tanky',
   body:0x3d2a0d,bodyL:0x6b4a1a,bodyD:0x1a1005,belly:0x8B6914,
   wingD:0x1a1005,wingL:0x3d2a0d,horn:0x2d4a0d,eye:0x88ff44,eyeC:'#88ff44',
   breath:[0xaabb44,0x886622,0x443311],speed:14,hp:220,fuel:70,rfuel:1.0,dmg:7,pts:1},
  {id:'air',   name:'AIR',    emoji:'💨',desc:'Fastest flier',
   body:0x3a3a4a,bodyL:0x8888aa,bodyD:0x1a1a2a,belly:0xddddff,
   wingD:0x1a1a2a,wingL:0x444466,horn:0xaaaacc,eye:0x00ffff,eyeC:'#00ffff',
   breath:[0xeeeeff,0xaaaacc,0x6666aa],speed:30,hp:120,fuel:100,rfuel:2.0,dmg:3,pts:1},
  {id:'nature',name:'NATURE', emoji:'🌿',desc:'Poison & heals',
   body:0x0d4a0d,bodyL:0x1a8a1a,bodyD:0x051a05,belly:0x88cc44,
   wingD:0x051a05,wingL:0x0d4a0d,horn:0x2d6b0d,eye:0xffff00,eyeC:'#ffff00',
   breath:[0xaaffaa,0x44cc44,0x118811],speed:18,hp:170,fuel:85,rfuel:1.6,dmg:4,pts:1},
  {id:'soul',  name:'SOUL',   emoji:'💜',desc:'Dark magic',
   body:0x2d0a4a,bodyL:0x6622aa,bodyD:0x120524,belly:0x9944dd,
   wingD:0x120524,wingL:0x2d0a4a,horn:0x220044,eye:0xff44ff,eyeC:'#ff44ff',
   breath:[0xff88ff,0xaa44ff,0x660088],speed:20,hp:150,fuel:95,rfuel:1.3,dmg:6,pts:1},
];

// ── Three.js setup ────────────────────────────────────────────────────────────
const canvas=document.getElementById('c3d');
const wrap=document.getElementById('wrap');
let cW=0,cH=0;
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.shadowMap.enabled=false;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080018);
scene.fog=new THREE.Fog(0x080018,180,900);

const camera=new THREE.PerspectiveCamera(70,1,.5,1200);

// Lights
scene.add(new THREE.AmbientLight(0x442255,0.7));
const sun=new THREE.DirectionalLight(0xffaa66,1.3);
sun.position.set(0.4,1,-0.5);scene.add(sun);
const fillLight=new THREE.DirectionalLight(0x2244aa,0.4);
fillLight.position.set(-1,0.5,0.5);scene.add(fillLight);

function resize(){
  const r=wrap.getBoundingClientRect();
  cW=r.width;cH=r.height;
  renderer.setSize(cW,cH,false);
  camera.aspect=cW/cH;camera.updateProjectionMatrix();
}
resize();window.addEventListener('resize',resize);

// ── Ground ────────────────────────────────────────────────────────────────────
const GROUND_SIZE=4000;
const groundGeo=new THREE.PlaneGeometry(GROUND_SIZE,GROUND_SIZE,60,60);
// Add gentle hills
{const pos=groundGeo.attributes.position;
 for(let i=0;i<pos.count;i++){
   const x=pos.getX(i),z=pos.getY(i);
   pos.setZ(i,Math.sin(x/80)*4+Math.sin(z/120)*6+Math.sin(x/35)*2+Math.sin(z/45)*3);
 }
 groundGeo.computeVertexNormals();}
const groundMat=new THREE.MeshLambertMaterial({color:0x1a4d08,flatShading:true});
const ground=new THREE.Mesh(groundGeo,groundMat);
ground.rotation.x=-Math.PI/2;scene.add(ground);

// Stars
{const sg=new THREE.BufferGeometry();
 const sv=new Float32Array(600);
 for(let i=0;i<sv.length;i+=3){
   const th=Math.random()*Math.PI*2,ph=Math.random()*Math.PI*.5;
   sv[i]=Math.cos(ph)*Math.cos(th)*800;sv[i+1]=Math.sin(ph)*800+200;sv[i+2]=Math.cos(ph)*Math.sin(th)*800;
 }
 sg.setAttribute('position',new THREE.BufferAttribute(sv,3));
 scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xfff8e0,size:2,sizeAttenuation:false})));}

// Moon
{const moonGeo=new THREE.SphereGeometry(30,8,8);
 const moonMesh=new THREE.Mesh(moonGeo,new THREE.MeshBasicMaterial({color:0xffe0a0}));
 moonMesh.position.set(300,400,-500);scene.add(moonMesh);}

// ── Dragon model builder ──────────────────────────────────────────────────────
function hex(c){return parseInt(typeof c==='string'?c.replace('#',''):c.toString(16).padStart(6,'0'),16);}
function mat(col,opts={}){return new THREE.MeshLambertMaterial({color:hex(col),...opts});}
function matBasic(col){return new THREE.MeshBasicMaterial({color:hex(col)});}

function addBox(g,w,h,d,m,x=0,y=0,z=0,rx=0,ry=0,rz=0){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  mesh.position.set(x,y,z);mesh.rotation.set(rx,ry,rz);g.add(mesh);return mesh;
}

function makeWingGeo(flip){
  const f=flip?-1:1;
  const v=new Float32Array([
    0,0,0,  f*4,0.4,-0.3,  f*3,0.1,1.5,
    0,0,0,  f*3,0.1,1.5,   f*1.2,0,2.8,
    f*4,0.4,-0.3, f*5.5,0.2,0.5, f*3,0.1,1.5,
  ]);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(v,3));
  geo.computeVertexNormals();return geo;
}

function buildDragonMesh(dt){
  const g=new THREE.Group();
  const mB=mat(dt.body),mL=mat(dt.bodyL),mD=mat(dt.bodyD),mV=mat(dt.belly),mH=mat(dt.horn);
  const mW=mat(dt.wingD,{side:THREE.DoubleSide,transparent:true,opacity:.88});
  const mWL=mat(dt.wingL,{side:THREE.DoubleSide,transparent:true,opacity:.7});
  const mE=matBasic(dt.eye);

  // Body
  addBox(g,2.0,0.95,3.5,mB);
  addBox(g,1.5,0.06,3.0,mV, 0,-0.46,0.1);
  // Neck
  addBox(g,0.78,0.78,1.6,mL, 0,0.28,2.4, -0.38);
  // Head
  addBox(g,1.15,0.92,1.5,mB, 0,0.6,3.6);
  // Snout
  addBox(g,0.78,0.52,0.95,mL, 0,0.44,4.5);
  // Nostrils
  addBox(g,0.14,0.1,0.14,mD, -0.2,0.42,5.0);
  addBox(g,0.14,0.1,0.14,mD,  0.2,0.42,5.0);
  // Horns
  addBox(g,0.2,0.75,0.2,mH, -0.32,1.22,3.5, 0.0,0,0.35);
  addBox(g,0.2,0.75,0.2,mH,  0.32,1.22,3.5, 0.0,0,-0.35);
  // Eyes
  const eGeo=new THREE.SphereGeometry(0.16,6,6);
  const eL=new THREE.Mesh(eGeo,mE.clone());eL.position.set(-0.4,0.78,4.4);g.add(eL);
  const eR=new THREE.Mesh(eGeo,mE.clone());eR.position.set( 0.4,0.78,4.4);g.add(eR);
  // Pupils
  const pGeo=new THREE.SphereGeometry(0.08,4,4);const pM=matBasic(0x000000);
  const pL=new THREE.Mesh(pGeo,pM.clone());pL.position.set(-0.4,0.78,4.57);g.add(pL);
  const pR=new THREE.Mesh(pGeo,pM.clone());pR.position.set( 0.4,0.78,4.57);g.add(pR);

  // Wings (pivots for animation)
  const lwp=new THREE.Group();lwp.position.set(-1.0,0.15,0.6);
  lwp.add(new THREE.Mesh(makeWingGeo(false),mW.clone()));
  lwp.add(new THREE.Mesh(makeWingGeo(false),mWL.clone()));g.add(lwp);
  const rwp=new THREE.Group();rwp.position.set(1.0,0.15,0.6);
  rwp.add(new THREE.Mesh(makeWingGeo(true),mW.clone()));
  rwp.add(new THREE.Mesh(makeWingGeo(true),mWL.clone()));g.add(rwp);

  // Tail segments
  for(let i=0;i<5;i++){
    const s=0.88-i*0.14;
    addBox(g,s,s,1.05,i<2?mB:mD, 0,-i*0.12,-2.4-i*1.0, i*0.08);
  }
  // Tail tip
  addBox(g,0.3,0.3,0.6,mD, 0,-0.55,-7.5, 0.5);

  // Legs
  addBox(g,0.38,0.75,0.38,mD, -0.75,-0.78, 0.65);
  addBox(g,0.38,0.75,0.38,mD,  0.75,-0.78, 0.65);
  addBox(g,0.38,0.75,0.38,mD, -0.75,-0.78,-0.65);
  addBox(g,0.38,0.75,0.38,mD,  0.75,-0.78,-0.65);
  // Feet
  addBox(g,0.55,0.18,0.5,mD, -0.75,-1.2, 0.65);
  addBox(g,0.55,0.18,0.5,mD,  0.75,-1.2, 0.65);
  addBox(g,0.55,0.18,0.5,mD, -0.75,-1.2,-0.65);
  addBox(g,0.55,0.18,0.5,mD,  0.75,-1.2,-0.65);

  g.userData={lwp,rwp,wingAngle:0,tailF:0,tailSegs:[]};
  return g;
}

// Enemy models
function makeArcherMesh(){
  const g=new THREE.Group();
  addBox(g,0.7,1.1,0.7,mat(0x2a1a0a));
  addBox(g,0.6,0.6,0.6,mat(0x8B5a2a), 0,0.9,0);
  addBox(g,0.2,0.2,0.2,mat(0xFFD070), -0.15,1.0,0.32);
  addBox(g,0.2,0.2,0.2,mat(0xFFD070),  0.15,1.0,0.32);
  addBox(g,0.08,1.0,0.08,mat(0x8B6914), 0.5,0.4,0,0,0,0.3);
  g.userData={type:'archer',alive:true};return g;
}
function makeOgreMesh(){
  const g=new THREE.Group();
  addBox(g,1.6,1.4,1.2,mat(0x2d6b18));
  addBox(g,1.2,1.0,1.0,mat(0x1a4a0a), 0,0,0);
  addBox(g,1.3,1.2,1.1,mat(0x3d8b22), 0,1.3,0);
  addBox(g,0.3,0.3,0.3,mat(0xffCC00), -0.3,1.3,0.55);
  addBox(g,0.3,0.3,0.3,mat(0xffCC00),  0.3,1.3,0.55);
  addBox(g,0.2,0.4,0.2,mat(0x1a0a05), -0.4,2.0,0);
  addBox(g,0.2,0.4,0.2,mat(0x1a0a05),  0.4,2.0,0);
  addBox(g,0.8,1.2,0.6,mat(0x2d6b18), -1.3,0.3,0);
  addBox(g,0.8,1.2,0.6,mat(0x2d6b18),  1.3,0.3,0);
  addBox(g,0.7,0.9,0.7,mat(0x1a4a0a), -0.5,-1.1,0);
  addBox(g,0.7,0.9,0.7,mat(0x1a4a0a),  0.5,-1.1,0);
  g.userData={type:'ogre',alive:true};return g;
}
function makeMageMesh(){
  const g=new THREE.Group();
  addBox(g,0.8,1.5,0.7,mat(0x330066));
  addBox(g,0.6,0.7,0.6,mat(0xcc8844), 0,1.1,0);
  addBox(g,0.9,0.5,0.9,mat(0x220044), 0,1.65,0);
  addBox(g,0.4,1.2,0.4,mat(0x220044), 0,2.3,0);
  addBox(g,0.08,1.6,0.08,mat(0x8B6914), 0.5,0.9,0);
  const orbGeo=new THREE.SphereGeometry(0.22,8,8);
  const orb=new THREE.Mesh(orbGeo,new THREE.MeshBasicMaterial({color:0xff44ff}));
  orb.position.set(0.5,1.7,0);g.add(orb);
  g.userData={type:'mage',alive:true,orb};return g;
}

// Tree and building helpers
function makeTreeMesh(){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.5,5,6),mat(0x1a3d08));
  trunk.position.y=2.5;g.add(trunk);
  const top=new THREE.Mesh(new THREE.SphereGeometry(2.5,7,5),mat(0x2d6b10,{flatShading:true}));
  top.position.y=6;g.add(top);
  const top2=new THREE.Mesh(new THREE.SphereGeometry(1.8,6,4),mat(0x3d8b18,{flatShading:true}));
  top2.position.set(-0.8,7.5,0.5);g.add(top2);
  return g;
}

function makeVillageMesh(){
  const g=new THREE.Group();
  addBox(g,8,5,8,mat(0x5a3a1a));
  addBox(g,6,4,6,mat(0x7a5a2a), 0,0.5,0);
  // Roof
  const rGeo=new THREE.ConeGeometry(6,4,4);
  const roof=new THREE.Mesh(rGeo,mat(0x8B1a1a,{flatShading:true}));
  roof.position.y=4.5;roof.rotation.y=Math.PI/4;g.add(roof);
  // Windows
  addBox(g,1.2,1,0.2,mat(0xFFD070), -1.5,1,4.1);
  addBox(g,1.2,1,0.2,mat(0xFFD070),  1.5,1,4.1);
  g.userData={type:'village',alive:true,hp:30,maxHp:30,radius:8};return g;
}

function makeCastleMesh(){
  const g=new THREE.Group();
  addBox(g,12,9,10,mat(0x2a2040));
  addBox(g,8,8,8,mat(0x3a2f5a), 0,0.5,0);
  // Towers
  for(const[tx,tz] of [[-7,-6],[7,-6],[-7,6],[7,6]]){
    addBox(g,3,13,3,mat(0x2a2040), tx,2,tz);
    addBox(g,3.5,1,3.5,mat(0x1a1030), tx,8.5,tz);
  }
  // Gate
  addBox(g,2.5,4,0.5,mat(0x0a0010), 0,-0.5,5.1);
  addBox(g,2.5,2,0.5,mat(0x44228a), 0,2,5.1);
  // Flag
  addBox(g,0.2,8,0.2,mat(0x8B6914), 0,13,0);
  addBox(g,2,1.5,0.1,mat(0xdd2222), 1.1,17,0);
  g.userData={type:'castle',alive:true,hp:80,maxHp:80,radius:14};return g;
}

// ── Fire particle system ───────────────────────────────────────────────────────
const FIRE_MAX=400;
const fPos=new Float32Array(FIRE_MAX*3);
const fCol=new Float32Array(FIRE_MAX*3);
const fGeo=new THREE.BufferGeometry();
fGeo.setAttribute('position',new THREE.BufferAttribute(fPos,3));
fGeo.setAttribute('color',new THREE.BufferAttribute(fCol,3));
fGeo.setDrawRange(0,0);
const fMat=new THREE.PointsMaterial({size:3.5,vertexColors:true,sizeAttenuation:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false});
const firePoints=new THREE.Points(fGeo,fMat);scene.add(firePoints);
let fireArr=[];

function spawnFire(){
  if(fireArr.length>=FIRE_MAX)return;
  const dt=dtype;
  // Head world position
  const head=new THREE.Vector3(0,1.5,5.0);
  head.applyQuaternion(dragonMesh.quaternion);
  head.add(dragonMesh.position);
  // Direction: dragon forward + slight spread
  const fwd=new THREE.Vector3((Math.random()-.5)*.25,(Math.random()-.5)*.2,1);
  fwd.applyQuaternion(dragonMesh.quaternion).normalize();
  fireArr.push({p:head,v:fwd.multiplyScalar(28+Math.random()*12),life:1,decay:.028+Math.random()*.02});
}

function updateFireParticles(dt){
  for(let i=fireArr.length-1;i>=0;i--){
    const f=fireArr[i];
    f.p.addScaledVector(f.v,dt);
    f.v.y+=3*dt;f.v.x+=(Math.random()-.5)*3*dt;
    f.life-=f.decay;
    // Hit check
    for(const e of activeEnemies){
      if(!e.userData.alive)continue;
      if(f.p.distanceTo(e.position)<4.5){hitEnemy(e);f.life=0;break;}
    }
    for(const b of activeBuildings){
      if(!b.userData.alive)continue;
      if(f.p.distanceTo(b.position)<b.userData.radius){hitBuilding(b);f.life=0;break;}
    }
    if(f.life<=0){fireArr.splice(i,1);}
  }
  const count=Math.min(fireArr.length,FIRE_MAX);
  for(let i=0;i<count;i++){
    const f=fireArr[i];
    fPos[i*3]=f.p.x;fPos[i*3+1]=f.p.y;fPos[i*3+2]=f.p.z;
    const t=f.life,b=dtype.breath;
    const c0=t>.6?b[0]:t>.3?b[1]:b[2];
    const alpha=t*.8;
    fCol[i*3]=((c0>>16)&255)/255*alpha;
    fCol[i*3+1]=((c0>>8)&255)/255*alpha;
    fCol[i*3+2]=(c0&255)/255*alpha;
  }
  for(let i=count;i<FIRE_MAX;i++)fPos[i*3+1]=-9999;
  fGeo.attributes.position.needsUpdate=true;
  fGeo.attributes.color.needsUpdate=true;
  fGeo.setDrawRange(0,count);
}

// ── Projectile system ─────────────────────────────────────────────────────────
let projectiles=[];
const projGeo=new THREE.SphereGeometry(0.3,4,4);

function spawnProjectile(type,pos,target){
  const col=type==='magic'?0xff44ff:type==='rock'?0x886644:0xcc8844;
  const mesh=new THREE.Mesh(projGeo,new THREE.MeshBasicMaterial({color:col}));
  mesh.position.copy(pos);
  const dir=new THREE.Vector3().subVectors(target,pos).normalize();
  const spd=type==='magic'?22:type==='rock'?16:18;
  mesh.userData={vel:dir.multiplyScalar(spd),dmg:type==='rock'?20:type==='magic'?15:12,life:4};
  scene.add(mesh);projectiles.push(mesh);
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.position.addScaledVector(p.userData.vel,dt);
    p.userData.vel.y-=5*dt; // gravity
    p.userData.life-=dt;
    if(p.userData.life<=0){scene.remove(p);projectiles.splice(i,1);continue;}
    // Hit dragon
    if(!ddead&&dinvT<=0){
      if(p.position.distanceTo(dragonMesh.position)<4){
        dhp-=p.userData.dmg;dinvT=1.5;
        scene.remove(p);projectiles.splice(i,1);
        if(dhp<=0&&!ddead){ddead=true;dhp=0;}
        continue;
      }
    }
  }
}

// ── World (zone-based infinite) ───────────────────────────────────────────────
const ZONE=200,RD=4;
const zoneMap=new Map();
let activeEnemies=[],activeBuildings=[];

function zoneKey(cx,cz){return`${cx},${cz}`;}

function spawnZone(cx,cz){
  const key=zoneKey(cx,cz);
  if(zoneMap.has(key))return;
  const objects=[];
  const wx0=cx*ZONE,wz0=cz*ZONE;
  const dist2=cx*cx+cz*cz;

  if(dist2>3){
    // Trees
    const nt=3+~~(Math.random()*4);
    for(let i=0;i<nt;i++){
      const t=makeTreeMesh();
      const tx=wx0+Math.random()*ZONE,tz=wz0+Math.random()*ZONE;
      t.position.set(tx,groundY(tx,tz),tz);
      scene.add(t);objects.push(t);
    }

    // Building
    if(Math.random()<0.07){
      const isC=Math.random()<.3;
      const b=isC?makeCastleMesh():makeVillageMesh();
      const bx=wx0+ZONE/2+(Math.random()-.5)*80;
      const bz=wz0+ZONE/2+(Math.random()-.5)*80;
      const gy=groundY(bx,bz);
      b.position.set(bx,gy,bz);
      scene.add(b);objects.push(b);activeBuildings.push(b);

      // Enemies near building
      const ne=isC?2:1;
      for(let i=0;i<ne;i++){
        const eType=enemyBudget()<2?'archer':Math.random()<.4?'mage':Math.random()<.5?'ogre':'archer';
        const e=makeEnemy3d(eType);
        const eH=isC?12:6;
        e.position.set(bx+(Math.random()-.5)*20,gy+eH,bz+(Math.random()-.5)*20);
        scene.add(e);objects.push(e);activeEnemies.push(e);
      }
    }

    // Ground roaming enemy (very sparse)
    const ec=0.004*enemyBudget();
    if(Math.random()<ec){
      const eType=Math.random()<.5?'ogre':'archer';
      const e=makeEnemy3d(eType);
      const ex=wx0+Math.random()*ZONE,ez=wz0+Math.random()*ZONE;
      e.position.set(ex,groundY(ex,ez)+1.5,ez);
      scene.add(e);objects.push(e);activeEnemies.push(e);
    }
  }

  zoneMap.set(key,objects);
}

function groundY(x,z){
  return Math.sin(x/80)*4+Math.sin(z/120)*6+Math.sin(x/35)*2+Math.sin(z/45)*3;
}

function makeEnemy3d(type){
  const m=type==='ogre'?makeOgreMesh():type==='mage'?makeMageMesh():makeArcherMesh();
  const cfg={archer:{hp:20,maxHp:20,si:3+Math.random()*2,spd:18,dmg:12,pts:60},
              ogre:  {hp:60,maxHp:60,si:5+Math.random()*2,spd:14,dmg:20,pts:120},
              mage:  {hp:30,maxHp:30,si:2+Math.random()*2,spd:22,dmg:15,pts:100}};
  Object.assign(m.userData,cfg[type]);
  m.userData.shootT=Math.random()*m.userData.si;
  return m;
}

function despawnFarZones(){
  const pcx=~~(dragonMesh.position.x/ZONE),pcz=~~(dragonMesh.position.z/ZONE);
  for(const[key,objs] of zoneMap){
    const[cx,cz]=key.split(',').map(Number);
    if(Math.abs(cx-pcx)>RD+2||Math.abs(cz-pcz)>RD+2){
      objs.forEach(o=>{
        scene.remove(o);
        activeEnemies=activeEnemies.filter(e=>e!==o);
        activeBuildings=activeBuildings.filter(b=>b!==o);
        // Clean up associated projectiles
      });
      zoneMap.delete(key);
    }
  }
}

function updateZones(){
  const pcx=~~(dragonMesh.position.x/ZONE),pcz=~~(dragonMesh.position.z/ZONE);
  for(let dz=-RD;dz<=RD+2;dz++)for(let dx=-RD;dx<=RD;dx++)spawnZone(pcx+dx,pcz+dz);
  if(gs==='playing'&&frame%180===0)despawnFarZones();
}

// ── Hit logic ─────────────────────────────────────────────────────────────────
function hitEnemy(e){
  if(!e.userData.alive)return;
  e.userData.hp-=dtype.dmg;
  if(dtype.id==='ice')e.userData.shootT+=3;
  if(e.userData.hp<=0){
    e.userData.alive=false;score+=e.userData.pts;kills++;
    floatWorld(e.position,'+'+ e.userData.pts,'#ff8888');
    scene.remove(e);activeEnemies=activeEnemies.filter(x=>x!==e);
  }
}
function hitBuilding(b){
  if(!b.userData.alive)return;
  b.userData.hp-=dtype.dmg*.5;
  if(b.userData.hp<=0){
    b.userData.alive=false;const pts=b.userData.type==='castle'?500:150;score+=pts;kills++;
    floatWorld(b.position,'+'+pts,'#FFD700');
    scene.remove(b);activeBuildings=activeBuildings.filter(x=>x!==b);
  }
}

// ── Floating text (screen-space) ──────────────────────────────────────────────
let floaters2d=[];
const tmpV=new THREE.Vector3();
function floatWorld(worldPos,text,col){
  tmpV.copy(worldPos).project(camera);
  const sx=(tmpV.x+1)/2*cW,sy=(1-tmpV.y)/2*cH;
  if(tmpV.z<1)floaters2d.push({sx,sy,text,col,life:60});
}

// ── Game state ────────────────────────────────────────────────────────────────
let gs='select',score=0,best=0,kills=0,frame=0;
let dhp=0,dmaxHp=0,dfuel=0,dmaxFuel=0,dinvT=0,ddead=false,ddeathT=0;
let dtype=DT[0],selectedType=0;
let dragonMesh=null;
let dYaw=0,dPitch=0,dRoll=0,dYawVel=0,dPitchVel=0;
const camPos=new THREE.Vector3(0,30,-20);
const camTarget=new THREE.Vector3(0,20,10);

try{best=parseInt(localStorage.getItem('dragonbattle_best')||'0');}catch(e){}
function enemyBudget(){return Math.max(1,~~(score/400));}

// ── Input ─────────────────────────────────────────────────────────────────────
const keys={};
const mk={up:false,dn:false,lf:false,rt:false,fire:false};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;if(e.code==='Space')e.preventDefault();
  if(gs==='select'){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){selectedType=(selectedType-1+DT.length)%DT.length;buildSelectUI();}
    if(e.code==='ArrowRight'||e.code==='KeyD'){selectedType=(selectedType+1)%DT.length;buildSelectUI();}
    if(e.code==='Enter'||e.code==='Space')startGame();
  }
  if(gs==='dead'&&(e.code==='Enter'||e.code==='Space'))showSelect();
});
document.addEventListener('keyup',e=>{delete keys[e.code];});

function isMob(){return'ontouchstart'in window||navigator.maxTouchPoints>0;}
let swipeX=null;
canvas.addEventListener('touchstart',e=>{swipeX=e.touches[0].clientX;if(gs==='dead')showSelect();},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(gs!=='select')return;
  const dx=e.changedTouches[0].clientX-swipeX;
  if(Math.abs(dx)>30){selectedType=(selectedType+(dx<0?1:-1)+DT.length)%DT.length;buildSelectUI();}
  else startGame();
},{passive:true});

function initMobile(){
  document.getElementById('mctrl').classList.add('show');
  const btn=(id,k)=>{const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();mk[k]=true;},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();mk[k]=false;},{passive:false});};
  btn('mc-up','up');btn('mc-down','dn');btn('mc-left','lf');btn('mc-right','rt');
  const f=document.getElementById('mc-fire');
  f.addEventListener('touchstart',e=>{e.preventDefault();mk.fire=true;if(gs==='select')startGame();},{passive:false});
  f.addEventListener('touchend',e=>{e.preventDefault();mk.fire=false;},{passive:false});
}

// ── UI helpers ─────────────────────────────────────────────────────────────────
function buildSelectUI(){
  const container=document.getElementById('cards');
  container.innerHTML='';
  DT.forEach((dt,i)=>{
    const card=document.createElement('div');
    card.className='card'+(i===selectedType?' sel':'');
    card.style.setProperty('--ec',dt.eyeC);
    card.style.setProperty('--bd','#'+dt.bodyD.toString(16).padStart(6,'0')+'dd');
    const spdPct=~~(dt.speed/30*100),hpPct=~~(dt.hp/220*100);
    card.innerHTML=`<div class="card-emoji">${dt.emoji}</div><div class="card-name">${dt.name}</div><div class="card-desc">${dt.desc}</div>`+
      (i===selectedType?`<div class="bars"><div class="bar-row" style="--ec:${dt.eyeC}">SPD<div class="bar-fill" style="width:${spdPct}%"></div></div><div class="bar-row" style="--ec:#ff4444">HP<div class="bar-fill" style="background:#ff4444;width:${hpPct}%"></div></div></div>`:'');
    card.onclick=()=>{selectedType=i;buildSelectUI();};
    container.appendChild(card);
  });
  const sb=document.getElementById('sel-best');
  sb.textContent=best>0?'BEST: '+best:'';
}

function showSelect(){
  gs='select';
  document.getElementById('sel').style.display='flex';
  document.getElementById('hud').style.display='none';
  document.getElementById('dead').style.display='none';
  buildSelectUI();
}

function startGame(){
  dtype=DT[selectedType];
  gs='playing';score=0;kills=0;frame=0;
  ddead=false;ddeathT=0;dinvT=0;fireArr=[];projectiles.forEach(p=>scene.remove(p));projectiles=[];
  activeEnemies=[];activeBuildings=[];
  // Clear world
  for(const[,objs] of zoneMap)objs.forEach(o=>scene.remove(o));
  zoneMap.clear();
  // Reset dragon position
  dYaw=0;dPitch=0;dRoll=0;dYawVel=0;dPitchVel=0;
  dhp=dtype.hp;dmaxHp=dtype.hp;dfuel=dtype.fuel;dmaxFuel=dtype.fuel;
  // Build new dragon mesh
  if(dragonMesh)scene.remove(dragonMesh);
  dragonMesh=buildDragonMesh(dtype);
  dragonMesh.position.set(0,30,0);scene.add(dragonMesh);
  // Camera
  camPos.set(0,38,-20);camTarget.set(0,28,10);
  // Ground follows
  ground.position.set(0,0,0);
  document.getElementById('sel').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('dead').style.display='none';
}

function endGame(){
  ddead=true;
  if(score>best){best=score;try{localStorage.setItem('dragonbattle_best',best);}catch(e){}}
  document.getElementById('dead-score').textContent='SCORE: '+score+' · KILLS: '+kills;
  document.getElementById('dead-new').textContent=score>=best&&score>0?'🏆 NEW BEST!':'BEST: '+best;
  document.getElementById('dead').style.display='flex';
}

// ── Update ─────────────────────────────────────────────────────────────────────
let last=0;
function update(ts){
  const dt=Math.min((ts-last)/1000,.05);last=ts;
  if(gs!=='playing')return;
  frame++;

  if(!ddead){
    const lf=keys['ArrowLeft']||keys['KeyA']||mk.lf;
    const rt=keys['ArrowRight']||keys['KeyD']||mk.rt;
    const up=keys['ArrowUp']||keys['KeyW']||mk.up;
    const dn=keys['ArrowDown']||keys['KeyS']||mk.dn;
    const doFire=keys['Space']||keys['KeyZ']||mk.fire;

    // Steering
    const turnSpd=1.6,pitchSpd=1.0,turnDrag=0.82,pitchDrag=0.78;
    if(lf)dYawVel+=turnSpd*dt;if(rt)dYawVel-=turnSpd*dt;
    if(up)dPitchVel-=pitchSpd*dt;if(dn)dPitchVel+=pitchSpd*dt;
    dYawVel*=turnDrag;dPitchVel*=pitchDrag;
    dYaw+=dYawVel;
    dPitch=Math.max(-.55,Math.min(.4,dPitch+dPitchVel));
    // Banking roll
    dRoll+=(dYawVel*-2.5-dRoll)*.15;

    // Apply rotation to dragon
    dragonMesh.rotation.set(dPitch,dYaw,dRoll,'YXZ');

    // Move forward in facing direction
    const fwd=new THREE.Vector3(0,0,1);
    fwd.applyEuler(dragonMesh.rotation);
    dragonMesh.position.addScaledVector(fwd,dtype.speed*dt);

    // Keep above ground
    const gy=groundY(dragonMesh.position.x,dragonMesh.position.z);
    if(dragonMesh.position.y<gy+4){dragonMesh.position.y=gy+4;dPitchVel=Math.min(0,dPitchVel);}

    // Ground plane follows
    ground.position.x=~~(dragonMesh.position.x/200)*200;
    ground.position.z=~~(dragonMesh.position.z/200)*200;

    // Fire
    if(doFire&&dfuel>0){dfuel=Math.max(0,dfuel-70*dt);if(frame%2===0)spawnFire();}
    else dfuel=Math.min(dmaxFuel,dfuel+dtype.rfuel*60*dt);

    // Regen
    if(frame%240===0)dhp=Math.min(dmaxHp,dhp+(dtype.id==='nature'?8:3));
    if(dinvT>0)dinvT-=dt;

    // Wing animation
    dragonMesh.userData.wingAngle+=dt*5;
    const wa=Math.sin(dragonMesh.userData.wingAngle)*.55;
    dragonMesh.userData.lwp.rotation.z=wa;
    dragonMesh.userData.rwp.rotation.z=-wa;
    dragonMesh.userData.tailF+=dt*4;

    // Camera: smooth third-person follow
    const camOff=new THREE.Vector3(0,8,-18);
    camOff.applyEuler(new THREE.Euler(0,dYaw,0));
    const idealCam=dragonMesh.position.clone().add(camOff);
    camPos.lerp(idealCam,6*dt);
    const idealTgt=dragonMesh.position.clone().addScaledVector(fwd,15).add(new THREE.Vector3(0,2,0));
    camTarget.lerp(idealTgt,10*dt);
    camera.position.copy(camPos);
    camera.lookAt(camTarget);

    // Enemy AI
    for(const e of activeEnemies){
      if(!e.userData.alive)continue;
      e.userData.animT=(e.userData.animT||0)+dt;
      // Face dragon
      e.lookAt(dragonMesh.position.x,e.position.y,dragonMesh.position.z);
      // Ogres walk toward dragon
      if(e.userData.type==='ogre'){
        const toD=new THREE.Vector3().subVectors(dragonMesh.position,e.position);
        toD.y=0;const dist=toD.length();
        if(dist>8&&dist<400){toD.normalize().multiplyScalar(4*dt);e.position.add(toD);}
        e.position.y=groundY(e.position.x,e.position.z)+1.5;
      }
      // Mages bob
      if(e.userData.type==='mage'){
        e.userData.orb.rotation.y+=dt*3;
        e.position.y+= Math.sin(e.userData.animT*2)*.02;
      }
      // Shoot
      e.userData.shootT-=dt;
      const distToDragon=e.position.distanceTo(dragonMesh.position);
      if(e.userData.shootT<=0&&distToDragon<400){
        e.userData.shootT=e.userData.si;
        spawnProjectile(e.userData.type==='mage'?'magic':e.userData.type==='ogre'?'rock':'arrow',
          e.position.clone(),dragonMesh.position.clone());
      }
    }

    updateZones();
    updateFireParticles(dt);
    updateProjectiles(dt);
    updateHUD();

    if(dhp<=0&&!ddead){endGame();}
  } else {
    ddeathT+=dt;
    dragonMesh.position.y-=5*dt;
    dragonMesh.rotation.z+=dt;
    camera.lookAt(dragonMesh.position);
    if(ddeathT>3){}
  }

  // Floaters age
  for(const f of floaters2d)f.life--;
  floaters2d=floaters2d.filter(f=>f.life>0);
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD(){
  document.getElementById('type-badge').textContent=dtype.emoji+' '+dtype.name;
  document.getElementById('type-badge').style.color=dtype.eyeC;
  document.getElementById('hp-fill').style.width=~~(100*Math.max(0,dhp)/dmaxHp)+'%';
  document.getElementById('fuel-fill').style.background='#'+dtype.breath[0].toString(16).padStart(6,'0');
  document.getElementById('fuel-fill').style.width=~~(100*dfuel/dmaxFuel)+'%';
  document.getElementById('sc').textContent='SCORE '+score;
  document.getElementById('bs').textContent='BEST '+best;
  document.getElementById('kl').textContent='KILLS '+kills;
  const dist=~~(Math.hypot(dragonMesh.position.x,dragonMesh.position.z)/10);
  document.getElementById('dst').textContent=dist+' km';
}

// ── 2D overlay canvas for floaters ────────────────────────────────────────────
const ov=document.createElement('canvas');
ov.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:3';
wrap.appendChild(ov);
const oc=ov.getContext('2d');

function drawOverlay(){
  ov.width=cW;ov.height=cH;
  oc.clearRect(0,0,cW,cH);
  oc.textAlign='center';oc.textBaseline='middle';
  for(const f of floaters2d){
    oc.globalAlpha=Math.min(1,f.life/20);
    oc.font=`bold 13px "Press Start 2P",monospace`;
    oc.fillStyle=f.col;oc.fillText(f.text,f.sx,f.sy);
  }
  oc.globalAlpha=1;
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop(ts){
  requestAnimationFrame(loop);
  update(ts);
  renderer.render(scene,camera);
  drawOverlay();
}

// ── Init ──────────────────────────────────────────────────────────────────────
showSelect();
if(isMob())initMobile();
requestAnimationFrame(loop);
</script>
