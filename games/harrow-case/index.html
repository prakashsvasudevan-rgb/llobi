<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Harrow Case</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Georgia',serif;color:#c8a87a}
canvas{display:block}
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;z-index:200;padding:30px
}
#overlay h1{font-size:2.4rem;color:#e8c060;text-shadow:0 0 30px rgba(255,160,0,0.4);margin-bottom:.5rem;letter-spacing:.08em}
#overlay .sub{color:#997755;font-size:.95rem;font-style:italic;margin-bottom:1.6rem;line-height:1.7}
#overlay .controls{color:#776655;font-size:.82rem;margin-bottom:1.8rem;line-height:2}
#overlay .controls span{color:#aa9977;font-weight:bold}
#start-btn{
  background:none;border:1px solid #664422;color:#cc9955;font-family:'Georgia',serif;font-size:1rem;
  padding:12px 36px;cursor:pointer;letter-spacing:.1em;transition:.2s
}
#start-btn:hover{background:rgba(100,60,20,0.3);border-color:#aa7733;color:#eecc88}
#crosshair{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  color:rgba(255,255,255,0.45);font-size:.95rem;pointer-events:none;
  letter-spacing:.05em;text-align:center;white-space:nowrap;
  text-shadow:0 0 8px rgba(0,0,0,0.9)
}
#journal{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:rgba(8,6,4,0.93);border:1px solid #553322;
  color:#c8a07a;padding:18px 24px;max-width:520px;width:92%;
  font-size:.88rem;border-radius:2px;display:none;line-height:1.65;
  box-shadow:0 0 40px rgba(0,0,0,0.8)
}
#hud{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:16px 20px;pointer-events:none;display:none
}
#clue-count{color:rgba(180,140,90,0.7);font-size:.8rem;letter-spacing:.06em}
#location-name{color:rgba(160,120,80,0.6);font-size:.75rem;font-style:italic}
#resume-hint{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  color:rgba(200,160,100,0.7);font-size:.9rem;pointer-events:none;display:none
}
#vignette{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.6) 100%);
  z-index:5
}
#darkness{
  position:fixed;inset:0;pointer-events:none;background:#000;opacity:0;z-index:4;
  transition:opacity 4s ease
}
#lightning{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:10;transition:opacity 0.05s}
#blood-vignette{
  position:fixed;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(60,0,0,0) 100%);
  transition:background 3s ease
}
#whisper{
  position:fixed;top:30%;left:50%;transform:translateX(-50%);
  color:rgba(180,80,80,0);font-size:1.1rem;font-style:italic;pointer-events:none;z-index:15;
  text-align:center;width:60%;text-shadow:0 0 20px rgba(200,0,0,0.5);
  transition:color 1.5s ease,opacity 1.5s ease;white-space:nowrap
}
#heartbeat{
  position:fixed;inset:0;pointer-events:none;background:#1a0000;opacity:0;z-index:3;
  animation:none
}
@keyframes hb{0%,100%{opacity:0}10%{opacity:0.08}20%{opacity:0}35%{opacity:0.12}45%{opacity:0}}
</style>
</head>
<body>
<div id="overlay">
  <h1>THE HARROW CASE</h1>
  <div class="sub">
    Millhaven, October 1952.<br>
    A woman named Ella has been missing for three weeks.<br>
    The town says nothing. The truth does.
  </div>
  <div class="controls">
    <span>W A S D</span> — Move &nbsp;&nbsp; <span>Mouse</span> — Look<br>
    <span>E</span> — Investigate &nbsp;&nbsp; <span>ESC</span> — Release cursor
  </div>
  <button id="start-btn" onclick="startGame()">BEGIN INVESTIGATION</button>
</div>
<div id="darkness"></div>
<div id="lightning"></div>
<div id="blood-vignette"></div>
<div id="heartbeat"></div>
<div id="vignette"></div>
<div id="whisper"></div>
<div id="resume-hint">[Click to resume]</div>
<div id="hud">
  <div id="clue-count">CLUES: 0 / 5</div>
  <div id="location-name"></div>
</div>
<div id="crosshair">+</div>
<div id="journal"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════
//  SCENE SETUP
// ═══════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.05, 250);
camera.position.set(0, 1.75, 5);
camera.rotation.order = 'YXZ';

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ═══════════════════════════════════════════════════════
//  ATMOSPHERE STAGES (0=golden dusk → 5=abyss)
// ═══════════════════════════════════════════════════════
const ATM = [
  { sky:0xd4713a, fog:0xc87040, fogD:0.011, amb:0xffaa55, aI:0.9, sun:0.9, rain:0, lamps:1.0 },
  { sky:0x8a4428, fog:0x9a6035, fogD:0.018, amb:0xdd7733, aI:0.65, sun:0.5, rain:0.0, lamps:0.9 },
  { sky:0x2e2040, fog:0x3a2a4a, fogD:0.028, amb:0x776699, aI:0.4,  sun:0.1, rain:0.3, lamps:0.6 },
  { sky:0x100c1e, fog:0x14101e, fogD:0.044, amb:0x445566, aI:0.22, sun:0.0, rain:0.65, lamps:0.2 },
  { sky:0x06040d, fog:0x080610, fogD:0.065, amb:0x222233, aI:0.1,  sun:0.0, rain:0.9, lamps:0.0 },
  { sky:0x010102, fog:0x030205, fogD:0.09,  amb:0x110508, aI:0.04, sun:0.0, rain:1.0, lamps:0.0 },
];
let targetStage = 0;

// ═══════════════════════════════════════════════════════
//  LIGHTING
// ═══════════════════════════════════════════════════════
const ambLight = new THREE.AmbientLight(new THREE.Color(ATM[0].amb), ATM[0].aI);
scene.add(ambLight);

const sunLight = new THREE.DirectionalLight(0xffbb66, ATM[0].sun);
sunLight.position.set(60, 90, 40);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048; sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 10; sunLight.shadow.camera.far = 200;
sunLight.shadow.camera.left = -60; sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60; sunLight.shadow.camera.bottom = -60;
scene.add(sunLight);

// Flashlight attached to camera
const flashlight = new THREE.SpotLight(0xffeedd, 0, 18, Math.PI/9, 0.35, 1.5);
camera.add(flashlight);
flashlight.position.set(0.2, -0.1, 0);
flashlight.target.position.set(0, -0.2, -1);
camera.add(flashlight.target);
scene.add(camera);

// Fog & sky
scene.fog = new THREE.FogExp2(new THREE.Color(ATM[0].fog), ATM[0].fogD);
scene.background = new THREE.Color(ATM[0].sky);

// ═══════════════════════════════════════════════════════
//  WORLD HELPERS
// ═══════════════════════════════════════════════════════
function mbox(w,h,d,col,x,y,z,ry=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));
  m.position.set(x,y,z); m.rotation.y=ry;
  m.castShadow=true; m.receiveShadow=true; scene.add(m); return m;
}
function mcyl(rt,rb,h,seg,col,x,y,z,ry=0){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),new THREE.MeshLambertMaterial({color:col}));
  m.position.set(x,y,z); m.rotation.y=ry;
  m.castShadow=true; m.receiveShadow=true; scene.add(m); return m;
}
function msphere(r,col,x,y,z){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),new THREE.MeshLambertMaterial({color:col}));
  m.position.set(x,y,z); m.castShadow=true; scene.add(m); return m;
}
function plane(col,x,z,w,d,ry=0){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide}));
  m.rotation.x=-Math.PI/2; m.rotation.z=ry; m.position.set(x,0.01,z); m.receiveShadow=true; scene.add(m); return m;
}

// ═══════════════════════════════════════════════════════
//  WORLD GEOMETRY
// ═══════════════════════════════════════════════════════
// Ground
const gm = new THREE.Mesh(new THREE.PlaneGeometry(220,220,30,30), new THREE.MeshLambertMaterial({color:0x2e3a1e}));
gm.rotation.x=-Math.PI/2; gm.receiveShadow=true; scene.add(gm);

// Dirt roads
plane(0x4a3824, 0, 0, 3.5, 100); // N-S
plane(0x4a3824, 0, 0, 100, 3.5, Math.PI/2); // E-W

// ── CENTRAL SQUARE (spawn area) ──
mcyl(1.4,1.4,1.5,14,0x6a6050, 0,0.75,-4);  // well rim
mcyl(1.1,1.1,1.8,14,0x1a1510, 0,0.9,-4);   // inner dark water
mcyl(0.08,0.08,2,8,0x554433,-1.3,2.7,-4);  // left post
mcyl(0.08,0.08,2,8,0x554433, 1.3,2.7,-4);  // right post
mbox(3.0,0.14,0.5,0x665544,0,3.75,-4);     // roof beam
mbox(0.4,0.3,0.4,0x443322,0,3.65,-4);      // bucket hook
// Notice board
mbox(2.5,1.8,0.1,0x6a5030,5,1.5,-4);
mbox(2.3,1.6,0.08,0x8a7050,5,1.5,-3.94);
mbox(0.15,1.5,0.15,0x443322,4.0,0.75,-4);
mbox(0.15,1.5,0.15,0x443322,6.0,0.75,-4);

// ── BARN (North, z≈-32) ──
mbox(14,8,11,0x8c3a18,0,4,-32);
mbox(14,3,11.6,0x6b2810,0,9,-32);
// Barn roof (hip)
const brf=new THREE.CylinderGeometry(0.1,9,4.5,4);
const brm=new THREE.Mesh(brf,new THREE.MeshLambertMaterial({color:0x551a0a}));
brm.position.set(0,12,-32); brm.rotation.y=Math.PI/4; brm.castShadow=true; scene.add(brm);
mbox(3.5,5,0.3,0x443314,0,2.5,-26.4);  // main door
mbox(1.2,1.2,0.2,0x0a0808,4,5,-26.4);  // window
mbox(1.2,1.2,0.2,0x0a0808,-4,5,-26.4);
// Hay bales scattered
for(const[bx,bz] of [[3,-30],[-4,-31],[5,-33],[-2,-28]]){
  mbox(1.4,1.1,1.1,0x9a8020,bx,0.55,bz,Math.random());
}

// ── CHURCH (East, x≈30) ──
mbox(10,9,12,0xd4cabc,30,4.5,0);
mbox(3.5,3.5,3.5,0xcfcabb,30,11.25,-0.5);
mcyl(0.12,1.5,6,4,0x888070,30,16,-0.5);
mbox(0.35,3,0.35,0x665544,30,18.5,-0.5);
mbox(1.8,0.35,0.35,0x665544,30,19,-0.5);
// Church windows (arched approximation)
mbox(1.4,2.8,0.2,0x0d1020,27,5.5,6.1);
mbox(1.4,2.8,0.2,0x0d1020,33,5.5,6.1);
mbox(1.4,2.8,0.2,0x0d1020,27,5.5,-6.1);
mbox(1.4,2.8,0.2,0x0d1020,33,5.5,-6.1);
// Church door
mbox(2.2,4,0.2,0x332211,30,2,-6.1);
// Graveyard fence
for(let gx=-3;gx<=3;gx+=1.5) mbox(0.1,1.2,0.1,0x665544,30+gx,0.6,8.5);
for(let gz=8.5;gz<=16;gz+=1.5) mbox(0.1,1.2,0.1,0x665544,24.5,0.6,gz);
for(let gz=8.5;gz<=16;gz+=1.5) mbox(0.1,1.2,0.1,0x665544,35.5,0.6,gz);
// Gravestones
for(const[gx,gz] of [[27,11],[29,12],[31,10],[33,13],[28,14],[32,15]]){
  mbox(0.6,1.2,0.15,0x888880,gx,0.6,gz,Math.random()*0.15-0.075);
}

// ── SHERIFF'S OFFICE (West, x≈-28) ──
mbox(11,6,9,0x8a7855,-28,3,0);
mbox(13,0.4,10,0x665a3a,-28,6.2,0);  // awning
// Sign
mbox(4.5,1.1,0.18,0x443322,-28,4.5,4.6);
mbox(4.1,0.8,0.1,0x6a5030,-28,4.5,4.65);
// Windows
mbox(1.8,1.8,0.15,0x0a1018,-25.5,3.2,4.6);
mbox(1.8,1.8,0.15,0x0a1018,-30.5,3.2,4.6);
// Door
mbox(2,4,0.2,0x2a1a0a,-28,2,-4.6);
// Water tower nearby
mcyl(3.5,3.5,5,12,0x6a5030,-42,7.5,10);
mcyl(3.6,3.6,0.4,12,0x554020,-42,10.2,10);
for(let i=0;i<6;i++){const a=i/6*Math.PI*2;mcyl(0.1,0.1,8,6,0x443020,-42+Math.cos(a)*3.3,4,10+Math.sin(a)*3.3);}

// ── OLD TREE (South, z≈32) ──
mcyl(0.55,0.75,8,10,0x3a2a16,0,4,32);
mcyl(0.3,0.4,4,8,0x3a2a16,2,7.5,31);
mcyl(0.25,0.3,3,8,0x3a2a16,-1.5,6.5,33);
// Canopy
[[0,10,0],[2,9.5,1.5],[-1.5,9,2],[1,11,-1],[-2,10,-1.5],[0.5,8.5,3],[-1,8,3.5]].forEach(([dx,dy,dz])=>{
  msphere(2.6+Math.random()*0.6,0x1e3a10,dx,dy,32+dz);
});
// Carving clue marker
mbox(0.3,0.3,0.1,0x885522,0.6,2.2,31.6);

// ── BACKGROUND TREES (atmosphere) ──
for(const[tx,tz,ts] of [
  [-15,-15,1],[-20,-18,0.9],[12,-12,1.1],[-10,15,0.85],[20,20,1.05],
  [-25,5,0.95],[22,-8,1],[-18,25,0.9],[8,22,1.1],[-30,-25,0.8],[28,15,0.9]
]){
  mcyl(0.3*ts,0.4*ts,6*ts,8,0x2e1e0c,tx,3*ts,tz);
  msphere(2*ts,0x162808,tx,7*ts,tz);
}

// ── STREET LAMPS ──
const LAMP_POS=[[-7,0],[7,0],[0,-10],[0,10],[-14,-14],[14,-14],[-14,14],[14,14],[-20,0],[20,0],[0,-22],[0,22]];
const lampLights=[];
LAMP_POS.forEach(([lx,lz])=>{
  mcyl(0.09,0.12,5.5,8,0x444455,lx,2.75,lz);
  mbox(0.5,0.3,0.5,0x334455,lx,5.75,lz);
  const pt=new THREE.PointLight(0xffcc55,ATM[0].lamps,14);
  pt.position.set(lx,5.5,lz); scene.add(pt); lampLights.push(pt);
});

// ═══════════════════════════════════════════════════════
//  CLUES
// ═══════════════════════════════════════════════════════
const CLUES=[
  {
    pos:new THREE.Vector3(1.6,0.6,-4),
    name:'Torn Note',icon:'📄',
    text:'"The water has been wrong for three weeks. Dark, with a smell like iron. We stopped asking why. We stopped asking about Ella, too.\n\n — Found tucked inside the well stone"',
    mood:"The golden light fails. Something colder settles over the town.",
    loc:'The Well'
  },
  {
    pos:new THREE.Vector3(2,1.4,-26.3),
    name:'Wall Scratching',icon:'✍',
    text:'"THEY TOOK ELLA. SAY NOTHING OR YOUR FAMILY NEXT. SHE KNEW TOO MUCH. WE ALL SAW IT HAPPEN.\n\n — Scratched into the barn planks, behind the hay"',
    mood:"The sky darkens. A lamp across the square flickers — and goes out forever.",
    loc:'The Old Barn'
  },
  {
    pos:new THREE.Vector3(24.2,1.2,-5.5),
    name:'Hidden Letter',icon:'✉',
    text:'"Father Davies — Stop speaking to outsiders. The mayor has been generous to this parish. The girl made her choice. If you value your congregation, let it rest.\n\n — Sheriff Cole\n\nP.S. There is no body. There never was."',
    mood:"Rain begins. Cold and steady. The fog thickens around you like a hand closing.",
    loc:'The Church'
  },
  {
    pos:new THREE.Vector3(-24,2.8,1),
    name:'Sealed File',icon:'🗂',
    text:'"CASE #441 — E. HARROW — STATUS: CLOSED\n\nClosed by direct order of Mayor R. Voss. No further investigation will be authorized or permitted. Any evidence gathered is to be destroyed.\n\nNote: Burn this file after reading.\n\n — Note: File was not burned."',
    mood:"The lamps die. All of them. The rain falls like a verdict. You cannot escape what you now know.",
    loc:"Sheriff's Office"
  },
  {
    pos:new THREE.Vector3(0.6,2.3,31.6),
    name:'Carved Message',icon:'🌿',
    text:'"E.H. — I know what this town did. I told them I would go to the papers. That was my mistake.\n\nIf someone finds this — it was Mayor Voss, the sheriff, the priest, and twelve men who called themselves the town council.\n\nRun. They are still here.\n\n — M. Aldren, November 1951"',
    mood:"The world goes nearly black. Only your flashlight remains. You understand everything now. And it is worse than you imagined.",
    loc:'The Old Tree'
  },
];

// Create clue markers
const clueObjs=[], clueMats=[], clueGlows=[];
CLUES.forEach((cl,i)=>{
  const mat=new THREE.MeshStandardMaterial({
    color:0xffcc44,emissive:new THREE.Color(0xffaa00),emissiveIntensity:1.6,
    roughness:0.2,metalness:0.0,transparent:true,opacity:0.9
  });
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(0.2,10,10),mat);
  mesh.position.copy(cl.pos); mesh.userData={ci:i,found:false};
  scene.add(mesh); clueObjs.push(mesh); clueMats.push(mat);

  const gl=new THREE.PointLight(0xffaa22,0.7,4);
  gl.position.copy(cl.pos); scene.add(gl); clueGlows.push(gl);
  cl.glowLight=gl;
});

// ═══════════════════════════════════════════════════════
//  RAIN
// ═══════════════════════════════════════════════════════
const RAIN_N=3000;
const rPos=new Float32Array(RAIN_N*3);
for(let i=0;i<RAIN_N;i++){rPos[i*3]=(Math.random()-.5)*70;rPos[i*3+1]=Math.random()*28;rPos[i*3+2]=(Math.random()-.5)*70;}
const rainGeo=new THREE.BufferGeometry();
rainGeo.setAttribute('position',new THREE.BufferAttribute(rPos,3));
const rainMat=new THREE.PointsMaterial({color:0x8899cc,size:0.07,transparent:true,opacity:0,sizeAttenuation:true});
const rain=new THREE.Points(rainGeo,rainMat);
scene.add(rain);

// ═══════════════════════════════════════════════════════
//  PLAYER
// ═══════════════════════════════════════════════════════
let yaw=Math.PI,pitch=0;
const keys={};
let started=false,cluesFound=0;
let nearClue=null, journalTimer=null;
let vignetteLevel=0;

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyE'&&nearClue&&!nearClue.userData.found&&started) collectClue(nearClue.userData.ci);
  if(e.code==='Space'&&nearClue&&!nearClue.userData.found&&started) collectClue(nearClue.userData.ci);
});
document.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('mousemove',e=>{
  if(!document.pointerLockElement)return;
  yaw-=e.movementX*0.0025; pitch-=e.movementY*0.0025;
  pitch=Math.max(-1.2,Math.min(1.2,pitch));
});

renderer.domElement.addEventListener('click',()=>{
  if(!started)return;
  if(!document.pointerLockElement){renderer.domElement.requestPointerLock();return;}
  if(nearClue&&!nearClue.userData.found) collectClue(nearClue.userData.ci);
});

document.addEventListener('pointerlockchange',()=>{
  const rh=document.getElementById('resume-hint');
  if(!document.pointerLockElement&&started&&cluesFound<5){rh.style.display='block';}
  else{rh.style.display='none';}
});

// ═══════════════════════════════════════════════════════
//  CLUE COLLECTION
// ═══════════════════════════════════════════════════════
const raycaster=new THREE.Raycaster();
raycaster.near=0.1; raycaster.far=5;

function collectClue(i){
  const cl=CLUES[i], mesh=clueObjs[i];
  if(mesh.userData.found)return;
  mesh.userData.found=true; cluesFound++;

  // Extinguish marker
  clueMats[i].emissiveIntensity=0; clueMats[i].color.set(0x332211);
  clueMats[i].opacity=0.3; cl.glowLight.intensity=0;

  // Journal
  showJournal(`<strong style="color:#e8c06a;font-size:.95rem">[${cl.icon} ${cl.name}]</strong><br><br><em style="color:#c09070">${cl.text.replace(/\n/g,'<br>')}</em><br><br><span style="color:#776655;font-size:.8rem">${cl.mood}</span>`, 9000);

  // HUD
  document.getElementById('clue-count').textContent=`CLUES: ${cluesFound} / 5`;

  // Darken world
  targetStage=cluesFound;
  applyStageEffects(targetStage);

  if(cluesFound===5) setTimeout(finalReveal,4000);
}

function applyStageEffects(s){
  const st=ATM[Math.min(s,ATM.length-1)];
  // Lamps: immediate reaction
  lampLights.forEach(l=>{ l.intensity=st.lamps*0.9+(Math.random()*st.lamps*0.1); });
  // Flashlight emerges from darkness
  flashlight.intensity = s>=3 ? (s-2)*0.6 : 0;
  // Vignette darkens
  vignetteLevel = s/5;
  // Horror
  updateBloodVignette(s);
  startHorrorTimers(s);
  // Ambient drones per stage
  const droneFreqs=[0,55,45,38,30,22];
  if(droneFreqs[s]) playDrone(droneFreqs[s],0.08+(s*0.015),12);
  // Immediate lightning on clues 2+
  if(s>=2) setTimeout(triggerLightning, 500+Math.random()*1000);
  // Immediate whisper on clues 3+
  if(s>=3) setTimeout(triggerWhisper, 1200);
}

function finalReveal(){
  document.exitPointerLock();
  CLUES[0].glowLight.color.set(0xff2200); CLUES[0].glowLight.intensity=3; CLUES[0].glowLight.distance=20;
  clueMats[0].emissive.set(0xcc1100); clueMats[0].emissiveIntensity=3;
  triggerLightning(); triggerWhisper();
  setTimeout(()=>{triggerLightning();playDrone(18,0.15,30);},1000);
  setTimeout(triggerLightning,2000);
  showJournal(`<strong style="color:#cc2222;font-size:1rem;letter-spacing:.06em">CASE FILE #441 — CLOSED</strong><br><br>
<em style="color:#cc8880;line-height:1.8">"Ella Harrow did not disappear. She was removed.<br><br>
Mayor Voss, Sheriff Cole, and Father Davies coordinated her silencing after she discovered evidence of a land fraud scheme that had displaced forty families.<br><br>
Twelve men knew. None spoke.<br><br>
You are now the thirteenth person who knows."</em><br><br>
<span style="color:#664444;font-size:.82rem">The well glows red. Millhaven watches you.<br>Whatever you do next — you cannot unknow this.</span>`, 0);
}

function showJournal(html, duration){
  const j=document.getElementById('journal');
  j.innerHTML=html; j.style.display='block';
  clearTimeout(journalTimer);
  if(duration>0) journalTimer=setTimeout(()=>j.style.display='none',duration);
}

// ═══════════════════════════════════════════════════════
//  COLLISION VOLUMES
// ═══════════════════════════════════════════════════════
const COLS=[
  {x:0,z:-4,r:2.2},{x:0,z:-32,r:8},{x:30,z:0,r:7},{x:-28,z:0,r:7},{x:0,z:32,r:5},
  {x:-42,z:10,r:5},{x:5,z:-4,r:1.5}
];
function collide(){
  camera.position.y=1.75;
  camera.position.x=Math.max(-48,Math.min(48,camera.position.x));
  camera.position.z=Math.max(-48,Math.min(48,camera.position.z));
  COLS.forEach(c=>{
    const dx=camera.position.x-c.x,dz=camera.position.z-c.z;
    const d=Math.sqrt(dx*dx+dz*dz);
    if(d<c.r&&d>0.01){camera.position.x=c.x+dx/d*c.r;camera.position.z=c.z+dz/d*c.r;}
  });
}

// ═══════════════════════════════════════════════════════
//  LOCATION DETECTOR
// ═══════════════════════════════════════════════════════
const ZONES=[
  {x:0,z:-4,r:12,name:'The Well — Town Square'},
  {x:0,z:-32,r:14,name:'The Old Barn'},
  {x:30,z:0,r:14,name:'St. Ambrose Church'},
  {x:-28,z:0,r:14,name:"Sheriff's Office"},
  {x:0,z:32,r:12,name:'The Old Oak Tree'},
];
function getZone(){
  const p=camera.position;
  for(const z of ZONES){
    const dx=p.x-z.x,dz=p.z-z.z;
    if(dx*dx+dz*dz<z.r*z.r)return z.name;
  }
  return 'Millhaven';
}

// ═══════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════
let frame=0, prev=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-prev)/1000,0.05); prev=ts; frame++;
  if(!started) return;

  // Camera
  camera.rotation.y=yaw; camera.rotation.x=pitch;

  // Movement
  const sp=5.5;
  const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  if(keys['KeyW']||keys['ArrowUp'])    camera.position.addScaledVector(fwd,sp*dt);
  if(keys['KeyS']||keys['ArrowDown'])  camera.position.addScaledVector(fwd,-sp*dt);
  if(keys['KeyA']||keys['ArrowLeft'])  camera.position.addScaledVector(right,-sp*dt);
  if(keys['KeyD']||keys['ArrowRight']) camera.position.addScaledVector(right,sp*dt);
  collide();

  // Clue bob + pulse
  clueObjs.forEach((m,i)=>{
    if(!m.userData.found){
      clueMats[i].emissiveIntensity=1.3+Math.sin(frame*0.07+i)*0.5;
      m.position.y=CLUES[i].pos.y+Math.sin(frame*0.05+i*1.5)*0.1;
    }
  });

  // Raycast for nearby clues
  raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
  const active=clueObjs.filter(m=>!m.userData.found);
  const hits=raycaster.intersectObjects(active);
  const ch=document.getElementById('crosshair');
  if(hits.length){
    nearClue=hits[0].object;
    ch.textContent='[E] '+CLUES[nearClue.userData.ci].name;
    ch.style.color='#ffcc44';
  }else{
    nearClue=null;
    ch.textContent='+';
    ch.style.color='rgba(255,255,255,0.4)';
  }

  // Location label
  document.getElementById('location-name').textContent=getZone();

  // Rain
  const rp=rainGeo.attributes.position.array;
  const spd=12+targetStage*4;
  for(let i=0;i<RAIN_N;i++){
    rp[i*3+1]-=spd*dt;
    rp[i*3]-=targetStage*0.5*dt; // wind
    if(rp[i*3+1]<0){rp[i*3+1]=28;rp[i*3]=(Math.random()-.5)*70;rp[i*3+2]=(Math.random()-.5)*70;}
  }
  rainGeo.attributes.position.needsUpdate=true;

  // Lamp flicker when transitioning
  if(targetStage>=3&&frame%7===0){
    const st=ATM[Math.min(targetStage,ATM.length-1)];
    lampLights.forEach(l=>{if(l.intensity>0){l.intensity=st.lamps*(0.7+Math.random()*0.3);}});
  }

  // Smooth atmosphere lerp
  const tgt=ATM[Math.min(targetStage,ATM.length-1)];
  const lr=Math.min(dt*0.8,0.04);
  ambLight.color.lerp(new THREE.Color(tgt.amb),lr);
  ambLight.intensity+=(tgt.aI-ambLight.intensity)*lr*2;
  sunLight.intensity+=(tgt.sun-sunLight.intensity)*lr*2;
  scene.fog.color.lerp(new THREE.Color(tgt.fog),lr);
  scene.fog.density+=(tgt.fogD-scene.fog.density)*lr*2;
  scene.background.lerp(new THREE.Color(tgt.sky),lr);
  rainMat.opacity+=(tgt.rain*0.7-rainMat.opacity)*lr*2;

  renderer.render(scene,camera);
}

// ═══════════════════════════════════════════════════════
//  HORROR SYSTEMS
// ═══════════════════════════════════════════════════════
let audioCtx=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}

function playDrone(freq,gain,duration){
  ensureAudio();
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  osc.type='sine'; osc.frequency.value=freq;
  g.gain.setValueAtTime(0,audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(gain,audioCtx.currentTime+1.5);
  g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+duration);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+duration);
}

function playThunder(){
  ensureAudio();
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,0.3)*0.6;
  const src=audioCtx.createBufferSource();
  const g=audioCtx.createGain(); g.gain.value=0.9;
  const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=400;
  src.buffer=buf; src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start();
}

function playHeartbeat(){
  ensureAudio();
  [0,0.3].forEach(t=>{
    const osc=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    osc.type='sine'; osc.frequency.setValueAtTime(60,audioCtx.currentTime+t);
    osc.frequency.linearRampToValueAtTime(30,audioCtx.currentTime+t+0.15);
    g.gain.setValueAtTime(0,audioCtx.currentTime+t);
    g.gain.linearRampToValueAtTime(0.7,audioCtx.currentTime+t+0.05);
    g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+t+0.2);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime+t); osc.stop(audioCtx.currentTime+t+0.3);
  });
}

function playWhisper(){
  ensureAudio();
  const dur=1.5;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*dur,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.15*Math.sin(i/d.length*Math.PI);
  const src=audioCtx.createBufferSource();
  const f=audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2200; f.Q.value=0.5;
  const g=audioCtx.createGain(); g.gain.value=0.6;
  src.buffer=buf; src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start();
}

const WHISPERS=[
  "she's still here","they're watching","don't look back","it was you",
  "run","she won't stop","they all knew","close your eyes","you're next",
  "she can hear you","the water remembers"
];

function triggerLightning(){
  const lt=document.getElementById('lightning');
  lt.style.opacity='0.9';
  setTimeout(()=>{lt.style.opacity='0';},80);
  setTimeout(()=>{lt.style.opacity='0.4';},160);
  setTimeout(()=>{lt.style.opacity='0';},280);
  playThunder();
  // Brief ambient flash in scene
  ambLight.intensity+=2;
  setTimeout(()=>{/* lerp handles recovery */},100);
}

function triggerWhisper(){
  const w=document.getElementById('whisper');
  const txt=WHISPERS[Math.floor(Math.random()*WHISPERS.length)];
  w.textContent='"'+txt+'"';
  w.style.color='rgba(200,60,60,0.85)';
  playWhisper();
  setTimeout(()=>{w.style.color='rgba(180,80,80,0)';},2000);
}

// Horror escalation timers
let horrorIntervals=[];
function startHorrorTimers(stage){
  horrorIntervals.forEach(clearInterval);
  horrorIntervals=[];
  if(stage>=2){
    // Occasional lightning
    horrorIntervals.push(setInterval(()=>{if(Math.random()<0.3)triggerLightning();},8000));
  }
  if(stage>=3){
    // Whispers
    horrorIntervals.push(setInterval(()=>{if(Math.random()<0.5)triggerWhisper();},6000));
    // Heartbeat
    horrorIntervals.push(setInterval(playHeartbeat,2200));
  }
  if(stage>=4){
    // More frequent
    horrorIntervals.push(setInterval(()=>{if(Math.random()<0.6)triggerLightning();},4000));
    horrorIntervals.push(setInterval(()=>{triggerWhisper();},3500));
    horrorIntervals.push(setInterval(playHeartbeat,1400));
  }
  if(stage>=5){
    horrorIntervals.push(setInterval(()=>{triggerLightning();},2500));
    horrorIntervals.push(setInterval(()=>{triggerWhisper();},2200));
    horrorIntervals.push(setInterval(playHeartbeat,900));
  }
}

// Blood vignette escalation
function updateBloodVignette(stage){
  const bv=document.getElementById('blood-vignette');
  const alpha=Math.min(stage/5*0.6,0.65);
  bv.style.background=`radial-gradient(ellipse at center,transparent ${Math.max(20,55-stage*8)}%,rgba(40,0,0,${alpha}) 100%)`;
  // Heartbeat div
  if(stage>=3){
    document.getElementById('heartbeat').style.animation=`hb ${Math.max(0.7,2-stage*0.25)}s ease infinite`;
  }
}

// ═══════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════
function startGame(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('hud').style.display='flex';
  started=true;
  renderer.domElement.requestPointerLock();

  // Soft ambient intro drone
  setTimeout(()=>playDrone(80,0.04,20), 500);

  showJournal(`<strong style="color:#e8c06a">[CASE FILE — MILLHAVEN, OCTOBER 1952]</strong><br><br>
<em style="color:#aa9070">"Subject: Ella Harrow, 24. Missing three weeks. No body found. Local law enforcement uncooperative.<br><br>
Five locations of interest have been identified. Investigate each one."</em><br><br>
<span style="color:#776655;font-size:.8rem">Move with WASD · Look with mouse · Press E or click glowing objects to investigate</span>`, 9000);

  requestAnimationFrame(loop);
}
