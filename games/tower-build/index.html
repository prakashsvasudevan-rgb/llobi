<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Craft &amp; Build | LLOBI.com</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated;font-family:'Outfit',sans-serif}
    body{background:#000;display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden}
    .topbar{width:100%;background:#fff;border-bottom:3px solid #000;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:100}
    .brand{font-size:1.2rem;font-weight:800;color:#6C4AB6;display:flex;align-items:center;gap:6px;text-decoration:none}
    .brand .dot{background:#FFC93C;border-radius:6px;padding:2px 6px;box-shadow:0 2px 0 #c8960a;font-size:.85rem}
    .back-btn{font-weight:700;background:#F3EFFA;border:2px solid #E6DEF4;border-radius:6px;padding:4px 10px;cursor:pointer;color:#2B2150;font-size:.8rem}
    #gameArea{position:relative;flex:1;width:100%;overflow:hidden}
    canvas{display:block;width:100%;height:100%}
    /* HUD */
    #hud{position:absolute;top:0;left:0;right:0;pointer-events:none;z-index:10}
    .hud-tl{position:absolute;top:8px;left:8px}
    .hearts{display:flex;gap:1px;flex-wrap:wrap;max-width:210px;margin-bottom:4px}
    .heart{font-size:15px;line-height:1}
    .goal-box{background:rgba(0,0,0,.72);border:2px solid #8B6914;border-radius:4px;padding:5px 8px;font-family:'Press Start 2P',monospace;font-size:7px;line-height:1.9;max-width:175px}
    .goal-box .gl{color:#FFC93C}
    .hud-tr{position:absolute;top:8px;right:8px;display:flex;gap:6px;pointer-events:all}
    .hbtn{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.65);border:2px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:800;font-size:.78rem;color:#fff}
    .hbtn.liked{border-color:#FFC93C;color:#FFC93C}
    /* Hotbar */
    #hotbar{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:rgba(100,60,15,.95);border:3px solid #4a2800;border-bottom:none;border-radius:8px 8px 0 0;padding:5px 6px;z-index:10;pointer-events:all}
    .hslot{width:54px;height:54px;background:rgba(200,155,75,.35);border:2px solid #6a3e0c;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:.1s;user-select:none}
    .hslot.active{background:rgba(255,215,90,.55);border-color:#FFC93C;box-shadow:inset 0 0 0 2px #FFC93C}
    .hslot .si{font-size:22px;line-height:1}
    .hslot .sq{position:absolute;bottom:2px;right:4px;font-size:11px;font-weight:800;color:#fff;text-shadow:1px 1px 0 #000}
    .hslot .sk{position:absolute;top:2px;left:4px;font-size:9px;font-weight:800;color:rgba(255,255,255,.5)}
    /* Modals */
    .modal{position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(3px)}
    .modal.hidden{display:none}
    .mbox{background:#c09050;border:4px solid #5a3000;border-radius:4px;box-shadow:6px 6px 0 #000,inset 0 0 0 2px rgba(255,255,255,.12);position:relative;max-width:96vw}
    .mtitle{background:#5a8090;color:#fff;font-family:'Press Start 2P',monospace;font-size:10px;text-align:center;padding:11px 20px;border-bottom:3px solid #3a5060;letter-spacing:1px}
    .xbtn{position:absolute;top:8px;right:10px;font-size:1.2rem;cursor:pointer;color:rgba(255,255,255,.8);font-weight:800;background:none;border:none;z-index:2}
    /* Inventory */
    .inv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:12px}
    .islot{width:70px;height:70px;background:#ddb870;border:3px solid #8B5E3C;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer}
    .islot:hover{border-color:#FFC93C}
    .islot .si{font-size:28px}
    .islot .sq{position:absolute;bottom:2px;right:5px;font-size:12px;font-weight:800;color:#000}
    .islot.empty{background:rgba(180,130,60,.35)}
    /* Workbench */
    .wb-wrap{display:flex}
    .wb-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:10px;overflow-y:auto;max-height:340px}
    .wslot{width:66px;height:66px;background:#ddb870;border:3px solid #8B5E3C;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:.1s}
    .wslot:hover,.wslot.sel{border-color:#FFC93C;background:#f0d888}
    .wslot.sel{box-shadow:inset 0 0 0 2px #FFC93C}
    .wslot .si{font-size:24px}
    .wslot .sn{font-size:7px;font-weight:800;color:#4a2800;text-align:center;line-height:1.2;padding:0 2px}
    .wb-side{width:170px;background:#9a7035;border-left:3px solid #5a3000;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:200px}
    .wri{font-size:44px;text-align:center}
    .wrn{font-family:'Press Start 2P',monospace;font-size:8px;color:#fff;text-align:center;line-height:1.6}
    .wrc{font-size:.78rem;font-weight:800;color:#ffe080;text-align:center}
    .wrh{font-size:.72rem;color:rgba(255,255,255,.7);text-align:center;white-space:pre}
    .craft-btn{font-family:'Press Start 2P',monospace;font-size:9px;background:#3a7030;color:#fff;border:3px solid #244820;border-radius:4px;padding:10px;cursor:pointer;box-shadow:0 4px 0 #142a10;text-align:center;margin-top:auto}
    .craft-btn:disabled{background:#555;border-color:#333;box-shadow:0 4px 0 #111;cursor:not-allowed;opacity:.7}
    .craft-btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #142a10}
    /* Overlays */
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.76);z-index:40;backdrop-filter:blur(4px)}
    .overlay.hidden{display:none}
    .ovbox{background:#2d1a00;border:4px solid #FFC93C;border-radius:10px;padding:26px 32px;text-align:center;max-width:340px;box-shadow:0 8px 0 #000}
    .ovbox h2{font-family:'Press Start 2P',monospace;font-size:.95rem;color:#FFC93C;margin-bottom:12px;line-height:1.6}
    .ovbox p{font-weight:700;font-size:.88rem;opacity:.85;margin-bottom:14px;line-height:1.6}
    .pbtn{font-family:'Press Start 2P',monospace;font-size:.7rem;background:#3DDC97;color:#000;border:none;border-radius:6px;padding:12px 22px;cursor:pointer;box-shadow:0 4px 0 #1a7a4a}
    .pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1a7a4a}
    /* Mobile */
    #mctrl{position:absolute;bottom:70px;left:0;right:0;display:none;justify-content:space-between;padding:0 10px;z-index:15;pointer-events:none}
    .cg{display:flex;gap:6px;pointer-events:all}
    .cbtn{width:52px;height:52px;border-radius:10px;border:3px solid rgba(0,0,0,.45);background:rgba(255,255,255,.14);font-size:1.2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(3px)}
    .cbtn:active{background:rgba(255,255,255,.3)}
    @media(max-width:700px){#mctrl{display:flex}.hslot{width:46px;height:46px}.hslot .si{font-size:18px}.wb-grid{grid-template-columns:repeat(5,1fr)}.wslot{width:56px;height:56px}}
  </style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="/"><span class="dot">🎮</span>llobi</a>
  <button class="back-btn" onclick="window.location.href='/'">← Games</button>
</div>
<div id="gameArea">
  <canvas id="c"></canvas>
  <!-- HUD -->
  <div id="hud">
    <div class="hud-tl">
      <div class="hearts" id="hearts"></div>
      <div class="goal-box"><span class="gl">GOAL: </span><span id="goalTxt">Chop a tree</span><br><span id="goalPct"></span></div>
    </div>
    <div class="hud-tr">
      <div class="hbtn">▶ <span id="playCount">0</span></div>
      <button class="hbtn" id="likeBtn"><span id="likeIcon">👍</span><span id="likeCount">0</span></button>
    </div>
  </div>
  <!-- Hotbar -->
  <div id="hotbar">
    <div class="hslot active" data-i="0"><span class="sk">1</span><span class="si" id="h0"></span><span class="sq" id="hq0"></span></div>
    <div class="hslot" data-i="1"><span class="sk">2</span><span class="si" id="h1"></span><span class="sq" id="hq1"></span></div>
    <div class="hslot" data-i="2"><span class="sk">3</span><span class="si" id="h2"></span><span class="sq" id="hq2"></span></div>
    <div class="hslot" data-i="3"><span class="sk">4</span><span class="si" id="h3"></span><span class="sq" id="hq3"></span></div>
    <div class="hslot" data-i="4"><span class="sk">5</span><span class="si" id="h4"></span><span class="sq" id="hq4"></span></div>
    <div class="hslot" data-i="5"><span class="sk">I</span><span class="si">🎒</span></div>
    <div class="hslot" data-i="6"><span class="sk">B</span><span class="si">🛠️</span></div>
  </div>
  <!-- Mobile controls -->
  <div id="mctrl">
    <div class="cg"><div class="cbtn" id="ml">◀</div><div class="cbtn" id="mr">▶</div></div>
    <div class="cg"><div class="cbtn" id="mm">⛏️</div><div class="cbtn" id="mj">▲</div></div>
  </div>
  <!-- Inventory modal -->
  <div class="modal hidden" id="invM">
    <div class="mbox"><div class="mtitle">Inventory</div><button class="xbtn" id="invX">✕</button><div class="inv-grid" id="invG"></div></div>
  </div>
  <!-- Workbench modal -->
  <div class="modal hidden" id="wbM">
    <div class="mbox">
      <div class="mtitle">Work Bench</div><button class="xbtn" id="wbX">✕</button>
      <div class="wb-wrap">
        <div class="wb-grid" id="wbG"></div>
        <div class="wb-side">
          <div class="wri" id="wri">?</div>
          <div class="wrn" id="wrn">Select a recipe</div>
          <div class="wrc" id="wrc"></div>
          <div class="wrh" id="wrh"></div>
          <button class="craft-btn" id="craftBtn" disabled>Create</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Start overlay -->
  <div class="overlay" id="startOv">
    <div class="ovbox">
      <h2>⛏️ CRAFT &amp; BUILD</h2>
      <p>Mine wood &amp; stone, craft tools and survive!<br><br>Arrow keys = move · Space = jump · Click = mine<br>I = inventory · B = workbench</p>
      <button class="pbtn" id="startBtn">START GAME</button>
    </div>
  </div>
  <!-- Dead overlay -->
  <div class="overlay hidden" id="deadOv">
    <div class="ovbox">
      <h2>YOU DIED!</h2>
      <p>Resources collected: <strong id="finalScore">0</strong></p>
      <button class="pbtn" id="restartBtn">TRY AGAIN</button>
    </div>
  </div>
</div>
<script>
// ── Stats ──────────────────────────────────────────────────────────
const GID='tower-build';
function gS(){ return JSON.parse(localStorage.getItem('llobi_stats_'+GID)||'{"plays":1540,"likes":380,"liked":false}'); }
function sS(s){ localStorage.setItem('llobi_stats_'+GID,JSON.stringify(s)); }
function rS(){ var s=gS(); document.getElementById('playCount').innerText=s.plays.toLocaleString(); document.getElementById('likeCount').innerText=s.likes.toLocaleString(); document.getElementById('likeBtn').classList.toggle('liked',s.liked); document.getElementById('likeIcon').innerText=s.liked?'💛':'👍'; }
(function(){ var s=gS(); s.plays++; sS(s); rS(); })();
document.getElementById('likeBtn').addEventListener('click',()=>{ var s=gS(); s.liked?s.likes--:s.likes++; s.liked=!s.liked; sS(s); rS(); });

// ── Canvas ────────────────────────────────────────────────────────
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H;
function resize(){ var a=document.getElementById('gameArea'); W=canvas.width=a.clientWidth; H=canvas.height=a.clientHeight; }
resize(); window.addEventListener('resize',resize);

// ── Item definitions ──────────────────────────────────────────────
const ITEMS={
  wood:{icon:'🪵',name:'Oak Wood'}, stone:{icon:'🪨',name:'Stone'}, coal:{icon:'🖤',name:'Coal'},
  iron:{icon:'🔩',name:'Iron Ore'}, plank:{icon:'🟫',name:'Oak Plank'}, stick:{icon:'🪃',name:'Stick'},
  torch:{icon:'🔦',name:'Torch'}, workbench:{icon:'🛠️',name:'Workbench'}, chest:{icon:'📦',name:'Chest'},
  sword:{icon:'⚔️',name:'Wood Sword'}, stone_sword:{icon:'🗡️',name:'Stone Sword'},
  axe:{icon:'🪓',name:'Wood Axe'}, stone_axe:{icon:'🔨',name:'Stone Axe'},
  pick:{icon:'⛏️',name:'Wood Pickaxe'}, stone_pick:{icon:'🪚',name:'Stone Pickaxe'},
  shovel:{icon:'🔧',name:'Shovel'}, bow:{icon:'🏹',name:'Bow'},
  helmet:{icon:'⛑️',name:'Helmet'}, chestplate:{icon:'🦺',name:'Chestplate'},
  leggings:{icon:'👖',name:'Leggings'}, boots:{icon:'👢',name:'Boots'},
  bread:{icon:'🍞',name:'Bread'}, cooked:{icon:'🥩',name:'Cooked Meat'},
  door:{icon:'🚪',name:'Door'}, ladder:{icon:'🪜',name:'Ladder'},
  fence:{icon:'🪺',name:'Fence'}, slab:{icon:'🧱',name:'Stone Slab'},
  tnt:{icon:'💣',name:'TNT'}, bucket:{icon:'🪣',name:'Bucket'},
  arrow:{icon:'➡️',name:'Arrow'}, string:{icon:'🧵',name:'String'},
  hook:{icon:'🪝',name:'Hook'}, shears:{icon:'✂️',name:'Shears'},
};
const RECIPES=[
  {out:'plank',qty:4,need:{wood:1}},
  {out:'stick',qty:4,need:{plank:2}},
  {out:'workbench',qty:1,need:{plank:4}},
  {out:'chest',qty:1,need:{plank:8}},
  {out:'torch',qty:4,need:{stick:1,coal:1}},
  {out:'sword',qty:1,need:{stick:1,plank:2}},
  {out:'stone_sword',qty:1,need:{stick:1,stone:2}},
  {out:'axe',qty:1,need:{stick:2,plank:3}},
  {out:'stone_axe',qty:1,need:{stick:2,stone:3}},
  {out:'pick',qty:1,need:{stick:2,plank:3}},
  {out:'stone_pick',qty:1,need:{stick:2,stone:3}},
  {out:'shovel',qty:1,need:{stick:2,plank:1}},
  {out:'bow',qty:1,need:{stick:3,string:3}},
  {out:'arrow',qty:4,need:{stick:1,stone:1}},
  {out:'helmet',qty:1,need:{plank:5}},
  {out:'chestplate',qty:1,need:{plank:8}},
  {out:'leggings',qty:1,need:{plank:7}},
  {out:'boots',qty:1,need:{plank:4}},
  {out:'door',qty:1,need:{plank:6}},
  {out:'ladder',qty:3,need:{stick:7}},
  {out:'fence',qty:2,need:{stick:4,plank:2}},
  {out:'slab',qty:6,need:{stone:3}},
  {out:'tnt',qty:1,need:{coal:5,stone:4}},
  {out:'bucket',qty:1,need:{iron:3}},
  {out:'shears',qty:1,need:{iron:2}},
  {out:'hook',qty:1,need:{iron:3,stick:2}},
  {out:'bread',qty:1,need:{plank:2,stone:1}},
  {out:'cooked',qty:1,need:{coal:1,stone:1}},
  {out:'string',qty:2,need:{plank:1}},
  {out:'iron',qty:1,need:{stone:4,coal:2}},
];

// ── Inventory ─────────────────────────────────────────────────────
let inv={};
let hotbarTypes=[null,null,null,null,null];
function addItem(type,n=1){ inv[type]=(inv[type]||0)+n; refreshUI(); updateGoal(); }
function canCraft(r){ return Object.entries(r.need).every(([k,v])=>(inv[k]||0)>=v); }
function doCraft(r){
  if(!canCraft(r)) return;
  Object.entries(r.need).forEach(([k,v])=>{ inv[k]-=v; if(inv[k]<=0) delete inv[k]; });
  addItem(r.out,r.qty);
  showFloat('✅ +'+r.qty+' '+ITEMS[r.out].icon);
}
function refreshUI(){
  // fill hotbar
  var keys=Object.keys(inv).filter(k=>inv[k]>0);
  hotbarTypes=hotbarTypes.map(t=>t&&inv[t]?t:null);
  var used=new Set(hotbarTypes.filter(Boolean));
  keys.forEach(k=>{ if(!used.has(k)){ var e=hotbarTypes.indexOf(null); if(e>=0){hotbarTypes[e]=k;used.add(k);} } });
  for(var i=0;i<5;i++){
    var t=hotbarTypes[i];
    document.getElementById('h'+i).innerText=t?ITEMS[t].icon:'';
    document.getElementById('hq'+i).innerText=t&&inv[t]>1?inv[t]:'';
  }
  if(openModal==='inv') renderInvGrid();
  if(openModal==='wb') renderWbGrid();
}

// ── Goals ─────────────────────────────────────────────────────────
const GOALS=[
  {txt:'Chop a tree',c:()=>(inv.wood||0)>=1},
  {txt:'Collect 5 wood',c:()=>(inv.wood||0)>=5},
  {txt:'Mine 5 stone',c:()=>(inv.stone||0)>=5},
  {txt:'Craft planks',c:()=>(inv.plank||0)>=1},
  {txt:'Mine coal',c:()=>(inv.coal||0)>=1},
  {txt:'Craft a pickaxe',c:()=>inv.pick||inv.stone_pick},
  {txt:'Craft a sword',c:()=>inv.sword||inv.stone_sword},
  {txt:'Mine iron',c:()=>(inv.iron||0)>=1},
  {txt:'You win! 🏆',c:()=>false},
];
let gIdx=0;
function updateGoal(){
  if(gIdx<GOALS.length-1&&GOALS[gIdx].c()){gIdx++;updateGoal();return;}
  document.getElementById('goalTxt').innerText=GOALS[Math.min(gIdx,GOALS.length-1)].txt;
  document.getElementById('goalPct').innerText=gIdx>=GOALS.length-1?'All done! 🎉':'';
}

// ── World ─────────────────────────────────────────────────────────
const T={AIR:0,GRASS:1,DIRT:2,STONE:3,LOG:4,LEAVES:5,COAL:6,IRON:7};
const TS=40, WW=100, WH=32, SKY=10;
let world=[];
function genWorld(){
  world=[];
  for(let y=0;y<WH;y++){world[y]=[];for(let x=0;x<WW;x++)world[y][x]=T.AIR;}
  for(let x=0;x<WW;x++){
    var sy=SKY+Math.round(Math.sin(x*.15)*2+Math.cos(x*.09)*1.5);
    sy=Math.max(SKY-1,Math.min(SKY+3,sy));
    world[sy][x]=T.GRASS;
    for(let y=sy+1;y<sy+4&&y<WH;y++) world[y][x]=T.DIRT;
    for(let y=sy+4;y<WH;y++){
      world[y][x]=T.STONE;
      if(y>sy+5&&Math.random()<.045) world[y][x]=T.COAL;
      if(y>sy+9&&Math.random()<.025) world[y][x]=T.IRON;
    }
    // Trees
    if(x>3&&x<WW-4&&x%8===2){
      var th=4+Math.floor(Math.random()*2);
      for(let ly=0;ly<th;ly++) if(sy-ly-1>=0) world[sy-ly-1][x]=T.LOG;
      for(let lx=-2;lx<=2;lx++) for(let ly=-2;ly<=1;ly++){
        var nx=x+lx, ny=sy-th+ly;
        if(nx>=0&&nx<WW&&ny>=0&&ny<WH&&world[ny][nx]===T.AIR) world[ny][nx]=T.LEAVES;
      }
    }
  }
}
function tileAt(tx,ty){ if(tx<0||tx>=WW||ty<0||ty>=WH) return T.STONE; return world[ty][tx]; }
function solid(t){ return t!==T.AIR&&t!==T.LEAVES; }
const TILE_DROP={[T.LOG]:'wood',[T.STONE]:'stone',[T.COAL]:'coal',[T.IRON]:'iron'};

// ── Player ────────────────────────────────────────────────────────
const PW=28,PH=50;
let pl,camX,lives,score,floats,running;
function initPlayer(){
  var sx=8, sy=SKY;
  for(let y=0;y<WH;y++) if(world[y][sx]===T.GRASS){sy=y;break;}
  pl={x:sx*TS+6,y:(sy-2)*TS,vx:0,vy:0,onG:false,dir:1,wf:0,hurt:0};
  camX=pl.x-W/2; lives=10; score=0; floats=[];
  inv={}; hotbarTypes=[null,null,null,null,null]; gIdx=0;
  refreshUI(); updateGoal(); renderHearts();
}
function renderHearts(){ document.getElementById('hearts').innerHTML=Array.from({length:10},(_,i)=>`<div class="heart">${i<lives?'❤️':'🖤'}</div>`).join(''); }

// ── Animals ──────────────────────────────────────────────────────
let animals=[];
function spawnAnimals(){
  animals=[];
  [[20,'cow'],[28,'sheep'],[36,'cow'],[44,'sheep'],[54,'cow'],[62,'sheep']].forEach(([ax,type])=>{
    var sy=SKY;
    for(let y=0;y<WH;y++) if(world[y][Math.min(ax,WW-1)]===T.GRASS){sy=y;break;}
    animals.push({type,x:ax*TS,y:(sy-1)*TS,vx:0,vy:0,dir:1,wf:0,timer:60+Math.random()*100,w:36,h:24,onG:false});
  });
}

// ── Enemies ───────────────────────────────────────────────────────
let slimes=[];
function spawnSlimes(){
  slimes=[];
  [38,50,66,78].forEach(ax=>{
    var sy=SKY; for(let y=0;y<WH;y++) if(world[y][Math.min(ax,WW-1)]===T.GRASS){sy=y;break;}
    slimes.push({x:ax*TS,y:(sy-1)*TS,vx:0,vy:0,dir:1,wf:0,w:26,h:22,onG:false});
  });
}

// ── Input ─────────────────────────────────────────────────────────
const keys={}, mk={l:false,r:false};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();doJump();}
  if(e.code==='KeyI'){e.preventDefault();toggleModal('inv');}
  if(e.code==='KeyB'){e.preventDefault();toggleModal('wb');}
  if(e.code==='Digit1') setSlot(0); if(e.code==='Digit2') setSlot(1);
  if(e.code==='Digit3') setSlot(2); if(e.code==='Digit4') setSlot(3);
  if(e.code==='Digit5') setSlot(4);
});
document.addEventListener('keyup',e=>{ keys[e.code]=false; });
function doJump(){ if(pl&&pl.onG){pl.vy=-12;pl.onG=false;} }
let activeSlot=0;
function setSlot(i){ activeSlot=i; document.querySelectorAll('.hslot').forEach((s,j)=>s.classList.toggle('active',j===i)); }
document.querySelectorAll('.hslot').forEach((s,i)=>{
  s.addEventListener('click',()=>{ if(i===5){toggleModal('inv');return;} if(i===6){toggleModal('wb');return;} setSlot(i); });
});

// ── Modals ────────────────────────────────────────────────────────
let openModal=null;
function toggleModal(w){
  var im=document.getElementById('invM'), wm=document.getElementById('wbM');
  if(openModal===w){im.classList.add('hidden');wm.classList.add('hidden');openModal=null;return;}
  im.classList.add('hidden'); wm.classList.add('hidden');
  if(w==='inv'){im.classList.remove('hidden');renderInvGrid();}
  else{wm.classList.remove('hidden');renderWbGrid();}
  openModal=w;
}
document.getElementById('invX').addEventListener('click',()=>toggleModal('inv'));
document.getElementById('wbX').addEventListener('click',()=>toggleModal('wb'));

function renderInvGrid(){
  var el=document.getElementById('invG');
  var allKeys=Object.keys(ITEMS);
  var html=allKeys.map(k=>{
    var n=inv[k]||0;
    return `<div class="islot${n?'':' empty'}">${n?`<span class="si">${ITEMS[k].icon}</span>${n>0?`<span class="sq">${n}</span>`:''}`:''}</div>`;
  }).join('');
  var rem=20-allKeys.length; for(var i=0;i<rem;i++) html+=`<div class="islot empty"></div>`;
  el.innerHTML=html;
}

let selR=null;
function renderWbGrid(){
  var el=document.getElementById('wbG');
  el.innerHTML=RECIPES.map((r,i)=>{
    var it=ITEMS[r.out], ok=canCraft(r);
    return `<div class="wslot${selR===i?' sel':''}" data-ri="${i}" style="opacity:${ok?1:.55}">
      <span class="si">${it.icon}</span><span class="sn">${it.name}</span></div>`;
  }).join('');
  el.querySelectorAll('.wslot').forEach(s=>{
    s.addEventListener('click',()=>{
      selR=parseInt(s.dataset.ri); renderWbGrid();
      var r=RECIPES[selR],it=ITEMS[r.out];
      document.getElementById('wri').innerText=it.icon;
      document.getElementById('wrn').innerText=it.name+' x'+r.qty;
      document.getElementById('wrc').innerText='Needs: '+Object.entries(r.need).map(([k,v])=>ITEMS[k].icon+' x'+v).join('  ');
      document.getElementById('wrh').innerText=Object.entries(r.need).map(([k,v])=>'Have '+k+': '+(inv[k]||0)+'/'+v).join('\n');
      document.getElementById('craftBtn').disabled=!canCraft(r);
    });
  });
}
document.getElementById('craftBtn').addEventListener('click',()=>{
  if(selR===null) return;
  doCraft(RECIPES[selR]); renderWbGrid();
  if(selR!==null) document.getElementById('craftBtn').disabled=!canCraft(RECIPES[selR]);
});

// ── Mine on click ─────────────────────────────────────────────────
canvas.addEventListener('click',e=>{ if(openModal) return; mine(e.clientX,e.clientY); });
canvas.addEventListener('touchstart',e=>{ if(openModal) return; e.preventDefault(); mine(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
function mine(cx,cy){
  var r=canvas.getBoundingClientRect();
  var tx=Math.floor((cx-r.left)*(W/r.width)+camX)/TS|0, ty=Math.floor((cy-r.top)*(H/r.height)/TS)|0;
  tx=Math.floor((((cx-r.left)*(W/r.width))+camX)/TS);
  var t=tileAt(tx,ty);
  if(t!==T.AIR&&t!==T.LEAVES){
    world[ty][tx]=T.AIR;
    var d=TILE_DROP[t];
    if(d){ addItem(d,1); score++; showFloat(ITEMS[d].icon+' +1'); }
  }
}
function showFloat(txt){ if(pl) floats.push({txt,x:pl.x-camX,y:H*.55,a:1}); }

// ── Physics ───────────────────────────────────────────────────────
function pX(e){
  e.x+=e.vx; e.x=Math.max(0,Math.min(e.x,(WW-1)*TS));
  var L=Math.floor(e.x/TS), R=Math.floor((e.x+e.w-1)/TS);
  var top=Math.floor(e.y/TS), bot=Math.floor((e.y+e.h-1)/TS);
  for(var ty=top;ty<=bot;ty++){
    if(solid(tileAt(L,ty))&&e.vx<=0){e.x=(L+1)*TS; e.vx=0;}
    if(solid(tileAt(R,ty))&&e.vx>=0){e.x=R*TS-e.w; e.vx=0;}
  }
}
function pY(e){
  e.vy=Math.min(e.vy+0.55,14); e.y+=e.vy; e.onG=false;
  var L=Math.floor((e.x+2)/TS), R=Math.floor((e.x+e.w-3)/TS);
  var bot=Math.floor((e.y+e.h)/TS), top=Math.floor(e.y/TS);
  for(var tx=L;tx<=R;tx++){
    if(solid(tileAt(tx,bot))&&e.vy>=0){e.y=bot*TS-e.h; e.vy=0; e.onG=true;}
    if(solid(tileAt(tx,top))&&e.vy<0){e.y=(top+1)*TS; e.vy=0;}
  }
}

// ── Update ────────────────────────────────────────────────────────
function update(){
  if(!running||openModal) return;
  var mvL=keys['ArrowLeft']||keys['KeyA']||mk.l;
  var mvR=keys['ArrowRight']||keys['KeyD']||mk.r;
  pl.vx=mvL?-4:mvR?4:0;
  if(pl.vx!==0) pl.dir=pl.vx>0?1:-1;
  if(pl.vx!==0&&pl.onG) pl.wf=(pl.wf+.15)%4;
  pl.w=PW; pl.h=PH; pX(pl); pY(pl);
  pl.hurt=Math.max(0,pl.hurt-1);
  camX+=(pl.x-W/2-camX)*.1;
  camX=Math.max(0,Math.min(camX,(WW-1)*TS-W));

  // Animals
  animals.forEach(a=>{
    a.timer--; if(a.timer<=0){a.dir*=-1;a.timer=70+Math.random()*100;}
    a.vx=a.dir*.6; a.wf=(a.wf+.06)%4;
    pX(a); pY(a);
    var nx=Math.floor((a.x+(a.dir>0?a.w+2:-3))/TS), ny=Math.floor((a.y+a.h+2)/TS);
    if(!solid(tileAt(nx,ny))||solid(tileAt(Math.floor((a.x+a.w/2)/TS),Math.floor(a.y/TS)))){ a.dir*=-1; }
  });

  // Slimes
  slimes.forEach(s=>{
    s.vx=s.dir*1.4; s.wf=(s.wf+.1)%2;
    pX(s); pY(s);
    var nx=Math.floor((s.x+(s.dir>0?s.w+2:-3))/TS), ny=Math.floor((s.y+s.h+2)/TS);
    if(!solid(tileAt(nx,ny))||solid(tileAt(Math.floor((s.x+13)/TS),Math.floor(s.y/TS)))) s.dir*=-1;
    var dx=s.x+13-pl.x-PW/2, dy=s.y+11-pl.y-PH/2;
    if(Math.abs(dx)<30&&Math.abs(dy)<28&&pl.hurt<=0){
      lives=Math.max(0,lives-1); renderHearts(); pl.hurt=45;
      pl.vy=-8; pl.vx=(pl.x<s.x?-1:1)*5;
      if(lives<=0) endGame();
    }
  });

  floats.forEach(f=>{f.y-=.9;f.a-=.015;}); floats=floats.filter(f=>f.a>0);
}

// ── Draw ──────────────────────────────────────────────────────────
var clouds=Array.from({length:7},(_,i)=>({x:i*180,y:18+Math.random()*60,w:80+Math.random()*60,s:.14+Math.random()*.12}));
function draw(){
  var sg=ctx.createLinearGradient(0,0,0,H); sg.addColorStop(0,'#4a7fe0'); sg.addColorStop(1,'#a0ccf8');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
  // Sun
  ctx.beginPath(); ctx.arc(W-80,60,34,0,Math.PI*2); ctx.fillStyle='#ffe640'; ctx.fill();
  ctx.strokeStyle='#ffc200'; ctx.lineWidth=4; ctx.stroke();
  // Mountains
  drawMtns();
  // Clouds
  clouds.forEach(cl=>{cl.x+=cl.s;if(cl.x>W+250)cl.x=-250;drawCloud(cl.x,cl.y,cl.w);});
  // Tiles
  var tx0=Math.max(0,Math.floor(camX/TS)-1), tx1=Math.min(WW,Math.ceil((camX+W)/TS)+1);
  for(var ty=0;ty<WH;ty++) for(var tx=tx0;tx<tx1;tx++){
    var t=world[ty][tx]; if(t===T.AIR) continue; drawTile(tx,ty,t);
  }
  animals.forEach(drawAnimal);
  slimes.forEach(drawSlime);
  drawPlayer();
  floats.forEach(f=>{
    ctx.save(); ctx.globalAlpha=f.a; ctx.textAlign='center';
    ctx.font='bold 15px Outfit,sans-serif';
    ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.strokeText(f.txt,f.x,f.y);
    ctx.fillStyle='#fff'; ctx.fillText(f.txt,f.x,f.y); ctx.restore();
  });
}

function drawMtns(){
  [[40,H*.62,160],[190,H*.52,200],[360,H*.58,180],[540,H*.50,210],[730,H*.60,170]].forEach(([x,y,w])=>{
    ctx.fillStyle='rgba(55,100,55,.35)'; ctx.beginPath(); ctx.moveTo(x,H*.83); ctx.lineTo(x+w/2,y); ctx.lineTo(x+w,H*.83); ctx.fill();
  });
  [[0,H*.70,200],[160,H*.65,180],[340,H*.68,190],[520,H*.63,180],[710,H*.70,180]].forEach(([x,y,w])=>{
    ctx.fillStyle='rgba(75,130,55,.2)'; ctx.beginPath(); ctx.moveTo(x,H*.84); ctx.lineTo(x+w/2,y); ctx.lineTo(x+w,H*.84); ctx.fill();
  });
}
function drawCloud(x,y,w){
  ctx.fillStyle='rgba(255,255,255,.88)';
  ctx.beginPath();ctx.ellipse(x+w/2,y,w/2,15,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+w*.3,y+5,w*.28,11,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+w*.72,y+4,w*.24,10,0,0,Math.PI*2);ctx.fill();
}

function drawTile(tx,ty,t){
  var x=tx*TS-camX, y=ty*TS; ctx.save();
  if(t===T.GRASS){
    ctx.fillStyle='#7a4a20';ctx.fillRect(x,y,TS,TS);
    ctx.fillStyle='#4a8030';ctx.fillRect(x,y,TS,9);
    ctx.fillStyle='#5da040'; for(var i=4;i<TS;i+=5)ctx.fillRect(x+i,y-3,2,4);
    ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(x+2,y+1,TS-4,4);
  } else if(t===T.DIRT){
    ctx.fillStyle='#7a4a20';ctx.fillRect(x,y,TS,TS);
    ctx.fillStyle='#623810';ctx.fillRect(x,y,TS/2,TS/2);ctx.fillRect(x+TS/2,y+TS/2,TS/2,TS/2);
    ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(x+4,y+4,10,7);ctx.fillRect(x+22,y+20,10,7);
  } else if(t===T.STONE){
    ctx.fillStyle='#888';ctx.fillRect(x,y,TS,TS);
    ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(x,y,TS/2,TS/2);ctx.fillRect(x+TS/2,y+TS/2,TS/2,TS/2);
    ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(x+TS/2,y,TS/2,TS/2);ctx.fillRect(x,y+TS/2,TS/2,TS/2);
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(x+2,y+2,8,5);
  } else if(t===T.LOG){
    ctx.fillStyle='#6B3D11';ctx.fillRect(x,y,TS,TS);
    ctx.fillStyle='#3e1f00';ctx.fillRect(x+1,y,4,TS);ctx.fillRect(x+TS-5,y,4,TS);
    ctx.fillStyle='#8B5E3C';ctx.fillRect(x+5,y,TS-10,TS);
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(x+10,y+4,4,TS-8);
  } else if(t===T.LEAVES){
    ctx.fillStyle='#2d7a1f';ctx.fillRect(x,y,TS,TS);
    ctx.fillStyle='#3a9c28';ctx.fillRect(x+4,y+4,TS-8,TS-8);
    ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(x+8,y+7,7,4);
  } else if(t===T.COAL){
    ctx.fillStyle='#666';ctx.fillRect(x,y,TS,TS);
    ctx.fillStyle='#111';ctx.fillRect(x+7,y+7,10,10);ctx.fillRect(x+22,y+18,8,8);
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(x+2,y+2,8,5);
  } else if(t===T.IRON){
    ctx.fillStyle='#777';ctx.fillRect(x,y,TS,TS);
    ctx.fillStyle='#cc8855';ctx.fillRect(x+5,y+5,12,12);ctx.fillRect(x+21,y+20,10,10);
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(x+2,y+2,8,5);
  }
  ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;ctx.strokeRect(x,y,TS,TS);
  ctx.restore();
}

function drawPlayer(){
  var px=pl.x-camX, py=pl.y;
  ctx.save();
  if(pl.dir<0){ctx.translate(px+PW,py);ctx.scale(-1,1);}else ctx.translate(px,py);
  if(pl.hurt>0) ctx.globalAlpha=pl.hurt%6<3?.35:1;
  var leg=pl.onG&&pl.vx!==0?Math.sin(pl.wf*Math.PI)*5:0;
  // Legs
  ctx.fillStyle='#224488';
  ctx.fillRect(1,PH*.58,12,PH*.4+leg); ctx.fillRect(PW-13,PH*.58,12,PH*.4-leg);
  // Shoes
  ctx.fillStyle='#111'; ctx.fillRect(0,PH*.94,14,PH*.06); ctx.fillRect(PW-14,PH*.94,14,PH*.06);
  // Body
  ctx.fillStyle='#4466cc'; ctx.fillRect(1,PH*.3,PW-2,PH*.3);
  // Belt
  ctx.fillStyle='#8B5E3C'; ctx.fillRect(1,PH*.56,PW-2,4);
  // Head
  ctx.fillStyle='#FFCC88'; ctx.fillRect(4,0,PW-8,PH*.3);
  // Hair
  ctx.fillStyle='#3a2000'; ctx.fillRect(4,0,PW-8,5); ctx.fillRect(4,0,4,PH*.18);
  // Eyes
  ctx.fillStyle='#000'; ctx.fillRect(PW-12,PH*.1,4,4);
  // Nose
  ctx.fillStyle='#cc8866'; ctx.fillRect(PW-10,PH*.17,3,3);
  // Beard
  ctx.fillStyle='#5a3000'; ctx.fillRect(5,PH*.21,PW-8,7);
  // Ears
  ctx.fillStyle='#FFCC88'; ctx.fillRect(2,PH*.08,4,7);
  // Arm (animated with walk)
  ctx.fillStyle='#4466cc';
  ctx.fillRect(PW-2,PH*.3-leg/2,5,PH*.22);
  // Tool
  if(hotbarTypes[activeSlot]){
    ctx.font='14px serif'; ctx.fillText(ITEMS[hotbarTypes[activeSlot]].icon,PW+3,PH*.46);
  }
  ctx.restore();
}

function drawAnimal(a){
  var ax=a.x-camX, ay=a.y;
  var bob=a.onG&&a.vx!==0?Math.sin(a.wf*Math.PI)*2:0;
  ctx.save();
  if(a.dir<0){ctx.translate(ax+a.w,ay);ctx.scale(-1,1);}else ctx.translate(ax,ay);
  if(a.type==='cow'){
    // body
    ctx.fillStyle='#ddd'; ctx.fillRect(2,6+bob,28,16);
    // patches
    ctx.fillStyle='#7a3a10'; ctx.fillRect(4,7+bob,10,8); ctx.fillRect(20,9+bob,8,8);
    // head
    ctx.fillStyle='#ddd'; ctx.fillRect(24,3+bob,12,13);
    ctx.fillStyle='#ffccaa'; ctx.fillRect(26,11+bob,10,5);
    // eye
    ctx.fillStyle='#000'; ctx.fillRect(30,5+bob,3,3);
    ctx.fillStyle='#fff'; ctx.fillRect(31,5+bob,1,1);
    // horns
    ctx.fillStyle='#ccc'; ctx.fillRect(25,-2+bob,3,5); ctx.fillRect(33,-2+bob,3,5);
    // legs
    ctx.fillStyle='#bbb';
    ctx.fillRect(4,21+bob,5,8); ctx.fillRect(11,21+bob,5,8);
    ctx.fillRect(20,21+bob,5,8); ctx.fillRect(27,21+bob,5,8);
    // udder
    ctx.fillStyle='#ffbbbb'; ctx.fillRect(13,21+bob,10,5);
    // tail
    ctx.fillStyle='#aaa'; ctx.fillRect(0,10+bob,3,6);
  } else {
    // sheep - fluffy body
    ctx.fillStyle='#e8e8e8';
    [[16,8],[7,10],[24,10],[14,16],[20,16],[10,16]].forEach(([cx,cy])=>{
      ctx.beginPath();ctx.arc(cx,cy+bob,8,0,Math.PI*2);ctx.fill();
    });
    // Face
    ctx.fillStyle='#aaa'; ctx.fillRect(24,4+bob,11,11);
    ctx.fillStyle='#000'; ctx.fillRect(30,6+bob,3,3);
    ctx.fillStyle='#fff'; ctx.fillRect(31,6+bob,1,1);
    // Nose
    ctx.fillStyle='#ffaaaa'; ctx.fillRect(26,11+bob,8,3);
    // Ear
    ctx.fillStyle='#bbb'; ctx.fillRect(22,5+bob,4,5);
    // Legs
    ctx.fillStyle='#888';
    ctx.fillRect(5,22+bob,4,8); ctx.fillRect(12,22+bob,4,8);
    ctx.fillRect(18,22+bob,4,8); ctx.fillRect(25,22+bob,4,8);
  }
  ctx.restore();
}

function drawSlime(s){
  var sx=s.x-camX, sy=s.y;
  var bob=Math.sin(s.wf*Math.PI)*3;
  ctx.save(); ctx.translate(sx,sy);
  ctx.fillStyle='#44bb33'; ctx.beginPath(); ctx.ellipse(13,11+bob,13,9,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#77dd55'; ctx.beginPath(); ctx.ellipse(11,7+bob,8,6,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000'; ctx.fillRect(5,7+bob,4,4); ctx.fillRect(15,7+bob,4,4);
  ctx.fillStyle='#fff'; ctx.fillRect(6,7+bob,2,2); ctx.fillRect(16,7+bob,2,2);
  ctx.fillStyle='rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(13,22+bob,10,3,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ── Mobile ───────────────────────────────────────────────────────
['ml','r'].forEach((_,i)=>{}); // placeholder
function mobBtn(id,k){ var e=document.getElementById(id); ['touchstart','touchend'].forEach((ev,j)=>e.addEventListener(ev,e2=>{e2.preventDefault();mk[k]=!j;},{passive:false})); }
mobBtn('ml','l'); mobBtn('mr','r');
document.getElementById('mm').addEventListener('touchstart',e=>{e.preventDefault();if(pl&&!openModal){var cx=pl.x+camX+PW/2,cy=pl.y+PH/2;mine(cx+40,cy);}},{passive:false});
document.getElementById('mj').addEventListener('touchstart',e=>{e.preventDefault();doJump();},{passive:false});

// ── Game flow ────────────────────────────────────────────────────
let animId;
function loop(){ update(); draw(); animId=requestAnimationFrame(loop); }
function endGame(){ running=false; cancelAnimationFrame(animId); document.getElementById('finalScore').innerText=score; document.getElementById('deadOv').classList.remove('hidden'); }
function startGame(){
  ['startOv','deadOv'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  openModal=null; document.getElementById('invM').classList.add('hidden'); document.getElementById('wbM').classList.add('hidden');
  cancelAnimationFrame(animId);
  genWorld(); initPlayer(); spawnAnimals(); spawnSlimes();
  running=true; loop();
}
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('restartBtn').addEventListener('click',startGame);
ctx.fillStyle='#4a7fe0'; ctx.fillRect(0,0,600,400);
</script>
