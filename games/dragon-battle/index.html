<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dragon Battle | LLOBI</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;user-select:none;display:flex;flex-direction:column;align-items:center;height:100dvh;image-rendering:pixelated}
.topbar{width:100%;max-width:700px;display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:#0a0005;border-bottom:3px solid #4a0010;flex-shrink:0}
.logo{font-family:'Press Start 2P',monospace;font-size:.55rem;color:#fff;text-decoration:none}
.logo span{color:#ff4444}
#wrap{position:relative;width:100%;max-width:700px;flex:1;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#mctrl{position:absolute;bottom:0;left:0;right:0;display:none;padding:6px 10px;pointer-events:none}
#mctrl.show{display:flex;justify-content:space-between;align-items:flex-end}
.mc-pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:4px}
.mc-btn{width:52px;height:52px;background:rgba(255,50,50,.18);border:2px solid rgba(255,80,80,.35);color:#ff8888;font-size:.8rem;display:grid;place-items:center;cursor:pointer;pointer-events:all;border-radius:6px}
.mc-btn:active{background:rgba(255,80,80,.4)}
.mc-fire{width:76px;height:76px;background:rgba(255,100,0,.22);border:3px solid rgba(255,140,0,.5);border-radius:50%;color:#ffaa00;font-size:1.6rem;display:grid;place-items:center;cursor:pointer;pointer-events:all}
.mc-fire:active{background:rgba(255,160,0,.5)}
</style>
</head>
<body>
<div class="topbar">
  <a href="/" class="logo"><span>llobi</span>.com</a>
  <span style="font-family:'Press Start 2P',monospace;font-size:.42rem;color:#661111">DRAGON BATTLE</span>
</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="mctrl">
    <div class="mc-pad">
      <div></div><div class="mc-btn" id="mc-up">▲</div><div></div>
      <div class="mc-btn" id="mc-left">◀</div>
      <div class="mc-btn" id="mc-down">▼</div>
      <div class="mc-btn" id="mc-right">▶</div>
    </div>
    <div class="mc-fire" id="mc-fire">🔥</div>
  </div>
</div>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const wrap=document.getElementById('wrap');
let cW=0,cH=0,HORIZ=0;
function resize(){
  const r=wrap.getBoundingClientRect();
  cW=r.width;cH=r.height;HORIZ=~~(cH*.40);
  canvas.width=~~cW;canvas.height=~~cH;
  ctx.imageSmoothingEnabled=false;
}
resize();window.addEventListener('resize',resize);

// ── Dragon types ─────────────────────────────────────────────────────────────
const DRAGON_TYPES=[
  {id:'fire',  name:'FIRE',   emoji:'🔥',desc:'Fast & fierce',
   body:'#8B0000',bodyL:'#CC2222',bodyD:'#5a0000',belly:'#CC7744',
   wingD:'#3d0000',wingL:'#660000',horn:'#1a1a1a',eye:'#FFD700',
   breath:['#FFE566','#FF8800','#FF2200'],speed:4.5,hp:140,fuel:80,regenFuel:1.4,dmg:5},
  {id:'ice',   name:'ICE',    emoji:'❄️',desc:'Slows enemies',
   body:'#1a3a6b',bodyL:'#4488cc',bodyD:'#0d2040',belly:'#aaddff',
   wingD:'#0d2040',wingL:'#1a3a6b',horn:'#88ccff',eye:'#ffffff',
   breath:['#ffffff','#88ddff','#44aaff'],speed:3.5,hp:160,fuel:90,regenFuel:1.1,dmg:4},
  {id:'earth', name:'EARTH',  emoji:'🪨',desc:'Heavy & tanky',
   body:'#3d2a0d',bodyL:'#6b4a1a',bodyD:'#1a1005',belly:'#8B6914',
   wingD:'#1a1005',wingL:'#3d2a0d',horn:'#2d4a0d',eye:'#88ff44',
   breath:['#aabb44','#886622','#443311'],speed:2.5,hp:220,fuel:70,regenFuel:1.0,dmg:7},
  {id:'air',   name:'AIR',    emoji:'💨',desc:'Fastest flier',
   body:'#3a3a4a',bodyL:'#8888aa',bodyD:'#1a1a2a',belly:'#ddddff',
   wingD:'#1a1a2a',wingL:'#444466',horn:'#aaaacc',eye:'#00ffff',
   breath:['#eeeeff','#aaaacc','#6666aa'],speed:6,hp:120,fuel:100,regenFuel:2.0,dmg:3},
  {id:'nature',name:'NATURE', emoji:'🌿',desc:'Poison & heals',
   body:'#0d4a0d',bodyL:'#1a8a1a',bodyD:'#051a05',belly:'#88cc44',
   wingD:'#051a05',wingL:'#0d4a0d',horn:'#2d6b0d',eye:'#ffff00',
   breath:['#aaffaa','#44cc44','#118811'],speed:3.5,hp:170,fuel:85,regenFuel:1.6,dmg:4},
  {id:'soul',  name:'SOUL',   emoji:'💜',desc:'Dark magic',
   body:'#2d0a4a',bodyL:'#6622aa',bodyD:'#120524',belly:'#9944dd',
   wingD:'#120524',wingL:'#2d0a4a',horn:'#220044',eye:'#ff44ff',
   breath:['#ff88ff','#aa44ff','#660088'],speed:4,hp:150,fuel:95,regenFuel:1.3,dmg:6},
];
let selectedType=0;

// ── State ─────────────────────────────────────────────────────────────────────
let gs='select',score=0,best=0,kills=0,frame=0;
// 3D camera / world position
let camX=0,camZ=0,camH=180;
// Dragon screen position and physics
let dsx=0,dsy=0,dvx=0,dvy=0,dtilt=0,dwingF=0,dwingT=0,dtailF=0;
let dhp=0,dmaxHp=0,dfuel=0,dmaxFuel=0,dinvT=0,dregenT=0,ddead=false,ddeathT=0;
let dtype=null;
let objects=[],enemies=[],projectiles=[],breathFX=[],particles=[],floaters=[];
let spawnedUpTo=0;
// 3D projection constants
const FOCAL=200;
try{best=parseInt(localStorage.getItem('dragonbattle_best')||'0');}catch(e){}

// ── Input ─────────────────────────────────────────────────────────────────────
const keys={};
const mk={up:false,dn:false,lf:false,rt:false,fire:false};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;if(e.code==='Space')e.preventDefault();
  if(gs==='select'){
    if(e.code==='ArrowLeft'||e.code==='KeyA')selectedType=(selectedType-1+DRAGON_TYPES.length)%DRAGON_TYPES.length;
    if(e.code==='ArrowRight'||e.code==='KeyD')selectedType=(selectedType+1)%DRAGON_TYPES.length;
    if(e.code==='Enter'||e.code==='Space')startGame();
  }
  if(gs==='dead'&&(e.code==='Enter'||e.code==='Space'))gs='select';
});
document.addEventListener('keyup',e=>{delete keys[e.code];});

function isMobile(){return'ontouchstart'in window||navigator.maxTouchPoints>0;}
let swipeX=null;
canvas.addEventListener('touchstart',e=>{swipeX=e.touches[0].clientX;if(gs==='dead')gs='select';},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(gs!=='select')return;
  const dx=e.changedTouches[0].clientX-swipeX;
  if(Math.abs(dx)>30)selectedType=(selectedType+(dx<0?1:-1)+DRAGON_TYPES.length)%DRAGON_TYPES.length;
  else startGame();
},{passive:true});
function initMobile(){
  document.getElementById('mctrl').classList.add('show');
  const btn=(id,k)=>{const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();mk[k]=true;},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();mk[k]=false;},{passive:false});};
  btn('mc-up','up');btn('mc-down','dn');btn('mc-left','lf');btn('mc-right','rt');
  const f=document.getElementById('mc-fire');
  f.addEventListener('touchstart',e=>{e.preventDefault();mk.fire=true;if(gs==='select')startGame();},{passive:false});
  f.addEventListener('touchend',e=>{e.preventDefault();mk.fire=false;},{passive:false});
}

// ── World generation (3D — objects have wx, wz, wy_height) ───────────────────
// wx = left/right, wz = depth (forward), wy = height above ground

// Very sparse initial spawn: 1 enemy per ~8000 units; increases with score
function enemyBudget(){return Math.max(1,Math.floor(score/300));}

function spawnChunk(fromZ,toZ){
  const budget=enemyBudget();
  for(let z=fromZ;z<toZ;z+=500){
    // Trees — common
    if(Math.random()<.7){
      const wx=(-1+Math.random()*2)*600;
      objects.push({type:'tree',wx,wz:z+Math.random()*500,wy:0,dead:false});
    }
    if(Math.random()<.7){
      objects.push({type:'tree',wx:(-1+Math.random()*2)*600,wz:z+Math.random()*500,wy:0,dead:false});
    }
    // Buildings — rare
    if(Math.random()<.04){
      const type=Math.random()<.3?'castle':'village';
      const wx=(-1+Math.random()*2)*400;
      const h=type==='castle'?110:60,w=type==='castle'?120:80;
      objects.push({type,wx,wz:z+Math.random()*500,wy:0,w,h,hp:type==='castle'?80:30,maxHp:type==='castle'?80:30,dead:false});
    }
    // Enemies — very sparse, controlled by budget
    const spawnChance=0.004*budget; // starts tiny, grows with score
    if(Math.random()<spawnChance){
      const eType=budget<3?'archer':Math.random()<.4?'mage':Math.random()<.5?'ogre':'archer';
      const wx=(-1+Math.random()*2)*350;
      const wy=eType==='mage'?100+Math.random()*80:0;
      enemies.push(makeEnemy(eType,wx,wy,z+Math.random()*500));
    }
  }
  spawnedUpTo=toZ;
}

function makeEnemy(type,wx,wy,wz){
  const cfg={
    archer:{hp:20,maxHp:20,shootInterval:120,projSpd:5,dmg:12,pts:60},
    ogre:  {hp:60,maxHp:60,shootInterval:160,projSpd:4,dmg:20,pts:120},
    mage:  {hp:30,maxHp:30,shootInterval:80, projSpd:7,dmg:15,pts:100},
  };
  return Object.assign({type,wx,wy,wz,shootT:60+Math.random()*80,dead:false,animT:0,vx:0},cfg[type]);
}

function startGame(){
  gs='playing';score=0;kills=0;frame=0;
  objects=[];enemies=[];projectiles=[];breathFX=[];particles=[];floaters=[];spawnedUpTo=0;
  dtype=DRAGON_TYPES[selectedType];
  camX=0;camZ=0;camH=180;
  dsx=cW/2;dsy=cH*.72;dvx=0;dvy=0;dtilt=0;dwingF=0;dwingT=0;dtailF=0;
  dhp=dtype.hp;dmaxHp=dtype.hp;dfuel=dtype.fuel;dmaxFuel=dtype.fuel;
  dinvT=0;dregenT=0;ddead=false;ddeathT=0;
  spawnChunk(500,4000);
}

function ensureSpawned(){
  const need=camZ+3000;
  if(need>spawnedUpTo)spawnChunk(spawnedUpTo,need+2000);
}

// ── 3D Projection ─────────────────────────────────────────────────────────────
function project3(wx,wy,wz){
  const dz=wz-camZ;
  if(dz<10)return null;
  const scale=FOCAL/dz;
  const sx=cW/2+(wx-camX)*scale;
  const sy=HORIZ+(camH-wy)*scale;
  return{sx,sy,scale,dz};
}

// ── Update ────────────────────────────────────────────────────────────────────
function update(){
  if(gs!=='playing')return;
  frame++;
  const dt=dtype;

  // Always move forward
  camZ+=dt.speed;

  if(!ddead){
    const lf=keys['ArrowLeft']||keys['KeyA']||mk.lf,rt=keys['ArrowRight']||keys['KeyD']||mk.rt;
    const up=keys['ArrowUp']||keys['KeyW']||mk.up,dn=keys['ArrowDown']||keys['KeyS']||mk.dn;
    const doFire=keys['Space']||keys['KeyZ']||mk.fire;

    // Screen position steering
    const hSpd=3.5,vSpd=2.5,drag=0.84;
    if(lf)dvx-=hSpd;if(rt)dvx+=hSpd;
    if(up)dvy-=vSpd;if(dn)dvy+=vSpd;
    dvx*=drag;dvy*=drag;
    dvx=Math.max(-8,Math.min(8,dvx));dvy=Math.max(-6,Math.min(6,dvy));
    dsx+=dvx;dsy+=dvy;
    dsx=Math.max(50,Math.min(cW-50,dsx));
    dsy=Math.max(cH*.45,Math.min(cH*.88,dsy));

    // Tilt based on horizontal movement
    dtilt+=(dvx*.05-dtilt)*.18;

    // Translate camera X based on dragon screen position
    camX+=(dsx-cW/2)*0.012;
    // Altitude based on vertical screen position
    camH=180+(cH*.72-dsy)*1.2;

    // Wing animation
    dwingT++;if(dwingT>5){dwingT=0;dwingF+=.5;}
    dtailF+=0.09;

    if(doFire&&dfuel>0){dfuel=Math.max(0,dfuel-2.5);if(frame%2===0)spawnBreath3();}
    else{dfuel=Math.min(dmaxFuel,dfuel+dt.regenFuel);}

    dregenT++;if(dregenT>240){dregenT=0;dhp=Math.min(dmaxHp,dhp+(dt.id==='nature'?8:3));}
    if(dinvT>0)dinvT--;
  } else {
    ddeathT++;dsy+=1.5;
    if(ddeathT>90){gs='dead';if(score>best){best=score;try{localStorage.setItem('dragonbattle_best',best);}catch(e){}}}
  }

  ensureSpawned();
  // Despawn objects way behind
  const minZ=camZ-200;
  objects=objects.filter(o=>o.wz>minZ);
  enemies=enemies.filter(e=>e.wz>minZ||!e.dead);
  projectiles=projectiles.filter(p=>p.wz-camZ<1500&&p.wz>minZ);

  updateEnemies3();updateProjectiles3();updateBreath3();
  for(const p of particles){p.sx+=p.vx;p.sy+=p.vy;p.vy+=.3;p.vx*=.9;p.life--;}
  particles=particles.filter(p=>p.life>0);
  for(const f of floaters){f.sy-=.7;f.life--;}
  floaters=floaters.filter(f=>f.life>0);
}

function spawnBreath3(){
  breathFX.push({sx:dsx,sy:dsy-20,life:18,maxLife:18,r:14,cols:dtype.breath});
}

function updateBreath3(){
  for(const f of breathFX){
    f.r+=6;f.sy-=3;f.sx+=(cW/2-f.sx)*.08;f.life--;
    // Check enemy hits — enemy must be visible ahead near crosshair area
    if(f.life>8){
      for(const e of enemies){
        if(e.dead)continue;
        const p=project3(e.wx,e.wy,e.wz);
        if(!p)continue;
        const dx=p.sx-dsx,dy=p.sy-dsy;
        if(Math.abs(dx)<120&&Math.abs(dy)<100&&p.dz<800){
          if(dtype.id==='ice')e.shootT+=30;
          hitEnemy3(e,dtype.dmg);f.life=0;
        }
      }
    }
    // Building hits
    for(const o of objects){
      if(o.dead||o.type==='tree')continue;
      const p=project3(o.wx,o.wy,o.wz);
      if(!p)continue;
      const dx=p.sx-dsx,dy=p.sy-dsy;
      if(Math.abs(dx)<140&&Math.abs(dy)<120&&p.dz<600){
        o.hp-=1.2;
        if(o.hp<=0&&!o.dead){o.dead=true;const pts=o.type==='castle'?500:150;score+=pts;kills++;screenBoom(p.sx,p.sy);floatText(p.sx,p.sy-20,'+'+pts,16,'#FFD700');}
        f.life=0;
      }
    }
  }
  breathFX=breathFX.filter(f=>f.life>0);
}

function hitEnemy3(e,dmg){
  if(e.dead)return;e.hp-=dmg;
  if(e.hp<=0){
    e.dead=true;score+=e.pts;kills++;
    const p=project3(e.wx,e.wy,e.wz);
    if(p)screenBoom(p.sx,p.sy);
    floatText(p?p.sx:cW/2,p?p.sy-20:cH/2,'+'+e.pts,13,'#ff8888');
  }
}

function updateEnemies3(){
  for(const e of enemies){
    if(e.dead)continue;e.animT++;
    // Ogres drift sideways
    if(e.type==='ogre'){e.wx+=Math.sin(e.animT*.03)*0.5;}
    e.shootT--;
    if(e.shootT<=0){
      e.shootT=e.shootInterval+Math.random()*50;
      const p=project3(e.wx,e.wy,e.wz);
      if(p&&p.dz<900){
        // Shoot toward dragon screen pos
        const aimX=(dsx-p.sx),aimY=(dsy-p.sy);
        const dist=Math.hypot(aimX,aimY)||1;
        const spd=e.projSpd;
        projectiles.push({type:e.type==='mage'?'magic':e.type==='ogre'?'rock':'arrow',
          sx:p.sx,sy:p.sy,vx:aimX/dist*spd,vy:aimY/dist*spd,dmg:e.dmg,life:120,scale:p.scale});
      }
    }
  }
}

function updateProjectiles3(){
  for(const p of projectiles){
    p.sx+=p.vx;p.sy+=p.vy;p.life--;
    if(!ddead&&dinvT===0){
      if(Math.abs(p.sx-dsx)<36&&Math.abs(p.sy-dsy)<28){
        dhp-=p.dmg;dinvT=45;p.life=0;
        screenBoom(dsx,dsy);
        if(dhp<=0&&!ddead){ddead=true;dhp=0;}
      }
    }
  }
  projectiles=projectiles.filter(p=>p.life>0);
}

function screenBoom(sx,sy){
  for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*4;particles.push({sx,sy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:20+~~(Math.random()*15),col:i<6?'#FF4400':'#FFD700'});}
}
function floatText(sx,sy,text,size,col){floaters.push({sx,sy,text,size,col,life:65});}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawWorld3D(){
  // Sky
  const skyGrad=ctx.createLinearGradient(0,0,0,HORIZ);
  skyGrad.addColorStop(0,'#080018');skyGrad.addColorStop(.7,'#160530');skyGrad.addColorStop(1,'#2a0a0a');
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,cW,HORIZ);

  // Stars
  ctx.fillStyle='rgba(255,220,180,.7)';
  [[60,10],[190,20],[340,8],[490,22],[600,5],[700,25],[120,30],[250,6],[380,18]].forEach(([x,y])=>ctx.fillRect(x%cW,y,2,2));
  // Moon
  ctx.fillStyle='#ffe0a0';ctx.beginPath();ctx.arc(cW*.85,30,18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#160530';ctx.beginPath();ctx.arc(cW*.85+8,24,13,0,Math.PI*2);ctx.fill();

  // Fog band at horizon
  const fogGrad=ctx.createLinearGradient(0,HORIZ-12,0,HORIZ+12);
  fogGrad.addColorStop(0,'rgba(26,5,50,0)');fogGrad.addColorStop(.5,'rgba(60,20,80,.7)');fogGrad.addColorStop(1,'rgba(26,5,50,0)');
  ctx.fillStyle=fogGrad;ctx.fillRect(0,HORIZ-12,cW,24);

  // Ground — scanline perspective
  for(let sy=HORIZ;sy<cH;sy+=2){
    const rowDist=FOCAL*camH/(sy-HORIZ+.5);
    // Terrain type by Z position
    const wz=camZ+rowDist;
    const tile=~~(wz/180)^~~(camX/180);
    const isAlt=tile%2===0;
    // Also vary by x scan for subtle cross-pattern (approximate)
    const brightness=1-rowDist/3000*.7;
    const r=~~(10*brightness),g=~~((isAlt?60:40)*brightness),b=~~(5*brightness);
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.fillRect(0,sy,cW,2);
  }

  // Ground grid lines converging to vanishing point
  const VP={x:cW/2,y:HORIZ};
  ctx.strokeStyle='rgba(60,140,20,.22)';ctx.lineWidth=1;
  // Vertical (lane) lines
  for(let wx2=-800;wx2<=800;wx2+=200){
    const nearScale=FOCAL/80,farScale=FOCAL/2000;
    const sx_near=VP.x+(wx2-camX)*nearScale,sx_far=VP.x+(wx2-camX)*farScale;
    ctx.beginPath();ctx.moveTo(~~VP.x+(~~(sx_far-VP.x)),~~VP.y);ctx.lineTo(~~sx_near,cH);ctx.stroke();
  }
  // Horizontal (depth) lines
  for(let dz=100;dz<2200;dz+=200){
    const scale=FOCAL/dz;const sy=HORIZ+camH*scale;
    if(sy>=cH||sy<HORIZ)continue;
    ctx.globalAlpha=.18*(1-dz/2200);ctx.beginPath();ctx.moveTo(0,~~sy);ctx.lineTo(cW,~~sy);ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawObjects3D(){
  // Collect all visible objects + enemies, sort by Z desc (far first)
  const toRender=[];
  for(const o of objects){
    if(o.dead&&o.type!=='tree')continue;
    const p=project3(o.wx,o.wy,o.wz);
    if(!p||p.dz>2200||p.sx<-200||p.sx>cW+200)continue;
    toRender.push({...o,p});
  }
  for(const e of enemies){
    if(e.dead)continue;
    const p=project3(e.wx,e.wy,e.wz);
    if(!p||p.dz>1600||p.sx<-100||p.sx>cW+100)continue;
    toRender.push({...e,p,isEnemy:true});
  }
  // Sort far → near
  toRender.sort((a,b)=>b.p.dz-a.p.dz);

  for(const o of toRender){
    const{sx,sy,scale}=o.p;
    if(o.isEnemy){
      const s=Math.max(.3,Math.min(2,scale*60));
      ctx.save();ctx.translate(~~sx,~~sy);ctx.scale(s,s);
      if(o.type==='archer')drawArcher3(o.animT,o.hp,o.maxHp);
      else if(o.type==='ogre')drawOgre3(o.animT,o.hp,o.maxHp);
      else drawMage3(o.animT,o.hp,o.maxHp);
      ctx.restore();
      continue;
    }
    if(o.type==='tree'){
      const h=~~(60*scale),r=~~(20*scale);
      if(h<2)continue;
      ctx.fillStyle='#1a3d08';ctx.fillRect(~~sx-~~(3*scale),~~sy-h,~~(6*scale),h);
      ctx.fillStyle='#2d6b10';ctx.beginPath();ctx.arc(~~sx,~~sy-h,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#3d8b18';ctx.beginPath();ctx.arc(~~sx-~~(r*.3),~~sy-h-~~(r*.3),~~(r*.7),0,Math.PI*2);ctx.fill();
    } else if(o.type==='village'){
      const w=~~(o.w*scale),h=~~(o.h*scale);
      if(w<3)continue;
      ctx.fillStyle='#5a3a1a';ctx.fillRect(~~sx-w/2,~~sy-h,w,h);
      ctx.fillStyle='#7a5a2a';ctx.fillRect(~~sx-w/2+~~(4*scale),~~sy-h+~~(4*scale),w-~~(8*scale),h);
      ctx.fillStyle='#8B1a1a';ctx.beginPath();ctx.moveTo(~~sx-w/2-~~(4*scale),~~sy-h);ctx.lineTo(~~sx,~~sy-h-~~(28*scale));ctx.lineTo(~~sx+w/2+~~(4*scale),~~sy-h);ctx.fill();
      if(h>8){ctx.fillStyle='#FFD070';ctx.fillRect(~~sx-w/2+~~(8*scale),~~sy-h+~~(16*scale),~~(12*scale),~~(10*scale));}
      if(o.hp<o.maxHp){ctx.fillStyle='#330000';ctx.fillRect(~~sx-w/2,~~sy-h-8,w,4);ctx.fillStyle='#ff4444';ctx.fillRect(~~sx-w/2,~~sy-h-8,~~(w*o.hp/o.maxHp),4);}
    } else if(o.type==='castle'){
      const w=~~(o.w*scale),h=~~(o.h*scale);
      if(w<3)continue;
      ctx.fillStyle='#2a2040';ctx.fillRect(~~sx-w/2,~~sy-h,w,h);
      ctx.fillStyle='#3a2f5a';ctx.fillRect(~~sx-w/2+~~(6*scale),~~sy-h+~~(6*scale),w-~~(12*scale),h);
      const tw=~~(28*scale),th=~~((o.h+20)*scale);
      ctx.fillStyle='#2a2040';ctx.fillRect(~~sx-w/2-~~(14*scale),~~sy-th,tw,th);ctx.fillRect(~~sx+w/2-~~(14*scale),~~sy-th,tw,th);
      if(h>10){ctx.fillStyle='#0a0010';ctx.fillRect(~~sx-~~(10*scale),~~sy-~~(40*scale),~~(20*scale),~~(40*scale));}
      if(o.hp<o.maxHp){ctx.fillStyle='#220033';ctx.fillRect(~~sx-w/2,~~sy-h-8,w,4);ctx.fillStyle='#aa00ff';ctx.fillRect(~~sx-w/2,~~sy-h-8,~~(w*o.hp/o.maxHp),4);}
    }
  }
}

  ctx.fillStyle='#1a0a05';ctx.fillRect(-7,-48,4,6);ctx.fillRect(3,-48,4,6);

  ctx.fillStyle='#cc8844';ctx.fillRect(-5,-38+bob,10,12);

  ctx.fillStyle='#ff88ff';ctx.fillRect(-7,-45+bob,14,2);
  ctx.fillStyle='#ff44ff';ctx.fillRect(-3,-34+bob,3,3);ctx.fillRect(1,-34+bob,3,3);

}

// ── Pixel art dragon sprite (screen-space) ────────────────────────────────────
const PS=4;
const WING_FRAMES=[
  [[1,8],[2,8],[3,8],[4,8],[1,9],[2,9],[3,9],[1,10],[2,10],[1,11]],
  [[1,6],[2,6],[3,6],[4,6],[1,7],[2,7],[3,7],[1,8],[2,8]],
  [[0,4],[1,4],[2,4],[3,4],[4,5],[1,5],[2,5],[3,5],[1,6]],
  [[-1,2],[0,2],[1,2],[2,2],[3,3],[1,3],[2,3],[0,3],[-1,3],[-1,4]],
];
const BODY_MAP=[
  '..........HhHHhH....','.........HhBBBBhh...',
  '........HBBBBBBhN....','.......HBBeeEEBBN...',
  '......BBBBBBBBBNN...','.....BBBBBBBBBBN...',
  '....BBBvvvvvvBBN....','...BBBBvvvvvvBBB....',
  '....BBBvvvvvBBB.....','.....BBBBBBBBB......',
  '......BBB...BB......','......BBB...BB......',
  '.....BBBB..BBBB.....',
];
function drawDragonSprite(){
  if(!dtype)return;
  const dt=dtype;
  const sx=~~dsx,sy=~~dsy;
  // Apply banking tilt
  ctx.save();
  ctx.translate(sx,sy);ctx.rotate(dtilt*.4);ctx.translate(-sx,-sy);

  const ox=sx-10*PS,oy=sy-5*PS;
  function px(gx,gy,col){
    if(!col)return;
    ctx.fillStyle=col;ctx.fillRect(~~(ox+gx*PS),~~(oy+gy*PS),PS,PS);
  }
  // Tail
  for(let i=0;i<7;i++){
    const tgx=1-i,tgy=6+~~(Math.sin(dtailF+i*.65)*1.8);
    px(tgx,tgy,i<2?dt.body:i<5?dt.bodyD:'#111');
    px(tgx,tgy+1,i<3?dt.bodyD:'#0a0a0a');
  }
  // Wings
  const wf=~~(dwingF)%4;
  for(const[gx,gy] of WING_FRAMES[wf])px(gx,gy,dt.wingD);
  if(WING_FRAMES[wf].length>2){const[gx,gy]=WING_FRAMES[wf][1];px(gx,gy,dt.wingL);}
  // Body
  for(let gy=0;gy<BODY_MAP.length;gy++){
    const row=BODY_MAP[gy];
    for(let gx=0;gx<row.length;gx++){
      const ch=row[gx];if(ch==='.')continue;
      const col=ch==='B'?dt.body:ch==='N'?dt.bodyL:ch==='v'?dt.belly:ch==='H'?dt.bodyD:ch==='h'?dt.horn:ch==='E'?dt.eye:ch==='e'?dt.bodyL:null;
      if(col)px(gx,gy,col);
    }
  }
  px(15,3,'#000');
  ctx.globalAlpha=.3;ctx.fillStyle=dt.eye;
  ctx.beginPath();ctx.arc(~~(ox+14*PS+PS/2),~~(oy+3*PS+PS/2),PS*2.5,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawBreathFX(){
  for(const f of breathFX){
    const t=f.life/f.maxLife;
    const ci=t>.6?0:t>.3?1:2;
    // Beam toward horizon
    ctx.globalAlpha=t*.7;
    const grd=ctx.createRadialGradient(~~dsx,~~dsy-20,0,~~dsx,~~dsy-20,f.r*3);
    grd.addColorStop(0,f.cols[0]);grd.addColorStop(.5,f.cols[1]);grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd;
    // Fan shape toward vanishing point
    ctx.beginPath();
    ctx.moveTo(~~dsx,~~dsy-20);
    ctx.lineTo(~~dsx-f.r*2,~~HORIZ+10);
    ctx.lineTo(~~dsx+f.r*2,~~HORIZ+10);
    ctx.closePath();ctx.fill();
    // Core glow
    ctx.globalAlpha=t*.9;ctx.fillStyle=f.cols[ci];
    const pr=~~(f.r/PS)*PS;ctx.fillRect(~~dsx-pr/2,~~dsy-20-pr/2,pr,pr);
  }
  ctx.globalAlpha=1;
}

function drawProjectiles3(){
  for(const p of projectiles){
    if(p.type==='arrow'){
      ctx.save();ctx.translate(~~p.sx,~~p.sy);ctx.rotate(Math.atan2(p.vy,p.vx));
      ctx.fillStyle='#cc8844';ctx.fillRect(-8,-1,16,2);ctx.fillStyle='#aaa';ctx.fillRect(6,-2,5,4);
      ctx.restore();
    } else if(p.type==='rock'){
      ctx.fillStyle='#886644';ctx.fillRect(~~p.sx-5,~~p.sy-5,10,10);ctx.fillStyle='#aa8866';ctx.fillRect(~~p.sx-3,~~p.sy-3,4,4);
    } else {
      ctx.fillStyle='#ff44ff';ctx.beginPath();ctx.arc(~~p.sx,~~p.sy,8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(~~p.sx,~~p.sy,4,0,Math.PI*2);ctx.fill();
    }
  }
}

function drawScreenFX(){
  for(const p of particles){ctx.globalAlpha=p.life/30;ctx.fillStyle=p.col;ctx.fillRect(~~p.sx-3,~~p.sy-3,6,6);}
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of floaters){
    ctx.globalAlpha=Math.min(1,f.life/20);ctx.font=`bold ${f.size}px "Press Start 2P",monospace`;
    ctx.fillStyle=f.col;ctx.fillText(f.text,~~f.sx,~~f.sy);
  }
  ctx.globalAlpha=1;
}

// Crosshair / aim reticle
function drawCrosshair(){
  const dt=dtype;const cx=~~(cW/2),cy=~~HORIZ+~~(camH*.3);
  ctx.strokeStyle=dt.eye+'88';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx-16,cy);ctx.lineTo(cx-6,cy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+6,cy);ctx.lineTo(cx+16,cy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy-16);ctx.lineTo(cx,cy-6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy+6);ctx.lineTo(cx,cy+16);ctx.stroke();
  // Fire range circle
  if(dfuel>5){ctx.globalAlpha=.3;ctx.beginPath();ctx.arc(cx,cy,120,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
}

function drawHUD(){
  const dt=dtype;
  ctx.fillStyle=dt.bodyD+'cc';ctx.fillRect(8,8,88,16);
  ctx.fillStyle=dt.eye;ctx.font='5px "Press Start 2P",monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(dt.emoji+' '+dt.name,12,16);
  ctx.fillStyle='#330000';ctx.fillRect(8,28,160,10);
  ctx.fillStyle='#ff3333';ctx.fillRect(8,28,~~(160*Math.max(0,dhp)/dmaxHp),10);
  ctx.fillStyle='#ff8888';ctx.fillText('HP',12,33);
  ctx.fillStyle='#1a0d00';ctx.fillRect(8,42,160,8);
  ctx.fillStyle=dt.breath[0];ctx.fillRect(8,42,~~(160*dfuel/dmaxFuel),8);
  ctx.textAlign='right';ctx.textBaseline='top';
  ctx.font='bold 10px "Press Start 2P",monospace';
  ctx.fillStyle='#FFD700';ctx.fillText('SCORE '+score,cW-8,8);
  ctx.fillStyle='#888';ctx.fillText('BEST '+best,cW-8,24);
  ctx.fillStyle='#ff8888';ctx.fillText('KILLS '+kills,cW-8,40);
  // Distance
  ctx.fillStyle='#555';ctx.font='5px "Press Start 2P",monospace';
  ctx.fillText('DIST '+~~(camZ/100)+'km',cW-8,58);
}

// ── Select screen ─────────────────────────────────────────────────────────────
let previewAnim=0;
function drawSelectScreen(){
  const sg=ctx.createLinearGradient(0,0,0,cH);sg.addColorStop(0,'#080018');sg.addColorStop(1,'#200030');
  ctx.fillStyle=sg;ctx.fillRect(0,0,cW,cH);
  ctx.fillStyle='rgba(255,220,180,.7)';
  [[60,25],[190,50],[340,18],[490,42],[600,12],[700,55],[120,70],[250,15],[380,60]].forEach(([x,y])=>ctx.fillRect(x,y,2,2));
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 18px "Press Start 2P",monospace';
  ctx.fillStyle='#ff4444';ctx.shadowColor='#ff0000';ctx.shadowBlur=18;
  ctx.fillText('DRAGON BATTLE',cW/2,30);ctx.shadowBlur=0;
  ctx.font='6px "Press Start 2P",monospace';ctx.fillStyle='#aaa';ctx.fillText('CHOOSE YOUR DRAGON',cW/2,55);
  previewAnim++;
  const count=DRAGON_TYPES.length,slotW=Math.min(96,(cW-20)/count);
  const sx0=cW/2-slotW*count/2+slotW/2,cardH=100,cy0=cH/2+10;
  for(let i=0;i<count;i++){
    const dt=DRAGON_TYPES[i],sel=i===selectedType;
    const cx=sx0+i*slotW,cy=cy0+(sel?-14:0);
    const cw2=slotW-6,ch2=cardH+(sel?6:0);
    ctx.globalAlpha=sel?1:.65;
    ctx.fillStyle=sel?dt.bodyD+'ee':'#111122';
    rRect(cx-cw2/2,cy-ch2/2,cw2,ch2,6);
    ctx.strokeStyle=sel?dt.eye:'#333355';ctx.lineWidth=sel?3:1.5;
    ctx.beginPath();rRectPath(cx-cw2/2,cy-ch2/2,cw2,ch2,6);ctx.stroke();
    ctx.save();ctx.translate(~~cx,~~(cy-14));drawMiniDragon(dt,sel?3:2,sel?previewAnim:i*17);ctx.restore();
    ctx.globalAlpha=1;
    ctx.font=`${sel?6:5}px "Press Start 2P",monospace`;ctx.fillStyle=sel?dt.eye:'#aaa';ctx.textAlign='center';
    ctx.fillText(dt.name,~~cx,~~(cy+28));
    ctx.font='4px "Press Start 2P",monospace';ctx.fillStyle=sel?'#ccc':'#666';ctx.fillText(dt.desc,~~cx,~~(cy+40));
    if(sel){
      const bx=cx-26,by=cy+50;ctx.fillStyle='#aaa';ctx.textAlign='left';ctx.font='4px "Press Start 2P",monospace';
      ctx.fillText('SPD',~~bx,~~by);ctx.fillText('HP',~~bx,~~(by+10));
      ctx.fillStyle=dt.eye;ctx.fillRect(~~(bx+18),~~(by-3),~~(dt.speed/6*38),4);
      ctx.fillStyle='#ff4444';ctx.fillRect(~~(bx+18),~~(by+7),~~(dt.hp/220*38),4);
      ctx.textAlign='center';ctx.fillStyle=dt.eye;ctx.font='7px "Press Start 2P",monospace';
      ctx.fillText('▼',~~cx,~~(cy+ch2/2+10));
    }
  }
  ctx.globalAlpha=1;
  ctx.font='5px "Press Start 2P",monospace';ctx.fillStyle='#FFD700';ctx.textAlign='center';
  ctx.fillText('◀ ▶ TO CHOOSE  ·  SPACE / TAP TO START',cW/2,cH-20);
  if(best>0){ctx.fillStyle='#ff8888';ctx.fillText('BEST: '+best,cW/2,cH-8);}
}
function drawMiniDragon(dt,ps,anim){
  const wf=~~(anim/8)%4;
  for(const[gx,gy] of WING_FRAMES[wf]){ctx.fillStyle=dt.wingD;ctx.fillRect(~~((gx-10)*ps),~~((gy-5)*ps),ps,ps);}
  if(WING_FRAMES[wf].length>1){const[gx,gy]=WING_FRAMES[wf][1];ctx.fillStyle=dt.wingL;ctx.fillRect(~~((gx-10)*ps),~~((gy-5)*ps),ps,ps);}
  [[9,0,2,dt.bodyD],[8,1,4,dt.body],[7,2,6,dt.body],[6,3,8,dt.body],[5,4,10,dt.body],[4,5,10,dt.body],[4,6,10,dt.bodyL],[5,7,8,dt.body],[6,8,6,dt.body],[7,9,4,dt.body],[6,10,3,dt.body],[10,10,3,dt.body],[6,11,3,dt.body],[10,11,3,dt.body],[5,12,4,dt.body],[9,12,4,dt.body]].forEach(([gx,gy,gw,c])=>{ctx.fillStyle=c;ctx.fillRect(~~((gx-10)*ps),~~((gy-5)*ps),~~(gw*ps),ps);});
  ctx.globalAlpha=.8;ctx.fillStyle=dt.eye;ctx.beginPath();ctx.arc(~~(4*ps),~~(-2*ps),ps*1.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  for(let i=0;i<5;i++){const tx=(-1-i)*ps,tyy=(-1+~~(Math.sin(anim*.1+i*.7)*1.5))*ps;ctx.fillStyle=i<2?dt.body:dt.bodyD;ctx.fillRect(~~tx,~~tyy,ps,ps);}
}
function rRect(x,y,w,h,r){ctx.beginPath();rRectPath(x,y,w,h,r);ctx.fill();}
function rRectPath(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

function drawDeadScreen(){
  ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(0,0,cW,cH);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 14px "Press Start 2P",monospace';ctx.fillStyle='#ff4444';ctx.fillText('YOUR DRAGON FELL!',cW/2,cH/2-50);
  ctx.font='9px "Press Start 2P",monospace';ctx.fillStyle='#FFD700';
  ctx.fillText('SCORE: '+score,cW/2,cH/2-20);ctx.fillText('KILLS: '+kills,cW/2,cH/2+4);
  ctx.fillStyle='#888';ctx.fillText('DISTANCE: '+~~(camZ/100)+'km',cW/2,cH/2+22);
  if(score>=best&&score>0){ctx.fillStyle='#4ade80';ctx.fillText('NEW BEST!',cW/2,cH/2+42);}
  ctx.fillStyle='#ff8888';ctx.font='6px "Press Start 2P",monospace';ctx.fillText('PRESS SPACE / TAP TO CONTINUE',cW/2,cH/2+66);
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);update();ctx.clearRect(0,0,cW,cH);
  if(gs==='select'){drawSelectScreen();return;}
  drawWorld3D();
  drawObjects3D();
  drawBreathFX();
  drawProjectiles3();
  drawScreenFX();
  if(!ddead||ddeathT<80){
    if(dinvT===0||~~(dinvT/4)%2===0)drawDragonSprite();
  }
  drawCrosshair();
  drawHUD();
  if(gs==='dead')drawDeadScreen();
}

if(isMobile())initMobile();
requestAnimationFrame(loop);
</script>
