<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Magic Duel 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Georgia',serif;}
canvas{display:block;}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;}
/* Select Screen */
#select{position:absolute;inset:0;background:rgba(3,0,15,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:all;}
#select h1{font-size:50px;color:#cc88ff;text-shadow:0 0 30px #8844ff,0 0 60px #4400aa;margin-bottom:4px;letter-spacing:3px;}
#select .sub{color:#8866aa;font-size:13px;margin-bottom:26px;}
#char-row{display:flex;gap:16px;margin-bottom:26px;flex-wrap:wrap;justify-content:center;}
.cc{width:140px;padding:14px 8px;border:2px solid #442266;border-radius:10px;text-align:center;cursor:pointer;background:rgba(50,0,90,0.3);transition:all .2s;color:#fff;}
.cc:hover,.cc.sel{border-color:#aa66ff;background:rgba(90,0,160,0.5);box-shadow:0 0 18px #8844ff;}
.cc canvas{display:block;margin:0 auto 7px;}
.cc .cn{font-size:15px;font-weight:bold;margin-bottom:3px;}
.cc .ct{font-size:11px;opacity:.7;margin-bottom:5px;}
.cc .cd{font-size:10px;color:#cc99ff;line-height:1.3;}
#fight-btn{padding:13px 46px;font-size:21px;background:linear-gradient(135deg,#4400aa,#8800cc);color:#fff;border:2px solid #aa66ff;border-radius:8px;cursor:pointer;font-family:Georgia,serif;letter-spacing:2px;display:none;}
#fight-btn:hover{background:linear-gradient(135deg,#6600cc,#aa00ff);}
#ctrl{color:#554477;font-size:11px;margin-top:14px;}
/* HUD */
#hud{position:absolute;top:0;left:0;width:100%;padding:10px 18px;display:none;}
#banner{position:absolute;top:35%;left:50%;transform:translateX(-50%);font-size:46px;color:#fff;text-shadow:0 0 28px #cc88ff;opacity:0;transition:opacity .3s;white-space:nowrap;text-align:center;pointer-events:none;}
#result{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;pointer-events:all;}
#result h2{font-size:50px;text-shadow:0 0 28px #cc88ff;margin-bottom:14px;}
#result button{padding:11px 38px;font-size:17px;background:linear-gradient(135deg,#4400aa,#8800cc);color:#fff;border:2px solid #aa66ff;border-radius:8px;cursor:pointer;font-family:Georgia,serif;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">

  <div id="hud">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div style="width:42%">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px;">

          <span id="p1hn" style="color:#ff4444;font-size:12px"></span>

        </div>
        <div id="p1w" style="color:#ffdd44;font-size:11px;margin-top:2px;"></div>
      </div>
      <div style="text-align:center;min-width:76px;">
        <div id="rnum" style="color:#cc88ff;font-size:16px;font-weight:bold;text-shadow:0 0 10px #8844ff;"></div>
        <div id="tmr" style="color:#ffcc44;font-size:26px;font-weight:bold;text-shadow:0 0 12px #ffaa00;"></div>

        <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
          <span id="p2hn" style="color:#ff4444;font-size:12px"></span>
          <span id="p2n" style="color:#fff;font-size:13px;text-shadow:0 0 8px #cc88ff"></span>
        </div>
        <div style="height:13px;background:#1a001a;border:1px solid #664466;border-radius:6px;overflow:hidden;">
          <div id="p2h" style="height:100%;background:linear-gradient(90deg,#ff4444,#cc0000);border-radius:6px;transition:width .08s;width:100%;transform-origin:right"></div>
        </div>
        <div style="height:7px;background:#001a1a;border:1px solid #446666;border-radius:4px;overflow:hidden;margin-top:3px;direction:rtl;">
          <div id="p2m" style="height:100%;background:linear-gradient(90deg,#4488ff,#0044cc);border-radius:4px;transition:width .08s;width:100%"></div>
        </div>
        <div id="p2w" style="color:#ffdd44;font-size:11px;margin-top:2px;text-align:right;"></div>
      </div>
    </div>
  </div>
  <div id="banner"></div>
  <div id="result">
    <h2 id="rtxt"></h2>
    <p id="rsub" style="color:#cc99ff;margin-bottom:22px;font-size:17px;"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
// ===== THREE.JS SETUP =====
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x040010);
scene.fog=new THREE.FogExp2(0x040010,0.025);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,80);
camera.position.set(0,6,18);
camera.lookAt(0,2.5,0);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
resize();window.addEventListener('resize',resize);

// ===== HELPERS =====
function addBox(parent,w,h,d,color,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));
  m.position.set(x,y,z);m.castShadow=true;
  if(parent)parent.add(m);else scene.add(m);
  return m;
}
function addSphere(parent,r,color,x,y,z){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,8,6),new THREE.MeshBasicMaterial({color}));
  m.position.set(x,y,z);if(parent)parent.add(m);else scene.add(m);return m;
}

// ===== CHARACTERS =====
const CHARS=[

   desc:'Fast fireballs\nBurns defenses'},
  {id:'cryo', name:'Cryomancer',   type:'❄ Ice',      rC:0x002244,hC:0x001122,eC:0x44aaff,pc:'#44aaff',pg:'#88ccff',

  {id:'necro',name:'Necromancer',  type:'💀 Shadow',  rC:0x1a0033,hC:0x0a0022,eC:0xaa44ff,pc:'#aa44ff',pg:'#cc88ff',
   spells:{q:{n:'Soul Bolt',  c3:0xaa44ff,c:'#aa44ff',sz:0.17,sp:7, dm:14,mn:10,sh:'orb',drn:true},
           h:{n:'Death Ray',  c3:0x8800ff,c:'#8800ff',sz:0.22,sp:5, dm:25,mn:22,sh:'orb',drn:true},
           u:{n:'Soul Vortex',c3:0xff00ff,c:'#ff00ff',sz:0.18,sp:7, dm:20,mn:50,sh:'wave',cnt:3,drn:true}},

// ===== 2D PREVIEW =====
function drawPrev(ctx,ch,x,y){
  ctx.shadowBlur=10;ctx.shadowColor=ch.pg;
  ctx.fillStyle=ch.pc;ctx.beginPath();ctx.arc(x,y-50,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=ch.pc;ctx.beginPath();ctx.arc(x,y-50,6,0,Math.PI*2);ctx.fill();
  // robe
  ctx.fillStyle=ch.pc.replace('ff','44');
  ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x+12,y);ctx.lineTo(x+9,y-30);ctx.lineTo(x-9,y-30);ctx.closePath();ctx.fill();
  // head
  ctx.fillStyle='#e8c59a';ctx.beginPath();ctx.arc(x,y-36,9,0,Math.PI*2);ctx.fill();
  // hat
  ctx.fillStyle=ch.hC?'#'+ch.hC.toString(16).padStart(6,'0'):'#111';
  ctx.fillRect(x-12,y-44,24,4);
  ctx.beginPath();ctx.moveTo(x-9,y-44);ctx.lineTo(x,y-62);ctx.lineTo(x+9,y-44);ctx.closePath();ctx.fill();
  // eyes
  ctx.fillStyle=ch.pc;ctx.shadowBlur=4;
  ctx.fillRect(x-5,y-38,3,2);ctx.fillRect(x+2,y-38,3,2);
  ctx.shadowBlur=0;
}

// ===== CHARACTER SELECT CARDS =====
let selChar=null;
const row=document.getElementById('char-row');
CHARS.forEach((ch,i)=>{
  const card=document.createElement('div');card.className='cc';
  const cv=document.createElement('canvas');cv.width=80;cv.height=80;
  drawPrev(cv.getContext('2d'),ch,40,72);
  card.appendChild(cv);
  card.innerHTML+=`<div class="cn">${ch.name}</div><div class="ct">${ch.type}</div><div class="cd">${ch.desc.replace('\n','<br>')}</div>`;
  card.onclick=()=>{document.querySelectorAll('.cc').forEach(c=>c.classList.remove('sel'));card.classList.add('sel');selChar=ch;document.getElementById('fight-btn').style.display='block';};
  row.appendChild(card);
});

// ===== ARENA =====
let torchLights=[];
function buildArena(){
  // Floor
  const floorM=new THREE.Mesh(new THREE.PlaneGeometry(18,12),new THREE.MeshLambertMaterial({color:0x1a0a30}));
  floorM.rotation.x=-Math.PI/2;floorM.receiveShadow=true;scene.add(floorM);
  // Stone tiles
  for(let tx=-4;tx<=4;tx++)for(let tz=-2;tz<=2;tz++){
    const tile=new THREE.Mesh(new THREE.PlaneGeometry(1.9,1.9),new THREE.MeshLambertMaterial({color:(tx+tz)%2===0?0x1a0a30:0x150828}));
    tile.rotation.x=-Math.PI/2;tile.position.set(tx*2,0.01,tz*2);scene.add(tile);
  }
  // Rune circles
  for(let r of[1.8,2.8,3.8]){
    const rune=new THREE.Mesh(new THREE.RingGeometry(r,r+0.06,48),new THREE.MeshBasicMaterial({color:0x6622aa,side:THREE.DoubleSide}));
    rune.rotation.x=-Math.PI/2;rune.position.y=0.02;scene.add(rune);
  }
  // Pillars & torches
  for(let px of[-7,7])for(let pz of[-2,2]){
    const pil=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.45,7,8),new THREE.MeshLambertMaterial({color:0x1a1030}));
    pil.position.set(px,3.5,pz);pil.castShadow=true;scene.add(pil);
    addBox(null,0.9,0.4,0.9,0x221840,px,0.2,pz);
    addBox(null,0.8,0.4,0.8,0x221840,px,7.0,pz);
    // Torch
    const torchPole=addBox(null,0.1,0.5,0.1,0x5c3d1e,px+(px>0?-0.5:0.5),5.5,pz);
    const flame=new THREE.Mesh(new THREE.SphereGeometry(0.18,6,4),new THREE.MeshBasicMaterial({color:0xff6600}));
    flame.position.set(px+(px>0?-0.5:0.5),5.85,pz);scene.add(flame);
    const tl=new THREE.PointLight(0xff8800,2.5,8);tl.position.set(px+(px>0?-0.5:0.5),5.9,pz);scene.add(tl);
    torchLights.push({light:tl,flame,base:2.5,t:Math.random()*6.28});
  }
  // Back wall
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(20,10),new THREE.MeshLambertMaterial({color:0x0a0520}));
  wall.position.set(0,5,-4);scene.add(wall);
  // Stone wall details
  for(let bx=-9;bx<=9;bx+=2)for(let by=0;by<=8;by+=1.2){
    if(Math.random()<0.3){
      const stone=addBox(null,1.8,1.0,0.1,by%2===0?0x0f0825:0x0c061e,bx+(by%2===0?0:1),by,-3.95);
    }
  }
  // Banners
  const bannerColors=[0x8800cc,0x003388,0xaa2200,0x006622,0x226600];
  for(let bx=-4;bx<=4;bx+=2){
    const bn=new THREE.Mesh(new THREE.PlaneGeometry(0.9,2.2),new THREE.MeshBasicMaterial({color:bannerColors[Math.floor((bx+4)/2)],side:THREE.DoubleSide}));
    bn.position.set(bx,5.5,-3.9);scene.add(bn);
  }
  // Sky stars (points)
  const starGeo=new THREE.BufferGeometry();
  const sp=[];for(let i=0;i<300;i++){sp.push((Math.random()-0.5)*60,(Math.random())*20+5,(Math.random()-0.5)*60-10);}
  starGeo.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:0.08})));
  // Lights
  scene.add(new THREE.AmbientLight(0x1a0a30,0.9));
  const moon=new THREE.DirectionalLight(0x4433aa,0.6);moon.position.set(2,10,6);moon.castShadow=true;scene.add(moon);
  const arena=new THREE.PointLight(0x6633aa,1.2,20);arena.position.set(0,8,0);scene.add(arena);
}

// ===== MAGE MESH =====
function buildMage(ch){
  const g=new THREE.Group();
  const rM=()=>new THREE.MeshLambertMaterial({color:ch.rC});
  const hM=()=>new THREE.MeshLambertMaterial({color:ch.hC});
  const sM=new THREE.MeshLambertMaterial({color:0xe8c59a});
  // Legs
  const lR=addBox(g,0.28,0.65,0.28,ch.rC,0.18,0.33,0); lR.name='lR';
  const lL=addBox(g,0.28,0.65,0.28,ch.rC,-0.18,0.33,0);lL.name='lL';
  // Torso/robe
  const torso=addBox(g,0.9,1.1,0.48,ch.rC,0,1.25,0);
  // Robe flare at bottom
  addBox(g,1.0,0.3,0.55,ch.rC,0,0.72,0);
  // Arms
  const aR=addBox(g,0.22,0.75,0.22,ch.rC,0.58,1.4,0); aR.name='aR';
  const aL=addBox(g,0.22,0.75,0.22,ch.rC,-0.58,1.4,0);aL.name='aL';
  // Head
  const head=addBox(g,0.62,0.62,0.62,0xe8c59a,0,2.2,0);
  // Eyes (emissive glow)
  const eyeM=new THREE.MeshBasicMaterial({color:ch.eC});
  const eR=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.09,0.08),eyeM);eR.position.set(0.17,2.26,0.32);g.add(eR);
  const eL=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.09,0.08),eyeM.clone());eL.position.set(-0.17,2.26,0.32);g.add(eL);
  // Hat brim
  addBox(g,0.95,0.09,0.95,ch.hC,0,2.6,0);
  // Hat cone
  const hatCone=new THREE.Mesh(new THREE.ConeGeometry(0.38,1.0,8),new THREE.MeshLambertMaterial({color:ch.hC}));
  hatCone.position.set(0,3.2,0);g.add(hatCone);
  // Hat band
  const bandM=new THREE.MeshBasicMaterial({color:ch.eC,transparent:true,opacity:0.6});
  const band=new THREE.Mesh(new THREE.CylinderGeometry(0.39,0.39,0.1,8),bandM);band.position.set(0,2.65,0);g.add(band);
  // Wand
  const wand=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.85,6),new THREE.MeshLambertMaterial({color:0x8b5e2a}));
  wand.position.set(0.58,1.05,0);wand.rotation.z=-0.25;wand.name='wand';g.add(wand);
  // Wand tip glow
  const tipGeo=new THREE.SphereGeometry(0.08,6,4);
  const tipMat=new THREE.MeshBasicMaterial({color:ch.eC});
  const tip=new THREE.Mesh(tipGeo,tipMat);tip.position.set(0.9,0.75,0);g.add(tip);
  const tipLight=new THREE.PointLight(ch.eC,1.5,2.5);tipLight.position.copy(tip.position);tipLight.name='tipL';g.add(tipLight);
  // Drako special: dragon scale pattern on robe
  if(ch.id==='drako'){
    for(let dy=0;dy<3;dy++)for(let dx=-1;dx<=1;dx++){
      const sc=new THREE.Mesh(new THREE.PlaneGeometry(0.2,0.14),new THREE.MeshBasicMaterial({color:0x44ff00,transparent:true,opacity:0.3,side:THREE.DoubleSide}));
      sc.position.set(dx*0.25,1.0+dy*0.28,0.25);g.add(sc);
    }
  }
  g.userData.ch=ch;
  return g;
}

// ===== MINI DRAGON (Drakomancer summon) =====
function buildMiniDragon(col){
  const g=new THREE.Group();
  const dM=new THREE.MeshLambertMaterial({color:col});
  const dkM=new THREE.MeshLambertMaterial({color:0x1a3300});
  // Body
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.65,0.65),dM);g.add(body);
  // Neck
  const neck=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.5),dM);neck.position.set(0.9,0.2,0);g.add(neck);
  // Head
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.5,0.5),dM);head.position.set(1.35,0.3,0);g.add(head);
  // Snout
  const snout=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,0.4),dM);snout.position.set(1.7,0.18,0);g.add(snout);
  // Eyes
  const eyeM=new THREE.MeshBasicMaterial({color:0xff4400});
  [0.14,-0.14].forEach(ez=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.07,4,4),eyeM);e.position.set(1.55,0.38,ez);g.add(e);});
  // Horns
  for(let i=0;i<2;i++){const h=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.35,4),dkM);h.position.set(1.2,0.6,(i===0?0.15:-0.15));h.rotation.z=-0.4;g.add(h);}
  // Tail
  const tail=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.3,0.3),dM);tail.position.set(-1.0,-0.1,0);g.add(tail);
  const tailTip=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.5,4),dM);tailTip.rotation.z=1.57;tailTip.position.set(-1.9,-0.15,0);g.add(tailTip);
  // Wings
  const wGeo=new THREE.PlaneGeometry(1.4,0.9);
  const wMat=new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide,transparent:true,opacity:0.85});
  const wR=new THREE.Mesh(wGeo,wMat);wR.position.set(-0.1,0.3,0.55);wR.rotation.x=0.4;wR.name='wR';g.add(wR);
  const wL=new THREE.Mesh(wGeo,wMat.clone());wL.position.set(-0.1,0.3,-0.55);wL.rotation.x=-0.4;wL.name='wL';g.add(wL);
  // Legs
  for(let lx of[0.3,-0.5])for(let lz of[0.3,-0.3]){
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.4,0.22),dM);leg.position.set(lx,-0.52,lz);g.add(leg);
  }
  // Glow
  const dLight=new THREE.PointLight(0x44ff00,2,3);dLight.position.set(1.0,0.3,0);g.add(dLight);
  return g;
}

// ===== GAME STATE =====
let gs='select',p1,p2,spellMeshes=[],particles3d=[],summoned=[],torchT=0;
let roundNum=1,p1Wins=0,p2Wins=0,roundTimer=60,roundActive=false;
let p1Mesh,p2Mesh,shakeT=0,shakeAmt=0;
let keys={},aiState={action:'approach',timer:0,cooldown:0};
let lastTime=0;
const GROUND=0,MAX_HP=120,MAX_MP=100,ARENA_X=6.5;

function makePlayer(isAI,ch,sx){
  return{x:sx,y:GROUND,vx:0,vy:0,hp:MAX_HP,mp:MAX_MP,maxHp:MAX_HP,maxMp:MAX_MP,
    facing:isAI?-1:1,isAI,ch,
    state:'idle',stateT:0,frozenT:0,animT:0,onGround:true};
}

// ===== SPELLS =====
function fireSpell(owner,type){
  const sp=owner.ch.spells[type];
  if(!sp||owner.mp<sp.mn)return;
  owner.mp-=sp.mn;owner.state='attack';owner.stateT=0.3;updateBars();
  const dir=owner.facing;
  const mesh=owner===p1?p1Mesh:p2Mesh;
  const ox=owner.x+dir*0.9,oy=1.4,oz=0;
  if(sp.sh==='summon'){spawnDrake(owner);return;}
  if(sp.sh==='nova'){
    for(let a=0;a<8;a++){const ang=a/8*Math.PI*2;createSpellMesh(ox,oy,oz,Math.cos(ang)*sp.sp*0.7,Math.sin(ang)*sp.sp*0.3,sp,owner);}
    shakeT=0.3;shakeAmt=4;return;
  }
  if(sp.sh==='wave'||sp.sh==='storm'||sp.sh==='inferno'){
    const cnt=sp.cnt||3;
    for(let i=0;i<cnt;i++){
      setTimeout(()=>{if(gs!=='fight')return;
        const spread=(i-cnt/2)*0.3;
        createSpellMesh(ox,oy,oz,dir*sp.sp+Math.sin(spread),Math.sin(spread)*0.5,sp,owner);
      },i*120);
    }
    return;
  }
  createSpellMesh(ox,oy,oz,dir*sp.sp,0,sp,owner);
}

function createSpellMesh(x,y,z,vx,vy,sp,owner){
  const geo=sp.sh==='shard'||sp.sh==='bolt'?new THREE.BoxGeometry(sp.sz*3,sp.sz*0.6,sp.sz*0.6):new THREE.SphereGeometry(sp.sz,8,6);
  const mat=new THREE.MeshBasicMaterial({color:sp.c3});
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);scene.add(m);
  const l=new THREE.PointLight(sp.c3,2,2.5);m.add(l);
  spellMeshes.push({mesh:m,vx,vy,vz:0,sp,owner,life:1.2});
}

function spawnDrake(owner){
  const dir=owner.facing;
  const dCol=0x226600;
  const dm=buildMiniDragon(dCol);
  const startX=dir>0?-9:9;
  dm.position.set(startX,2.5,0);
  if(dir<0)dm.rotation.y=Math.PI;
  scene.add(dm);
  summoned.push({mesh:dm,x:startX,y:2.5,vx:dir*10,life:2.2,owner,dir,hit:false,wingT:0});
  shakeT=0.5;shakeAmt=5;
  showBanner('🐉 DRAKE SUMMONED!','');
}

// ===== HIT =====
function hitPlayer(target,sp,px,py){
  if(target.state==='dead')return;
  let dmg=sp.dm;
  if(target.state==='block')dmg=Math.max(2,~~(dmg*0.12));
  target.hp=Math.max(0,target.hp-dmg);
  if(sp.drn){const src=target===p2?p1:p2;src.hp=Math.min(src.maxHp,src.hp+~~(dmg*0.3));}
  if(sp.frz&&target.state!=='block'){target.frozenT=1.8;target.state='frozen';}
  if(dmg>5&&target.state!=='frozen'){target.state='hurt';target.stateT=0.18;}
  spawnHit3D(px,py,sp.c3,dmg);
  shakeT=dmg>20?0.3:0.15;shakeAmt=dmg>20?6:3;
  if(target.hp<=0){target.state='dead';checkRoundEnd();}
  updateBars();
}

function spawnHit3D(x,y,c,dmg){
  for(let i=0;i<8+~~(dmg/4);i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*3;
    const m=addSphere(null,0.08+Math.random()*0.08,c,x,y,0);
    scene.add(m);
    particles3d.push({mesh:m,vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:(Math.random()-0.5)*1.5,life:0.5,maxLife:0.5});
  }
}

function spawnFireParticle(x,y,z){
  const m=addSphere(null,0.08+Math.random()*0.06,0xff4400,x,y,z);
  particles3d.push({mesh:m,vx:(Math.random()-0.5)*1.5,vy:0.5+Math.random()*1.5,vz:(Math.random()-0.5)*0.8,life:0.3,maxLife:0.3});
}

// ===== ANIMATION =====
function animateMage(mesh,f,dt){
  if(!mesh)return;
  const lR=mesh.getObjectByName('lR');
  const lL=mesh.getObjectByName('lL');
  const aR=mesh.getObjectByName('aR');
  const aL=mesh.getObjectByName('aL');
  const wand=mesh.getObjectByName('wand');
  f.animT+=dt;
  const t=f.animT;
  mesh.position.set(f.x,f.y,0);
  mesh.scale.x=f.facing; // flip
  if(f.state==='dead'){mesh.rotation.z=f.facing*(-Math.PI/2);mesh.position.y=0.4;return;}
  mesh.rotation.z=0;
  const walk=f.state==='walk';
  const att=f.state==='attack';
  const blk=f.state==='block';
  const hurt=f.state==='hurt';
  const frz=f.state==='frozen'||f.frozenT>0;
  // Bob
  const bob=walk?Math.sin(t*8)*0.08:Math.sin(t*2)*0.03;
  mesh.position.y=f.y+bob;
  // Legs
  if(lR&&lL){lR.rotation.x=walk?Math.sin(t*8)*0.4:0;lL.rotation.x=walk?-Math.sin(t*8)*0.4:0;}
  // Arms
  if(aR&&aL){
    if(att){aR.rotation.x=-1.0;aR.position.set(0.58,1.6,0.3);}
    else if(blk){aR.rotation.x=-0.5;aL.rotation.x=-0.5;aR.position.set(0.3,1.8,0.2);aL.position.set(-0.3,1.8,0.2);}
    else{aR.rotation.x=Math.sin(t*2)*0.1;aR.position.set(0.58,1.4,0);aL.rotation.x=-Math.sin(t*2)*0.1;aL.position.set(-0.58,1.4,0);}
    if(!att)aL.rotation.x=walk?Math.sin(t*8)*0.3:0;
  }
  // Frozen tint
  if(frz){mesh.children.forEach(c=>{if(c.material&&c.material.color)c.material.color.set(0x88aadd);});}
  // Hurt flash
  if(hurt){mesh.children.forEach(c=>{if(c.material&&c.material.color)c.material.color.set(0xff4444);});}
}

// ===== AI =====
function updateAI(dt){
  const ai=p2;if(!ai||ai.state==='dead'||ai.state==='frozen')return;
  aiState.timer-=dt;aiState.cooldown-=dt;
  const dist=Math.abs(ai.x-p1.x);
  const diff=Math.min(3,1+roundNum*0.5);
  if(aiState.timer<=0){
    const r=Math.random();
    if(dist>3)aiState.action='approach';
    else if(dist<1.2&&r<0.3)aiState.action='retreat';
    else if(r<0.5)aiState.action='attack';
    else if(r<0.7)aiState.action='block';
    else aiState.action='approach';
    aiState.timer=0.4+Math.random()*0.6/diff;
  }
  if(aiState.action==='approach'){ai.vx=(p1.x<ai.x?-1:1)*3.5;}
  else if(aiState.action==='retreat'){ai.vx=(p1.x<ai.x?1:-1)*3.5;}
  else if(aiState.action==='block'){ai.vx=0;ai.state='block';}
  else if(aiState.action==='attack'&&aiState.cooldown<=0){
    ai.vx=0;
    const r=Math.random();let type='q';
    if(r<0.12&&ai.mp>=ai.ch.spells.u.mn)type='u';
    else if(r<0.38&&ai.mp>=ai.ch.spells.h.mn)type='h';
    fireSpell(ai,type);
    aiState.cooldown=0.9/diff+Math.random()*0.4;
  } else ai.vx=0;
  if(ai.state!=='attack'&&ai.state!=='block'&&ai.state!=='hurt'&&ai.state!=='frozen')
    ai.state=Math.abs(ai.vx)>0.1?'walk':'idle';
}

// ===== PHYSICS =====
function updatePlayer(f,dt){
  if(!f||f.state==='dead'){if(f)f.vx=0;return;}
  if(f.stateT>0){f.stateT-=dt;if(f.stateT<=0&&(f.state==='attack'||f.state==='hurt'))f.state='idle';}
  if(f.frozenT>0){f.frozenT-=dt;if(f.frozenT<=0&&f.state==='frozen')f.state='idle';f.vx=0;f.vy=0;return;}
  f.vy-=18*dt;f.y+=f.vy*dt;
  if(f.y<=GROUND){f.y=GROUND;f.vy=0;f.onGround=true;}else f.onGround=false;
  f.x+=f.vx*dt;
  f.x=Math.max(-ARENA_X,Math.min(ARENA_X,f.x));
  const opp=f===p1?p2:p1;if(opp)f.facing=opp.x>f.x?1:-1;
  f.mp=Math.min(f.maxMp,f.mp+8*dt);
  if(f.state==='idle'&&Math.abs(f.vx)>0.1)f.state='walk';
  else if(f.state==='walk'&&Math.abs(f.vx)<0.1)f.state='idle';
}

// ===== SPELL UPDATE =====
function updateSpells(dt){
  for(let i=spellMeshes.length-1;i>=0;i--){
    const s=spellMeshes[i];
    s.life-=dt;
    s.mesh.position.x+=s.vx*dt;s.mesh.position.y+=s.vy*dt;s.mesh.position.z+=s.vz*dt;
    s.vy-=1.5*dt; // slight gravity
    if(s.life<=0||Math.abs(s.mesh.position.x)>ARENA_X+2){scene.remove(s.mesh);spellMeshes.splice(i,1);continue;}
    const target=s.owner===p1?p2:p1;
    if(!target||target.state==='dead')continue;
    const dx=s.mesh.position.x-target.x;
    const dy=s.mesh.position.y-(target.y+1.4);
    if(Math.abs(dx)<(0.5+s.sp.sz)&&Math.abs(dy)<1.2){
      hitPlayer(target,s.sp,s.mesh.position.x,s.mesh.position.y);
      scene.remove(s.mesh);spellMeshes.splice(i,1);
    }
  }
}

function updateSummoned(dt){
  for(let i=summoned.length-1;i>=0;i--){
    const d=summoned[i];
    d.life-=dt;d.x+=d.vx*dt;
    d.wingT+=dt*6;
    d.mesh.position.set(d.x,d.y+Math.sin(d.wingT*0.5)*0.12,0);
    // Wing flap
    const wR=d.mesh.getObjectByName('wR');const wL=d.mesh.getObjectByName('wL');
    if(wR)wR.rotation.x=0.4+Math.sin(d.wingT)*0.5;
    if(wL)wL.rotation.x=-0.4-Math.sin(d.wingT)*0.5;
    // Fire breath
    if(Math.random()<0.6)spawnFireParticle(d.x+(d.dir>0?1.9:-1.9),d.y+0.18,(Math.random()-0.5)*0.3);
    // Hit opponent
    if(!d.hit){
      const opp=d.owner===p1?p2:p1;
      const dist=Math.abs(d.x-opp.x);
      if(dist<1.4&&Math.abs(d.y-1.0)<1.5){
        d.hit=true;
        hitPlayer(opp,{dm:40,c3:0x44ff00,sh:'orb'},d.x,d.y);
        shakeT=0.5;shakeAmt=8;
      }
    }
    if(d.life<=0||Math.abs(d.x)>10){scene.remove(d.mesh);summoned.splice(i,1);}
  }
}

// ===== INPUT =====
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(gs!=='fight'||!roundActive)return;
  if(e.code==='KeyA'){p1.vx=-3.5;p1.state='walk';}
  if(e.code==='KeyD'){p1.vx=3.5;p1.state='walk';}
  if(e.code==='KeyW'&&p1.onGround){p1.vy=9;p1.state='jump';}
  if(e.code==='KeyS'&&p1.state!=='attack'){p1.state='block';p1.vx=0;}
  if(e.code==='KeyJ')fireSpell(p1,'q');
  if(e.code==='KeyK')fireSpell(p1,'h');
  if(e.code==='KeyL')fireSpell(p1,'u');
  e.preventDefault();
});
document.addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(e.code==='KeyA'&&p1.vx<0)p1.vx=0;
  if(e.code==='KeyD'&&p1.vx>0)p1.vx=0;
  if(e.code==='KeyS'&&p1.state==='block')p1.state='idle';
});

// ===== HUD =====
function updateBars(){
  if(!p1||!p2)return;
  document.getElementById('p1h').style.width=(p1.hp/p1.maxHp*100)+'%';
  document.getElementById('p1m').style.width=(p1.mp/p1.maxMp*100)+'%';
  document.getElementById('p1hn').textContent=~~p1.hp+'/'+p1.maxHp;
  document.getElementById('p2h').style.width=(p2.hp/p2.maxHp*100)+'%';
  document.getElementById('p2m').style.width=(p2.mp/p2.maxMp*100)+'%';
  document.getElementById('p2hn').textContent=~~p2.hp+'/'+p2.maxHp;
  document.getElementById('p1w').textContent='⭐'.repeat(p1Wins);
  document.getElementById('p2w').textContent='⭐'.repeat(p2Wins);
  document.getElementById('rnum').textContent='ROUND '+roundNum;
  document.getElementById('tmr').textContent=Math.ceil(roundTimer);
}
function showBanner(txt,sub){
  const el=document.getElementById('banner');
  el.innerHTML=txt+(sub?'<br><span style="font-size:20px;color:#cc99ff">'+sub+'</span>':'');
  el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity='0',1600);
}

// ===== ROUND MANAGEMENT =====
function checkRoundEnd(){
  if(!roundActive)return;
  if(p1.hp<=0||p2.hp<=0||roundTimer<=0){roundActive=false;setTimeout(endRound,900);}
}
function endRound(){
  let w=p1.hp>p2.hp?1:p2.hp>p1.hp?2:0;
  if(w===1)p1Wins++;else if(w===2)p2Wins++;
  if(p1Wins>=2)return endMatch(1);
  if(p2Wins>=2)return endMatch(2);
  roundNum++;
  showBanner(w===1?'🏆 '+p1.ch.name+' WINS THE ROUND!':w===2?'🏆 '+p2.ch.name+' WINS!':'⚖ DRAW!');
  setTimeout(startRound,2200);
}
function endMatch(w){
  gs='result';
  document.getElementById('rtxt').textContent=w===1?'🏆 VICTORY!':'💀 DEFEATED!';
  document.getElementById('rtxt').style.color=w===1?'#ffdd44':'#ff4444';
  document.getElementById('rsub').textContent=(w===1?p1.ch.name:p2.ch.name)+' wins the duel!';
  document.getElementById('result').style.display='flex';
}
function startRound(){
  // Clear scene objects
  spellMeshes.forEach(s=>scene.remove(s.mesh));spellMeshes=[];
  summoned.forEach(s=>scene.remove(s.mesh));summoned=[];
  particles3d.forEach(p=>scene.remove(p.mesh));particles3d=[];
  p1.hp=MAX_HP;p1.mp=MAX_MP;p1.x=-3;p1.y=GROUND;p1.vx=0;p1.vy=0;p1.state='idle';p1.frozenT=0;
  p2.hp=MAX_HP;p2.mp=MAX_MP;p2.x=3;p2.y=GROUND;p2.vx=0;p2.vy=0;p2.state='idle';p2.frozenT=0;
  roundTimer=60;roundActive=false;
  updateBars();
  showBanner('ROUND '+roundNum,'FIGHT!');
  setTimeout(()=>roundActive=true,1500);
}

// ===== GAME LOOP =====
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTime)/1000,0.05);lastTime=ts;
  torchT+=dt;
  // Torch flicker
  torchLights.forEach(t=>{t.t+=dt*5;t.light.intensity=t.base*(0.85+Math.sin(t.t)*0.15+Math.random()*0.05);});
  if(gs==='select'){renderer.render(scene,camera);return;}
  if(gs!=='fight'){renderer.render(scene,camera);return;}
  if(roundActive){roundTimer-=dt;if(roundTimer<=0){roundTimer=0;checkRoundEnd();}}
  updateAI(dt);
  if(!keys['KeyA']&&!keys['KeyD'])p1.vx*=0.7;
  updatePlayer(p1,dt);updatePlayer(p2,dt);
  updateSpells(dt);updateSummoned(dt);
  // Particles
  for(let i=particles3d.length-1;i>=0;i--){
    const p=particles3d[i];p.life-=dt;
    p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;
    p.vy-=4*dt;
    p.mesh.material.opacity=p.life/p.maxLife;
    if(!p.mesh.material.transparent)p.mesh.material.transparent=true;
    if(p.life<=0){scene.remove(p.mesh);particles3d.splice(i,1);}
  }
  // Animate mages
  animateMage(p1Mesh,p1,dt);
  animateMage(p2Mesh,p2,dt);
  // Screen shake
  if(shakeT>0){shakeT-=dt;camera.position.x=Math.sin(shakeT*30)*(shakeAmt*shakeT*0.1);}
  else camera.position.x=0;
  updateBars();
  renderer.render(scene,camera);
}

// ===== START =====
function startFight(){
  if(!selChar)return;
  document.getElementById('select').style.display='none';
  document.getElementById('hud').style.display='block';
  const others=CHARS.filter(c=>c.id!==selChar.id);
  const aiCh=others[~~(Math.random()*others.length)];
  document.getElementById('p1n').textContent=selChar.name;
  document.getElementById('p2n').textContent=aiCh.name+' (AI)';
  p1=makePlayer(false,selChar,-3);p2=makePlayer(true,aiCh,3);
  // Build meshes
  if(p1Mesh)scene.remove(p1Mesh);if(p2Mesh)scene.remove(p2Mesh);
  p1Mesh=buildMage(selChar);p2Mesh=buildMage(aiCh);
  scene.add(p1Mesh);scene.add(p2Mesh);
  gs='fight';roundNum=1;p1Wins=0;p2Wins=0;
  startRound();
}

// ===== INIT =====
buildArena();
lastTime=performance.now();
requestAnimationFrame(loop);
</script>
</body>
