<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breaking Out</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Georgia,serif;user-select:none}
#wrap{width:620px;max-width:100%}
canvas{display:block;width:100%;background:#2a2a3a}
#ui{background:#0d0d1a;border:2px solid #4a3a60;border-top:none;padding:9px 14px 7px;display:flex;gap:10px;align-items:center}
#text-box{flex:1;color:#ddd;font-size:13px;line-height:1.45;min-height:38px}
#inv-bar{display:flex;gap:5px}
.inv-slot{width:42px;height:42px;border:2px solid #553355;border-radius:5px;background:#1a0a2a;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0;transition:border-color .15s,background .15s}
.inv-slot:hover:not(.empty){border-color:#aa77cc}
.inv-slot.selected{border-color:#ffdd44;background:#2a1a0a}
.inv-slot.empty{opacity:.3;cursor:default}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="620" height="380"></canvas>
<div id="ui">
  <div id="text-box">Click on things in your cell to explore. Find items and escape!</div>
  <div id="inv-bar">
    <div class="inv-slot empty" id="s0"></div>
    <div class="inv-slot empty" id="s1"></div>
    <div class="inv-slot empty" id="s2"></div>
    <div class="inv-slot empty" id="s3"></div>
    <div class="inv-slot empty" id="s4"></div>
  </div>
</div>
</div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=620,H=380,tb=document.getElementById('text-box');
let mx=0,my=0,frame=0;

// ── INVENTORY ───────────────────────────────────────────────
const MAX_INV=5;
let inv=[],selItem=null;
const ICONS={file:'📄',coin:'🪙',driver:'🔩',spoon:'🥄',poster:'🖼️',uniform:'👕',rope:'🪢',key:'🗝️',phone:'📱',gum:'🍬'};
const INAME={file:'Metal File',coin:'Gold Coin',driver:'Screwdriver',spoon:'Spoon',poster:'Movie Poster',uniform:'Guard Uniform',rope:'Knotted Sheets',key:'Rusty Key',phone:'Smuggled Phone',gum:'Chewing Gum'};

function addItem(id){if(!inv.includes(id)&&inv.length<MAX_INV){inv.push(id);renderInv();return true;}return false;}
function hasItem(id){return inv.includes(id);}
function renderInv(){
  for(let i=0;i<MAX_INV;i++){
    const sl=document.getElementById('s'+i);const id=inv[i];
    if(id){sl.textContent=ICONS[id];sl.title=INAME[id];sl.classList.remove('empty');sl.classList.toggle('selected',selItem===id);sl.onclick=()=>{selItem=selItem===id?null:id;renderInv();};}
    else{sl.textContent='';sl.title='';sl.classList.add('empty');sl.classList.remove('selected');sl.onclick=null;}
  }
}

// ── STATE ───────────────────────────────────────────────────
let scene='cell';
let flags=new Set();
let hovered=null;
let escType='',escPhase=0,escTick=0;
let choices=[],choiceTitle='';
let choiceHover=-1;

function setText(t){tb.textContent=t;}

// ── STORY OBJECTS (10 things to find) ───────────────────────
// Each spot: some give items, some give lore/story text
// Window REQUIRES rope now — without it you fall and get arrested

function tryWindow(){
  if(!hasItem('file')){setText('Iron bars block the window. You need something to cut them.');return;}
  if(!hasItem('rope')){
    // Fall and get arrested!
    doEscape('window_fall');
    return;
  }
  showChoice('You have the file AND knotted sheets!',[
    {emoji:'🔇',label:'File slowly and silently (careful)',cb:()=>doEscape('window_stealth')},
    {emoji:'⚡',label:'File FAST — speed over stealth',    cb:()=>doEscape('window_fast')},
    {emoji:'🪢',label:'Lower yourself on the rope first',  cb:()=>doEscape('window_rope')},
  ]);
}

function tryDoor(){
  if(hasItem('key')){doEscape('door_key');return;}
  if(hasItem('uniform')){showChoice('You\'re wearing a guard uniform!',[
    {emoji:'😎',label:'Stroll out calmly',       cb:()=>doEscape('door_uniform')},
    {emoji:'🎺',label:'Yell "FIRE!" and run',    cb:()=>doEscape('door_uniform_fire')},
  ]);return;}
  if(hasItem('coin')){showChoice('The guard is on the other side.',[
    {emoji:'🪙',label:'Slide the coin under the door',   cb:()=>doEscape('door_bribe')},
    {emoji:'📱',label:'Use the smuggled phone to call him away',cb:()=>{if(hasItem('phone'))doEscape('door_phone');else{setText('You could call the guard away if you had a phone...');scene='cell';}}},
  ]);return;}
  if(hasItem('phone')){doEscape('door_phone');return;}
  setText('The door is locked. Guard\'s on the other side. You\'ll need to find something that can help.');
}

function tryVent(){
  if(!hasItem('driver')){setText('A vent grate. The screws look removable — with a screwdriver.');return;}
  showChoice('The grate is open! (Warning: guards sometimes hide in vents.)',[
    {emoji:'🤫',label:'Crawl through quietly',           cb:()=>{if(Math.random()<0.4)doEscape('vent_guard');else doEscape('vent_quiet');}},
    {emoji:'🏃',label:'Take a running dive in',           cb:()=>{if(Math.random()<0.55)doEscape('vent_guard');else doEscape('vent_dive');}},
    {emoji:'🥄',label:'Bang the pipes — guards evacuate the vents',cb:()=>{if(hasItem('spoon'))doEscape('vent_spoon');else{setText('That would work if you had something to bang... find a spoon first.');scene='cell';}}},
  ]);
}

function showChoice(title,opts){choiceTitle=title;choices=opts;scene='choice';}

function doEscape(type){

  setText(SEQ[type].texts[0]);
}

// ── DRAW STICK ───────────────────────────────────────────────
function drawStick(x,y,facing,state){
  ctx.save();ctx.translate(x,y);if(facing<0)ctx.scale(-1,1);
  const t=frame;
  const bob=state==='walk'?Math.sin(t*0.22)*4:0;
  const ls=state==='walk'?Math.sin(t*0.22)*14:0,rs=-ls;
  ctx.lineCap='round';ctx.lineJoin='round';
  if(state==='crawl'){
    ctx.strokeStyle='#eee';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(-18,-6);ctx.lineTo(18,-6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-10,-6);ctx.lineTo(-16,6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(8,-6);ctx.lineTo(14,6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-6,-6);ctx.lineTo(-14,4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(14,-6);ctx.lineTo(20,4);ctx.stroke();
    ctx.fillStyle='#eee';ctx.beginPath();ctx.arc(22,-12,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(25,-12,2,0,Math.PI*2);ctx.fill();
  } else {
    ctx.strokeStyle='#eee';ctx.lineWidth=2.5;
    ctx.fillStyle='#eee';ctx.beginPath();ctx.arc(0,-36+bob,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(3,-37+bob,2,0,Math.PI*2);ctx.fill();
    if(state==='dizzy'||state==='fall'){ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('💫',0,-52+bob);}
    ctx.strokeStyle='#eee';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(0,-26+bob);ctx.lineTo(0,0);ctx.stroke();
    if(state==='celebrate'||state==='cheer'){
      ctx.beginPath();ctx.moveTo(0,-20+bob);ctx.lineTo(-16,-34+bob+Math.sin(t*0.3)*4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,-20+bob);ctx.lineTo(16,-34+bob-Math.sin(t*0.3)*4);ctx.stroke();
    } else if(state==='arms_up'||state==='fall'){
      ctx.beginPath();ctx.moveTo(0,-20+bob);ctx.lineTo(-18,-34+bob);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,-20+bob);ctx.lineTo(18,-34+bob);ctx.stroke();
    } else {
      ctx.beginPath();ctx.moveTo(0,-20+bob);ctx.lineTo(-12,-10+bob+ls*0.4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,-20+bob);ctx.lineTo(12,-10+bob+rs*0.4);ctx.stroke();
    }
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-8+ls*0.5,16);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(8+rs*0.5,16);ctx.stroke();
    // prison stripes
    if(state!=='celebrate'&&state!=='cheer'&&state!=='guard'){
      ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;
      for(let yy=-24;yy<0;yy+=6){ctx.beginPath();ctx.moveTo(-6,yy+bob);ctx.lineTo(6,yy+bob);ctx.stroke();}
    }
    // guard hat
    if(state==='guard'){
      ctx.fillStyle='#334455';ctx.fillRect(-10,-50+bob,20,8);
      ctx.fillRect(-14,-44+bob,28,5);
      ctx.fillStyle='#aaa';ctx.fillRect(-6,-52+bob,12,3);
    }
  }
  ctx.restore();
}

// ── DRAW CELL ────────────────────────────────────────────────
function drawCell(){
  const wg=ctx.createLinearGradient(0,0,0,H);wg.addColorStop(0,'#38384a');wg.addColorStop(1,'#252535');
  ctx.fillStyle=wg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=1;
  for(let r=0;r*28<H-70;r++){const o=(r%2)*44;for(let c=-1;c*88<W+88;c++)ctx.strokeRect(c*88+o,r*28,88,28);}
  const fg=ctx.createLinearGradient(0,H-70,0,H);fg.addColorStop(0,'#5a4a2e');fg.addColorStop(1,'#3a2e1a');
  ctx.fillStyle=fg;ctx.fillRect(0,H-70,W,70);
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1;for(let x=0;x<W;x+=55)ctx.strokeRect(x,H-70,55,70);

  // BED
  ctx.fillStyle='#6a3e1a';ctx.fillRect(24,218,138,55);
  ctx.fillStyle='#4a2800';ctx.fillRect(24,218,138,8);
  ctx.fillStyle=flags.has('bed')?'#5a4030':'#8a7060';ctx.fillRect(28,228,130,36);
  ctx.fillStyle='#6a5040';ctx.fillRect(28,228,130,8);

  // TOILET
  ctx.fillStyle='#ccc';ctx.beginPath();ctx.ellipse(66,320,32,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#bbb';ctx.fillRect(46,284,40,24);ctx.fillStyle='#ddd';ctx.fillRect(44,278,46,10);
  ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(66,320,32,22,0,0,Math.PI*2);ctx.stroke();

  // LOOSE BRICK
  if(!flags.has('brick')){
    ctx.fillStyle='#5a4535';ctx.fillRect(166,257,58,38);ctx.strokeStyle='#8a7055';ctx.lineWidth=1.5;ctx.strokeRect(166,257,58,38);
    ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(173,267);ctx.lineTo(194,275);ctx.lineTo(187,290);ctx.stroke();
  } else {ctx.fillStyle='#111';ctx.fillRect(166,257,58,38);ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.strokeRect(166,257,58,38);}

  // WALL CRACK (phone)
  if(!flags.has('phone')){
    ctx.strokeStyle='#5a5a6a';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(136,172);ctx.lineTo(148,185);ctx.lineTo(140,200);ctx.lineTo(152,215);ctx.stroke();
    // subtle glow
    ctx.strokeStyle='rgba(100,200,255,0.2)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(136,172);ctx.lineTo(148,185);ctx.lineTo(140,200);ctx.lineTo(152,215);ctx.stroke();
  } else {
    ctx.strokeStyle='#3a3a4a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(136,172);ctx.lineTo(148,185);ctx.lineTo(140,200);ctx.lineTo(152,215);ctx.stroke();
  }

  // GRAFFITI
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.font='9px monospace';ctx.textAlign='left';
  ctx.fillText('"Jake was here — he made it"',262,165);
  ctx.fillText('"Use rope for window"',268,178);
  ctx.fillStyle='rgba(255,255,200,0.08)';ctx.fillRect(260,155,110,60);
  ctx.strokeStyle='rgba(255,255,200,0.15)';ctx.lineWidth=0.5;ctx.strokeRect(260,155,110,60);

  // MOVIE POSTER
  if(!flags.has('poster')){
    ctx.fillStyle='#8a2222';ctx.fillRect(385,118,72,88);
    ctx.fillStyle='#aa3333';ctx.fillRect(388,121,66,60);
    ctx.fillStyle='#ffdd44';ctx.font='bold 8px sans-serif';ctx.textAlign='center';
    ctx.fillText('TUNNEL QUEST',421,135);ctx.fillText('4',421,148);
    ctx.fillStyle='#fff';ctx.fillText('★★★★★',421,185);
  } else {
    ctx.fillStyle='#2a2a3a';ctx.fillRect(385,118,72,88);ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.strokeRect(385,118,72,88);
  }

  // FOOD TRAY
  ctx.fillStyle='#999';ctx.fillRect(268,305,94,34);ctx.strokeStyle='#777';ctx.lineWidth=1;ctx.strokeRect(268,305,94,34);
  ctx.fillStyle='#6a8040';ctx.beginPath();ctx.ellipse(315,322,24,10,0,0,Math.PI*2);ctx.fill();

  // LAUNDRY BAG
  if(!flags.has('laundry')){
    ctx.fillStyle='#6a5a3a';ctx.beginPath();ctx.ellipse(384,318,34,22,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5a4a2a';ctx.fillRect(355,296,58,22);ctx.fillStyle='#8a7a5a';
    ctx.beginPath();ctx.arc(384,296,8,0,-Math.PI,false);ctx.fill();
    ctx.strokeStyle='#4a3a1a';ctx.lineWidth=1.5;ctx.strokeRect(355,296,58,22);
    ctx.strokeStyle='#4a3a1a';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(384,318,34,22,0,0,Math.PI*2);ctx.stroke();
  } else {
    ctx.strokeStyle='#4a4a3a';ctx.lineWidth=1;ctx.strokeRect(355,296,58,22);
  }

  // GUARD UNIFORM on hook (shows before taken)
  if(!flags.has('laundry')){
    // just part of laundry bag, described there
  }

  // VENT
  ctx.fillStyle='#444';ctx.fillRect(193,140,88,60);
  ctx.fillStyle='#2a2a2a';for(let vy=146;vy<196;vy+=10)ctx.fillRect(197,vy,80,6);
  if(!flags.has('brick')){
    ctx.fillStyle='#888';
    [[198,146],[273,146],[198,192],[273,192]].forEach(([sx,sy])=>{
      ctx.beginPath();ctx.arc(sx,sy,3.5,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx-2,sy);ctx.lineTo(sx+2,sy);ctx.stroke();ctx.beginPath();ctx.moveTo(sx,sy-2);ctx.lineTo(sx,sy+2);ctx.stroke();
    });
  }

  // WINDOW
  ctx.fillStyle='#2244aa';ctx.fillRect(455,72,118,130);
  ctx.fillStyle='rgba(150,210,255,0.4)';ctx.fillRect(460,77,108,120);
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(468,77,15,120);ctx.fillRect(502,77,10,120);
  ctx.strokeStyle='#888';ctx.lineWidth=5;ctx.lineCap='butt';
  for(let bx=467;bx<570;bx+=18){ctx.beginPath();ctx.moveTo(bx,72);ctx.lineTo(bx,202);ctx.stroke();}
  ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(455,112);ctx.lineTo(573,112);ctx.stroke();ctx.beginPath();ctx.moveTo(455,158);ctx.lineTo(573,158);ctx.stroke();
  ctx.strokeStyle='#5a3300';ctx.lineWidth=7;ctx.strokeRect(455,72,118,130);

  // DOOR
  ctx.fillStyle='#5a3808';ctx.fillRect(522,152,76,180);
  ctx.fillStyle='#3a2000';ctx.fillRect(528,162,62,160);
  ctx.strokeStyle='#666';ctx.lineWidth=4.5;for(let dx=532;dx<585;dx+=11){ctx.beginPath();ctx.moveTo(dx,162);ctx.lineTo(dx,322);ctx.stroke();}
  ctx.fillStyle='#aaa';ctx.beginPath();ctx.arc(532,242,6,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#3a2800';ctx.lineWidth=8;ctx.strokeRect(522,152,76,180);

  // character
  drawStick(315,H-70,1,'idle');

  // items count
  const found=flags.size;
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.fillText('CELL B-13',10,18);
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='11px sans-serif';ctx.fillText('Found: '+inv.length+' items',10,34);

  // hover
  if(hovered){
    ctx.strokeStyle='rgba(255,220,80,0.75)';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.strokeRect(hovered.x,hovered.y,hovered.w,hovered.h);ctx.setLineDash([]);
    ctx.font='12px Georgia,serif';const tw=ctx.measureText(hovered.label).width+14;
    const tx=Math.min(mx+12,W-tw-4),ty=my>30?my-26:my+18;
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(tx,ty,tw,20);ctx.fillStyle='#ffdd66';ctx.textAlign='left';ctx.fillText(hovered.label,tx+7,ty+14);
  }
}

// ── DRAW CHOICE ──────────────────────────────────────────────
const BTN_Y=130,BTN_H=52,BTN_GAP=10;
function drawChoice(){
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
  const pw=460,px=(W-pw)/2;
  ctx.fillStyle='#1a1228';ctx.fillRect(px,55,pw,H-80);
  ctx.strokeStyle='#6a4a90';ctx.lineWidth=2;ctx.strokeRect(px,55,pw,H-80);
  ctx.fillStyle='#ffdd88';ctx.font='bold 15px Georgia,serif';ctx.textAlign='center';ctx.fillText(choiceTitle,W/2,83);
  choices.forEach((ch,i)=>{
    const by=BTN_Y+i*(BTN_H+BTN_GAP);const hover=choiceHover===i;
    ctx.fillStyle=hover?'#2a1a4a':'#1a0a2a';ctx.fillRect(px+20,by,pw-40,BTN_H);
    ctx.strokeStyle=hover?'#aa77ee':'#553366';ctx.lineWidth=1.5;ctx.strokeRect(px+20,by,pw-40,BTN_H);
    ctx.font='22px sans-serif';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(ch.emoji,px+32,by+32);
    ctx.font='13px Georgia,serif';ctx.fillStyle=hover?'#fff':'#ccc';ctx.fillText(ch.label,px+62,by+30);
  });
  ctx.font='11px Georgia,serif';ctx.fillStyle='rgba(255,255,255,0.4)';ctx.textAlign='center';ctx.fillText('[click outside or press ESC to cancel]',W/2,H-30);
}

// ── DRAW ESCAPE ──────────────────────────────────────────────
function drawEscape(){
  const seq=SEQ[escType];const phase=Math.min(escPhase,seq.texts.length-1);
  const [cx,cy]=seq.charPath[Math.min(phase,seq.charPath.length-1)];

  if(seq.bg==='outside'){
    const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0a0a22');sky.addColorStop(1,'#1a3a66');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    for(let i=0;i<40;i++){const sx=(i*137)%W,sy=(i*73)%180,tw=0.4+0.6*Math.abs(Math.sin(frame*0.02+i));ctx.globalAlpha=tw;ctx.fillStyle='#fff';ctx.fillRect(sx,sy,2,2);}ctx.globalAlpha=1;
    ctx.fillStyle='#2a5a1a';ctx.fillRect(0,H*0.6,W,H*0.4);ctx.fillStyle='#1a4a0a';ctx.fillRect(0,H*0.6,W,8);
    // wall left side
    if(phase<4){
      ctx.fillStyle='#38384a';ctx.fillRect(W-120,0,120,H);
      ctx.fillStyle='#2244aa';ctx.fillRect(W-115,72,110,130);
      ctx.fillStyle='rgba(150,210,255,0.3)';ctx.fillRect(W-110,77,100,120);
      if(phase>=1){
        ctx.strokeStyle='rgba(255,100,0,0.6)';ctx.lineWidth=2;ctx.setLineDash([3,3]);
        ctx.beginPath();ctx.moveTo(W-108,112);ctx.lineTo(W-12,112);ctx.stroke();ctx.setLineDash([]);
      }
      // rope hanging
      if(hasItem('rope')&&escType!=='window_fall'&&phase>=2){
        ctx.strokeStyle='#c8a060';ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(W-60,110);ctx.lineTo(W-60,220);ctx.stroke();
        for(let ry=115;ry<220;ry+=18){ctx.beginPath();ctx.moveTo(W-65,ry);ctx.lineTo(W-55,ry+8);ctx.stroke();}
      }
    }
    // fall animation
    if(seq.fall){
      const st=phase>=4?'dizzy':'arms_up';
      drawStick(cx,cy,1,st);
      if(phase===1||phase===2){
        ctx.font='bold 20px sans-serif';ctx.textAlign='center';
        ctx.fillStyle='#f88';ctx.fillText('AAAAAAA',cx-20,cy-30);
      }
      if(phase>=3){
        // crack on ground
        ctx.strokeStyle='#f80';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx,cy+16);ctx.lineTo(cx-20,cy+30);ctx.moveTo(cx,cy+16);ctx.lineTo(cx+20,cy+28);ctx.moveTo(cx,cy+16);ctx.lineTo(cx+5,cy+35);ctx.stroke();
        // guard
        drawStick(cx-80,cy,1,'idle');
        ctx.fillStyle='#f88';ctx.font='13px Georgia,serif';ctx.textAlign='center';ctx.fillText('Guard: "...Really?"',cx-80,cy-50);
      }
    } else {
      const st=phase>=seq.texts.length-1?'cheer':phase===0?'idle':'walk';
      drawStick(cx,cy,escType.includes('fast')?1:1,st);
      if(escType==='window_fast'&&phase===3){
        drawStick(cx+120,cy,-1,'walk');
        ctx.fillStyle='#f44';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('HEY!!',cx+120,cy-50);
      }
    }

  } else if(seq.bg==='corridor'){
    const col=escType==='door_uniform_fire'?'#2a1a0a':escType.startsWith('door_ram')?'#300':'#1a1a2a';
    ctx.fillStyle=col;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
    [[0,0,W/2,H/2],[W,0,W/2,H/2],[0,H,W/2,H/2],[W,H,W/2,H/2]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});
    ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fillRect(0,H-70,W,70);
    if(phase<2){ctx.fillStyle='#5a3808';ctx.fillRect(10,100,70,210);ctx.strokeStyle='#666';ctx.lineWidth=4;for(let dx=15;dx<76;dx+=11){ctx.beginPath();ctx.moveTo(dx,100);ctx.lineTo(dx,310);ctx.stroke();}}
    // fire effect
    if(escType==='door_uniform_fire'&&phase>=1){
      for(let fx=0;fx<W;fx+=60){
        ctx.fillStyle=`rgba(255,${80+Math.random()*80},0,${0.1+Math.random()*0.15})`;ctx.fillRect(fx,0,55,H);
      }
      ctx.fillStyle='#f80';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
      if(phase===1)ctx.fillText('🔥 FIRE!! FIRE!! 🔥',W/2,80);
    }
    // guard
    if(phase>=1&&escType!=='door_uniform_fire'){
      drawStick(90,H-70,-1,escType==='door_bribe'?'idle':'guard');
      if(phase===1&&escType==='door_bribe'){ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('💰',90,H-115);}
      if(escType==='door_phone'&&phase<=2){ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('📱🍕',90,H-115);}
    }
    if(phase>=3&&!escType.includes('ram')){
      ctx.fillStyle='#4a6a30';ctx.fillRect(W-90,80,80,210);ctx.fillStyle='rgba(200,255,150,0.3)';ctx.fillRect(W-85,85,70,200);ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(W-93,185,6,0,Math.PI*2);ctx.fill();
    }
    const st=phase>=seq.texts.length-1?'cheer':phase<=1?'idle':'walk';
    const stateActual=(escType==='door_uniform'||escType==='door_uniform_fire')?'guard':st;
    drawStick(cx,H-70,1,stateActual);

  } else if(seq.bg==='vent'){
    if(phase<3){
      ctx.fillStyle='#0d0808';ctx.fillRect(0,0,W,H);
      const vy=H/2-30,vh=60;
      ctx.fillStyle='#1a1010';ctx.fillRect(0,vy,W,vh);
      ctx.strokeStyle='#2a2020';ctx.lineWidth=1;for(let vx=0;vx<W;vx+=30){ctx.beginPath();ctx.moveTo(vx,vy);ctx.lineTo(vx,vy+vh);ctx.stroke();}
      const gr=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,120);gr.addColorStop(0,'rgba(255,240,180,0.1)');gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
      drawStick(cx,H/2+10,1,'crawl');
      // guard in vent
      if(escType==='vent_guard'&&phase>=2){
        drawStick(cx+100,H/2+10,-1,'crawl');
        ctx.fillStyle='#f44';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('👮',cx+100,H/2-20);
      }
      if(escType==='vent_spoon'&&phase===1){ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('*CLANK CLANK CLANK*',W/2,H/2+60);}
    } else {
      const bg2=ctx.createLinearGradient(0,0,0,H);bg2.addColorStop(0,'#2a2535');bg2.addColorStop(1,'#1a151f');ctx.fillStyle=bg2;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#5a4a30';ctx.fillRect(100,220,180,60);ctx.fillStyle='#4a3a20';ctx.fillRect(95,278,190,10);
      ctx.strokeStyle='#aaa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(220,220);ctx.lineTo(220,165);ctx.lineTo(242,140);ctx.stroke();
      ctx.fillStyle='rgba(255,240,150,0.5)';ctx.beginPath();ctx.arc(242,135,20,0,Math.PI*2);ctx.fill();
      drawStick(190,220,1,'idle');ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('💤',190,165);
      ctx.fillStyle='#3a5a2a';ctx.fillRect(W-90,100,76,195);ctx.fillStyle='#5a8a4a';ctx.fillRect(W-85,105,66,185);ctx.fillStyle='rgba(200,255,150,0.3)';ctx.fillRect(W-85,105,66,185);ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(W-93,196,6,0,Math.PI*2);ctx.fill();
      const st=phase>=seq.texts.length-1?'cheer':'walk';drawStick(cx,cy,1,st);
    }
  }

  // overlays
  if(phase>=seq.texts.length-1&&!seq.gameover){
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
    const gr=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,260);gr.addColorStop(0,'rgba(255,220,50,0.22)');gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    ctx.font='bold 56px Georgia,serif';ctx.textAlign='center';ctx.shadowColor='#ffaa00';ctx.shadowBlur=28;ctx.fillStyle='#ffdd44';ctx.fillText('FREEDOM!',W/2,H/2-30);ctx.shadowBlur=0;
    ctx.font='14px Georgia,serif';ctx.fillStyle='#ddd';ctx.fillText(seq.texts[phase],W/2,H/2+10);
    ctx.font='12px Georgia,serif';ctx.fillStyle='#aaa';ctx.fillText('[ click to see your rating ]',W/2,H/2+36);
  }
  if(seq.gameover&&phase>=seq.texts.length-1){
    ctx.fillStyle='rgba(180,0,0,0.5)';ctx.fillRect(0,0,W,H);
    ctx.font='bold 42px Georgia,serif';ctx.textAlign='center';ctx.shadowColor='#f00';ctx.shadowBlur=20;ctx.fillStyle='#ff4444';ctx.fillText('BUSTED.',W/2,H/2-20);ctx.shadowBlur=0;
    ctx.font='14px Georgia,serif';ctx.fillStyle='#faa';ctx.fillText(seq.texts[phase],W/2,H/2+14);
    ctx.font='12px Georgia,serif';ctx.fillStyle='#f88';ctx.fillText('[ click to try again ]',W/2,H/2+40);
  }
}

// ── DRAW ENDING ──────────────────────────────────────────────
function drawEnding(){
  const seq=SEQ[escType];
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a1a0a');bg.addColorStop(1,'#152015');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){const sx=(i*197)%W,sy=(i*83)%H,tw=0.3+0.7*Math.abs(Math.sin(frame*0.015+i));ctx.globalAlpha=tw*0.6;ctx.fillStyle='#fff';ctx.fillRect(sx,sy,1.5,1.5);}ctx.globalAlpha=1;
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(80,25,W-160,H-45);ctx.strokeStyle='#4a7a4a';ctx.lineWidth=2;ctx.strokeRect(80,25,W-160,H-45);
  ctx.font='52px sans-serif';ctx.textAlign='center';ctx.fillText(seq.emoji,W/2,82);
  ctx.fillStyle='#ffdd44';ctx.font='bold 20px Georgia,serif';ctx.fillText('"'+seq.title+'"',W/2,112);
  ctx.fillStyle='#ccc';ctx.font='13px Georgia,serif';wrapText(seq.desc,W/2,138,W-200,19);
  // badassometer
  const r=seq.rating;ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(100,192,W-200,22);
  const rc=r>80?'#4f4':r>50?'#ff8':r>30?'#f80':'#f44';ctx.fillStyle=rc;ctx.fillRect(100,192,(W-200)*(r/100),22);
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect(100,192,W-200,22);
  ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.fillText('BADASSOMETER: '+r+'%',W/2,207);
  const lbl=r>90?'LEGENDARY':r>80?'EPIC':r>65?'SOLID':r>50?'DECENT':r>35?'QUESTIONABLE':'EMBARRASSING';
  ctx.fillStyle=rc;ctx.font='bold 14px Georgia,serif';ctx.fillText(lbl,W/2,230);
  drawStick(W/2,285,1,'cheer');
  const pw=180,px=(W-pw)/2;ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(px,310,pw,30);ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect(px,310,pw,30);
  ctx.fillStyle='#88aaff';ctx.font='13px Georgia,serif';ctx.fillText('[ Escape Again ]',W/2,330);
}

function wrapText(text,cx,y,maxW,lineH){
  const words=text.split(' ');let line='';
  for(const w of words){const test=line+w+' ';if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line.trim(),cx,y);y+=lineH;line=w+' ';}else line=test;}
  if(line)ctx.fillText(line.trim(),cx,y);
}

// ── UPDATE ───────────────────────────────────────────────────
function update(){
  frame++;
  if(scene==='escape'){
    const seq=SEQ[escType],done=escPhase>=seq.texts.length-1;
    if(!done){escTick++;if(escTick>90){escPhase++;escTick=0;setText(seq.texts[escPhase]);}}
  }
  if(scene==='cell'){
    hovered=null;for(const s of SPOTS)if(mx>s.x&&mx<s.x+s.w&&my>s.y&&my<s.y+s.h){hovered=s;break;}
    C.style.cursor=hovered?'pointer':'default';
  } else if(scene==='choice'){
    choiceHover=-1;const pw=460,px=(W-pw)/2;
    choices.forEach((ch,i)=>{const by=BTN_Y+i*(BTN_H+BTN_GAP);if(mx>px+20&&mx<px+20+pw-40&&my>by&&my<by+BTN_H)choiceHover=i;});
    C.style.cursor=choiceHover>=0?'pointer':'default';
  } else {C.style.cursor='pointer';}
}

// ── INPUT ────────────────────────────────────────────────────
function sc(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
C.addEventListener('mousemove',e=>{const c=sc(e);mx=c.x;my=c.y;});
C.addEventListener('click',e=>{
  const c=sc(e);mx=c.x;my=c.y;
  if(scene==='cell'&&hovered){hovered.act();return;}
  if(scene==='choice'){
    if(choiceHover>=0){choices[choiceHover].cb();return;}
    scene='cell';setText('You decide to think about it more.');return;
  }
  if(scene==='escape'){
    const seq=SEQ[escType],done=escPhase>=seq.texts.length-1;
    if(done){if(seq.gameover)reset();else scene='ending';}
    return;
  }
  if(scene==='ending')reset();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&scene==='choice'){scene='cell';setText('Never mind.');}});

function reset(){
  scene='cell';inv=[];flags=new Set();selItem=null;escType='';escPhase=0;escTick=0;
  renderInv();setText('Click on things in your cell to explore. Find items and escape!');
}

C.addEventListener('touchstart',e=>{
  e.preventDefault();const r=C.getBoundingClientRect();const t=e.touches[0];
  mx=(t.clientX-r.left)*W/r.width;my=(t.clientY-r.top)*H/r.height;
  if(scene==='cell'){hovered=null;for(const s of SPOTS)if(mx>s.x&&mx<s.x+s.w&&my>s.y&&my<s.y+s.h){hovered=s;break;}if(hovered)hovered.act();}
  else if(scene==='choice'&&choiceHover>=0){choices[choiceHover].cb();}
  else if(scene==='escape'){const seq=SEQ[escType],done=escPhase>=seq.texts.length-1;if(done){if(seq.gameover)reset();else scene='ending';}}
  else if(scene==='ending')reset();
},{passive:false});

// ── LOOP ─────────────────────────────────────────────────────
function loop(){
  ctx.clearRect(0,0,W,H);update();
  if(scene==='cell')drawCell();
  else if(scene==='choice'){drawCell();drawChoice();}
  else if(scene==='escape')drawEscape();
  else if(scene==='ending')drawEnding();
  requestAnimationFrame(loop);
}
loop();
</script>
