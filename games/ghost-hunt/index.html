<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost Hunt – Llobi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;user-select:none}
canvas{display:block;touch-action:none}
#ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;pointer-events:none;z-index:10;gap:8px}
#score-box{font-size:1.2rem;font-weight:700;color:#aaffee;text-shadow:0 0 12px #00ffcc;min-width:110px}
#level-box{font-size:1.1rem;font-weight:700;color:#cc88ff;text-shadow:0 0 10px #8844ff;text-align:center}
#timer-box{font-size:1.2rem;font-weight:600;color:#ffee88;text-shadow:0 0 10px #ffaa00;min-width:70px;text-align:right}
#lives-box{position:fixed;top:46px;left:0;right:0;text-align:center;font-size:1.3rem;letter-spacing:3px;pointer-events:none;z-index:10}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,0,20,.9);z-index:20;gap:16px}
#overlay h1{font-size:2.6rem;text-shadow:0 0 30px #88aaff;text-align:center}
#overlay p{font-size:1.05rem;color:#aabbff;max-width:340px;text-align:center;line-height:1.6}
.btn-main{padding:13px 42px;font-size:1.2rem;font-weight:700;border:none;border-radius:40px;background:linear-gradient(135deg,#8844ff,#44aaff);color:#fff;cursor:pointer;box-shadow:0 0 24px #6644ff88;transition:transform .1s}
.btn-main:hover{transform:scale(1.06)}
.btn-sec{padding:9px 26px;font-size:.95rem;border:none;border-radius:40px;background:rgba(255,255,255,.13);color:#fff;cursor:pointer}
#back{position:fixed;top:12px;left:12px;z-index:30;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:50%;width:38px;height:38px;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
#lvl-banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:15;opacity:0;transition:opacity .3s}
#lvl-banner span{font-size:3.5rem;font-weight:900;color:#cc88ff;text-shadow:0 0 40px #8844ff,0 0 80px #4422aa;padding:10px 32px;background:rgba(20,0,40,.7);border-radius:20px}
</style>
</head>
<body>
<button id="back" onclick="location.href='/'">‹</button>
<div id="ui">
  <div id="score-box">Score: <span id="score">0</span></div>
  <div id="level-box">Level <span id="lvl">1</span></div>
  <div id="timer-box">⏱ <span id="timer">30</span>s</div>
</div>
<div id="lives-box"><span id="lives">❤️❤️❤️</span></div>
<canvas id="c"></canvas>
<div id="lvl-banner"><span id="lvl-banner-txt"></span></div>
<div id="overlay">
  <div style="font-size:4rem">👻</div>
  <h1>Ghost Hunt</h1>
  <p>Tap ghosts before they escape! Each level gets harder. Survive as long as you can across <strong>100,000,000+</strong> levels!</p>
  <button class="btn-main" id="play-btn">Play</button>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay');
const scoreEl=document.getElementById('score');
const timerEl=document.getElementById('timer');
const livesEl=document.getElementById('lives');
const lvlEl=document.getElementById('lvl');
const lvlBanner=document.getElementById('lvl-banner');
const lvlBannerTxt=document.getElementById('lvl-banner-txt');

let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

// Ghost type definitions — unlocked progressively by level
const TYPES=[
  {emoji:'👻',r:28,pts:10,spd:1.0,hp:1,minLv:1},
  {emoji:'💀',r:30,pts:25,spd:1.5,hp:1,minLv:2},
  {emoji:'🧟',r:34,pts:40,spd:0.85,hp:2,minLv:3},
  {emoji:'🫥',r:22,pts:60,spd:2.0,hp:1,minLv:5},
  {emoji:'👁️',r:20,pts:20,spd:2.3,hp:1,minLv:4},
  {emoji:'🧛',r:30,pts:50,spd:1.7,hp:2,minLv:8},
  {emoji:'🕷️',r:24,pts:35,spd:2.8,hp:1,minLv:10},
  {emoji:'☠️',r:36,pts:80,spd:1.2,hp:3,minLv:15},
  {emoji:'🧌',r:40,pts:100,spd:0.7,hp:4,minLv:20},
  {emoji:'👿',r:28,pts:70,spd:2.2,hp:2,minLv:25},
  {emoji:'🔮',r:26,pts:90,spd:3.0,hp:1,minLv:30},
  {emoji:'🌑',r:32,pts:120,spd:2.5,hp:3,minLv:50},
  {emoji:'💫',r:18,pts:150,spd:3.8,hp:1,minLv:100},
];

let ghosts=[],particles=[],floats=[];
let score=0,lives=3,timeLeft=30,level=1,gs='idle';
let loopId=0; // monotonic id to prevent double-loops
let frame=0,spawnT=0;

// Level-scaled difficulty
function levelSpawnRate(lv){return Math.max(0.25,2.2-lv*0.018);}
function levelSpdMult(lv){return 1+lv*0.012;}
function levelTimeLimit(lv){
  // 30s for lv1-10, gradually reduces to 20s at lv100, 15s at lv1000+
  return Math.max(15,30-Math.floor(lv/10));
}
function levelGhostPool(lv){
  return TYPES.filter(t=>t.minLv<=lv);
}

function spawnGhost(lv){
  const pool=levelGhostPool(lv);
  const t=pool[Math.floor(Math.random()*pool.length)];
  const spdM=levelSpdMult(lv);
  const spd=t.spd*spdM;
  const edge=Math.floor(Math.random()*4);
  let x,y,vx,vy;
  const s60=spd*60;
  if(edge===0){x=Math.random()*W;y=-50;vx=(Math.random()-.5)*s60;vy=s60*(0.5+Math.random()*0.5);}
  else if(edge===1){x=W+50;y=Math.random()*H;vx=-s60*(0.5+Math.random()*0.5);vy=(Math.random()-.5)*s60;}
  else if(edge===2){x=Math.random()*W;y=H+50;vx=(Math.random()-.5)*s60;vy=-s60*(0.5+Math.random()*0.5);}
  else{x=-50;y=Math.random()*H;vx=s60*(0.5+Math.random()*0.5);vy=(Math.random()-.5)*s60;}
  // HP scales slightly with level for existing types
  const hpBonus=t.minLv>=50?0:Math.floor(lv/40);
  const hp=t.hp+hpBonus;
  ghosts.push({...t,x,y,vx,vy,hp,maxHp:hp,wobble:Math.random()*Math.PI*2,wobbleSpd:1.5+Math.random()*2,hitT:0});
}

function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=60+Math.random()*120;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,r:3+Math.random()*4});
  }
}

function floatText(x,y,txt,color){
  floats.push({x,y,txt,color,life:1.2,vy:-55});
}

function updateLives(){
  if(lives>6)livesEl.textContent='❤️×'+lives;
  else livesEl.textContent='❤️'.repeat(Math.max(0,lives));
}

let pointerHandled=false; // debounce same-frame double events
function tryHit(px,py){
  if(gs!=='playing')return;
  for(let i=ghosts.length-1;i>=0;i--){
    const g=ghosts[i];
    const dx=px-g.x,dy=py-g.y;
    if(dx*dx+dy*dy<(g.r+12)*(g.r+12)){
      g.hp--;
      if(g.hp<=0){
        const pts=g.pts*(level>50?3:level>20?2:1);
        score+=pts;scoreEl.textContent=score;
        spawnParticles(g.x,g.y,'#aaffee',14);
        floatText(g.x,g.y-g.r,'+'+pts,'#aaffee');
        ghosts.splice(i,1);
      } else {
        g.hitT=0.18;
        floatText(g.x,g.y-g.r,'Hit!','#ffee88');
      }
      return true; // hit something
    }
  }
  return false; // missed
}

function showLevelBanner(text,cb){
  lvlBannerTxt.textContent=text;
  lvlBanner.style.opacity='1';
  setTimeout(()=>{lvlBanner.style.opacity='0';setTimeout(cb,350);},900);
}

function endGame(reason){
  gs='over';
  overlay.innerHTML=`
    <div style="font-size:3rem">💀</div>
    <h1 style="font-size:2rem">${reason}</h1>
    <p style="color:#cc88ff;font-size:1.1rem;font-weight:700">Level ${level} · Score ${score}</p>
    <p style="color:#aabbff">Highest level reached: <strong style="color:#ffee88">${level}</strong></p>
    <button class="btn-main" onclick="startGame()">Play Again</button>
    <button class="btn-sec" onclick="location.href='/'">Home</button>`;
  overlay.style.display='flex';
}

function advanceLevel(){
  gs='between';
  ghosts=[];
  level++;
  lvlEl.textContent=level;
  timeLeft=levelTimeLimit(level);
  timerEl.textContent=timeLeft;
  spawnT=0;
  // Bonus life every 10 levels
  if(level%10===0){lives++;updateLives();floatText(W/2,H/2,'❤️ BONUS LIFE!','#ff88aa');}
  showLevelBanner(`👻 Level ${level}`,()=>{gs='playing';});
}

function startGame(){
  score=0;lives=3;level=1;timeLeft=30;spawnT=0;
  ghosts=[];particles=[];floats=[];frame=0;gs='playing';
  scoreEl.textContent=0;timerEl.textContent=30;lvlEl.textContent=1;updateLives();
  overlay.style.display='none';
  const myId=++loopId;
  let last=performance.now(),secT=0;
  showLevelBanner('👻 Level 1',()=>{});
  function loop(now){
    if(myId!==loopId)return; // stale loop — stop
    if(gs==='over')return;
    const dt=Math.min((now-last)/1000,0.05);last=now;frame++;
    if(gs==='playing'){
      // timer
      secT+=dt;
      if(secT>=1){secT-=1;timeLeft--;timerEl.textContent=timeLeft;
        if(timeLeft<=0){advanceLevel();secT=0;}
      }
      // spawn
      spawnT+=dt;
      const sr=levelSpawnRate(level);
      if(spawnT>=sr){spawnT-=sr;spawnGhost(level);}
      // update ghosts
      for(let i=ghosts.length-1;i>=0;i--){
        const g=ghosts[i];
        g.wobble+=g.wobbleSpd*dt;
        g.x+=g.vx*dt;g.y+=g.vy*dt;
        if(g.hitT>0)g.hitT-=dt;
        if(g.x<-90||g.x>W+90||g.y<-90||g.y>H+90){
          ghosts.splice(i,1);
          lives--;updateLives();
          if(lives<=0){endGame('No Lives Left!');return;}
        }
      }
    }
    // particles & floats always update
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=130*dt;p.life-=dt*1.6;
      if(p.life<=0)particles.splice(i,1);
    }
    for(let i=floats.length-1;i>=0;i--){
      const f=floats[i];f.y+=f.vy*dt;f.life-=dt;if(f.life<=0)floats.splice(i,1);
    }
    draw();requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

function draw(){
  // Background
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  // Grid tint shifts with level
  const hue=(level*17)%360;
  ctx.strokeStyle=`hsla(${hue},60%,50%,.1)`;ctx.lineWidth=1;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Ghosts
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const g of ghosts){
    ctx.save();
    const wobX=Math.sin(g.wobble)*4,wobY=Math.cos(g.wobble*0.7)*3;
    ctx.translate(g.x+wobX,g.y+wobY);
    if(g.hitT>0){ctx.scale(1.25,1.25);ctx.globalAlpha=0.55;}
    ctx.font=`${g.r*2}px serif`;
    ctx.fillText(g.emoji,0,0);
    // HP bar
    if(g.maxHp>1){
      const bw=g.r*2,bh=5,bx=-g.r,by=g.r+6;
      ctx.fillStyle='#333';ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle=g.hp/g.maxHp>0.5?'#44ff88':'#ff4466';
      ctx.fillRect(bx,by,bw*(g.hp/g.maxHp),bh);
      ctx.strokeStyle='#ffffff33';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
    }
    ctx.restore();
    ctx.globalAlpha=1;
  }

  // Float texts
  ctx.textAlign='center';
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.life*1.5);
    ctx.font='bold 18px Segoe UI';ctx.fillStyle=f.color;
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

// Input — use only pointerdown to avoid double-firing on mobile
canvas.addEventListener('pointerdown',e=>{
  if(gs!=='playing')return;
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  tryHit(e.clientX-r.left,e.clientY-r.top);
});

// Multi-touch: touchstart only as fallback for non-pointer browsers
let _ptDown=false;
canvas.addEventListener('touchstart',e=>{
  if(_ptDown)return; // pointer already handled
  if(gs!=='playing')return;
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  for(const t of e.changedTouches)tryHit(t.clientX-r.left,t.clientY-r.top);
},{passive:false});
canvas.addEventListener('pointerdown',()=>{_ptDown=true},{capture:true});
canvas.addEventListener('pointerup',()=>{setTimeout(()=>{_ptDown=false},50)},{capture:true});

document.getElementById('play-btn').addEventListener('click',startGame);
draw();
</script>
</body>
</html>
