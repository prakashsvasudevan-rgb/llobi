<title>Sort the Court</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1228;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Georgia',serif;overflow:hidden;user-select:none;}
canvas{display:block;border-radius:8px;border:2px solid #4a3060;}
#stats-bar{display:flex;gap:18px;margin-bottom:8px;font-size:14px;color:#ffe8a0;}
.stat{display:flex;align-items:center;gap:6px;}
.stat-bar-bg{width:90px;height:12px;background:#2a1a40;border-radius:6px;border:1px solid #5a3a80;overflow:hidden;}
.stat-fill{height:100%;border-radius:6px;transition:width .4s;}
#day-label{color:#ffcc66;font-size:16px;font-weight:bold;margin-bottom:4px;text-align:center;}
#btns{display:flex;gap:20px;margin-top:8px;}
.choice-btn{padding:10px 36px;font-size:18px;font-weight:bold;border-radius:10px;border:none;cursor:pointer;font-family:Georgia,serif;letter-spacing:1px;transition:all .15s;}
#yes-btn{background:linear-gradient(135deg,#228833,#44cc55);color:#fff;border:3px solid #66ff88;box-shadow:0 4px 16px rgba(0,200,80,0.4);}
#yes-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,200,80,0.6);}
#no-btn{background:linear-gradient(135deg,#882222,#cc3333);color:#fff;border:3px solid #ff6666;box-shadow:0 4px 16px rgba(200,0,0,0.4);}
#no-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 24px rgba(200,0,0,0.6);}
.choice-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
#hint-label{color:#aa88cc;font-size:12px;margin-top:4px;}

/* Advisor selection overlay */
#advisor-screen{position:fixed;inset:0;background:#0d0820;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;}
#advisor-screen h1{color:#ffcc44;font-size:28px;margin-bottom:6px;text-shadow:0 0 20px #ff8800;}
#advisor-screen p{color:#cc99ff;font-size:14px;margin-bottom:22px;}
#advisor-cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:700px;}
.adv-card{background:#1e1040;border:2px solid #4a2880;border-radius:12px;padding:16px 14px;width:120px;cursor:pointer;text-align:center;transition:all .2s;}
.adv-card:hover{border-color:#cc88ff;background:#2a1a50;transform:translateY(-4px);box-shadow:0 8px 24px rgba(180,100,255,0.3);}
.adv-card.chosen{border-color:#ffcc44;background:#2a1a50;box-shadow:0 0 20px rgba(255,200,0,0.4);}
.adv-icon{font-size:36px;margin-bottom:6px;}
.adv-name{color:#ffdd88;font-size:14px;font-weight:bold;margin-bottom:4px;}
.adv-role{color:#aa88cc;font-size:11px;margin-bottom:6px;line-height:1.3;}
.adv-trait{font-size:10px;color:#88ffaa;background:rgba(0,100,50,0.3);border-radius:4px;padding:2px 6px;}
#start-btn{margin-top:20px;padding:12px 44px;font-size:18px;font-weight:bold;background:linear-gradient(135deg,#6622cc,#aa44ff);color:#fff;border:3px solid #cc88ff;border-radius:12px;cursor:pointer;font-family:Georgia,serif;display:none;transition:all .2s;}
#start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(180,100,255,0.5);}

let chosenAdvisor=null;

function buildAdvisorCards(){
  const container=document.getElementById('advisor-cards');
  ADVISORS.forEach(a=>{
    const card=document.createElement('div');
    card.className='adv-card';card.id='adv-'+a.id;
    card.innerHTML=`<div class="adv-icon">${a.icon}</div><div class="adv-name">${a.name}</div><div class="adv-role">${a.role}</div><div class="adv-trait">${a.trait}</div>`;
    card.onclick=()=>{
      document.querySelectorAll('.adv-card').forEach(c=>c.classList.remove('chosen'));
      card.classList.add('chosen');chosenAdvisor=a;
      document.getElementById('start-btn').style.display='block';
    };
    container.appendChild(card);
  });
}

function startGame(){
  if(!chosenAdvisor) return;
  document.getElementById('advisor-screen').style.display='none';
  document.getElementById('day-label').style.display='block';
  document.getElementById('stats-bar').style.display='flex';
  document.getElementById('c').style.display='block';
  document.getElementById('btns').style.display='flex';
  document.getElementById('hint-label').style.display='block';
  document.getElementById('adv-name-label').textContent=chosenAdvisor.icon+' '+chosenAdvisor.name;
  shuffleEvents();nextEvent();updateStats();loop();
}

// ── ADVISOR ADVICE ────────────────────────────────────────
let currentAdvice='';
function computeAdvice(ev){
  if(!chosenAdvisor||!ev) return;
  const a=chosenAdvisor;
  const yesScore=ev.yes.g*a.wg+ev.yes.p*a.wp+ev.yes.h*a.wh;
  const noScore=ev.no.g*a.wg+ev.no.p*a.wp+ev.no.h*a.wh;
  // accuracy: sometimes give wrong advice
  let suggestYes=yesScore>=noScore;
  if(Math.random()>a.accuracy) suggestYes=!suggestYes;
  const pool=suggestYes?a.yes:a.no;
  currentAdvice=pool[Math.floor(Math.random()*pool.length)];
}

let pendingFarmDay=-1,pendingOrchardDay=-1;
function applySpecial(key){
  switch(key){
    case 'wizard_yes':
      if(Math.random()<0.55){g2(30);showEffect('+30 gold from the spell! ✨',true);}
      else if(Math.random()<0.5){p2(-4);showEffect('5 people turned into frogs! 🐸',false);}
      else{h2(20);showEffect('The whole town feels magical! ✨',true);}
      break;
    case 'wizard_no': h2(2);break;
    case 'straw_gold':
      if(Math.random()<0.4){g2(-5+40);showEffect('It worked! +35 gold net! 💰',true);}
      else{g2(-5);showEffect('McGee runs off with your 5 gold. 🏃',false);}
      break;
    case 'dark_magic':
      if(Math.random()<0.45){g2(50);showEffect('Dark spell works! +50 gold! 💀💰',true);}
      else{p2(-5);showEffect('Backfires! Lost 5 people to shadows! 💀',false);}
      break;
    case 'gem':
      if(Math.random()<0.4){g2(-40+80);showEffect('Gem worth 80 gold! +40 net! 💎',true);}
      else{g2(-40);showEffect('Just a pretty rock. 40 gold wasted.',false);}
      break;
    case 'war':
      if(Math.random()<0.5){g2(40);h2(10);showEffect('Victory! +40 gold! ⚔️',true);}
      else{g2(-20);p2(-6);showEffect('Defeat! Lost people and gold. 💀',false);}
      break;
    case 'farm': pendingFarmDay=day+2;showEffect('Seeds planted! Harvest in 2 days. 🌱',true);break;
    case 'orchard': pendingOrchardDay=day+3;showEffect('Orchard planted! Apples in 3 days. 🍎',true);break;
    case 'spy':
      if(Math.random()<0.55){g2(25);showEffect('Secrets stolen! +25 gold. 🕵️',true);}
      else{h2(-10);showEffect('Spy caught! -10 happiness. 😬',false);}
      break;
    case 'smuggler':
      g2(-10);
      if(Math.random()<0.6){g2(35);showEffect('Smugglers busted! +25 net gold! 💰',true);}
      else{p2(-2);showEffect('Smugglers escape and retaliate. 😠',false);}
      break;
    case 'dragon_yes': h2(15);g2(10);showEffect('Flint guards the kingdom! 🐉 +15 happy!',true);break;
    case 'potion':
      if(Math.random()<0.6){g2(20);h2(5);showEffect('Potion works! +20 gold productivity! 🧪',true);}
      else{p2(-3);showEffect('Potion turns 3 people into goats. 🐐',false);}
      break;
    case 'storm_magic':
      if(Math.random()<0.55){h2(10);showEffect('Storm diverted! The kingdom is safe! ⚡→☀️',true);}
      else{g2(-15);h2(-5);showEffect('Storm magic backfires. Things got worse.',false);}
      break;
    case 'treasure':
      if(Math.random()<0.5){g2(60);showEffect('Treasure found! +60 gold! 💎',true);}
      else{g2(-20);showEffect('The map was fake! Lost 20 gold.',false);}
      break;
    case 'machine':
      if(Math.random()<0.45){g2(40);showEffect('It works! Free energy saves +40 gold! ⚙️',true);}
      else{g2(-30);h2(-5);showEffect('Machine explodes. -30 gold, 5 happiness.',false);}
      break;
    case 'ghost_treasure':
      if(Math.random()<0.65){g2(45);showEffect('The treasure is real! +45 gold! 👻💰',true);}
      else{h2(-8);showEffect('Sue lied. The \"treasure\" was just old socks.',false);}
      break;
  }
  gold=clamp(gold,0,GOLD_MAX);people=clamp(people,0,PEOPLE_MAX);happiness=clamp(happiness,0,HAPPY_MAX);
  updateStats();
}
function g2(v){gold=clamp(gold+v,0,GOLD_MAX);if(v!==0) addFloat((v>0?'+':'')+v+'💰',W/2-80,H-80,v>0?'#ffdd44':'#ff6666');}
function p2(v){people=clamp(people+v,0,PEOPLE_MAX);if(v!==0) addFloat((v>0?'+':'')+v+'👥',W/2,H-80,v>0?'#88aaff':'#ff6666');}
function h2(v){happiness=clamp(happiness+v,0,HAPPY_MAX);if(v!==0) addFloat((v>0?'+':'')+v+'😊',W/2+80,H-80,v>0?'#ff88bb':'#ff6666');}

function drawCharacter(type,x,y,scale=1,flip=false,bob=0){
  const col=CHAR_COLS[type]||CHAR_COLS.peasant;
  ctx.save();ctx.translate(x,y+bob);if(flip) ctx.scale(-1,1);ctx.scale(scale,scale);
  if(type==='dragon'){
    ctx.fillStyle='#2a9944';ctx.beginPath();ctx.ellipse(0,-20,22,16,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#44cc66';ctx.beginPath();ctx.ellipse(0,-20,16,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2a9944';ctx.beginPath();ctx.ellipse(18,-30,14,10,0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff4400';ctx.beginPath();ctx.arc(24,-33,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(25,-33,1.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a7733';ctx.beginPath();ctx.moveTo(-10,-20);ctx.bezierCurveTo(-30,-50,-50,-40,-45,-20);ctx.lineTo(-10,-15);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#2a9944';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-18,-20);ctx.bezierCurveTo(-35,-15,-40,-5,-35,5);ctx.stroke();
    ctx.restore();return;
  }
  if(type==='ghost'){
    ctx.fillStyle='rgba(200,220,255,0.55)';ctx.beginPath();ctx.arc(0,-28,16,Math.PI,0);ctx.lineTo(16,4);for(let i=0;i<4;i++) ctx.quadraticCurveTo(10-i*8,i%2===0?10:0,-2-i*4,4);ctx.lineTo(-16,4);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(50,80,150,0.7)';ctx.beginPath();ctx.ellipse(-6,-30,4,5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(6,-30,4,5,0,0,Math.PI*2);ctx.fill();
    ctx.restore();return;
  }
  // legs
  ctx.fillStyle='#555566';ctx.fillRect(-10,2,8,16);ctx.fillRect(2,2,8,16);
  ctx.fillStyle='#333';ctx.fillRect(-11,17,10,5);ctx.fillRect(1,17,10,5);
  // body
  ctx.fillStyle=col.body;ctx.beginPath();ctx.roundRect(-13,-22,26,26,3);ctx.fill();
  if(col.extra==='armor'){ctx.fillStyle='rgba(180,180,200,0.4)';ctx.beginPath();ctx.roundRect(-13,-22,26,26,3);ctx.fill();}
  if(col.extra==='apron'){ctx.fillStyle='#664422';ctx.fillRect(-8,-16,16,22);}
  if(col.extra==='cape'||type==='vampire'){ctx.fillStyle='#330011';ctx.beginPath();ctx.moveTo(-12,-18);ctx.lineTo(-24,20);ctx.lineTo(-12,10);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(12,-18);ctx.lineTo(24,20);ctx.lineTo(12,10);ctx.closePath();ctx.fill();}
  if(col.extra==='belt'){ctx.fillStyle='#553300';ctx.fillRect(-13,-2,26,5);}
  // arms
  ctx.fillStyle=col.body;ctx.fillRect(-20,-20,8,18);ctx.fillRect(12,-20,8,18);
  ctx.fillStyle=col.head;ctx.beginPath();ctx.arc(-16,0,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(16,0,5,0,Math.PI*2);ctx.fill();
  // extras
  if(col.extra==='wand'){ctx.strokeStyle=type==='witch'?'#88ff44':'#cc88ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(16,-5);ctx.lineTo(26,-18);ctx.stroke();ctx.fillStyle=type==='witch'?'#aaffaa':'#ffaaff';ctx.beginPath();ctx.arc(26,-18,4,0,Math.PI*2);ctx.fill();}
  if(col.extra==='scroll'){ctx.fillStyle='#eedd99';ctx.fillRect(10,-5,10,14);ctx.strokeStyle='#886600';ctx.lineWidth=1;ctx.strokeRect(10,-5,10,14);}
  if(col.extra==='bag'){ctx.fillStyle='#aa7733';ctx.beginPath();ctx.arc(-16,0,7,0,Math.PI*2);ctx.fill();}
  if(col.extra==='lute'){ctx.fillStyle='#cc8833';ctx.beginPath();ctx.ellipse(16,2,6,8,0.3,0,Math.PI*2);ctx.fill();}
  if(col.extra==='cross'){ctx.strokeStyle='#ffdd88';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-16,-12);ctx.lineTo(-16,2);ctx.stroke();ctx.beginPath();ctx.moveTo(-21,-6);ctx.lineTo(-11,-6);ctx.stroke();}
  if(col.extra==='potion'){ctx.fillStyle='#44aaff';ctx.beginPath();ctx.arc(16,-2,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(100,200,255,0.7)';ctx.beginPath();ctx.arc(13,-5,3,0,Math.PI*2);ctx.fill();}
  if(col.extra==='bow'){ctx.strokeStyle='#885522';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-16,-6,10,0.5,2.6);ctx.stroke();ctx.strokeStyle='#ccaa66';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-16,-16);ctx.lineTo(-16,4);ctx.stroke();}
  if(col.extra==='fan'){ctx.fillStyle='#cc44aa';ctx.beginPath();ctx.arc(-16,-5,8,Math.PI,0);ctx.fill();}
  if(col.extra==='patch'){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-6,-31,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-12,-31);ctx.lineTo(0,-31);ctx.stroke();}
  // head
  ctx.fillStyle=col.head;ctx.beginPath();ctx.arc(0,-30,12,0,Math.PI*2);ctx.fill();
  // face
  ctx.fillStyle=type==='vampire'?'#660011':'#111';
  ctx.beginPath();ctx.arc(-4,-30,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(4,-30,2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-27,3.5,0.1*Math.PI,0.9*Math.PI);ctx.stroke();
  if(type==='witch'){ctx.fillStyle='#44aa00';ctx.beginPath();ctx.arc(-4,-30,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(4,-30,2,0,Math.PI*2);ctx.fill();}
  if(type==='vampire'){ctx.fillStyle='#cc0022';ctx.font='8px sans-serif';ctx.textAlign='center';ctx.fillText('⌐¬',-1,-27);}
  // hat
  if(col.hat){
    ctx.fillStyle=col.hat;
    if(type==='knight'||type==='soldier'){ctx.beginPath();ctx.roundRect(-13,-45,26,16,2);ctx.fill();}
    else if(type==='wizard'||type==='witch'){ctx.beginPath();ctx.moveTo(0,-58);ctx.lineTo(-12,-42);ctx.lineTo(12,-42);ctx.closePath();ctx.fill();if(type==='witch'){ctx.fillStyle='#cc8800';ctx.beginPath();ctx.arc(0,-42,6,Math.PI,0);ctx.fill();}}
    else if(type==='jester'){ctx.beginPath();ctx.moveTo(-6,-42);ctx.bezierCurveTo(-10,-55,2,-55,0,-45);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(6,-42);ctx.bezierCurveTo(10,-55,18,-50,14,-42);ctx.closePath();ctx.fill();ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(0,-44,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(14,-41,3,0,Math.PI*2);ctx.fill();}
    else if(type==='priest'){ctx.beginPath();ctx.arc(0,-41,10,Math.PI,0);ctx.fill();}
    else if(type==='spy'){ctx.fillRect(-12,-44,24,6);}
    else if(type==='pirate'){ctx.beginPath();ctx.moveTo(-14,-42);ctx.lineTo(-16,-50);ctx.lineTo(16,-50);ctx.lineTo(14,-42);ctx.closePath();ctx.fill();ctx.fillStyle='#ffffff';ctx.fillRect(-8,-52,16,4);}
    else if(type==='chef'){ctx.beginPath();ctx.arc(0,-44,10,Math.PI,0);ctx.fill();ctx.fillRect(-10,-44,20,8);ctx.beginPath();ctx.arc(0,-44,10,0,Math.PI);ctx.fill();}
    else if(type==='vampire'){ctx.beginPath();ctx.moveTo(-13,-42);ctx.lineTo(-16,-56);ctx.lineTo(0,-50);ctx.lineTo(16,-56);ctx.lineTo(13,-42);ctx.closePath();ctx.fill();}
    else if(type==='noble'){ctx.fillStyle='#cc44ff';ctx.beginPath();ctx.arc(0,-41,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffff00';ctx.beginPath();ctx.arc(-6,-46,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,-48,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(6,-46,2,0,Math.PI*2);ctx.fill();}
    else{ctx.beginPath();ctx.roundRect(-11,-44,22,14,2);ctx.fill();}
  }
  if(type==='bard'){ctx.fillStyle='#ff8800';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('♪',-16,-12);}
  ctx.restore();
}

function drawAdvisor(x,y){
  if(!chosenAdvisor) return;
  ctx.save();ctx.translate(x,y);ctx.scale(0.7,0.7);
  // small advisor figure (robed)
  ctx.fillStyle=chosenAdvisor.color;
  ctx.beginPath();ctx.roundRect(-10,-28,20,30,3);ctx.fill();
  ctx.fillStyle='#f4c07a';ctx.beginPath();ctx.arc(0,-34,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-3,-34,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(3,-34,1.5,0,Math.PI*2);ctx.fill();
  // hat/icon based on advisor
  if(chosenAdvisor.id==='earl'){ctx.fillStyle='#3366aa';ctx.beginPath();ctx.roundRect(-9,-44,18,12,2);ctx.fill();}
  else if(chosenAdvisor.id==='goldie'){ctx.fillStyle='#ddaa00';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('💰',0,-42);}
  else if(chosenAdvisor.id==='dove'){ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('🕊️',0,-44);}
  else if(chosenAdvisor.id==='rex'){ctx.fillStyle='#aa2200';ctx.beginPath();ctx.roundRect(-9,-44,18,12,2);ctx.fill();ctx.fillStyle='#ffaa00';ctx.font='8px sans-serif';ctx.textAlign='center';ctx.fillText('⚔',0,-36);}
  else if(chosenAdvisor.id==='crux'){ctx.fillStyle='#6622aa';ctx.beginPath();ctx.moveTo(0,-48);ctx.lineTo(-9,-38);ctx.lineTo(9,-38);ctx.closePath();ctx.fill();}
  ctx.restore();

  // advice bubble (small, above advisor)
  if(currentAdvice&&phase==='talking'){
    const words=currentAdvice.split(' ');
    const lines=[],maxW=90;
    let cur='';
    ctx.font='10px Georgia,serif';
    words.forEach(w=>{const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW){lines.push(cur);cur=w;}else cur=t;});
    if(cur) lines.push(cur);
    const lh=13,pad=8,tw=maxW+pad,th=lines.length*lh+pad;
    const bx=x-tw/2,by=y-th-40;
    ctx.fillStyle='rgba(230,210,255,0.95)';ctx.strokeStyle=chosenAdvisor.color;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(bx,by,tw,th,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#111';ctx.font='10px Georgia,serif';ctx.textAlign='center';
    lines.forEach((l,i)=>ctx.fillText(l,x,by+pad+9+i*lh));
    // tail
    ctx.fillStyle='rgba(230,210,255,0.95)';ctx.beginPath();ctx.moveTo(x-5,by+th);ctx.lineTo(x+5,by+th);ctx.lineTo(x,by+th+8);ctx.closePath();ctx.fill();
    ctx.strokeStyle=chosenAdvisor.color;ctx.beginPath();ctx.moveTo(x-5,by+th);ctx.lineTo(x,by+th+8);ctx.lineTo(x+5,by+th);ctx.stroke();
  }
}

function drawKing(x,y){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#6633aa';ctx.beginPath();ctx.roundRect(-30,-80,60,90,6);ctx.fill();
  ctx.fillStyle='#8844cc';ctx.fillRect(-28,-78,56,20);
  ['#ff4444','#44ff44','#4488ff'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(-16+i*16,-72,4,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle='#2244aa';ctx.fillRect(-16,8,12,18);ctx.fillRect(4,8,12,18);
  ctx.fillStyle='#113377';ctx.fillRect(-17,24,14,5);ctx.fillRect(3,24,14,5);
  ctx.fillStyle='#2244aa';ctx.beginPath();ctx.roundRect(-18,-20,36,30,4);ctx.fill();
  ctx.fillStyle='#1a3399';ctx.beginPath();ctx.moveTo(-18,-20);ctx.lineTo(-24,10);ctx.lineTo(24,10);ctx.lineTo(18,-20);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8822aa';ctx.beginPath();ctx.moveTo(-16,-18);ctx.lineTo(-28,15);ctx.lineTo(-16,10);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(16,-18);ctx.lineTo(28,15);ctx.lineTo(16,10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2244aa';ctx.fillRect(-28,-18,10,22);ctx.fillRect(18,-18,10,22);
  ctx.fillStyle='#f4c07a';ctx.beginPath();ctx.arc(-23,6,6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(23,6,6,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#ffcc00';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(23,6);ctx.lineTo(38,-28);ctx.stroke();
  ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(38,-28,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff4400';ctx.beginPath();ctx.arc(38,-28,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f4c07a';ctx.beginPath();ctx.arc(0,-34,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-5,-34,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(5,-34,2.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-30,4,0.1*Math.PI,0.9*Math.PI);ctx.stroke();
  ctx.strokeStyle='#886600';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,-28);ctx.bezierCurveTo(-4,-26,4,-26,6,-28);ctx.stroke();
  ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.moveTo(-14,-47);ctx.lineTo(-14,-57);ctx.lineTo(-7,-52);ctx.lineTo(0,-60);ctx.lineTo(7,-52);ctx.lineTo(14,-57);ctx.lineTo(14,-47);ctx.closePath();ctx.fill();
  ['#ff2200','#2222ff','#22aa22'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(-6+i*6,-56,3,0,Math.PI*2);ctx.fill();});
  ctx.restore();
}

function drawBg(){
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1a0d2e');bg.addColorStop(1,'#2a1540');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#3a2060';ctx.fillRect(0,H-55,W,55);
  ctx.fillStyle='#4a2880';ctx.fillRect(0,H-57,W,4);
  ctx.strokeStyle='rgba(100,60,160,0.4)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,H-55);ctx.lineTo(x,H);ctx.stroke();}
  ctx.fillStyle='#241540';ctx.fillRect(0,0,30,H-55);ctx.fillRect(W-30,0,30,H-55);
  drawWindow(60,30);drawWindow(W-100,30);
  drawBanner(100,0,'#8822cc');drawBanner(W-124,0,'#8822cc');
  ctx.fillStyle='#660022';ctx.beginPath();ctx.moveTo(W/2-30,H-55);ctx.lineTo(W/2+30,H-55);ctx.lineTo(W/2+60,H);ctx.lineTo(W/2-60,H);ctx.closePath();ctx.fill();
  ctx.fillStyle='#aa0033';ctx.fillRect(W/2-14,H-55,28,55);
  drawTorch(45,90);drawTorch(W-45,90);
}
function drawWindow(x,y){
  ctx.fillStyle='#1a2a44';ctx.beginPath();ctx.roundRect(x,y,40,55,4);ctx.fill();
  ctx.strokeStyle='#4466aa';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(180,200,255,0.12)';ctx.fillRect(x+2,y+2,36,51);
  ctx.fillStyle='#eeeeff';ctx.beginPath();ctx.arc(x+20,y+18,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(220,230,255,0.35)';ctx.beginPath();ctx.arc(x+20,y+18,10,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#4466aa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+20,y);ctx.lineTo(x+20,y+55);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y+28);ctx.lineTo(x+40,y+28);ctx.stroke();
}
function drawBanner(x,y,color){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+24,y);ctx.lineTo(x+24,y+70);ctx.lineTo(x+12,y+80);ctx.lineTo(x,y+70);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#cc66ff';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#ffcc00';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('♦',x+12,y+42);
}
function drawTorch(x,y){
  ctx.fillStyle='#664422';ctx.fillRect(x-3,y,6,20);
  ctx.fillStyle='#ff8800';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,180,0,0.12)';ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.fill();
}

function drawBubble(text,x,y){
  const lines=text.split('\n');const lh=18,pad=14;
  const tw=Math.max(...lines.map(l=>{ctx.font='13px Georgia,serif';return ctx.measureText(l).width;}))+pad*2;
  const th=lines.length*lh+pad*2;const bx=x-tw/2,by=y-th-18;
  ctx.fillStyle='rgba(255,250,230,0.95)';ctx.strokeStyle='#886600';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(bx,by,tw,th,10);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,250,230,0.95)';ctx.beginPath();ctx.moveTo(x-8,by+th);ctx.lineTo(x+8,by+th);ctx.lineTo(x,by+th+16);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#886600';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-8,by+th);ctx.lineTo(x,by+th+16);ctx.lineTo(x+8,by+th);ctx.stroke();
  ctx.fillStyle='#2a1400';ctx.font='13px Georgia,serif';ctx.textAlign='center';
  lines.forEach((l,i)=>ctx.fillText(l,x,by+pad+12+i*lh));
}

let effect={text:'',timer:0,good:true};
function showEffect(text,good){effect={text,timer:120,good};}
function drawEffect(){
  if(effect.timer<=0)return;
  ctx.globalAlpha=Math.min(1,effect.timer/30);
  ctx.fillStyle=effect.good?'#88ff88':'#ff8888';
  ctx.font='bold 15px Georgia,serif';ctx.textAlign='center';
  ctx.fillText(effect.text,W/2,80-Math.max(0,(120-effect.timer)/2));
  ctx.globalAlpha=1;effect.timer--;
}

let floaters=[];
function addFloat(text,x,y,color){floaters.push({text,x,y,color,life:70});}
function drawFloaters(){
  floaters=floaters.filter(f=>{
    ctx.save();ctx.globalAlpha=f.life/70;ctx.fillStyle=f.color;ctx.font='bold 14px Georgia,serif';ctx.textAlign='center';
    ctx.fillText(f.text,f.x,f.y);f.y-=0.7;f.life--;ctx.restore();return f.life>0;
  });
}

// ── GAME LOOP VARS ────────────────────────────────────────
let phase='walk_in',charX=W+60,charType='peasant',charName='',charText='',charYes=null,charNo=null;
let reactionTimer=0,answered=false,currentEvent=null;
let eventIdx=0,shuffledEvents=[],visitorCount=0,gameOverState=false;
const VISITORS_PER_DAY=3;
let frameN=0;

function shuffleEvents(){shuffledEvents=[...EVENTS].sort(()=>Math.random()-0.5);eventIdx=0;}
function nextEvent(){
  if(eventIdx>=shuffledEvents.length) shuffleEvents();
  const ev=shuffledEvents[eventIdx++];
  currentEvent=ev;charType=ev.char;charName=ev.name;charText=ev.text;charYes=ev.yes;charNo=ev.no;
  charX=W+60;phase='walk_in';answered=false;setBtns(false);
  currentAdvice='';
}
function setBtns(en){document.getElementById('yes-btn').disabled=!en;document.getElementById('no-btn').disabled=!en;}

function answer(yes){
  if(answered||phase!=='talking')return;
  answered=true;setBtns(false);
  const ch=yes?charYes:charNo;
  gold=clamp(gold+ch.g,0,GOLD_MAX);people=clamp(people+ch.p,0,PEOPLE_MAX);happiness=clamp(happiness+ch.h,0,HAPPY_MAX);
  if(ch.g!==0) addFloat((ch.g>0?'+':'')+ch.g+'💰',W/2-80,H-80,ch.g>0?'#ffdd44':'#ff6666');
  if(ch.p!==0) addFloat((ch.p>0?'+':'')+ch.p+'👥',W/2,H-80,ch.p>0?'#88aaff':'#ff6666');
  if(ch.h!==0) addFloat((ch.h>0?'+':'')+ch.h+'😊',W/2+80,H-80,ch.h>0?'#ff88bb':'#ff6666');
  if(ch.special) applySpecial(ch.special);
  else if(ch.msg) showEffect(ch.msg,(ch.g+ch.p*3+ch.h)>=0);
  updateStats();
  phase='react';reactionTimer=55;
  if(gold<=0||people<=0||happiness<=0) setTimeout(()=>gameOverState=true,600);
}

document.addEventListener('keydown',e=>{
  if(!chosenAdvisor) return;
  if(e.code==='KeyY'||e.code==='ArrowLeft') answer(true);
  if(e.code==='KeyN'||e.code==='ArrowRight') answer(false);
  if(e.code==='Space'&&gameOverState) resetGame();
});

function advanceDay(){
  day++;
  if(pendingFarmDay===day){g2(22);showEffect('Harvest ready! +22 gold! 🌾',true);pendingFarmDay=-1;updateStats();}
  if(pendingOrchardDay===day){g2(30);showEffect('Apple harvest! +30 gold! 🍎',true);pendingOrchardDay=-1;updateStats();}
  if(Math.random()<0.15){h2(Math.floor(Math.random()*8)-3);}
}

function resetGame(){
  gold=50;people=10;happiness=50;day=1;pendingFarmDay=-1;pendingOrchardDay=-1;
  gameOverState=false;floaters=[];effect.timer=0;
  shuffleEvents();nextEvent();updateStats();
}

function loop(){
  frameN++;
  drawBg();
  drawKing(W/2,H-55);
  // advisor figure to right of king
  drawAdvisor(W/2+70,H-55);

  const floorY=H-55-28,bob=Math.sin(frameN*0.08)*2;
  if(!gameOverState){
    if(phase==='walk_in'){
      charX-=3.5;drawCharacter(charType,charX,floorY,1,true,bob);
      if(charX<=W/2-120){charX=W/2-120;phase='talking';setBtns(true);computeAdvice(currentEvent);}
    } else if(phase==='talking'){
      drawCharacter(charType,charX,floorY,1,true,bob*0.5);
      drawBubble(charText,charX,floorY-45);
    } else if(phase==='react'){
      drawCharacter(charType,charX,floorY,1,true,Math.sin(frameN*0.3)*4);
      if(--reactionTimer<=0) phase='walk_out';
    } else if(phase==='walk_out'){
      charX-=3.5;drawCharacter(charType,charX,floorY,1,false,bob);
      if(charX<-80){
        visitorCount++;
        if(visitorCount>=VISITORS_PER_DAY){visitorCount=0;advanceDay();}
        nextEvent();
      }
    }
  }
  drawEffect();drawFloaters();

  if(gameOverState){
    ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffcc44';ctx.font='bold 30px Georgia,serif';ctx.textAlign='center';
    ctx.fillText('The Kingdom Has Fallen!',W/2,H/2-55);
    const reason=gold<=0?'💰 You ran out of gold!':people<=0?'👥 Your people fled!':'😊 The people revolted!';
    ctx.fillStyle='#ff9988';ctx.font='17px Georgia,serif';ctx.fillText(reason,W/2,H/2-20);
    ctx.fillStyle='#fff';ctx.font='15px Georgia,serif';ctx.fillText('You survived '+day+' days.',W/2,H/2+10);
    if(chosenAdvisor){ctx.fillStyle=chosenAdvisor.color;ctx.font='13px Georgia,serif';ctx.fillText(chosenAdvisor.icon+' '+chosenAdvisor.name+' says: "I tried to help..."',W/2,H/2+34);}
    ctx.fillStyle='#aaaaff';ctx.font='13px Georgia,serif';ctx.fillText('Press Space to try again',W/2,H/2+60);
  }
  requestAnimationFrame(loop);
}

buildAdvisorCards();
</script>
