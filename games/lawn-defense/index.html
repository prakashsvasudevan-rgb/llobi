<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lawn Defense</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a0a00;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;font-family:'Georgia',serif;overflow:hidden;}
#topbar{width:800px;height:52px;background:rgba(0,0,0,0.6);display:flex;align-items:center;gap:8px;padding:0 10px;flex-shrink:0;}
#sun-count{color:#ffe000;font-size:20px;font-weight:bold;min-width:70px;text-shadow:0 0 8px #ffaa00;}
.plant-btn{width:60px;height:60px;border:3px solid #554400;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,40,0,0.8);color:#fff;font-size:9px;text-align:center;position:relative;transition:border-color .15s;user-select:none;}
.plant-btn:hover:not(.disabled){border-color:#aacc00;background:rgba(40,70,0,0.9);}
.plant-btn.selected{border-color:#ffee00;box-shadow:0 0 10px #ffee00;}
.plant-btn.disabled{opacity:0.4;cursor:not-allowed;}
.plant-btn .cost{position:absolute;bottom:2px;right:3px;color:#ffe000;font-size:9px;}
.plant-btn .icon{font-size:26px;line-height:1;}
#shovel-btn{width:48px;height:48px;border:3px solid #554400;border-radius:8px;cursor:pointer;background:rgba(60,30,0,0.8);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;transition:border-color .15s;}
#shovel-btn:hover{border-color:#cc8800;}
#shovel-btn.selected{border-color:#ffee00;box-shadow:0 0 10px #ffee00;}
#wave-info{margin-left:auto;color:#ffcc88;font-size:13px;}
canvas{display:block;cursor:crosshair;}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10;}
#overlay h1{font-size:52px;color:#88ff44;text-shadow:0 0 30px #44ff00,0 0 60px #22aa00;margin-bottom:12px;}
#overlay .sub{color:#aaddaa;font-size:15px;margin-bottom:32px;text-align:center;line-height:1.9;}
#overlay button{padding:14px 56px;font-size:22px;background:linear-gradient(135deg,#226600,#44aa00);color:#fff;border:2px solid #88ff44;border-radius:10px;cursor:pointer;font-family:Georgia,serif;letter-spacing:2px;}
#overlay button:hover{background:linear-gradient(135deg,#338800,#66cc00);}
#gameover{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10;}
#gameover h2{font-size:54px;color:#ff4422;text-shadow:0 0 28px #ff0000;margin-bottom:10px;}
#gameover p{font-size:18px;color:#ffbbaa;margin-bottom:28px;}
#gameover button{padding:12px 44px;font-size:18px;background:linear-gradient(135deg,#226600,#44aa00);color:#fff;border:2px solid #88ff44;border-radius:8px;cursor:pointer;font-family:Georgia,serif;}
#win{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10;}
#win h2{font-size:54px;color:#ffee00;text-shadow:0 0 28px #ffaa00;margin-bottom:10px;}
#win p{font-size:18px;color:#ffffaa;margin-bottom:28px;}
#win button{padding:12px 44px;font-size:18px;background:linear-gradient(135deg,#226600,#44aa00);color:#fff;border:2px solid #88ff44;border-radius:8px;cursor:pointer;font-family:Georgia,serif;}
</style>
</head>
<body>
<div id="topbar">
  <div id="sun-count">☀ 150</div>
  <div id="plant-bar"></div>
  <div id="shovel-btn" title="Shovel (remove plant)">🪠</div>
  <div id="wave-info">Wave 1</div>
</div>
<canvas id="c"></canvas>

<div id="overlay">
  <h1>🌻 LAWN DEFENSE 🧟</h1>
  <div class="sub">
    Place plants to stop the zombie horde!<br>
    <b style="color:#88ff44">Click</b> a plant card, then <b style="color:#88ff44">click</b> a lawn tile to plant.<br>
    Sunflowers generate ☀ sun. Click falling suns to collect!<br>
    Zombies breach at the left — don't let them reach your house!
  </div>
  <button onclick="startGame()">🌿 START GAME 🌿</button>
</div>

<div id="gameover">
  <h2>🧟 OVERRUN! 🧟</h2>
  <p id="go-score"></p>
  <button onclick="location.reload()">Try Again</button>
</div>
<div id="win">
  <h2>🏆 YOU WIN! 🏆</h2>
  <p id="win-score"></p>
  <button onclick="location.reload()">Play Again</button>
</div>

<script>
const COLS=9,ROWS=5,CW=80,CH=100,OX=0,OY=0;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=ROWS*CH+20;
canvas.style.width='800px';

// ─── Plant definitions ───
const PLANT_DEFS=[
  {id:'sunflower',name:'Sunflower',icon:'🌻',cost:50,hp:100,color:'#ffdd00',desc:'Produces ☀ sun'},
  {id:'peashooter',name:'Peashooter',icon:'🌿',cost:100,hp:100,color:'#44cc00',desc:'Shoots peas'},
  {id:'snowpea',name:'Snow Pea',icon:'❄️',cost:175,hp:100,color:'#44aaff',desc:'Slows & shoots'},
  {id:'wallnut',name:'Wall-nut',icon:'🌰',cost:50,hp:400,color:'#cc7700',desc:'Tough barrier'},
  {id:'cherrybomb',name:'Cherry Bomb',icon:'🍒',cost:150,hp:1,color:'#cc0000',desc:'Big explosion!'},
  {id:'potatomine',name:'Potato Mine',icon:'🥔',cost:25,hp:1,color:'#886600',desc:'Explodes on contact'},
  {id:'sunshroom',name:'Sun-shroom',icon:'🍄',cost:25,hp:100,color:'#ffaa00',desc:'Small→big sun'},
  {id:'repeater',name:'Repeater',icon:'🌱',cost:200,hp:100,color:'#228800',desc:'Shoots 2 peas'},
];

// ─── Zombie definitions ───
const ZOMBIE_DEFS={
  basic:  {name:'Zombie',    hp:200, spd:0.3, dmg:1,  reward:10, color:'#88aa66'},
  cone:   {name:'Conehead',  hp:370, spd:0.3, dmg:1,  reward:15, color:'#99bb77'},
  bucket: {name:'Buckethead',hp:650, spd:0.25,dmg:1.2,reward:25, color:'#aabb88'},
  flag:   {name:'Flag',      hp:200, spd:0.4, dmg:1,  reward:10, color:'#88aa66'},
  giga:   {name:'Giga-conehead',hp:1400,spd:0.22,dmg:2,reward:50,color:'#bbccaa'},
};

// ─── Wave definitions ───
const WAVES=[
  [{type:'basic',count:5,interval:4}],
  [{type:'basic',count:5,interval:3},{type:'cone',count:2,interval:5}],
  [{type:'basic',count:7,interval:2.5},{type:'cone',count:3,interval:4}],
  [{type:'cone',count:5,interval:3},{type:'bucket',count:1,interval:8}],
  [{type:'basic',count:8,interval:2},{type:'cone',count:4,interval:3},{type:'bucket',count:2,interval:6}],
  [{type:'cone',count:6,interval:2.5},{type:'bucket',count:3,interval:5}],
  [{type:'bucket',count:4,interval:4},{type:'basic',count:10,interval:1.5}],
  [{type:'cone',count:8,interval:2},{type:'bucket',count:4,interval:4},{type:'giga',count:1,interval:12}],
  [{type:'bucket',count:6,interval:3},{type:'giga',count:2,interval:10}],
  [{type:'giga',count:5,interval:5},{type:'bucket',count:8,interval:2},{type:'cone',count:10,interval:1.5}],
];

let grid=[], plants=[], zombies=[], projectiles=[], suns=[], particles=[];
let sunAmount=150, score=0, selectedPlant=null, usingShovel=false;
let waveIdx=0, waveTimer=0, waveActive=false, spawnQueue=[], spawnTimer=0;
let betweenWaves=false, betweenTimer=0;
let gameRunning=false, gameOver=false;
let lastTime=0, animT=0;

function startGame(){
  document.getElementById('overlay').style.display='none';
  buildUI();
  buildGrid();
  gameRunning=true;
  betweenWaves=true;betweenTimer=5;
  requestAnimationFrame(loop);
  setInterval(dropFreeSun,7000);
}

function buildUI(){
  const bar=document.getElementById('plant-bar');
  bar.innerHTML='';
  PLANT_DEFS.forEach((p,i)=>{
    const btn=document.createElement('div');
    btn.className='plant-btn';btn.id='btn-'+p.id;
    btn.innerHTML=`<div class="icon">${p.icon}</div><div>${p.name}</div><div class="cost">☀${p.cost}</div>`;
    btn.title=p.desc;
    btn.onclick=()=>selectPlant(p);
    bar.appendChild(btn);
  });
  document.getElementById('shovel-btn').onclick=()=>{
    usingShovel=!usingShovel;selectedPlant=null;
    document.querySelectorAll('.plant-btn').forEach(b=>b.classList.remove('selected'));
    document.getElementById('shovel-btn').classList.toggle('selected',usingShovel);
  };
}

function selectPlant(p){
  if(p.cost>sunAmount)return;
  usingShovel=false;
  document.getElementById('shovel-btn').classList.remove('selected');
  selectedPlant=p;
  document.querySelectorAll('.plant-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('btn-'+p.id).classList.add('selected');
}

function buildGrid(){
  grid=[];
  for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++)grid[r][c]=null;}
}

function cellX(c){return OX+c*CW+CW/2;}
function cellY(r){return OY+r*CH+CH/2+10;}
function tileX(c){return OX+c*CW;}
function tileY(r){return OY+r*CH+10;}

// ─── Planting ───
canvas.addEventListener('click',e=>{
  if(!gameRunning)return;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const c=Math.floor((mx-OX)/CW),r=Math.floor((my-OY-10)/CH);
  if(c<0||c>=COLS||r<0||r>=ROWS)return;

  if(usingShovel){
    if(grid[r][c]){removePlant(r,c);}
    return;
  }
  if(!selectedPlant)return;
  if(grid[r][c])return;
  if(selectedPlant.cost>sunAmount)return;

  sunAmount-=selectedPlant.cost;
  placePlant(r,c,selectedPlant);
  updateSunDisplay();
  updateButtonStates();
  selectedPlant=null;
  document.querySelectorAll('.plant-btn').forEach(b=>b.classList.remove('selected'));
});

function placePlant(r,c,def){
  const p={row:r,col:c,def,hp:def.hp,maxHp:def.hp,
    shootTimer:0,sunTimer:0,active:true,armedT:0,
    stage:def.id==='sunshroom'?0:1};
  grid[r][c]=p;plants.push(p);
  if(def.id==='cherrybomb'){
    setTimeout(()=>cherryExplode(p),2000);
  }
}

function removePlant(r,c){
  const p=grid[r][c];if(!p)return;
  plants=plants.filter(x=>x!==p);
  grid[r][c]=null;
  spawnParticles(cellX(c),cellY(r),p.def.color,8);
}

// ─── Sun ───
function dropFreeSun(){
  if(!gameRunning||gameOver)return;
  const x=80+Math.random()*640,y=-20;
  suns.push({x,y,vy:1.2,land:60+Math.random()*200,collected:false,life:8,big:false});
}

function collectSun(sun,big){
  sunAmount+=big?50:25;
  updateSunDisplay();
  updateButtonStates();
  sun.collected=true;
  spawnParticles(sun.x,sun.y,'#ffee00',6);
}

canvas.addEventListener('click',e=>{
  if(!gameRunning)return;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  for(const s of suns){
    if(!s.collected&&Math.hypot(mx-s.x,my-s.y)<22){collectSun(s,s.big);return;}
  }
});

function updateSunDisplay(){
  document.getElementById('sun-count').textContent='☀ '+sunAmount;
}
function updateButtonStates(){
  PLANT_DEFS.forEach(p=>{
    const btn=document.getElementById('btn-'+p.id);
    if(btn)btn.classList.toggle('disabled',p.cost>sunAmount);
  });
}

// ─── Wave spawning ───
function startWave(){
  if(waveIdx>=WAVES.length){setTimeout(()=>winGame(),2000);return;}
  betweenWaves=false;waveActive=true;spawnQueue=[];
  const waveDef=WAVES[waveIdx];
  document.getElementById('wave-info').textContent='Wave '+(waveIdx+1)+' / '+WAVES.length;
  waveDef.forEach(group=>{
    for(let i=0;i<group.count;i++){
      spawnQueue.push({type:group.type,delay:i*group.interval+Math.random()*1.5});
    }
  });
  spawnQueue.sort((a,b)=>a.delay-b.delay);
  spawnTimer=0;
}

function updateWaves(dt){
  if(betweenWaves){
    betweenTimer-=dt;
    if(betweenTimer<=0){startWave();}
    return;
  }
  if(!waveActive)return;
  spawnTimer+=dt;
  while(spawnQueue.length&&spawnQueue[0].delay<=spawnTimer){
    const e=spawnQueue.shift();
    spawnZombie(e.type);
  }
  if(spawnQueue.length===0&&zombies.length===0){
    waveIdx++;
    if(waveIdx>=WAVES.length){setTimeout(()=>winGame(),2000);return;}
    betweenWaves=true;betweenTimer=8;waveActive=false;
    document.getElementById('wave-info').textContent='Next wave in 8s…';
  }
}

function spawnZombie(type){
  const def=ZOMBIE_DEFS[type]||ZOMBIE_DEFS.basic;
  const row=Math.floor(Math.random()*ROWS);
  zombies.push({type,row,x:820,hp:def.hp,maxHp:def.hp,
    spd:def.spd,dmg:def.dmg,reward:def.reward,def,
    atkTimer:0,eating:false,animT:0,dead:false});
}

// ─── Cherry bomb ───
function cherryExplode(p){
  if(!plants.includes(p))return;
  const cx=cellX(p.col),cy=cellY(p.row);
  for(let r=p.row-1;r<=p.row+1;r++)for(let c=p.col-1;c<=p.col+1;c++){
    if(r<0||r>=ROWS||c<0||c>=COLS)continue;
    if(grid[r][c]&&grid[r][c]!==p)continue;
  }
  zombies.forEach(z=>{
    if(Math.abs(z.row-p.row)<=1&&z.x>=tileX(p.col-1)&&z.x<=tileX(p.col+1)+CW*2){
      z.hp-=1800;spawnParticles(z.x,cellY(z.row),'#ff4400',12);
    }
  });
  spawnParticles(cx,cy,'#ff6600',20);
  spawnParticles(cx,cy,'#ffee00',12);
  removePlant(p.row,p.col);
}

// ─── Potato mine ───
function potatoDetonate(mine){
  if(!plants.includes(mine))return;
  spawnParticles(cellX(mine.col),cellY(mine.row),'#cc8800',14);
  removePlant(mine.row,mine.col);
}

// ─── Particles ───
function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,col,life:0.7,maxLife:0.7,r:3+Math.random()*4});
  }
}

// ─── Main update ───
function update(dt){
  animT+=dt;
  // update suns
  suns=suns.filter(s=>{
    if(s.collected)return false;
    s.life-=dt;if(s.life<=0)return false;
    if(s.y<s.land)s.y+=s.vy*60*dt;
    return true;
  });

  // update plants
  plants.forEach(p=>{
    if(!p.active)return;
    if(p.def.id==='potatomine'){p.armedT+=dt;return;}
    if(p.def.id==='cherrybomb')return;
    // sunflower / sunshroom
    if(p.def.id==='sunflower'||p.def.id==='sunshroom'){
      const rate=p.def.id==='sunshroom'?(p.stage===0?12:p.stage===1?8:5):8;
      p.sunTimer+=dt;
      if(p.sunTimer>=rate){
        p.sunTimer=0;
        const big=p.def.id==='sunshroom'&&p.stage===2;
        suns.push({x:cellX(p.col),y:cellY(p.row),vy:0,land:cellY(p.row)-30,collected:false,life:10,big});
        if(p.def.id==='sunshroom'){p.stage=Math.min(2,p.stage+1);}
      }
    }
    // shooters
    if(p.def.id==='peashooter'||p.def.id==='snowpea'||p.def.id==='repeater'){
      const hasTarget=zombies.some(z=>z.row===p.row&&z.x>tileX(p.col)&&!z.dead);
      if(hasTarget){
        p.shootTimer+=dt;
        const rate=p.def.id==='repeater'?0.75:1.5;
        if(p.shootTimer>=rate){
          p.shootTimer=0;
          firePea(p);
          if(p.def.id==='repeater')setTimeout(()=>firePea(p),200);
        }
      } else p.shootTimer=0;
    }
  });

  // update projectiles
  projectiles=projectiles.filter(pr=>{
    pr.x+=pr.spd*60*dt;
    if(pr.x>820)return false;
    for(const z of zombies){
      if(z.dead)continue;
      if(z.row===pr.row&&Math.abs(z.x-pr.x)<20){
        z.hp-=pr.dmg;
        if(pr.slow)z.spd=ZOMBIE_DEFS[z.type].spd*0.5;
        spawnParticles(pr.x,cellY(pr.row),pr.col,5);
        return false;
      }
    }
    return true;
  });

  // update zombies
  zombies.forEach(z=>{
    if(z.dead)return;
    z.animT+=dt;
    // check if eating
    let blocked=null;
    for(let c=0;c<COLS;c++){
      const p=grid[z.row][c];
      if(!p)continue;
      const px=cellX(c);
      if(z.x<=px+CW/2&&z.x>=px-CW/2+10){blocked=p;break;}
    }
    if(blocked){
      z.eating=true;z.atkTimer+=dt;
      if(z.atkTimer>=1){
        z.atkTimer=0;
        blocked.hp-=z.dmg*35;
        spawnParticles(cellX(blocked.col),cellY(blocked.row),'#884400',4);
        if(blocked.hp<=0){
          // potato mine explodes instead of dying quietly
          if(blocked.def.id==='potatomine'&&blocked.armedT>1.5){
            const ez=zombies.filter(oz=>oz.row===z.row&&Math.abs(oz.x-z.x)<90);
            ez.forEach(oz=>{oz.hp-=1200;spawnParticles(oz.x,cellY(z.row),'#cc8800',10);});
            spawnParticles(cellX(blocked.col),cellY(blocked.row),'#ffaa00',16);
          }
          removePlant(blocked.row,blocked.col);
        }
      }
    } else {
      z.eating=false;z.atkTimer=0;
      z.x-=z.spd*60*dt;
    }
    // restore slow speed gradually
    if(!z.eating&&z.spd<ZOMBIE_DEFS[z.type].spd){z.spd=Math.min(ZOMBIE_DEFS[z.type].spd,z.spd+dt*0.1);}
    // reached the house
    if(z.x<-10){endGame();return;}
    if(z.hp<=0){
      z.dead=true;score+=z.reward;
      spawnParticles(z.x,cellY(z.row),'#55aa33',10);
    }
  });
  zombies=zombies.filter(z=>!z.dead);

  // update particles
  particles=particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life-=dt;return p.life>0;
  });

  updateWaves(dt);
}

function firePea(plant){
  const slow=plant.def.id==='snowpea';
  const col=slow?'#88ddff':'#88cc00';
  const dmg=slow?20:30;
  projectiles.push({row:plant.row,x:cellX(plant.col)+CW/2,spd:4,dmg,col,slow,row:plant.row});
}

// ─── Drawing ───
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // lawn rows
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const even=(r+c)%2===0;
      ctx.fillStyle=even?'#3a7a20':'#348a1c';
      ctx.fillRect(tileX(c),tileY(r),CW,CH);
    }
  }

  // hover highlight
  if(selectedPlant||usingShovel){
    canvas.addEventListener('mousemove',onMouseMove,{passive:true});
  }

  // grid lines
  ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1;
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,tileY(r));ctx.lineTo(canvas.width,tileY(r));ctx.stroke();}
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(tileX(c),tileY(0));ctx.lineTo(tileX(c),tileY(ROWS));ctx.stroke();}

  // house on left
  ctx.fillStyle='#8B4513';ctx.fillRect(0,tileY(0),10,ROWS*CH);
  ctx.fillStyle='#D2691E';ctx.fillRect(0,tileY(0),6,ROWS*CH);

  // plants
  plants.forEach(p=>drawPlant(p));

  // projectiles
  projectiles.forEach(pr=>{
    ctx.beginPath();ctx.arc(pr.x,cellY(pr.row),pr.slow?8:7,0,Math.PI*2);
    ctx.fillStyle=pr.col;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.stroke();
  });

  // zombies
  zombies.forEach(z=>drawZombie(z));

  // suns
  suns.forEach(s=>{
    if(s.collected)return;
    const pulse=Math.sin(animT*4)*2;
    ctx.save();ctx.globalAlpha=Math.min(1,s.life*0.5);
    ctx.font=(s.big?36:28+pulse)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='#ffee00';ctx.shadowBlur=12;
    ctx.fillText('☀',s.x,s.y);
    ctx.restore();
  });

  // particles
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  // next wave countdown
  if(betweenWaves&&betweenTimer>0&&gameRunning){
    ctx.save();ctx.font='bold 16px Georgia';ctx.fillStyle='rgba(255,220,100,0.9)';
    ctx.textAlign='center';
    ctx.fillText('Next wave in '+Math.ceil(betweenTimer)+'s',400,tileY(ROWS)+10);
    ctx.restore();
  }
}

let hoverCell={r:-1,c:-1};
function onMouseMove(e){
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  hoverCell.c=Math.floor((mx-OX)/CW);hoverCell.r=Math.floor((my-OY-10)/CH);
}

function drawPlant(p){
  const x=cellX(p.col),y=cellY(p.row);
  const def=p.def;
  // hp bar
  const hpRatio=p.hp/p.maxHp;
  if(hpRatio<1){
    ctx.fillStyle='#440000';ctx.fillRect(x-24,y-36,48,5);
    ctx.fillStyle=hpRatio>0.5?'#44cc00':'#ff6600';ctx.fillRect(x-24,y-36,48*hpRatio,5);
  }
  // cherry bomb countdown flash
  if(def.id==='cherrybomb'){
    ctx.save();ctx.globalAlpha=0.5+0.5*Math.sin(animT*8);
    ctx.font='36px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(def.icon,x,y);ctx.restore();
    return;
  }
  // potato mine arming
  if(def.id==='potatomine'){
    ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.armedT>1.5?'💥':'🥔',x,y);
    if(p.armedT<=1.5){ctx.fillStyle='rgba(255,200,0,0.5)';ctx.font='11px Georgia';ctx.fillText('arming…',x,y+22);}
    return;
  }
  // sunshroom stages
  if(def.id==='sunshroom'){
    const icons=['🍄','🌸','🌺'];
    ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(icons[p.stage]||'🍄',x,y+Math.sin(animT*2)*2);return;
  }
  // others: bounce animation
  const bob=def.id==='peashooter'||def.id==='repeater'?Math.sin(animT*2)*2:0;
  ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(def.icon,x,y+bob);
}

function drawZombie(z){
  if(z.dead)return;
  const x=z.x,y=cellY(z.row);
  const walk=z.eating?0:Math.sin(z.animT*4)*4;
  ctx.save();
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(x,y+28,16,6,0,0,Math.PI*2);ctx.fill();
  // body
  const col=z.def.color;
  ctx.fillStyle=col;ctx.fillRect(x-13,y-25+walk,26,36);
  // head
  ctx.fillStyle='#b8d4a0';ctx.fillRect(x-10,y-45+walk,20,22);
  // eyes
  ctx.fillStyle='#ff2200';ctx.fillRect(x-6,y-38+walk,5,5);ctx.fillRect(x+1,y-38+walk,5,5);
  // mouth
  ctx.fillStyle='#330000';ctx.fillRect(x-5,y-28+walk,10,3);
  // accessory
  if(z.type==='cone'){ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.moveTo(x,y-56+walk);ctx.lineTo(x-10,y-45+walk);ctx.lineTo(x+10,y-45+walk);ctx.closePath();ctx.fill();}
  if(z.type==='bucket'){ctx.fillStyle='#aaaaaa';ctx.fillRect(x-12,y-50+walk,24,12);ctx.strokeStyle='#888';ctx.lineWidth=2;ctx.strokeRect(x-12,y-50+walk,24,12);}
  if(z.type==='giga'){ctx.fillStyle='#ff8800';ctx.beginPath();ctx.moveTo(x,y-60+walk);ctx.lineTo(x-13,y-45+walk);ctx.lineTo(x+13,y-45+walk);ctx.closePath();ctx.fill();}
  if(z.type==='flag'){ctx.fillStyle='#cc0000';ctx.fillRect(x-18,y-55+walk,16,10);}
  // arms
  ctx.fillStyle=col;
  const armY=y-18+walk+(z.eating?Math.sin(animT*8)*4:0);
  ctx.fillRect(x-24,armY,12,8);ctx.fillRect(x+12,armY,12,8);
  // hp bar
  const hpR=z.hp/z.maxHp;
  ctx.fillStyle='#440000';ctx.fillRect(x-20,y-62+walk,40,5);
  ctx.fillStyle=hpR>0.5?'#44ee00':'#ff6600';ctx.fillRect(x-20,y-62+walk,40*hpR,5);
  ctx.restore();
}

// ─── Game loop ───
function loop(ts){
  if(!gameRunning){return;}
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTime)/1000,0.05);lastTime=ts;
  if(!gameOver){update(dt);}
  draw();
}

function endGame(){
  if(gameOver)return;
  gameOver=true;gameRunning=false;
  document.getElementById('go-score').textContent='Score: '+score;
  document.getElementById('gameover').style.display='flex';
}

function winGame(){
  if(gameOver)return;
  gameOver=true;gameRunning=false;
  document.getElementById('win-score').textContent='Final Score: '+score;
  document.getElementById('win').style.display='flex';
}
</script>
</body>
</html>
