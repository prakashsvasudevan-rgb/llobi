<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost Hunt – Llobi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;user-select:none}
canvas{display:block;touch-action:none}
#ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;pointer-events:none;z-index:10}
#score-box{font-size:1.3rem;font-weight:700;color:#aaffee;text-shadow:0 0 12px #00ffcc}
#lives-box{font-size:1.4rem;letter-spacing:4px}
#timer-box{font-size:1.2rem;font-weight:600;color:#ffee88;text-shadow:0 0 10px #ffaa00}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,0,20,.88);z-index:20;gap:18px}
#overlay h1{font-size:3rem;text-shadow:0 0 30px #88aaff}
#overlay p{font-size:1.1rem;color:#aabbff;max-width:340px;text-align:center;line-height:1.6}
#play-btn{padding:14px 44px;font-size:1.3rem;font-weight:700;border:none;border-radius:40px;background:linear-gradient(135deg,#8844ff,#44aaff);color:#fff;cursor:pointer;box-shadow:0 0 24px #6644ff88;transition:transform .1s}
#play-btn:hover{transform:scale(1.06)}
#back{position:fixed;top:12px;left:12px;z-index:30;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:50%;width:38px;height:38px;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<button id="back" onclick="location.href='/'">‹</button>
<div id="ui">
  <div id="score-box">Score: <span id="score">0</span></div>
  <div id="timer-box">⏱ <span id="timer">60</span>s</div>
  <div id="lives-box"><span id="lives">❤️❤️❤️</span></div>
</div>
<canvas id="c"></canvas>
<div id="overlay">
  <div style="font-size:4rem">👻</div>
  <h1>Ghost Hunt</h1>
  <p>Tap or click the ghosts before they escape! Don't miss — you only have 3 lives.</p>
  <button id="play-btn">Play</button>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay');
const scoreEl=document.getElementById('score');
const timerEl=document.getElementById('timer');
const livesEl=document.getElementById('lives');

let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

// Ghost types
const TYPES=[
  {emoji:'👻',r:28,pts:10,spd:1.2,hp:1},
  {emoji:'💀',r:32,pts:20,spd:1.6,hp:1},
  {emoji:'🧟',r:36,pts:30,spd:0.9,hp:2},
  {emoji:'🫥',r:24,pts:50,spd:2.2,hp:1},
  {emoji:'👁️',r:22,pts:15,spd:1.8,hp:1},
];

let ghosts=[],particles=[],floats=[];
let score=0,lives=3,timeLeft=60,gs='idle';
let frame=0,spawnT=0,spawnRate=2.2;

function spawnGhost(){
  const t=TYPES[Math.floor(Math.random()*TYPES.length)];
  const edge=Math.floor(Math.random()*4);
  let x,y,vx,vy;
  if(edge===0){x=Math.random()*W;y=-50;vx=(Math.random()-.5)*t.spd*60;vy=t.spd*60*(0.5+Math.random()*0.5);}
  else if(edge===1){x=W+50;y=Math.random()*H;vx=-t.spd*60*(0.5+Math.random()*0.5);vy=(Math.random()-.5)*t.spd*60;}
  else if(edge===2){x=Math.random()*W;y=H+50;vx=(Math.random()-.5)*t.spd*60;vy=-t.spd*60*(0.5+Math.random()*0.5);}
  else{x=-50;y=Math.random()*H;vx=t.spd*60*(0.5+Math.random()*0.5);vy=(Math.random()-.5)*t.spd*60;}
  ghosts.push({...t,x,y,vx,vy,hp:t.hp,maxHp:t.hp,wobble:Math.random()*Math.PI*2,wobbleSpd:2+Math.random()*2,opacity:1,hit:false,hitT:0});
}

function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;const spd=60+Math.random()*120;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,maxLife:1,color,r:3+Math.random()*4});
  }
}

function floatText(x,y,txt,color){
  floats.push({x,y,txt,color,life:1.2,vy:-55});
}

function tryHit(px,py){
  for(let i=ghosts.length-1;i>=0;i--){
    const g=ghosts[i];
    const dx=px-g.x,dy=py-g.y;
    if(dx*dx+dy*dy<(g.r+10)*(g.r+10)){
      g.hp--;
      if(g.hp<=0){
        const pts=g.pts*(score>200?2:1);
        score+=pts;scoreEl.textContent=score;
        spawnParticles(g.x,g.y,'#aaffee',12);
        floatText(g.x,g.y-g.r,'+'+pts,'#aaffee');
        ghosts.splice(i,1);
      } else {
        g.hit=true;g.hitT=0.15;
        floatText(g.x,g.y-g.r,'Hit!','#ffee88');
      }
      return;
    }
  }
  // missed
  spawnParticles(px,py,'#ff4466',5);
  lives--;updateLives();
  if(lives<=0)endGame();
}

function updateLives(){
  livesEl.textContent='❤️'.repeat(Math.max(0,lives));
}

function endGame(){
  gs='over';
  overlay.innerHTML=`
    <div style="font-size:3rem">👻</div>
    <h1 style="font-size:2.2rem">${lives<=0?'Busted!':'Time Up!'}</h1>
    <p style="color:#aaffee;font-size:1.4rem;font-weight:700">Score: ${score}</p>
    <p style="color:#aabbff">Can you beat it?</p>
    <button id="play-btn" onclick="startGame()">Play Again</button>
    <button onclick="location.href='/'" style="padding:10px 28px;font-size:1rem;border:none;border-radius:40px;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;margin-top:4px">Home</button>`;
  overlay.style.display='flex';
}

function startGame(){
  score=0;lives=3;timeLeft=60;spawnT=0;spawnRate=2.2;
  ghosts=[];particles=[];floats=[];frame=0;gs='playing';
  scoreEl.textContent=0;timerEl.textContent=60;updateLives();
  overlay.style.display='none';
  let last=performance.now();
  let secT=0;
  function loop(now){
    if(gs!=='playing')return;
    const dt=Math.min((now-last)/1000,0.05);last=now;frame++;
    // timer
    secT+=dt;if(secT>=1){secT-=1;timeLeft--;timerEl.textContent=timeLeft;if(timeLeft<=0){endGame();return;}}
    // spawn
    spawnT+=dt;if(spawnT>=spawnRate){spawnT=0;spawnRate=Math.max(0.6,spawnRate-0.04);spawnGhost();}
    // update ghosts
    for(let i=ghosts.length-1;i>=0;i--){
      const g=ghosts[i];
      g.wobble+=g.wobbleSpd*dt;
      g.x+=g.vx*dt;g.y+=g.vy*dt;
      if(g.hitT>0){g.hitT-=dt;}
      // escaped
      if(g.x<-80||g.x>W+80||g.y<-80||g.y>H+80){
        ghosts.splice(i,1);
        lives--;updateLives();
        if(lives<=0){endGame();return;}
      }
    }
    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt*1.5;
      if(p.life<=0)particles.splice(i,1);
    }
    // floats
    for(let i=floats.length-1;i>=0;i--){
      const f=floats[i];f.y+=f.vy*dt;f.life-=dt;if(f.life<=0)floats.splice(i,1);
    }
    draw();requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // starfield bg
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  // subtle grid
  ctx.strokeStyle='rgba(80,60,160,.12)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // ghosts
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const g of ghosts){
    ctx.save();
    const wobX=Math.sin(g.wobble)*4;const wobY=Math.cos(g.wobble*0.7)*3;
    ctx.translate(g.x+wobX,g.y+wobY);
    if(g.hitT>0){ctx.scale(1.3,1.3);ctx.globalAlpha=0.6;}
    ctx.font=`${g.r*2}px serif`;
    // HP bar for multi-hp ghosts
    if(g.maxHp>1){
      ctx.fillStyle=g.hp>1?'#44ff88':'#ff4466';
      ctx.fillRect(-g.r,g.r+6,g.r*2*(g.hp/g.maxHp),5);
      ctx.strokeStyle='#ffffff44';ctx.lineWidth=1;ctx.strokeRect(-g.r,g.r+6,g.r*2,5);
    }
    ctx.fillText(g.emoji,0,0);
    ctx.restore();
    ctx.globalAlpha=1;
  }

  // floats
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.life*2);
    ctx.font='bold 18px Segoe UI';ctx.textAlign='center';ctx.fillStyle=f.color;
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

// Input
function onPointer(e){
  if(gs!=='playing')return;
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const touches=e.touches||[e];
  for(const t of touches)tryHit(t.clientX-rect.left,t.clientY-rect.top);
}
canvas.addEventListener('pointerdown',onPointer);
canvas.addEventListener('touchstart',onPointer,{passive:false});

document.getElementById('play-btn').addEventListener('click',startGame);
// initial idle draw
draw();
</script>
</body>
</html>
