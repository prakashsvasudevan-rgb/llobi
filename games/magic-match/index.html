<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Magic Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0821;font-family:'Segoe UI',sans-serif;user-select:none}

/* Stars background */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}

/* Screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.screen.hidden{display:none}

/* Menu */
#menuScreen{background:radial-gradient(ellipse at 50% 60%,#1a0d3a 0%,#0d0821 70%)}
#menuScreen h1{font-size:3rem;font-weight:900;color:#fff;letter-spacing:.04em;text-shadow:0 0 40px #a855f7,0 0 80px #7c3aed}
#menuScreen .sub{color:#c084fc;margin:.5rem 0 2.5rem;font-size:1rem;opacity:.85}
.bigBtn{font-size:1.1rem;font-weight:800;padding:14px 42px;border:none;border-radius:50px;cursor:pointer;transition:transform .12s,box-shadow .12s;letter-spacing:.04em;margin:6px}
.bigBtn.purple{background:linear-gradient(135deg,#9333ea,#7c3aed);color:#fff;box-shadow:0 6px 0 #4c1d95,0 0 24px #a855f788}
.bigBtn.purple:hover{transform:translateY(-2px);box-shadow:0 8px 0 #4c1d95,0 0 36px #a855f7aa}
.bigBtn.purple:active{transform:translateY(3px);box-shadow:0 3px 0 #4c1d95}
.bigBtn.gold{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 6px 0 #92400e}
#modeSelect{display:flex;gap:12px;margin-bottom:1.5rem;flex-wrap:wrap;justify-content:center}
.modeBtn{padding:9px 22px;border:2px solid #6d28d9;border-radius:30px;cursor:pointer;font-size:.9rem;font-weight:700;color:#c084fc;background:transparent;transition:all .15s}
.modeBtn.active,.modeBtn:hover{background:#6d28d9;color:#fff;border-color:#9333ea}

/* Game screen */
#gameScreen{background:#0d0821;justify-content:flex-start;padding:10px 0}
#topBar{display:flex;gap:10px;padding:6px 16px;width:100%;max-width:520px;justify-content:space-between;align-items:center}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 16px;text-align:center;color:#fff}
.pill span{display:block;font-size:.58rem;opacity:.55;text-transform:uppercase;letter-spacing:.06em}
.pill strong{font-size:1.1rem;font-weight:800}
#timerBar{width:100%;max-width:520px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;margin:4px 16px 0;overflow:hidden;align-self:center}
#timerFill{height:100%;background:linear-gradient(90deg,#a855f7,#ec4899);border-radius:3px;transition:width .1s linear}
#board{display:grid;gap:7px;padding:12px;background:rgba(255,255,255,.03);border-radius:20px;border:1px solid rgba(255,255,255,.07);margin-top:8px;position:relative}
.cell{width:62px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.08)}
.cell:hover{transform:scale(1.07);background:rgba(255,255,255,.12)}
.cell.selected{border-color:#a855f7;background:rgba(168,85,247,.18);box-shadow:0 0 16px #a855f7aa;transform:scale(1.09)}
.cell.matched{animation:matchPop .5s ease forwards}
.cell.wrong{animation:wrongShake .4s ease}
.cell.hint{animation:hintPulse 1s ease 3}
.cell.empty{pointer-events:none;opacity:0}
@keyframes matchPop{0%{transform:scale(1.15)}40%{transform:scale(1.3);filter:brightness(1.6)}100%{transform:scale(0);opacity:0}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes hintPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 22px #fbbf24cc;border-color:#fbbf24;background:rgba(251,191,36,.18)}}
#comboEl{position:absolute;top:-36px;left:50%;transform:translateX(-50%);font-size:1.5rem;font-weight:900;color:#fbbf24;text-shadow:0 0 16px #f59e0b;pointer-events:none;opacity:0;transition:opacity .3s}
#comboEl.show{opacity:1;animation:comboFloat .8s ease forwards}
@keyframes comboFloat{0%{transform:translateX(-50%) translateY(0);opacity:1}100%{transform:translateX(-50%) translateY(-30px);opacity:0}}

/* Power-ups row */
#powers{display:flex;gap:10px;margin-top:10px;pointer-events:all}
.pwrBtn{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:8px 16px;cursor:pointer;font-size:.82rem;font-weight:700;color:#e2d4ff;transition:all .15s;display:flex;align-items:center;gap:5px}
.pwrBtn:hover{background:rgba(255,255,255,.15);border-color:#a855f7}
.pwrBtn.disabled{opacity:.35;pointer-events:none}
.pwrBtn .badge{background:#a855f7;color:#fff;border-radius:9px;padding:1px 7px;font-size:.72rem;font-weight:800}

/* Overlay */
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50;border-radius:20px}
#overlay.hidden{display:none}
#overlayBox{background:linear-gradient(135deg,#1e0a4a,#0d0821);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px 40px;text-align:center;color:#fff;min-width:260px}
#overlayBox h2{font-size:1.8rem;font-weight:900}
#overlayBox p{margin:.6rem 0 1.4rem;opacity:.75;font-size:.95rem}

/* Win screen */
#winScreen{background:radial-gradient(ellipse at 50% 50%,#2d1060 0%,#0d0821 70%)}
#winScreen h2{font-size:2.5rem;font-weight:900;color:#fbbf24;text-shadow:0 0 40px #f59e0b}
#winScreen .wscore{font-size:3rem;font-weight:900;color:#fff;margin:.5rem 0}
#winScreen .wlabel{color:#c084fc;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}

/* Particles */
.particle{position:fixed;pointer-events:none;border-radius:50%;z-index:200;animation:particleFly 1s ease forwards}
@keyframes particleFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<!-- MENU -->
<div class="screen" id="menuScreen">
  <div style="font-size:4rem;margin-bottom:.5rem">🔮</div>
  <h1>Magic Match</h1>
  <p class="sub">Match magical pairs before time runs out!</p>
  <div id="modeSelect">
    <button class="modeBtn active" data-mode="classic">Classic</button>
    <button class="modeBtn" data-mode="blitz">⚡ Blitz</button>
    <button class="modeBtn" data-mode="zen">🌿 Zen</button>
    <button class="modeBtn" data-mode="hard">💀 Hard</button>
  </div>
  <button class="bigBtn purple" id="playBtn">Play!</button>
  <div style="color:#6d28d9;font-size:.8rem;margin-top:1.5rem;opacity:.7">Match magical pairs · Combos = bonus points · Use power-ups!</div>
</div>

<!-- GAME -->
<div class="screen hidden" id="gameScreen">
  <div id="topBar">
    <div class="pill"><span>Score</span><strong id="scoreDisp">0</strong></div>
    <div class="pill"><span>Pairs</span><strong id="pairsDisp">0/0</strong></div>
    <div class="pill"><span>Moves</span><strong id="movesDisp">0</strong></div>
    <div class="pill" id="timerPill" style="display:none"><span>Time</span><strong id="timerDisp">60</strong></div>
  </div>
  <div id="timerBar" style="display:none"><div id="timerFill" style="width:100%"></div></div>
  <div id="board">
    <div id="comboEl"></div>
    <div id="overlay" class="hidden">
      <div id="overlayBox">
        <h2 id="overlayTitle">Get Ready!</h2>
        <p id="overlayMsg"></p>
        <button class="bigBtn purple" id="overlayBtn">OK</button>
      </div>
    </div>
  </div>
  <div id="powers">
    <button class="pwrBtn" id="pwrHint">💡 Hint <span class="badge" id="hintCt">3</span></button>
    <button class="pwrBtn" id="pwrShuffle">🌀 Shuffle <span class="badge" id="shuffleCt">2</span></button>
    <button class="pwrBtn" id="pwrBomb">💣 Bomb <span class="badge" id="bombCt">1</span></button>
  </div>
</div>

<!-- WIN -->
<div class="screen hidden" id="winScreen">
  <div style="font-size:3.5rem;margin-bottom:.5rem">🏆</div>
  <h2 id="winTitle">You Win!</h2>
  <div class="wlabel">Final Score</div>
  <div class="wscore" id="winScore">0</div>
  <div class="wlabel" id="winDetail" style="margin-bottom:2rem"></div>
  <button class="bigBtn purple" id="playAgainBtn">Play Again</button>
  <button class="bigBtn gold" id="nextLevelBtn" style="margin-top:4px">Next Level ▶</button>
</div>

<script>
// ═══════ STARS ═══════
const sc=document.getElementById('stars');
const ctx=sc.getContext('2d');
let stars=[];
function resizeStars(){sc.width=window.innerWidth;sc.height=window.innerHeight;stars=Array.from({length:140},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.5+.3,s:Math.random()*.8+.4,p:Math.random()*Math.PI*2}));}
resizeStars();window.addEventListener('resize',resizeStars);
let starT=0;
function drawStars(dt){
  starT+=dt;ctx.clearRect(0,0,sc.width,sc.height);
  for(const s of stars){s.p+=dt*.8;const a=.3+.5*Math.abs(Math.sin(s.p*s.s));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();}
}

// ═══════ EMOJIS BY THEME ═══════
const POOLS={
  classic:['🔮','🧙','✨','🌙','⭐','🌟','💫','🪄','🧿','🦋','🌸','🌈','🔥','💎','🦄'],
  blitz:  ['🃏','🎲','🎯','🎪','🎠','🎡','🎢','🎭','🎨','🎸','🎺','🎻','🥁','🎹','🎳'],
  zen:    ['🌿','🍃','🌺','🌻','🌼','🌷','🌲','🍀','🌊','🌙','⛅','🌸','🍁','🌾','🍄'],
  hard:   ['💀','🕷','🦇','🌑','⚡','🌪','🔱','⚔️','🛡','🗡','💥','🧨','🌋','🌊','⚠️'],
};

// ═══════ MODES ═══════
const MODES={
  classic:{label:'Classic',grid:4,pairs:8, time:0,  moves:0,  baseScore:100},
  blitz:  {label:'Blitz',  grid:4,pairs:8, time:60,  moves:0,  baseScore:150},
  zen:    {label:'Zen',    grid:4,pairs:8, time:0,  moves:40, baseScore:80 },
  hard:   {label:'Hard',  grid:6,pairs:18,time:90,  moves:0,  baseScore:200},
};

// ═══════ GAME STATE ═══════
let mode='classic',cfg=MODES.classic;
let level=1,score=0,moves=0,combo=0,matched=0;
let cards=[],firstIdx=null,secondIdx=null;
let locked=false,timerLeft=0,timerMax=0;
let hintUses=3,shuffleUses=2,bombUses=1;
let timerInterval=null;
let lastStarTs=0;

// ═══════ MENU ═══════
document.querySelectorAll('.modeBtn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.modeBtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');mode=b.dataset.mode;cfg=MODES[mode];
  });
});
document.getElementById('playBtn').onclick=()=>{level=1;score=0;startLevel();};
document.getElementById('playAgainBtn').onclick=()=>{level=1;score=0;startLevel();};
document.getElementById('nextLevelBtn').onclick=()=>{level++;startLevel();};

// ═══════ LEVEL START ═══════
function startLevel(){
  clearInterval(timerInterval);
  matched=0;moves=0;combo=0;firstIdx=null;secondIdx=null;locked=false;
  hintUses=3;shuffleUses=2;bombUses=1;
  updatePowerBadges();

  // Scale up grid with level for hard mode
  const extraPairs=mode==='hard'?Math.min(level-1,6):Math.min(level-1,3);
  const gridSize=cfg.grid+(mode==='hard'&&level>1?Math.min(2,Math.floor((level-1)/2)):0);
  const totalPairs=cfg.pairs+extraPairs;
  const pool=POOLS[mode];
  const chosen=shuffle([...pool]).slice(0,Math.min(totalPairs,pool.length));

  cards=shuffle([...chosen,...chosen]).map((e,i)=>({emoji:e,id:i,matched:false,selected:false}));

  buildBoard(gridSize);
  updateHUD();

  // Timer
  if(cfg.time>0){
    timerLeft=cfg.time+Math.floor((level-1)*10);timerMax=timerLeft;
    document.getElementById('timerPill').style.display='';
    document.getElementById('timerBar').style.display='';
    updateTimer();
    timerInterval=setInterval(tickTimer,1000);
  } else {
    document.getElementById('timerPill').style.display='none';
    document.getElementById('timerBar').style.display='none';
  }

  showScreen('gameScreen');
}

function buildBoard(cols){
  const board=document.getElementById('board');
  // Clear children except persistent overlays
  while(board.children.length>2)board.removeChild(board.lastChild);

  const size=Math.min(62,Math.floor((Math.min(window.innerWidth,520)-32)/cols)-7);
  board.style.gridTemplateColumns=`repeat(${cols},${size}px)`;
  document.querySelectorAll('.cell').forEach(c=>c.remove());

  cards.forEach((card,i)=>{
    const cell=document.createElement('div');
    cell.className='cell';cell.style.width=size+'px';cell.style.height=size+'px';
    cell.style.fontSize=Math.floor(size*.5)+'px';
    cell.dataset.idx=i;
    cell.textContent=card.emoji;
    cell.addEventListener('click',()=>onCellClick(i));
    board.appendChild(cell);
  });
}

// ═══════ GAMEPLAY ═══════
function onCellClick(idx){
  if(locked||cards[idx].matched||cards[idx].selected)return;
  if(firstIdx!==null&&secondIdx!==null)return;

  cards[idx].selected=true;
  getCellEl(idx).classList.add('selected');

  if(firstIdx===null){firstIdx=idx;return;}
  secondIdx=idx;locked=true;moves++;
  updateHUD();

  if(cards[firstIdx].emoji===cards[secondIdx].emoji){
    // Match!
    combo++;score+=cfg.baseScore*(1+combo*.5)*(1+level*.1)|0;matched++;
    spawnParticles(getCellEl(idx));spawnParticles(getCellEl(firstIdx));
    setTimeout(()=>{
      [firstIdx,secondIdx].forEach(i=>{
        cards[i].matched=true;cards[i].selected=false;
        const el=getCellEl(i);el.classList.remove('selected');el.classList.add('matched');
      });
      showCombo(combo);
      firstIdx=null;secondIdx=null;locked=false;
      updateHUD();
      if(matched===cards.length/2)setTimeout(onWin,500);
    },300);
  } else {
    // No match
    combo=0;
    setTimeout(()=>{
      [firstIdx,secondIdx].forEach(i=>{
        cards[i].selected=false;
        const el=getCellEl(i);el.classList.remove('selected');el.classList.add('wrong');
        setTimeout(()=>el.classList.remove('wrong'),400);
      });
      firstIdx=null;secondIdx=null;locked=false;
      // Zen mode: check moves
      if(cfg.moves>0&&moves>=cfg.moves)setTimeout(onLose,400);
    },700);
  }
}

function getCellEl(idx){
  return document.querySelector(`[data-idx="${idx}"]`);
}

function showCombo(c){
  if(c<2)return;
  const el=document.getElementById('comboEl');
  el.textContent=c>=5?`🔥 ${c}x COMBO!!`:`✨ ${c}x Combo!`;
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
}

function updateHUD(){
  document.getElementById('scoreDisp').textContent=score;
  document.getElementById('pairsDisp').textContent=matched+'/'+(cards.length/2);
  document.getElementById('movesDisp').textContent=cfg.moves>0?`${moves}/${cfg.moves}`:moves;
}

function tickTimer(){
  timerLeft--;updateTimer();
  if(timerLeft<=0){clearInterval(timerInterval);onLose();}
}
function updateTimer(){
  document.getElementById('timerDisp').textContent=timerLeft;
  document.getElementById('timerFill').style.width=(timerLeft/timerMax*100)+'%';
  document.getElementById('timerFill').style.background=timerLeft<10?'linear-gradient(90deg,#ef4444,#f97316)':'linear-gradient(90deg,#a855f7,#ec4899)';
}

// ═══════ WIN / LOSE ═══════
function onWin(){
  clearInterval(timerInterval);
  const timeBonus=cfg.time>0?timerLeft*10:0;
  const movesBonus=cfg.moves>0?Math.max(0,(cfg.moves-moves)*20):0;
  score+=timeBonus+movesBonus;
  document.getElementById('winTitle').textContent=level>1?`Level ${level} Clear! 🎉`:'You Win! 🎉';
  document.getElementById('winScore').textContent=score;
  document.getElementById('winDetail').textContent=`Time bonus +${timeBonus} · Moves bonus +${movesBonus}`;
  showScreen('winScreen');
}
function onLose(){
  clearInterval(timerInterval);locked=true;
  showOverlay(cfg.time>0?'⏰ Time\'s Up!':'Out of Moves!','Better luck next time…','Try Again',()=>{level=1;score=0;startLevel();});
}

// ═══════ POWER-UPS ═══════
document.getElementById('pwrHint').onclick=()=>{
  if(hintUses<=0)return;hintUses--;updatePowerBadges();
  // Find an unmatched pair and flash one of each
  const unmatched=cards.map((c,i)=>({...c,i})).filter(c=>!c.matched);
  const target=unmatched[0];
  const pair=unmatched.find(c=>c.i!==target.i&&c.emoji===target.emoji);
  [target.i,pair.i].forEach(i=>getCellEl(i).classList.add('hint'));
  setTimeout(()=>[target.i,pair.i].forEach(i=>getCellEl(i).classList.remove('hint')),3100);
};
document.getElementById('pwrShuffle').onclick=()=>{
  if(shuffleUses<=0)return;shuffleUses--;updatePowerBadges();
  const unmatched=cards.map((c,i)=>({...c,i})).filter(c=>!c.matched);
  const idxs=unmatched.map(c=>c.i);
  const emojis=shuffle(unmatched.map(c=>c.emoji));
  idxs.forEach((idx,j)=>{cards[idx].emoji=emojis[j];getCellEl(idx).textContent=emojis[j];});
  firstIdx=null;secondIdx=null;locked=false;
};
document.getElementById('pwrBomb').onclick=()=>{
  if(bombUses<=0)return;bombUses--;updatePowerBadges();
  // Auto-match a random unmatched pair
  const unmatched=cards.map((c,i)=>({...c,i})).filter(c=>!c.matched);
  if(unmatched.length<2)return;
  const a=unmatched[0];const b=unmatched.find(c=>c.emoji===a.emoji&&c.i!==a.i);
  if(!b)return;
  spawnParticles(getCellEl(a.i));spawnParticles(getCellEl(b.i));
  [a.i,b.i].forEach(i=>{
    cards[i].matched=true;getCellEl(i).classList.add('matched');
  });
  matched++;score+=cfg.baseScore;updateHUD();
  if(matched===cards.length/2)setTimeout(onWin,500);
};

function updatePowerBadges(){
  document.getElementById('hintCt').textContent=hintUses;
  document.getElementById('shuffleCt').textContent=shuffleUses;
  document.getElementById('bombCt').textContent=bombUses;
  document.getElementById('pwrHint').classList.toggle('disabled',hintUses<=0);
  document.getElementById('pwrShuffle').classList.toggle('disabled',shuffleUses<=0);
  document.getElementById('pwrBomb').classList.toggle('disabled',bombUses<=0);
}

// ═══════ OVERLAY ═══════
function showOverlay(title,msg,btnTxt,cb){
  document.getElementById('overlayTitle').textContent=title;
  document.getElementById('overlayMsg').textContent=msg;
  document.getElementById('overlayBtn').textContent=btnTxt;
  document.getElementById('overlayBtn').onclick=()=>{document.getElementById('overlay').classList.add('hidden');cb&&cb();};
  document.getElementById('overlay').classList.remove('hidden');
}

// ═══════ PARTICLES ═══════
function spawnParticles(el){
  if(!el)return;
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  const cols=['#a855f7','#ec4899','#fbbf24','#34d399','#60a5fa'];
  for(let i=0;i<12;i++){
    const p=document.createElement('div');p.className='particle';
    const size=5+Math.random()*8;
    p.style.cssText=`left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;background:${cols[i%cols.length]};--tx:${(Math.random()-.5)*120}px;--ty:${(Math.random()-1)*140}px`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),900);
  }
}

// ═══════ SCREENS ═══════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// ═══════ UTILS ═══════
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.random()*i+1|0;[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

// ═══════ RENDER LOOP ═══════
let last=0;
function raf(ts){requestAnimationFrame(raf);drawStars((ts-last)/1000);last=ts;}
requestAnimationFrame(raf);
</script>
</body>
</html>
