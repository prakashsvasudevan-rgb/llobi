<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gone Fishin'</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Georgia,serif}
#wrap{width:620px;max-width:100%}
canvas{display:block;width:100%;cursor:crosshair}
#ui{background:#081408;border:2px solid #2a4a2a;border-top:none;padding:7px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#text-box{color:#9fcf9f;font-size:12px;flex:1}
#stats{display:flex;gap:16px;font-size:12px;white-space:nowrap}
#score-box{color:#ffdd44;font-weight:bold}
#catches-box{color:#aaccff}
#best-box{color:#ff88ff}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="620" height="380"></canvas>
<div id="ui">
  <div id="text-box">Click on the water to cast your line.</div>
  <div id="stats">
    <span id="catches-box">Catches: 0</span>
    <span id="best-box">Best: —</span>
    <span id="score-box">Score: 0</span>
  </div>
</div>
</div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=620,H=380,WY=150; // WY = water surface y

let frame=0,score=0,catches=0,bestFish=null;
let state='idle'; // idle|casting|waiting|nibble|hooked|reveal|missed
let bobX=0,bobY=0,bobVX=0,bobVY=0,bobBob=0;
let nibbleTimer=0,nibbleWindow=0;
let reelProgress=0;
let caughtFish=null,caughtWeight=0,revealTimer=0;
let missFlash=0;

function setText(t){document.getElementById('text-box').textContent=t;}
function setScore(s){score=s;document.getElementById('score-box').textContent='Score: '+s;}
function setCatches(n){catches=n;document.getElementById('catches-box').textContent='Catches: '+n;}
function setBest(f){bestFish=f;document.getElementById('best-box').textContent='Best: '+f.name;}

const FISH=[
  {name:'Bluegill',    rarity:'common',   col:'#4a9aaa',pts:10, wlo:0.1,whi:0.5},
  {name:'Bass',        rarity:'common',   col:'#3a8a5a',pts:20, wlo:0.5,whi:2.5},
  {name:'Carp',        rarity:'common',   col:'#9a8a4a',pts:15, wlo:1,  whi:5},
  {name:'Perch',       rarity:'common',   col:'#bb8822',pts:12, wlo:0.2,whi:1},
  {name:'Catfish',     rarity:'uncommon', col:'#6a5a4a',pts:35, wlo:2,  whi:9},
  {name:'Trout',       rarity:'uncommon', col:'#8a5a9a',pts:40, wlo:0.5,whi:4},
  {name:'Pike',        rarity:'rare',     col:'#4a7a2a',pts:80, wlo:3,  whi:14},
  {name:'Salmon',      rarity:'rare',     col:'#ee8a4a',pts:75, wlo:2,  whi:11},
  {name:'Giant Tuna',  rarity:'epic',     col:'#2244cc',pts:200,wlo:20, whi:120},
  {name:'Swordfish',   rarity:'epic',     col:'#4466ee',pts:250,wlo:30, whi:160},
  {name:'Golden Fish', rarity:'legendary',col:'#ffdd44',pts:1000,wlo:1, whi:5},
  {name:'Ghost Fish',  rarity:'legendary',col:'#ccddff',pts:500, wlo:0, whi:0},
  {name:'Old Boot',    rarity:'junk',     col:'#6a5040',pts:0,  wlo:0.3,whi:0.3},
  {name:'Tin Can',     rarity:'junk',     col:'#888888',pts:1,  wlo:0.1,whi:0.1},
];
const RARITY_WEIGHTS={common:48,uncommon:25,rare:14,epic:7,legendary:3,junk:3};
const RARITY_COL={common:'#aaaaaa',uncommon:'#44aaff',rare:'#ff8800',epic:'#cc00ff',legendary:'#ffdd00',junk:'#777777'};
const RARITY_PULL={common:0.25,uncommon:0.3,rare:0.35,epic:0.45,legendary:0.55,junk:0.15};

function pickFish(){
  const total=Object.values(RARITY_WEIGHTS).reduce((a,b)=>a+b,0);
  let r=Math.random()*total,acc=0,rarity='common';
  for(const[k,v] of Object.entries(RARITY_WEIGHTS)){acc+=v;if(r<acc){rarity=k;break;}}
  const pool=FISH.filter(f=>f.rarity===rarity);
  return pool[Math.floor(Math.random()*pool.length)];
}

// background fish
const bgFish=[];
for(let i=0;i<10;i++){
  bgFish.push({
    x:Math.random()*W,
    y:WY+40+Math.random()*(H-WY-60),
    spd:(1+Math.random()*2.2)*(Math.random()<0.5?1:-1),
    sz:18+Math.random()*28,
    col:FISH[Math.floor(Math.random()*8)].col,
    ph:Math.random()*Math.PI*2,
  });
}

// clouds
const clouds=[[100,38,55],[260,52,42],[430,34,50],[180,62,32],[530,50,38]];

// DRAW HELPERS
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,WY);
  g.addColorStop(0,'#4477bb');g.addColorStop(1,'#88aadd');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,WY);
  // sun
  ctx.fillStyle='rgba(255,245,160,0.9)';ctx.beginPath();ctx.arc(W-70,45,34,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,245,160,0.25)';ctx.beginPath();ctx.arc(W-70,45,50,0,Math.PI*2);ctx.fill();
  // sun rays
  ctx.strokeStyle='rgba(255,245,160,0.15)';ctx.lineWidth=12;
  for(let a=0;a<Math.PI*2;a+=Math.PI/4){
    ctx.beginPath();ctx.moveTo(W-70+Math.cos(a)*48,45+Math.sin(a)*48);
    ctx.lineTo(W-70+Math.cos(a)*80,45+Math.sin(a)*80);ctx.stroke();
  }
  // clouds
  clouds.forEach(([cx,cy,r])=>{
    ctx.fillStyle='rgba(255,255,255,0.88)';
    [[0,0,r],[r*.65,6,r*.72],[r*-.55,8,r*.65],[r*.3,-4,r*.5]].forEach(([dx,dy,cr])=>{
      ctx.beginPath();ctx.arc(cx+dx,cy+dy,cr,0,Math.PI*2);ctx.fill();
    });
  });
}

function drawWater(){
  const g=ctx.createLinearGradient(0,WY,0,H);
  g.addColorStop(0,'#1a4488');g.addColorStop(0.5,'#0d2860');g.addColorStop(1,'#070f28');
  ctx.fillStyle=g;ctx.fillRect(0,WY,W,H-WY);
  // shimmer streaks
  for(let i=0;i<5;i++){
    const sx=((i*173+frame*1.5)%W+W)%W;
    const sy=WY+4+Math.sin(i*2.3+frame*.02)*5;
    const sw=30+Math.sin(i+frame*.03)*15;
    const sg=ctx.createLinearGradient(sx,0,sx+sw,0);
    sg.addColorStop(0,'rgba(255,255,255,0)');
    sg.addColorStop(0.5,'rgba(255,255,255,0.18)');
    sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sg;ctx.fillRect(sx,sy,sw,2);
  }
  // surface wave
  ctx.strokeStyle='rgba(180,220,255,0.35)';ctx.lineWidth=2;
  ctx.beginPath();
  for(let x=0;x<=W;x+=3){
    const wy=WY+Math.sin(x*.03+frame*.05)*3+Math.sin(x*.07-frame*.03)*1.5;
    x===0?ctx.moveTo(x,wy):ctx.lineTo(x,wy);
  }
  ctx.stroke();
  // depth haze lines
  ctx.strokeStyle='rgba(100,160,255,0.06)';ctx.lineWidth=1;
  for(let y=WY+40;y<H;y+=30){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
}

function drawBgFish(){
  bgFish.forEach(f=>{
    // scatter from bobber
    if((state==='waiting'||state==='nibble')&&Math.abs(f.x-bobX)<70&&Math.abs(f.y-WY)<50){
      f.x+=f.spd>0?-1.5:1.5;
    }
    ctx.save();ctx.globalAlpha=0.55;
    ctx.translate(f.x,f.y+Math.sin(f.ph+frame*.04)*3);
    if(f.spd<0)ctx.scale(-1,1);
    // body
    ctx.fillStyle=f.col;
    ctx.beginPath();ctx.ellipse(0,0,f.sz,f.sz*.38,0,0,Math.PI*2);ctx.fill();
    // tail
    const tw=Math.sin(f.ph+frame*.12)*7;
    ctx.beginPath();ctx.moveTo(-f.sz,0);
    ctx.lineTo(-f.sz-f.sz*.5,tw);ctx.lineTo(-f.sz-f.sz*.5,-tw);ctx.closePath();ctx.fill();
    // eye
    ctx.globalAlpha=0.8;ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.beginPath();ctx.arc(f.sz*.55,-f.sz*.05,f.sz*.11,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // move
    f.x+=f.spd;f.ph+=0.02;
    if(f.x>W+60){f.x=-60;f.y=WY+40+Math.random()*(H-WY-60);}
    if(f.x<-60){f.x=W+60;f.y=WY+40+Math.random()*(H-WY-60);}
  });
}

function drawDock(){
  // pilings
  ctx.fillStyle='#5a3a1a';
  [W-24,W-78].forEach(px=>{ctx.fillRect(px,WY-2,9,H-WY+2);});
  // boards
  for(let x=W-100;x<W;x+=14){
    ctx.fillStyle=x%28===0?'#8a6a3a':'#9a7a4a';
    ctx.fillRect(x,WY-32,13,32);
  }
  ctx.fillStyle='#6a4a1a';ctx.fillRect(W-100,WY-5,100,5);
  // railing
  ctx.strokeStyle='#7a5a2a';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W-100,WY-28);ctx.lineTo(W,WY-28);ctx.stroke();
  ctx.lineWidth=2;
  [W-90,W-70,W-50,W-30].forEach(px=>{
    ctx.beginPath();ctx.moveTo(px,WY-28);ctx.lineTo(px,WY-32);ctx.stroke();
  });
}

// Rod tip position
const ROD_TIP_X=W-55-30-72, ROD_TIP_Y=WY-35-28;

function drawPlayer(){
  const px=W-56,py=WY-32;
  // body shadow
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(px,py+16,14,4,0,0,Math.PI*2);ctx.fill();
  // legs
  ctx.strokeStyle='#223';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-9,py+16);ctx.stroke();
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+6,py+16);ctx.stroke();
  // boots
  ctx.fillStyle='#3a2a1a';
  ctx.fillRect(px-14,py+13,10,5);ctx.fillRect(px+2,py+13,10,5);
  // body
  ctx.fillStyle='#4466aa';
  ctx.beginPath();ctx.moveTo(px,py-18);ctx.lineTo(px-9,py);ctx.lineTo(px+8,py);ctx.closePath();ctx.fill();
  // head
  ctx.fillStyle='#f0c080';ctx.beginPath();ctx.arc(px,py-28,10,0,Math.PI*2);ctx.fill();
  // hat brim
  ctx.fillStyle='#3a2a0a';ctx.fillRect(px-14,py-39,28,6);
  // hat top
  ctx.fillRect(px-9,py-54,18,16);
  // hat band
  ctx.fillStyle='#aa4422';ctx.fillRect(px-9,py-41,18,3);
  // rod arm
  ctx.strokeStyle='#6a4a2a';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(px-4,py-16);ctx.lineTo(px-28,py-35);ctx.stroke();
  // fishing rod
  ctx.strokeStyle='#7a5a2a';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(px-28,py-35);ctx.lineTo(ROD_TIP_X,ROD_TIP_Y);ctx.stroke();
  // rod tip highlight
  ctx.fillStyle='#ddaa55';ctx.beginPath();ctx.arc(ROD_TIP_X,ROD_TIP_Y,3,0,Math.PI*2);ctx.fill();
}

function drawLine(){
  if(state==='idle')return;
  ctx.strokeStyle='rgba(220,220,220,0.5)';ctx.lineWidth=1;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(ROD_TIP_X,ROD_TIP_Y);
  if(state==='casting'){
    ctx.lineTo(bobX,bobY);
  } else {
    const mx=(ROD_TIP_X+bobX)/2;
    const my=Math.min(ROD_TIP_Y,WY)+25;
    ctx.quadraticCurveTo(mx,my,bobX,bobY+bobBob);
  }
  ctx.stroke();
}

function drawBobber(){
  if(state==='idle'||state==='reveal'||state==='missed')return;
  const bx=bobX,by=bobY+bobBob;
  // water ripples
  if(state!=='casting'){
    for(let r=1;r<=3;r++){
      const alpha=0.15-r*0.04;
      ctx.strokeStyle=`rgba(180,220,255,${alpha})`;ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(bx,WY,r*10+(frame%20)*.5,0,Math.PI*2);ctx.stroke();
    }
  }
  const isNibble=state==='nibble';
  // glow for nibble
  if(isNibble&&Math.floor(frame/4)%2===0){
    ctx.fillStyle='rgba(255,220,0,0.3)';
    ctx.beginPath();ctx.arc(bx,by,16,0,Math.PI*2);ctx.fill();
  }
  // bobber top (red)
  ctx.fillStyle=isNibble?'#ffcc00':'#dd2222';
  ctx.beginPath();ctx.arc(bx,by,7,Math.PI,0);ctx.fill();
  // bobber bottom (white)
  ctx.fillStyle='#eeeeee';
  ctx.beginPath();ctx.arc(bx,by,7,0,Math.PI);ctx.fill();
  // center stripe
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(bx-7,by);ctx.lineTo(bx+7,by);ctx.stroke();
  // top peg
  ctx.fillStyle='#555';ctx.beginPath();ctx.arc(bx,by-7,2,0,Math.PI*2);ctx.fill();
  // highlight
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.arc(bx-2,by-3.5,2,0,Math.PI*2);ctx.fill();
}

function drawReelBar(){
  if(state!=='hooked')return;
  const bw=240,bh=20,bx=(W-bw)/2,by=WY-55;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(bx-5,by-5,bw+10,bh+10);
  // track
  ctx.fillStyle='#111a11';ctx.fillRect(bx,by,bw,bh);
  // fill
  const pct=reelProgress/100;
  const col=pct<0.4?'#cc2222':pct<0.7?'#cc8800':'#22cc44';
  ctx.fillStyle=col;ctx.fillRect(bx,by,bw*pct,bh);
  // tick marks
  ctx.fillStyle='rgba(0,0,0,0.3)';
  for(let i=1;i<10;i++)ctx.fillRect(bx+bw*i/10-1,by,2,bh);
  // border
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);
  // label
  ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
  ctx.fillText('REEL IN — click fast!',W/2,by+14);
}

function drawNibbleFlash(){
  if(state!=='nibble')return;
  if(Math.floor(frame/5)%2!==0)return;
  ctx.save();
  ctx.font='bold 20px Georgia,serif';ctx.textAlign='center';
  ctx.shadowColor='#ffcc00';ctx.shadowBlur=15;
  ctx.fillStyle='#ffcc00';ctx.fillText('⚡ BITE! Click NOW!',W/2,WY-20);
  ctx.restore();
}

function drawReveal(){
  if(state!=='reveal'||!caughtFish)return;
  const f=caughtFish,t=revealTimer;
  // fish arc jump
  const jumpProg=Math.min(t/50,1);
  const jy=WY-Math.sin(jumpProg*Math.PI)*100;
  ctx.save();
  ctx.translate(W/2+Math.cos(jumpProg*Math.PI*.5)*30,Math.max(jy,WY-100));
  ctx.rotate(Math.sin(jumpProg*Math.PI)*0.4);
  // legendary aura
  if(f.rarity==='legendary'){
    ctx.fillStyle='rgba(255,220,0,0.2)';ctx.beginPath();ctx.arc(0,0,55,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,220,0,0.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,50,0,Math.PI*2);ctx.stroke();
  }
  // fish body
  ctx.fillStyle=f.col;ctx.beginPath();ctx.ellipse(0,0,38,18,0,0,Math.PI*2);ctx.fill();
  // shimmer
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.beginPath();ctx.ellipse(-5,-5,20,8,-.3,0,Math.PI*2);ctx.fill();
  // tail
  ctx.fillStyle=f.col;ctx.beginPath();ctx.moveTo(-38,0);ctx.lineTo(-58,14);ctx.lineTo(-58,-14);ctx.closePath();ctx.fill();
  // eye
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.beginPath();ctx.arc(24,0,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(23,-1,2,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // catch card (fades in)
  if(t>25){
    const alpha=Math.min((t-25)/18,1);
    ctx.save();ctx.globalAlpha=alpha;
    const cx=W/2,cy=WY-85;
    ctx.fillStyle='rgba(5,10,5,0.9)';ctx.fillRect(cx-120,cy-36,240,58);
    ctx.strokeStyle=RARITY_COL[f.rarity]||'#aaa';ctx.lineWidth=2;ctx.strokeRect(cx-120,cy-36,240,58);
    ctx.font='bold 16px Georgia,serif';ctx.textAlign='center';
    ctx.fillStyle=RARITY_COL[f.rarity]||'#fff';ctx.fillText(f.name,cx,cy-11);
    const wt=caughtWeight===0?'??? kg':caughtWeight.toFixed(1)+' kg';
    ctx.fillStyle='#aaaaaa';ctx.font='12px Georgia,serif';
    ctx.fillText(f.rarity.toUpperCase()+'  ·  '+wt,cx,cy+8);
    ctx.fillStyle='#ffdd44';ctx.font='bold 13px Georgia,serif';
    ctx.fillText('+'+f.pts+' pts',cx,cy+28);
    ctx.restore();
  }
}

function drawMissed(){
  if(!missFlash)return;
  const a=missFlash/30;
  ctx.save();ctx.globalAlpha=a;
  ctx.font='bold 20px Georgia,serif';ctx.textAlign='center';
  ctx.fillStyle='#ff6633';ctx.fillText('It got away!',W/2,WY-25);
  ctx.restore();
}

function drawIdle(){
  if(state!=='idle')return;
  // hint arrow on water
  const ax=W/2,ay=WY+40;
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(0,WY,W,H-WY);
  ctx.save();
  const bounce=Math.sin(frame*.05)*5;
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='13px Georgia,serif';ctx.textAlign='center';
  ctx.fillText('Click on the water to cast',ax,ay+bounce);
  ctx.restore();
}

// CAST ARC
function startCast(tx,ty){
  ty=WY; // always land on surface
  tx=Math.max(40,Math.min(W-140,tx));
  bobX=ROD_TIP_X;bobY=ROD_TIP_Y;
  const dx=tx-ROD_TIP_X,dy=ty-ROD_TIP_Y;
  const frames=Math.max(18,Math.sqrt(dx*dx+dy*dy)/10);
  bobVX=dx/frames;
  bobVY=dy/frames-0.4*frames/2;
  state='casting';
  setText('…');
}

// UPDATE
function update(){
  frame++;

  if(state==='casting'){
    bobX+=bobVX;bobY+=bobVY;bobVY+=0.4;
    if(bobY>=WY){
      bobY=WY;bobVX=0;bobVY=0;bobBob=0;
      state='waiting';
      nibbleTimer=90+Math.floor(Math.random()*200);
      setText('Waiting for a bite…');
    }
  }

  if(state==='waiting'||state==='nibble')bobBob=Math.sin(frame*.06)*3;

  if(state==='waiting'){
    nibbleTimer--;
    if(nibbleTimer<=0){
      state='nibble';
      nibbleWindow=50+Math.floor(Math.random()*30);
      setText('⚡ BITE! Click NOW!');
    }
  }

  if(state==='nibble'){
    bobBob=Math.sin(frame*.35)*12; // dramatic dip
    nibbleWindow--;
    if(nibbleWindow<=0){
      state='missed';
      missFlash=30;
      bobBob=0;
      setText('It got away! Click the water to try again.');
    }
  }

  if(state==='missed'){
    missFlash=Math.max(0,missFlash-1);
    if(missFlash===0)state='idle';
  }

  if(state==='hooked'){
    const f=caughtFish;
    const pull=RARITY_PULL[f.rarity]||0.3;
    reelProgress=Math.max(0,reelProgress-pull);
    if(reelProgress>=100){
      caughtWeight=f.wlo===0?0:f.wlo+Math.random()*(f.whi-f.wlo);
      setScore(score+f.pts);
      setCatches(catches+1);
      if(!bestFish||f.pts>bestFish.pts)setBest(f);
      revealTimer=0;state='reveal';
      setText('You caught a '+f.name+'! +'+f.pts+' pts');
    }
  }

  if(state==='reveal'){
    revealTimer++;
    if(revealTimer>110){
      state='idle';caughtFish=null;
      setText('Click on the water to cast your line.');
    }
  }
}

// DRAW LOOP
function draw(){
  ctx.clearRect(0,0,W,H);
  drawSky();
  drawWater();
  drawBgFish();
  drawDock();
  drawLine();
  drawBobber();
  drawPlayer();
  drawReelBar();
  drawNibbleFlash();
  drawReveal();
  drawMissed();
  drawIdle();
  update();
  requestAnimationFrame(draw);
}

// INPUT
function getPos(e){
  const r=C.getBoundingClientRect();
  if(e.touches){
    return{x:(e.touches[0].clientX-r.left)*W/r.width,y:(e.touches[0].clientY-r.top)*H/r.height};
  }
  return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}

function handleClick(e){
  const p=getPos(e);
  if(state==='idle'&&p.y>WY-15){
    startCast(p.x,p.y);return;
  }
  if(state==='nibble'){
    caughtFish=pickFish();
    reelProgress=0;
    state='hooked';
    setText('Hooked! Click fast to reel in!');
    return;
  }
  if(state==='hooked'){
    reelProgress=Math.min(100,reelProgress+8);
    return;
  }
}

C.addEventListener('click',handleClick);
C.addEventListener('touchstart',e=>{e.preventDefault();handleClick(e);},{passive:false});

draw();
</script>
