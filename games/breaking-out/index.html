function addItem(id){if(!inv.includes(id)&&inv.length<MAX_INV){inv.push(id);renderInv();return true;}setText('Hands too full! Drop something? (you can\'t, so find another way)');return false;}

function removeItem(id){const i=inv.indexOf(id);if(i>=0){inv.splice(i,1);if(selItem===id)selItem=null;renderInv();}}
function renderInv(){

// ── PATROL GUARD ────────────────────────────────────────────
// guardX moves across corridor; sneak window = when guard faces AWAY from exit
let sneakWindowOpen=false;

function updatePatrol(){
  const r=ROOMS[room];if(!r.patrol)return;
  guardX+=guardDir*guardSpeed;
  if(guardX>W-80){guardX=W-80;guardDir=-1;}
  if(guardX<80){guardX=80;guardDir=1;}
  // safe window: guard facing left (dir=-1) means they face away from right-side exit
  sneakWindowOpen=(guardDir===-1&&guardX>W*0.4)||(guardDir===1&&guardX<W*0.3);
}

function tryExit(){
  const r=ROOMS[room];const ex=r.exit;
  if(!ex.check()){setText(ex.locked);return;}
  if(r.patrol&&!sneakWindowOpen){
    setText(r.dangerMsg||'Guard is watching! Wait for them to look away.');return;
  }
  ex.unlock();
  if(scene==='ending')return;
  setTimeout(()=>goRoom(room+1),1200);
}

// ── HOTSPOT HELPERS ─────────────────────────────────────────
function getSpots(){
  const r=ROOMS[room];const spots=[...r.spots];
  const ex=r.exit;spots.push({id:'exit_door',x:ex.x,y:ex.y,w:ex.w,h:ex.h,label:ex.label,act:tryExit});
  return spots;
}

// ── STICK FIGURE ────────────────────────────────────────────
function drawStick(x,y,facing,state,scale){
  scale=scale||1;
  ctx.save();ctx.translate(x,y);if(facing<0)ctx.scale(-1,1);ctx.scale(scale,scale);
  const t=frame;
  const bob=state==='walk'?Math.sin(t*0.22)*4:0;
  const ls=state==='walk'?Math.sin(t*0.22)*14:0,rs=-ls;
  ctx.lineCap='round';ctx.lineJoin='round';
  if(state==='crawl'){
    ctx.strokeStyle='#eee';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(-18,-6);ctx.lineTo(18,-6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-10,-6);ctx.lineTo(-16,6);ctx.stroke();ctx.beginPath();ctx.moveTo(8,-6);ctx.lineTo(14,6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-6,-6);ctx.lineTo(-14,4);ctx.stroke();ctx.beginPath();ctx.moveTo(14,-6);ctx.lineTo(20,4);ctx.stroke();
    ctx.fillStyle='#eee';ctx.beginPath();ctx.arc(22,-12,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(25,-12,2,0,Math.PI*2);ctx.fill();
  } else {
    ctx.strokeStyle='#eee';ctx.lineWidth=2.5;
    ctx.fillStyle='#eee';ctx.beginPath();ctx.arc(0,-36+bob,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(3,-37+bob,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-26+bob);ctx.lineTo(0,0);ctx.stroke();
    if(state==='celebrate'||state==='cheer'){
      ctx.beginPath();ctx.moveTo(0,-20+bob);ctx.lineTo(-16,-34+bob+Math.sin(t*0.3)*4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,-20+bob);ctx.lineTo(16,-34+bob-Math.sin(t*0.3)*4);ctx.stroke();
    } else {
      ctx.beginPath();ctx.moveTo(0,-20+bob);ctx.lineTo(-12,-10+bob+ls*0.4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,-20+bob);ctx.lineTo(12,-10+bob+rs*0.4);ctx.stroke();
    }
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-8+ls*0.5,16);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(8+rs*0.5,16);ctx.stroke();
    if(state!=='celebrate'&&state!=='cheer'&&state!=='guard'){
      ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;
      for(let yy=-24;yy<0;yy+=6){ctx.beginPath();ctx.moveTo(-6,yy+bob);ctx.lineTo(6,yy+bob);ctx.stroke();}
    }
    if(state==='guard'||state==='guard_hat'){
      ctx.fillStyle='#334455';ctx.fillRect(-10,-50+bob,20,8);ctx.fillRect(-14,-44+bob,28,5);
      ctx.fillStyle='#aaa';ctx.fillRect(-6,-52+bob,12,3);
    }
  }
  ctx.restore();
}

// ── ROOM DRAWING ─────────────────────────────────────────────
function brickWall(dark){
  const wg=ctx.createLinearGradient(0,0,0,H);
  wg.addColorStop(0,dark?'#222230':'#38384a');wg.addColorStop(1,dark?'#141420':'#252535');
  ctx.fillStyle=wg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;
  for(let r=0;r*28<H;r++){const o=(r%2)*44;for(let c=-1;c*88<W+88;c++)ctx.strokeRect(c*88+o,r*28,88,28);}
}
function floorStrip(col1,col2){
  const fg=ctx.createLinearGradient(0,H-70,0,H);fg.addColorStop(0,col1||'#5a4a2e');fg.addColorStop(1,col2||'#3a2e1a');
  ctx.fillStyle=fg;ctx.fillRect(0,H-70,W,70);
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1;for(let x=0;x<W;x+=55)ctx.strokeRect(x,H-70,55,70);
}
function door(x,y,w,h,locked){
  ctx.fillStyle='#5a3808';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#3a2000';ctx.fillRect(x+4,y+6,w-8,h-6);
  if(locked){
    ctx.strokeStyle='#888';ctx.lineWidth=3;

  for(let i=0;i<80;i++){const sx=(i*197)%W,sy=(i*83)%260;ctx.globalAlpha=0.5+0.5*Math.abs(Math.sin(frame*0.012+i));ctx.fillStyle='#fff';ctx.fillRect(sx,sy,2,2);}ctx.globalAlpha=1;
  // moon
  ctx.fillStyle='rgba(255,255,200,0.9)';ctx.beginPath();ctx.arc(W-80,60,30,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(0,0,20,0.3)';ctx.beginPath();ctx.arc(W-70,55,28,0,Math.PI*2);ctx.fill();
  // trees
  for(let t=0;t<8;t++){
    const tx=50+t*76,th=100+Math.sin(t*1.4)*40;
    ctx.fillStyle='#1a4a0a';ctx.beginPath();ctx.moveTo(tx,H-70-th);ctx.lineTo(tx-28,H-70);ctx.lineTo(tx+28,H-70);ctx.closePath();ctx.fill();
    ctx.fillStyle='#0a3a00';ctx.fillRect(tx-6,H-70,12,30);
  }
  // road
  ctx.fillStyle='#3a3a3a';ctx.beginPath();ctx.moveTo(W*0.3,H-70);ctx.lineTo(W*0.6,H-70);ctx.lineTo(W+20,H-20);ctx.lineTo(W+20,H+20);ctx.lineTo(W*0.3-20,H+20);ctx.closePath();ctx.fill();
  ctx.fillStyle='#555';ctx.fillRect(0,H-70,W,6);
  // road sign
  ctx.fillStyle='#888';ctx.fillRect(W-140,H-70-80,2,80);ctx.fillRect(W-178,H-70-80,76,36);
  ctx.fillStyle='#2a4a1a';ctx.fillRect(W-178,H-70-80,76,36);ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText('FREE WORLD',W-140,H-70-57);
  // celebration!
  ctx.fillStyle='rgba(255,220,0,0.15)';
  const gr2=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,250);gr2.addColorStop(0,'rgba(255,220,50,0.2)');gr2.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr2;ctx.fillRect(0,0,W,H);
  ctx.font='bold 44px Georgia,serif';ctx.textAlign='center';ctx.shadowColor='#ffaa00';ctx.shadowBlur=24;ctx.fillStyle='#ffdd44';ctx.fillText('FREEDOM!!!',W/2,H/2-20);ctx.shadowBlur=0;
  ctx.font='14px Georgia,serif';ctx.fillStyle='#ddd';ctx.fillText('10 rooms. Every guard. Every door. You beat them ALL.',W/2,H/2+16);
  // player celebrating
  drawStick(W/2,H-70,1,'cheer',1.2);
  // click to continue
  ctx.fillStyle='rgba(0,255,100,0.08)';ctx.fillRect(W-170,H-70-120,160,110);
  ctx.strokeStyle='rgba(0,255,100,0.3)';ctx.lineWidth=1.5;ctx.strokeRect(W-170,H-70-120,160,110);
  ctx.fillStyle='#8f8';ctx.font='13px Georgia,serif';ctx.textAlign='center';ctx.fillText('[ click to run ]',W-90,H-100);
}

const DRAW_FNS=[drawRoom0,drawRoom1,drawRoom2,drawRoom3,drawRoom4,drawRoom5,drawRoom6,drawRoom7,drawRoom8,drawRoom9];

// ── CAUGHT / ENDING SCREENS ─────────────────────────────────
function drawCaught(){
  brickWall();floorStrip();
  ctx.fillStyle='rgba(180,0,0,0.5)';ctx.fillRect(0,0,W,H);
  ctx.font='bold 44px Georgia,serif';ctx.textAlign='center';ctx.shadowColor='#f00';ctx.shadowBlur=20;ctx.fillStyle='#ff4444';ctx.fillText('BUSTED!',W/2,H/2-30);ctx.shadowBlur=0;
  ctx.font='14px Georgia,serif';ctx.fillStyle='#faa';ctx.fillText(caughtMsg,W/2,H/2+10);
  ctx.font='12px Georgia,serif';ctx.fillStyle='#f88';ctx.fillText('[ click to try room '+room+' again ]',W/2,H/2+40);
  drawStick(W/2,H-70,1,'idle');
}
function drawEndingScreen(){
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a1a0a');bg.addColorStop(1,'#152015');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){const sx=(i*197)%W,sy=(i*83)%H;ctx.globalAlpha=0.3+0.7*Math.abs(Math.sin(frame*0.015+i));ctx.fillStyle='#fff';ctx.fillRect(sx,sy,1.5,1.5);}ctx.globalAlpha=1;
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(80,25,W-160,H-50);ctx.strokeStyle='#4a7a4a';ctx.lineWidth=2;ctx.strokeRect(80,25,W-160,H-50);
  ctx.font='52px sans-serif';ctx.textAlign='center';ctx.fillText(endEmoji,W/2,80);
  ctx.fillStyle='#ffdd44';ctx.font='bold 20px Georgia,serif';ctx.fillText('"'+endTitle+'"',W/2,112);
  ctx.fillStyle='#ccc';ctx.font='13px Georgia,serif';ctx.fillText(endDesc,W/2,140,W-200);
  const r=endRating;
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(100,192,W-200,22);
  const rc=r>80?'#4f4':r>50?'#ff8':r>30?'#f80':'#f44';ctx.fillStyle=rc;ctx.fillRect(100,192,(W-200)*(r/100),22);
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect(100,192,W-200,22);
  ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.fillText('BADASSOMETER: '+r+'%',W/2,207);
  const lbl=r>=100?'ABSOLUTE LEGEND':r>80?'EPIC':r>65?'SOLID':'DECENT';
  ctx.fillStyle=rc;ctx.font='bold 14px Georgia,serif';ctx.fillText(lbl,W/2,230);
  drawStick(W/2,285,1,'cheer');
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect((W-180)/2,310,180,30);ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect((W-180)/2,310,180,30);
  ctx.fillStyle='#88aaff';ctx.font='13px Georgia,serif';ctx.fillText('[ Escape Again ]',W/2,330);
}

// ── HOVER DETECTION ─────────────────────────────────────────
function getHover(){
  if(scene!=='game')return null;
  for(const s of getSpots()){if(mx>s.x&&mx<s.x+s.w&&my>s.y&&my<s.y+s.h)return s;}
  return null;
}
function drawHover(){
  if(!hovered)return;
  ctx.strokeStyle='rgba(255,220,80,0.75)';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.strokeRect(hovered.x,hovered.y,hovered.w,hovered.h);ctx.setLineDash([]);
  ctx.font='12px Georgia,serif';const tw=ctx.measureText(hovered.label).width+14;
  const tx=Math.min(mx+12,W-tw-4),ty=my>30?my-26:my+18;
  ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(tx,ty,tw,20);ctx.fillStyle='#ffdd66';ctx.textAlign='left';ctx.fillText(hovered.label,tx+7,ty+14);
}
function drawRoomLabel(){
  ctx.fillStyle='rgba(255,255,255,0.22)';ctx.font='bold 12px sans-serif';ctx.textAlign='left';ctx.fillText(ROOMS[room].name,10,18);
}

// ── UPDATE ───────────────────────────────────────────────────
function update(){
  frame++;
  updatePatrol();
  if(transDir!==0){
    transAlpha+=transDir*0.07;
    if(transDir===-1&&transAlpha<=0){transAlpha=0;room=transTarget;transTarget=-1;transDir=1;guardX=W*0.4;}
    if(transDir===1&&transAlpha>=1){transAlpha=1;transDir=0;}
  }
  hovered=getHover();
  if(scene==='game') C.style.cursor=hovered?'pointer':'default';
  else C.style.cursor='pointer';
}

// ── RENDER ───────────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,W,H);
  if(scene==='game'||(transDir!==0)){
    if(room<DRAW_FNS.length)DRAW_FNS[room]();
    drawHover();drawRoomLabel();
  }
  if(scene==='caught')drawCaught();
  if(scene==='ending')drawEndingScreen();
  if(transDir!==0){
    ctx.fillStyle=`rgba(0,0,0,${transDir===-1?1-transAlpha:1-transAlpha})`;
    ctx.fillRect(0,0,W,H);
  }
}

// ── INPUT ────────────────────────────────────────────────────
function sc(e){const r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
C.addEventListener('mousemove',e=>{const c=sc(e);mx=c.x;my=c.y;});
C.addEventListener('click',e=>{
  const c=sc(e);mx=c.x;my=c.y;
  if(scene==='caught'){scene='game';flags=new Set(getRoomFlags());setText('You\'re back in room '+(room+1)+'. Try again.');return;}
  if(scene==='ending'){resetAll();return;}
  if(scene!=='game')return;
  if(hovered)hovered.act();
});

// when caught, only reset that room's flags (keep inventory)
function getRoomFlags(){
  // keep all flags from previous rooms
  const keep=new Set();
  for(const f of flags){
    if(!['bed','toilet','brick','tray','graffiti','locker','bench','notice','locker2','coffee','guard2','table','cabinet','stove','chef_gone','pepper_used','fridge','shelf','boxes','padlock_cut','toolbox','rope_thrown','sign','window7','guard7'].includes(f)){
      keep.add(f);
    }
  }
  return keep;
}

function resetAll(){
  room=0;flags=new Set();inv=[];selItem=null;scene='game';
  guardX=W*0.4;guardDir=1;transDir=0;transAlpha=0;transTarget=-1;
  renderInv();setText('You\'re in Cell B-13. The door is locked. Find a way out.');
}

C.addEventListener('touchstart',e=>{
  e.preventDefault();const r=C.getBoundingClientRect();const t=e.touches[0];
  mx=(t.clientX-r.left)*W/r.width;my=(t.clientY-r.top)*H/r.height;
  hovered=getHover();
  if(scene==='caught'){scene='game';setText('Try again!');return;}
  if(scene==='ending'){resetAll();return;}
  if(hovered)hovered.act();
},{passive:false});

function loop(){render();update();requestAnimationFrame(loop);}
loop();
</script>
