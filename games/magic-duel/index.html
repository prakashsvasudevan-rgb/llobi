<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Magic Duel 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Georgia',serif;}
canvas{display:block;}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;}
#title{position:absolute;inset:0;background:rgba(3,0,15,0.97);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;pointer-events:all;overflow-y:auto;padding:24px 10px 30px;}
#title h1{font-size:54px;color:#cc88ff;text-shadow:0 0 30px #8844ff,0 0 60px #4400aa,0 0 100px #2200aa;margin-bottom:10px;letter-spacing:4px;text-align:center;}
#title .sub{color:#aa77cc;font-size:14px;margin-bottom:36px;text-align:center;line-height:1.8;}
.mage-pick{display:flex;gap:12px;margin-bottom:30px;flex-wrap:wrap;justify-content:center;max-width:960px;}
.mp{width:92px;padding:12px 6px 10px;border:2px solid #442266;border-radius:12px;text-align:center;cursor:pointer;background:rgba(30,0,60,0.5);transition:all .18s;color:#fff;user-select:none;}
.mp:hover{border-color:#8844cc;background:rgba(70,0,130,0.5);transform:translateY(-3px);}
.mp.sel{border-color:#cc88ff;background:rgba(100,0,180,0.6);box-shadow:0 0 18px #aa66ff,0 0 6px #aa66ff inset;transform:translateY(-4px);}
.mp .icon{font-size:34px;line-height:1;margin-bottom:6px;}
.mp .mn{font-size:12px;font-weight:bold;margin-bottom:2px;}
.mp .mt{font-size:10px;opacity:.6;}
.mp .sp{font-size:9px;color:#cc99ff;margin-top:4px;line-height:1.3;}
#play-btn{padding:16px 64px;font-size:26px;background:linear-gradient(135deg,#4400aa,#8800cc);color:#fff;border:2px solid #aa66ff;border-radius:12px;cursor:pointer;font-family:Georgia,serif;letter-spacing:3px;text-shadow:0 0 10px #fff;}
#play-btn:hover{background:linear-gradient(135deg,#6600cc,#aa00ff);box-shadow:0 0 30px #8844ff;}
#ctrl{color:#554477;font-size:11px;margin-top:16px;text-align:center;line-height:2;}
#hud{position:absolute;top:0;left:0;width:100%;padding:9px 16px;display:none;}
#banner{position:absolute;top:38%;left:50%;transform:translateX(-50%);font-size:46px;color:#fff;text-shadow:0 0 28px #cc88ff;opacity:0;transition:opacity .3s;white-space:nowrap;text-align:center;pointer-events:none;line-height:1.3;}
#gameover{position:absolute;inset:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;pointer-events:all;}
#gameover h2{font-size:52px;color:#ff4444;text-shadow:0 0 28px #ff0000;margin-bottom:14px;}
#gameover button{padding:12px 42px;font-size:17px;background:linear-gradient(135deg,#4400aa,#8800cc);color:#fff;border:2px solid #aa66ff;border-radius:8px;cursor:pointer;font-family:Georgia,serif;margin-top:16px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">
    <h1>✨ MAGIC DUEL 3D ✨</h1>
    <div class="sub">Battle endless evil armies — Knights, Hunters, Dragons & mighty Bosses!<br>A new Boss appears every 10 levels. How far can you go?</div>
    <div class="mage-pick" id="mage-pick"></div>
    <button id="play-btn" onclick="startFight()">⚔ FIGHT! ⚔</button>
    <div id="ctrl">
      <b style="color:#cc99ff">A/D</b> Move &nbsp;|&nbsp; <b style="color:#cc99ff">W</b> Jump &nbsp;|&nbsp; <b style="color:#cc99ff">S</b> Block<br>
      <b style="color:#ffcc44">J</b> Quick Spell &nbsp;|&nbsp; <b style="color:#ffcc44">K</b> Heavy Spell &nbsp;|&nbsp; <b style="color:#ffcc44">L</b> Ultimate
    </div>
  </div>
  <div id="hud">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div style="width:40%">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
          <span id="p1n" style="color:#fff;font-size:14px;font-weight:bold;text-shadow:0 0 8px #cc88ff"></span>
          <span id="p1hn" style="color:#ff6666;font-size:12px"></span>
        </div>
        <div style="height:14px;background:#1a001a;border:1px solid #664466;border-radius:6px;overflow:hidden">
          <div id="p1h" style="height:100%;background:linear-gradient(90deg,#cc2222,#ff4444);border-radius:6px;transition:width .08s;width:100%"></div>
        </div>
        <div style="height:8px;background:#001a1a;border:1px solid #446666;border-radius:4px;overflow:hidden;margin-top:3px">
          <div id="p1m" style="height:100%;background:linear-gradient(90deg,#0044cc,#4488ff);border-radius:4px;transition:width .08s;width:100%"></div>
        </div>
      </div>
      <div style="text-align:center;min-width:140px">
        <div id="lvltxt" style="color:#cc88ff;font-size:15px;font-weight:bold;text-shadow:0 0 10px #8844ff"></div>
        <div id="wavetxt" style="color:#ffcc44;font-size:11px;margin:1px 0"></div>
        <div id="scoretxt" style="color:#88ffaa;font-size:14px;font-weight:bold"></div>
      </div>
      <div style="width:40%;text-align:right">
        <div id="killtxt" style="color:#88ccff;font-size:11px;margin-bottom:4px"></div>
        <div id="enemytxt" style="color:#ff9944;font-size:11px"></div>
      </div>
    </div>
  </div>
  <div id="banner"></div>
  <div id="gameover">
    <h2>💀 DEFEATED!</h2>
    <p id="go1" style="color:#cc99ff;font-size:20px;margin-bottom:6px"></p>
    <p id="go2" style="color:#ffcc44;font-size:16px;margin-bottom:4px"></p>
    <p id="go3" style="color:#88ccff;font-size:14px"></p>
    <button onclick="location.reload()">⚔ Try Again</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x040010);scene.fog=new THREE.FogExp2(0x040010,0.025);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,80);
camera.position.set(0,6,18);camera.lookAt(0,2.5,0);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
resize();window.addEventListener('resize',resize);

function addBox(p,w,h,d,col,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));
  m.position.set(x,y,z);m.castShadow=true;if(p)p.add(m);else scene.add(m);return m;
}
function addSphere(p,r,col,x,y,z){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,7,5),new THREE.MeshBasicMaterial({color:col}));
  m.position.set(x,y,z);if(p)p.add(m);else scene.add(m);return m;
}

const CHARS=[
  {id:'pyro', name:'Pyromancer',  type:'🔥 Fire',    rC:0xaa2200,hC:0x330000,eC:0xff4400,pc:'#ff4400',
   spells:{q:{n:'Fireball',    c3:0xff6600,sz:0.18,sp:8, dm:14,mn:8, sh:'orb'},
           h:{n:'Fire Blast',  c3:0xff2200,sz:0.26,sp:5, dm:30,mn:20,sh:'orb'},
           u:{n:'Inferno Wave',c3:0xffcc00,sz:0.14,sp:9, dm:18,mn:40,sh:'wave',cnt:5}},
   desc:'Fast fireballs\nBurns through all'},
  {id:'cryo', name:'Cryomancer',  type:'❄ Ice',      rC:0x002244,hC:0x001122,eC:0x44aaff,pc:'#44aaff',
   spells:{q:{n:'Ice Shard',  c3:0x88ccff,sz:0.14,sp:10,dm:11,mn:6, sh:'bolt'},
           h:{n:'Blizzard',   c3:0x44aaff,sz:0.24,sp:5, dm:24,mn:18,sh:'orb',frz:true},
           u:{n:'Frost Nova', c3:0xaaddff,sz:0.16,sp:8, dm:22,mn:40,sh:'wave',cnt:7,frz:true}},
   desc:'Slows & freezes\nControl the battlefield'},
  {id:'storm',name:'Stormcaller', type:'⚡ Lightning',rC:0x1a1a00,hC:0x080800,eC:0xffee00,pc:'#ffee00',
   spells:{q:{n:'Lightning',  c3:0xffff44,sz:0.11,sp:14,dm:10,mn:5, sh:'bolt'},
           h:{n:'Chain Bolt', c3:0xffee00,sz:0.20,sp:10,dm:22,mn:16,sh:'orb'},
           u:{n:'Thunderstorm',c3:0xffffff,sz:0.12,sp:12,dm:14,mn:38,sh:'wave',cnt:7}},
   desc:'Blazing speed\nAll-out offense'},
  {id:'necro',name:'Necromancer', type:'💀 Shadow',  rC:0x1a0033,hC:0x0a0022,eC:0xaa44ff,pc:'#aa44ff',
   spells:{q:{n:'Soul Bolt',  c3:0xaa44ff,sz:0.17,sp:7, dm:14,mn:9, sh:'orb',drain:true},
           h:{n:'Death Ray',  c3:0x8800ff,sz:0.22,sp:5, dm:26,mn:20,sh:'orb',drain:true},
           u:{n:'Soul Vortex',c3:0xff00ff,sz:0.16,sp:7, dm:20,mn:45,sh:'wave',cnt:4,drain:true}},
   desc:'Drains life on hit\nDark & relentless'},
  {id:'drako',name:'Drakomancer', type:'🐉 Dragon',  rC:0x1a3300,hC:0x0a2200,eC:0x44ff00,pc:'#44ff00',
   spells:{q:{n:'Dragon Breath',c3:0xff4400,sz:0.20,sp:9, dm:16,mn:10,sh:'orb'},
           h:{n:'Drake Claw',   c3:0x44ff00,sz:0.28,sp:4, dm:34,mn:22,sh:'orb'},
           u:{n:'Summon Drake', c3:0x44ff00,sz:0,   sp:0, dm:40,mn:50,sh:'summon'}},
   desc:'Summons real dragons!\nFire & nature power'},
  {id:'light',name:'Light Mage',  type:'☀ Holy',     rC:0x887700,hC:0x554400,eC:0xffffaa,pc:'#ffffaa',
   spells:{q:{n:'Holy Beam',   c3:0xffffff,sz:0.13,sp:12,dm:14,mn:7, sh:'bolt',holy:true},
           h:{n:'Divine Smite',c3:0xffeeaa,sz:0.30,sp:5, dm:32,mn:22,sh:'orb', holy:true},
           u:{n:'Holy Nova',   c3:0xffffff,sz:0.16,sp:8, dm:24,mn:45,sh:'nova',heal:25}},
   desc:'Nova heals you\nExtra dmg to darkness'},
  {id:'soul', name:'Soul Mage',   type:'👻 Spirit',  rC:0x1a0044,hC:0x0a0022,eC:0xaa66ff,pc:'#aa66ff',
   spells:{q:{n:'Soul Bolt',   c3:0xcc44ff,sz:0.16,sp:7, dm:12,mn:7, sh:'orb',drain:true},
           h:{n:'Phantom',     c3:0x8800ff,sz:0.22,sp:9, dm:24,mn:18,sh:'orb',pierce:true},
           u:{n:'Soul Storm',  c3:0xdd88ff,sz:0.14,sp:9, dm:18,mn:40,sh:'wave',cnt:5,drain:true}},
   desc:'Soul bolt restores MP\nPiercing phantom orb'},
  {id:'bomb', name:'Bomb Mage',   type:'💣 Blast',   rC:0x553300,hC:0x2a1500,eC:0xff8800,pc:'#ff8800',
   spells:{q:{n:'Grenade',     c3:0xff8800,sz:0.22,sp:4, dm:18,mn:8, sh:'bomb',aoe:1.8},
           h:{n:'Cluster Bomb',c3:0xff4400,sz:0.19,sp:4, dm:14,mn:18,sh:'cluster',aoe:1.5},
           u:{n:'Mega Blast',  c3:0xff6600,sz:0,   sp:0, dm:55,mn:50,sh:'megabomb',aoe:4.5}},
   desc:'Area damage master\nClears crowds fast'},
  {id:'golem',name:'Golem Mage',  type:'🪨 Earth',   rC:0x446633,hC:0x223311,eC:0x88cc44,pc:'#88cc44',
   spells:{q:{n:'Boulder',     c3:0x888866,sz:0.30,sp:4, dm:30,mn:9, sh:'orb'},
           h:{n:'Earth Spike', c3:0x775544,sz:0,   sp:0, dm:36,mn:20,sh:'spike'},
           u:{n:'Summon Golem',c3:0x888866,sz:0,   sp:0, dm:0, mn:50,sh:'golem'}},
   desc:'Summons stone golem\nHeavy earth attacks'},
];

const CHAR_ICONS=['🔥','❄️','⚡','💀','🐉','☀️','👻','💣','🪨'];

let selChar=null;
CHARS.forEach((ch,ci)=>{
  const card=document.createElement('div');card.className='mp'+(ci===0?' sel':'');
  if(ci===0)selChar=ch;
  const sp=ch.spells;
  card.innerHTML=`<div class="icon">${CHAR_ICONS[ci]}</div><div class="mn">${ch.name}</div><div class="mt">${ch.type}</div><div class="sp">J: ${sp.q.n}<br>K: ${sp.h.n}<br>L: ${sp.u.n}</div>`;
  card.onclick=()=>{document.querySelectorAll('.mp').forEach(c=>c.classList.remove('sel'));card.classList.add('sel');selChar=ch;};
  document.getElementById('mage-pick').appendChild(card);
});

let torchLights=[];
function buildArena(){
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(18,12),new THREE.MeshLambertMaterial({color:0x1a0a30}));
  floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
  for(let tx=-4;tx<=4;tx++)for(let tz=-2;tz<=2;tz++){
    const t=new THREE.Mesh(new THREE.PlaneGeometry(1.9,1.9),new THREE.MeshLambertMaterial({color:(tx+tz)%2===0?0x1a0a30:0x150828}));
    t.rotation.x=-Math.PI/2;t.position.set(tx*2,0.01,tz*2);scene.add(t);
  }
  for(let r of[1.8,2.8,4.0]){
    const rune=new THREE.Mesh(new THREE.RingGeometry(r,r+0.07,48),new THREE.MeshBasicMaterial({color:0x6622aa,side:THREE.DoubleSide}));
    rune.rotation.x=-Math.PI/2;rune.position.y=0.02;scene.add(rune);
  }
  for(let px of[-7,7])for(let pz of[-2,2]){
    const pil=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.45,7,8),new THREE.MeshLambertMaterial({color:0x1a1030}));
    pil.position.set(px,3.5,pz);scene.add(pil);
    addBox(null,0.9,0.4,0.9,0x221840,px,0.2,pz);addBox(null,0.8,0.4,0.8,0x221840,px,7.0,pz);
    const flame=new THREE.Mesh(new THREE.SphereGeometry(0.18,6,4),new THREE.MeshBasicMaterial({color:0xff6600}));
    flame.position.set(px+(px>0?-0.5:0.5),5.85,pz);scene.add(flame);
    const tl=new THREE.PointLight(0xff8800,2.5,8);tl.position.set(px+(px>0?-0.5:0.5),5.9,pz);scene.add(tl);
    torchLights.push({light:tl,base:2.5,t:Math.random()*6.28});
  }
  const wall=new THREE.Mesh(new THREE.PlaneGeometry(20,10),new THREE.MeshLambertMaterial({color:0x0a0520}));
  wall.position.set(0,5,-4);scene.add(wall);
  for(let bx=-9;bx<=9;bx+=2)for(let by=0;by<=8;by+=1.2){
    if(Math.random()<0.3)addBox(null,1.8,1.0,0.1,by%2===0?0x0f0825:0x0c061e,bx+(by%2===0?0:1),by,-3.95);
  }
  const sp=[];for(let i=0;i<300;i++)sp.push((Math.random()-.5)*60,Math.random()*20+5,(Math.random()-.5)*60-10);
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.08})));
  scene.add(new THREE.AmbientLight(0x1a0a30,0.9));
  const moon=new THREE.DirectionalLight(0x4433aa,0.6);moon.position.set(2,10,6);moon.castShadow=true;scene.add(moon);
  scene.add(new THREE.PointLight(0x6633aa,1.2,20));
}

function buildMage(ch){
  const g=new THREE.Group();
  addBox(g,0.28,0.65,0.28,ch.rC,0.18,0.33,0).name='lR';
  addBox(g,0.28,0.65,0.28,ch.rC,-0.18,0.33,0).name='lL';
  addBox(g,0.9,1.1,0.48,ch.rC,0,1.25,0);addBox(g,1.0,0.3,0.55,ch.rC,0,0.72,0);
  addBox(g,0.22,0.75,0.22,ch.rC,0.58,1.4,0).name='aR';
  addBox(g,0.22,0.75,0.22,ch.rC,-0.58,1.4,0).name='aL';
  addBox(g,0.62,0.62,0.62,0xe8c59a,0,2.2,0);
  const eM=new THREE.MeshBasicMaterial({color:ch.eC});
  [[0.17,2.26,0.32],[-0.17,2.26,0.32]].forEach(p=>{const e=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.09,0.08),eM.clone());e.position.set(...p);g.add(e);});
  addBox(g,0.95,0.09,0.95,ch.hC,0,2.6,0);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(0.38,1.0,8),new THREE.MeshLambertMaterial({color:ch.hC}));cone.position.set(0,3.2,0);g.add(cone);
  const wand=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.85,6),new THREE.MeshLambertMaterial({color:0x8b5e2a}));
  wand.position.set(0.58,1.05,0);wand.rotation.z=-0.25;wand.name='wand';g.add(wand);
  addSphere(g,0.08,ch.eC,0.9,0.75,0);
  const tl=new THREE.PointLight(ch.eC,1.5,2.5);tl.position.set(0.9,0.75,0);tl.name='tipL';g.add(tl);
  g.userData.ch=ch;return g;
}

function buildKnight(lv){
  const g=new THREE.Group();const c=lv>=20?0x2a1a3a:0x2a2a3a;
  addBox(g,0.72,1.0,0.5,c,0,1.1,0);addBox(g,0.9,0.1,0.65,c,0,2.1,0);addBox(g,0.55,0.55,0.55,c,0,1.95,0);
  addBox(g,0.22,0.65,0.22,c,0.5,1.5,0);addBox(g,0.22,0.65,0.22,c,-0.5,1.5,0);
  addBox(g,0.28,0.7,0.3,c,0.18,0.35,0);addBox(g,0.28,0.7,0.3,c,-0.18,0.35,0);
  const sw=new THREE.Mesh(new THREE.BoxGeometry(0.08,1.2,0.04),new THREE.MeshLambertMaterial({color:0xaabbcc}));sw.position.set(0.65,1.0,0);sw.rotation.z=-0.3;g.add(sw);
  addBox(g,0.08,0.8,0.5,0x334466,-0.65,1.1,0);
  const eM=new THREE.MeshBasicMaterial({color:0xff2200});
  [[0.1,1.98,0.3],[-0.1,1.98,0.3]].forEach(p=>{const e=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.06,0.06),eM.clone());e.position.set(...p);g.add(e);});
  return g;
}
function buildHunter(lv){
  const g=new THREE.Group();const c=0x3d2819;
  addBox(g,0.55,0.9,0.4,c,0,1.05,0);addBox(g,0.7,0.25,0.65,0x2a1a0a,0,1.9,0);addBox(g,0.5,0.5,0.5,0x2a1a0a,0,1.8,0);
  addBox(g,0.22,0.65,0.22,c,0.44,1.3,0);addBox(g,0.22,0.65,0.22,c,-0.44,1.3,0);
  addBox(g,0.26,0.65,0.26,c,0.15,0.35,0);addBox(g,0.26,0.65,0.26,c,-0.15,0.35,0);
  const b1=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.6,0.06),new THREE.MeshLambertMaterial({color:0x8b5e2a}));b1.position.set(0.55,1.4,0);b1.rotation.z=0.5;g.add(b1);
  const b2=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.6,0.06),new THREE.MeshLambertMaterial({color:0x8b5e2a}));b2.position.set(0.65,1.0,0);b2.rotation.z=-0.5;g.add(b2);
  const eM=new THREE.MeshBasicMaterial({color:0xff6600});
  [[0.1,1.82,0.27],[-0.1,1.82,0.27]].forEach(p=>{const e=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.06,0.06),eM.clone());e.position.set(...p);g.add(e);});
  return g;
}
function buildMiniDragon(col){
  const g=new THREE.Group();
  addBox(g,1.6,0.65,0.65,col,0,0,0);addBox(g,0.4,0.4,0.5,col,0.9,0.2,0);
  addBox(g,0.6,0.5,0.5,col,1.35,0.3,0);addBox(g,0.4,0.3,0.4,col,1.7,0.18,0);
  addBox(g,1.4,0.3,0.3,col,-1.0,-0.1,0);
  const tail=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.5,4),new THREE.MeshLambertMaterial({color:col}));tail.rotation.z=1.57;tail.position.set(-1.9,-0.15,0);g.add(tail);
  const eM=new THREE.MeshBasicMaterial({color:0xff4400});
  [[1.55,0.38,0.14],[1.55,0.38,-0.14]].forEach(p=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.07,4,4),eM.clone());e.position.set(...p);g.add(e);});
  for(let i=0;i<2;i++){const h=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.35,4),new THREE.MeshLambertMaterial({color:0x111111}));h.position.set(1.2,0.6,i===0?0.15:-0.15);h.rotation.z=-0.4;g.add(h);}
  const wGeo=new THREE.PlaneGeometry(1.4,0.9),wMat=new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide,transparent:true,opacity:0.85});
  const wR=new THREE.Mesh(wGeo,wMat);wR.position.set(-0.1,0.3,0.55);wR.rotation.x=0.4;wR.name='wR';g.add(wR);

function fireSpell(type){
  if(!player||player.state==='dead')return;
  const sp=player.ch.spells[type];if(!sp||player.mp<sp.mn)return;
  player.mp-=sp.mn;player.state='attack';player.stateT=0.3;updateBars();
  const dir=player.facing,ox=player.x+dir*0.9,oy=1.4;
  if(sp.sh==='summon'){spawnPlayerDrake();return;}
  if(sp.sh==='golem'){summonPlayerGolem();return;}
  if(sp.sh==='megabomb'){aoeExplode(player.x+dir*2,1.5,sp.aoe,sp.dm,sp.c3);return;}
  if(sp.sh==='nova'){
    for(let a=0;a<9;a++){const ang=a/9*Math.PI*2;createSpellMesh(ox,oy,Math.cos(ang)*sp.sp*0.7,Math.sin(ang)*sp.sp*0.3,sp);}
    if(sp.heal){player.hp=Math.min(player.maxHp,player.hp+sp.heal);updateBars();}
    shakeT=0.3;shakeAmt=4;return;
  }
  if(sp.sh==='spike'){
    enemies.forEach(en=>{if(en.dead)return;const ahead=(en.x-player.x)*dir>0.5&&(en.x-player.x)*dir<5;if(ahead&&Math.abs(en.y-player.y)<1.8)hitEnemy(en,sp.dm,sp);});

  }
  if(sp.sh==='bomb'||sp.sh==='cluster'){createBomb(ox,oy,dir*4,4,sp);return;}
  if(sp.sh==='wave'){
    const cnt=sp.cnt||3;
    for(let i=0;i<cnt;i++)setTimeout(()=>{if(gs!=='fight')return;const s=(i-cnt/2)*0.28;createSpellMesh(ox,oy,dir*sp.sp+Math.sin(s),Math.sin(s)*0.5,sp);},i*110);
    return;
  }
  createSpellMesh(ox,oy,dir*sp.sp,0,sp);
}

function hitEnemy(en,dmg,sp){

function getEnemyTypes(lv){

function startWave(){

  const isBoss=level%10===0;
  if(isBoss){pendingSpawns=1;setTimeout(()=>{spawnBoss(level);pendingSpawns=0;},2500);}
  else{
    const count=Math.min(3+~~(level*0.9),22);pendingSpawns=count;
    const types=getEnemyTypes(level);showBanner('LEVEL '+level,'Wave '+waveNum);
    const interval=Math.max(400,1100-level*8);
    for(let i=0;i<count;i++)setTimeout(()=>{if(gs!=='fight')return;spawnEnemy(types[~~(Math.random()*types.length)],level);pendingSpawns--;},i*interval+900);
  }

function checkWaveComplete(){

  if(alive.length===0&&pendingSpawns<=0){
    waveActive=false;showBanner('✓ CLEARED!','');
    player.hp=Math.min(player.maxHp,player.hp+20);player.mp=Math.min(player.maxMp,player.mp+40);
    updateBars();setTimeout(()=>{level++;startWave();},2600);
  }
}

function updateEnemy(en,dt){
  if(en.dead)return;en.animT+=dt;
  if(en.frozenT>0){en.frozenT-=dt;return;}
  const dx=player.x-en.x,dist=Math.hypot(dx,player.y+1.4-en.y);
  const isFlying=en.type==='dragon'||(en.type==='boss'&&en.bossType==='dragon');
  const isRanged=en.type==='hunter'||(en.type==='boss'&&!isFlying);
  if(isFlying){en.vx=(dx>0?1:-1)*en.spd;const ty=2.5+Math.sin(en.animT*1.2)*0.4;en.y+=(ty-en.y)*dt*2;}
  else if(isRanged){if(dist<4)en.vx=(en.x<player.x?1:-1)*en.spd;else if(dist>7)en.vx=(dx>0?1:-1)*en.spd;else en.vx=0;}
  else{if(dist>en.atkRange)en.vx=(dx>0?1:-1)*en.spd;else en.vx=0;}
  if(!isFlying){en.vy-=18*dt;en.y+=en.vy*dt;if(en.y<=GROUND){en.y=GROUND;en.vy=0;}}
  en.x+=en.vx*dt;en.x=Math.max(-ARENA,Math.min(ARENA,en.x));
  en.atkCD-=dt;if(en.atkCD<=0&&dist<en.atkRange){enemyAttack(en);en.atkCD=en.atkSpd;}
  en.mesh.position.set(en.x,en.y,en.z);
  en.mesh.scale.x=(player.x>en.x?1:-1)*(isFlying?-1:1);
  if(en.barGroup)en.barGroup.position.set(en.x,en.y+en.barY,0);
  if(isFlying){const wR=en.mesh.getObjectByName('wR'),wL=en.mesh.getObjectByName('wL');if(wR)wR.rotation.x=0.4+Math.sin(en.animT*4)*0.5;if(wL)wL.rotation.x=-0.4-Math.sin(en.animT*4)*0.5;if(Math.random()<0.3){const fx=en.x+(player.x>en.x?0.9:-0.9)*1.4;const m=addSphere(null,0.07+Math.random()*0.05,0xff4400,fx,en.y+0.2,0);particles3d.push({mesh:m,vx:(Math.random()-.5)*1.5,vy:0.5+Math.random()*1.5,vz:(Math.random()-.5)*0.8,life:0.25,maxLife:0.25});}}
}
function enemyAttack(en){
  if(player.state==='dead')return;
  const dist=Math.hypot(en.x-player.x,en.y-player.y);
  if(en.type==='knight'||(en.type==='boss'&&en.bossType==='knight')){
    if(dist<en.atkRange){let dmg=en.dmg;if(player.state==='block')dmg=Math.max(1,~~(dmg*0.1));player.hp-=dmg;player.state='hurt';player.stateT=0.2;spawnHit3D(player.x,1.5,0xff2200,dmg);if(player.hp<=0)playerDied();updateBars();}
  } else {
    const dir=player.x>en.x?1:-1,spd=en.type==='boss'?10:7,col=en.type==='dragon'||en.type==='boss'?0xff4400:0xffcc00;
    const m=addSphere(null,0.12,col,en.x,en.y+0.3,0);const l=new THREE.PointLight(col,1.5,2);m.add(l);
    enemyProj.push({mesh:m,vx:dir*spd,vy:0,dmg:en.dmg,life:2.0});
  }
}

function updatePlayer(dt){
  if(!player||player.state==='dead'){if(player)player.vx=0;return;}
  if(player.stateT>0){player.stateT-=dt;if(player.stateT<=0&&(player.state==='attack'||player.state==='hurt'))player.state='idle';}
  if(player.frozenT>0){player.frozenT-=dt;player.vx=0;player.vy=0;return;}
  player.vy-=18*dt;player.y+=player.vy*dt;
  if(player.y<=GROUND){player.y=GROUND;player.vy=0;player.onGround=true;}else player.onGround=false;
  player.x+=player.vx*dt;player.x=Math.max(-ARENA,Math.min(ARENA,player.x));
  player.mp=Math.min(player.maxMp,player.mp+9*dt);
  if(player.state==='idle'&&Math.abs(player.vx)>0.1)player.state='walk';
  else if(player.state==='walk'&&Math.abs(player.vx)<0.1)player.state='idle';
  if(enemies.length>0){let near=enemies[0];for(const en of enemies)if(!en.dead&&Math.abs(en.x-player.x)<Math.abs(near.x-player.x))near=en;player.facing=near.x>player.x?1:-1;}
}
function playerDied(){
  player.state='dead';
  setTimeout(()=>{gs='result';document.getElementById('go1').textContent='Reached Level '+level;document.getElementById('go2').textContent='Score: '+score;document.getElementById('go3').textContent='Enemies Defeated: '+totalKills;document.getElementById('gameover').style.display='flex';},1200);
}

function updateSpells(dt){
  for(let i=spellMeshes.length-1;i>=0;i--){
    const s=spellMeshes[i];s.life-=dt;
    s.mesh.position.x+=s.vx*dt;s.mesh.position.y+=s.vy*dt;
    if(s.isBomb)s.vy-=14*dt;else s.vy-=0.8*dt;
    if(s.isBomb&&s.mesh.position.y<=0.1){
      if(s.cluster){for(let d=-1;d<=1;d++){const bs={...s.sp,sh:'bomb',aoe:s.sp.aoe*0.8};createBomb(s.mesh.position.x,0.5,d*3,4,bs);}}
      else aoeExplode(s.mesh.position.x,0.5,s.sp.aoe,s.sp.dm,s.sp.c3);
      scene.remove(s.mesh);spellMeshes.splice(i,1);continue;
    }
    if(s.life<=0||Math.abs(s.mesh.position.x)>ARENA+2){scene.remove(s.mesh);spellMeshes.splice(i,1);continue;}
    for(const en of enemies){
      if(en.dead)continue;
      const ey=en.y+(en.type==='dragon'||en.type==='boss'?0.3:0.8);
      if(Math.abs(s.mesh.position.x-en.x)<(0.5+s.sp.sz+en.hitW*0.4)&&Math.abs(s.mesh.position.y-ey)<(en.hitH*0.5+0.3)){
        if(s.isBomb)aoeExplode(s.mesh.position.x,s.mesh.position.y,s.sp.aoe,s.sp.dm,s.sp.c3);
        else hitEnemy(en,s.sp.dm,s.sp);
        if(!s.pierce){scene.remove(s.mesh);spellMeshes.splice(i,1);}break;
      }
    }
  }
}
function updateEnemyProj(dt){
  for(let i=enemyProj.length-1;i>=0;i--){
    const p=enemyProj[i];p.life-=dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.vy-=1*dt;
    if(p.life<=0||Math.abs(p.mesh.position.x)>ARENA+2){scene.remove(p.mesh);enemyProj.splice(i,1);continue;}
    if(player.state==='dead')continue;
    if(Math.abs(p.mesh.position.x-player.x)<0.65&&Math.abs(p.mesh.position.y-(player.y+1.4))<1.1){
      let dmg=p.dmg;if(player.state==='block')dmg=Math.max(1,~~(dmg*0.1));
      player.hp-=dmg;player.state='hurt';player.stateT=0.2;spawnHit3D(player.x,1.5,p.mesh.material.color.getHex(),dmg);
      scene.remove(p.mesh);enemyProj.splice(i,1);if(player.hp<=0)playerDied();updateBars();
    }
  }
}
function updateSummoned(dt){
  for(let i=summoned.length-1;i>=0;i--){
    const d=summoned[i];d.life-=dt;d.x+=d.vx*dt;
    d.mesh.position.set(d.x,d.y+Math.sin(Date.now()/300)*0.1,0);
    const wR=d.mesh.getObjectByName('wR'),wL=d.mesh.getObjectByName('wL');
    if(wR)wR.rotation.x=0.4+Math.sin(d.life*8)*0.5;if(wL)wL.rotation.x=-0.4-Math.sin(d.life*8)*0.5;
    if(Math.random()<0.5){const m=addSphere(null,0.07+Math.random()*0.05,0xff4400,d.x+(d.dir>0?1.9:-1.9),d.y+0.18,0);particles3d.push({mesh:m,vx:(Math.random()-.5)*1.5,vy:0.5+Math.random()*1.5,vz:(Math.random()-.5)*0.8,life:0.25,maxLife:0.25});}
    enemies.forEach(en=>{if(en.dead||d.hit.has(en))return;if(Math.abs(d.x-en.x)<1.6&&Math.abs(d.y-en.y-1)<1.5){hitEnemy(en,40,{c3:0x44ff00,dm:40});d.hit.add(en);}});
    if(d.life<=0||Math.abs(d.x)>10){scene.remove(d.mesh);summoned.splice(i,1);}
  }
}
function updatePlayerGolem(dt){
  if(!playerGolem)return;playerGolem.life-=dt;
  if(playerGolem.life<=0){scene.remove(playerGolem.mesh);playerGolem=null;return;}
  const tx=player.x-player.facing*2;playerGolem.x+=(tx-playerGolem.x)*dt*3;
  playerGolem.mesh.position.set(playerGolem.x,0,0);playerGolem.atkCD-=dt;
  if(playerGolem.atkCD<=0){for(const en of enemies){if(en.dead)continue;if(Math.abs(en.x-playerGolem.x)<2){hitEnemy(en,18,{c3:0x88cc44,dm:18});playerGolem.atkCD=0.9;break;}}}
}
function updateParticles(dt){
  for(let i=particles3d.length-1;i>=0;i--){
    const p=particles3d[i];p.life-=dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=(p.vz||0)*dt;p.vy-=4*dt;
    if(p.mesh.material){p.mesh.material.transparent=true;p.mesh.material.opacity=p.life/(p.maxLife||0.5);}
    if(p.life<=0){scene.remove(p.mesh);particles3d.splice(i,1);}
  }
}

function animateMage(mesh,f,dt){
  if(!mesh)return;
  const lR=mesh.getObjectByName('lR'),lL=mesh.getObjectByName('lL'),aR=mesh.getObjectByName('aR'),aL=mesh.getObjectByName('aL');
  f.animT+=dt;const t=f.animT;mesh.scale.x=f.facing;
  if(f.state==='dead'){mesh.rotation.z=f.facing*(-Math.PI/2);mesh.position.set(f.x,0.4,0);return;}
  mesh.rotation.z=0;mesh.position.set(f.x,f.y+Math.sin(t*(f.state==='walk'?8:2))*(f.state==='walk'?0.07:0.03),0);
  if(lR&&lL){lR.rotation.x=f.state==='walk'?Math.sin(t*8)*0.4:0;lL.rotation.x=f.state==='walk'?-Math.sin(t*8)*0.4:0;}
  if(aR&&aL){
    if(f.state==='attack'){aR.rotation.x=-1.0;aR.position.set(0.58,1.6,0.3);}
    else if(f.state==='block'){aR.rotation.x=-0.5;aL.rotation.x=-0.5;aR.position.set(0.3,1.8,0.2);aL.position.set(-0.3,1.8,0.2);}
    else{aR.rotation.x=Math.sin(t*2)*0.1;aR.position.set(0.58,1.4,0);aL.rotation.x=-Math.sin(t*2)*0.1;aL.position.set(-0.58,1.4,0);}
    if(f.state!=='attack')aL.rotation.x=f.state==='walk'?Math.sin(t*8)*0.3:0;
  }
  if(f.frozenT>0)mesh.children.forEach(c=>{if(c.material&&c.material.color)c.material.color.set(0x88aadd);});
  if(f.state==='hurt')mesh.children.forEach(c=>{if(c.material&&c.material.color)c.material.color.set(0xff4444);});
}

function updateBars(){
  if(!player)return;
  document.getElementById('p1h').style.width=(Math.max(0,player.hp/player.maxHp)*100)+'%';
  document.getElementById('p1m').style.width=(player.mp/player.maxMp*100)+'%';
  document.getElementById('p1hn').textContent=~~Math.max(0,player.hp)+'/'+player.maxHp;
}
function updateHUD(){
  document.getElementById('lvltxt').textContent='LEVEL '+level;
  document.getElementById('wavetxt').textContent='Wave '+waveNum;
  document.getElementById('scoretxt').textContent='Score: '+score;
  document.getElementById('killtxt').textContent='Killed: '+totalKills;
  document.getElementById('enemytxt').textContent='Enemies: '+enemies.filter(e=>!e.dead).length;
}
function showBanner(txt,sub){
  const el=document.getElementById('banner');
  el.innerHTML=txt+(sub?'<br><span style="font-size:18px;color:#cc99ff">'+sub+'</span>':'');
  el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity='0',1800);
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;if(gs!=='fight')return;
  if(e.code==='KeyA'){player.vx=-3.5;if(player.state!=='attack')player.state='walk';}
  if(e.code==='KeyD'){player.vx=3.5;if(player.state!=='attack')player.state='walk';}
  if(e.code==='KeyW'&&player.onGround)player.vy=9;
  if(e.code==='KeyS'&&player.state!=='attack'){player.state='block';player.vx=0;}
  if(e.code==='KeyJ')fireSpell('q');if(e.code==='KeyK')fireSpell('h');if(e.code==='KeyL')fireSpell('u');
  e.preventDefault();
});
document.addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(e.code==='KeyA'&&player&&player.vx<0)player.vx=0;
  if(e.code==='KeyD'&&player&&player.vx>0)player.vx=0;
  if(e.code==='KeyS'&&player&&player.state==='block')player.state='idle';
});

function loop(ts){
  requestAnimationFrame(loop);const dt=Math.min((ts-lastTime)/1000,0.05);lastTime=ts;
  torchLights.forEach(t=>{t.t+=dt*5;t.light.intensity=t.base*(0.85+Math.sin(t.t)*0.15+Math.random()*0.05);});
  if(gs!=='fight'){renderer.render(scene,camera);return;}
  if(!keys['KeyA']&&!keys['KeyD']&&player)player.vx*=0.6;
  updatePlayer(dt);enemies.forEach(en=>updateEnemy(en,dt));
  updateSpells(dt);updateEnemyProj(dt);updateSummoned(dt);updatePlayerGolem(dt);updateParticles(dt);
  animateMage(playerMesh,player,dt);
  if(shakeT>0){shakeT-=dt;camera.position.x=Math.sin(shakeT*30)*(shakeAmt*shakeT*0.1);}else camera.position.x=0;
  renderer.render(scene,camera);
}

function startFight(){
  if(!selChar)selChar=CHARS[0];
  document.getElementById('title').style.display='none';document.getElementById('hud').style.display='block';
  document.getElementById('p1n').textContent=selChar.name;
  player=makePlayer(selChar);
  if(playerMesh)scene.remove(playerMesh);playerMesh=buildMage(selChar);scene.add(playerMesh);
  gs='fight';level=1;score=0;totalKills=0;waveNum=0;
  updateBars();updateHUD();setTimeout(startWave,1200);
}

buildArena();lastTime=performance.now();requestAnimationFrame(loop);
</script>
